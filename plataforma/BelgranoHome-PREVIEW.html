<title>Be Soft · Belgrano Home (Vista previa)</title>

<style>
:root{--navy:#16324f;--ink:#0f1a2a;--blue:#1e5fce;--muted:#8a94a3;--sec:#5b6675;--line:#d9e0e8;--bg:#f4f6f8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.previewbar{background:#fff7e6;color:#7a4a00;font-size:12.5px;font-weight:600;padding:7px 20px;text-align:center;border-bottom:1px solid #f0d9a8;flex:0 0 auto}

/* Login Be Soft (una sola vez) */
#loginWrap{flex:1;display:flex;align-items:center;justify-content:center;background:#eef1f5;padding:20px}
.login-card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(15,26,42,.12);padding:34px 32px;width:100%;max-width:430px;text-align:center}
.login-logo{width:54px;height:54px;background:var(--navy);color:#fff;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;margin:0 auto 14px;letter-spacing:.02em}
.login-card h1{font-size:21px;color:var(--navy);margin:0 0 4px}
.login-sub{color:#5b6675;font-size:13.5px;margin:0 0 20px}
.ulist{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.ucard{border:1px solid #dfe5ec;border-radius:11px;padding:12px 14px;cursor:pointer;transition:.12s}
.ucard:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(30,95,206,.15);transform:translateY(-1px)}
.ucard .un{font-weight:700;color:var(--navy);font-size:15px}
.ucard .ur{color:var(--muted);font-size:11.5px;margin-top:2px}

/* Barra superior */
.app-header{background:var(--navy);color:#fff;height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.app-header .brand{display:flex;align-items:center;gap:12px}
.app-header .logo{width:32px;height:32px;border-radius:7px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.app-header .title{font-weight:800;font-size:17px;letter-spacing:-.01em}
.app-user{display:flex;align-items:center;gap:12px}
.app-user .who{text-align:right;line-height:1.2}
.app-user .who b{font-size:13px;font-weight:700}
.pv-tag{font-size:11.5px;font-weight:700;color:#ffe6a8;background:rgba(255,255,255,.10);padding:5px 10px;border-radius:20px;white-space:nowrap}
.btn-logout{background:rgba(255,255,255,.15);color:#fff;border:none;font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:7px;cursor:pointer}
.btn-logout:hover{background:rgba(255,255,255,.28)}

/* Barra de modulos */
.mod-switch{background:#fff;border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:2px;flex:0 0 auto;overflow-x:auto}
.mod-switch button{background:transparent;border:none;border-bottom:2px solid transparent;padding:13px 16px;font:inherit;font-size:13.5px;font-weight:600;color:var(--sec);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.mod-switch button:hover{color:var(--navy)}
.mod-switch button.on{color:var(--navy);font-weight:700;border-bottom-color:var(--blue)}
.mod-switch button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#moduleHost{flex:1 1 auto;position:relative;min-height:0}
#moduleHost iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#moduleHost iframe.hidden{display:none}
.aviso{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.aviso .box{max-width:520px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 28px;text-align:center;box-shadow:0 6px 24px rgba(15,26,42,.08)}
.aviso .ic{font-size:34px}
.aviso h3{color:var(--navy);margin:10px 0 6px;font-size:18px}
.aviso p{color:var(--sec);font-size:14px;line-height:1.5;margin:0}
.hidden{display:none!important}
@media(max-width:640px){.app-header{padding:0 12px}.mod-switch{padding:0 8px}.ulist{grid-template-columns:1fr}}
</style>
</head>

<div class="previewbar">🔎 Vista previa local · Entrás una vez y te movés entre los módulos. Logística necesita el servidor (se activa al subirla).</div>

<div id="loginWrap">

    <p class="login-sub">Gestión de Belgrano Home · elegí tu usuario para entrar</p>
    <div class="ulist" id="userList"></div>
  </div>
</div>

<div id="app" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0">

  {id:'sergio',n:'Sergio',r:'Vendedor'},{id:'nati',n:'Nati',r:'Vendedor'},
  {id:'ale',n:'Ale',r:'Vendedor'},{id:'cristian',n:'Cristian',r:'Vendedor'},
  {id:'claudia',n:'Claudia',r:'Vendedor'},{id:'cintia',n:'Cintia',r:'Auditora / Coordinadora'},
  {id:'brian',n:'Brian',r:'Administrador'}
];
var NOMBRES={crm:'CRM',logistica:'Logística'};
var actual=null, cargados={};

function b64ToUtf8(b64){
  var bin=atob(b64.trim()); var by=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(by);
}

/* --- Login Be Soft --- */
document.getElementById('userList').innerHTML=USERS.map(function(u){
  return '<div class="ucard" onclick="entrar(\''+u.id+'\')"><div class="un">'+u.n+'</div><div class="ur">'+u.r+'</div></div>';
}).join('');

function entrar(id){
  actual=USERS.filter(function(u){return u.id===id;})[0];
  document.getElementById('loginWrap').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topWho').textContent=actual.n;
  abrir('crm');
}
function salir(){ location.reload(); }

/* --- Navegación entre módulos --- */
function abrir(clave){
  var host=document.getElementById('moduleHost');
  if(clave==='logistica'){
    if(!cargados.logistica){
      var av=document.createElement('div'); av.id='if_logistica'; av.className='aviso';
      av.innerHTML='<div class="box"><div class="ic">🔌</div><h3>Logística se activa al subir la plataforma</h3><p>Este módulo se conecta al servidor (Supabase). Por seguridad, el navegador no lo deja funcionar desde un archivo abierto con doble clic. En la versión subida entrás una sola vez arriba y funciona igual que hoy.</p></div>';
      host.appendChild(av); cargados.logistica=true;
    }
  } else if(!cargados[clave]){
    var fr=document.createElement('iframe');
    fr.id='if_'+clave; fr.title=NOMBRES[clave];
    fr.srcdoc=b64ToUtf8(document.getElementById('src-'+clave).textContent);
    fr.addEventListener('load',function(){ autoLoginCRM(fr); });
    host.appendChild(fr); cargados[clave]=true;
  }
  Array.prototype.forEach.call(host.children,function(el){
    el.classList.toggle('hidden', el.id!=='if_'+clave);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#appNav button'),function(b){
    b.classList.toggle('on', b.getAttribute('data-mod')===clave);
  });
}

/* Entra automáticamente al CRM con el usuario elegido (sin pedir login otra vez),
   simulando el clic en su tarjeta de usuario (igual que una persona). */
function autoLoginCRM(fr){
  var tries=0;
  (function go(){
    try{
      var d=fr.contentDocument;
      if(d){
        var cards=[].slice.call(d.querySelectorAll('.ucard'));
        var card=cards.filter(function(c){var oc=c.getAttribute('onclick')||'';return oc.indexOf("'"+actual.id+"'")>=0;})[0]
              || cards.filter(function(c){return (c.textContent||'').trim().toLowerCase().indexOf(actual.n.toLowerCase())===0;})[0];
        if(card){ card.click(); return; }
      }
    }catch(e){}
    if(tries++<50) setTimeout(go,200);   // reintenta ~10s
  })();
}

/* Mantiene escondida la barra propia del CRM aunque reaparezca tras su login. */
setInterval(function(){
  var crm=document.getElementById('if_crm');
  if(crm && crm.tagName==='IFRAME'){ try{
    var d=crm.contentDocument;
    if(d){
      var h=d.querySelector('.app-header'); if(h) h.style.setProperty('display','none','important');
      var m=d.querySelector('.tabs .tab[data-tab="cola"]'); if(m) m.style.setProperty('display','none','important');
    }
  }catch(e){} }
},500);
</script>
