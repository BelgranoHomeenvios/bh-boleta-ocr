        ['todos', 'Todos'], ['bajo', 'Por debajo del mínimo'], ['con', 'Con mínimo definido'],
        ['sin', 'Sin mínimo'] ] },
      { k: 'entrega', titulo: 'Demora de entrega', ops: [
        ['todos', 'Todos'], ['15', 'Hasta 15 días'], ['30', 'Hasta 30 días'], ['mas', 'Más de 30'] ] },
      { k: 'pub', titulo: 'Publicación', ops: [
        ['todos', 'Todos'], ['tn', 'En Tienda Nube'], ['interno', 'Sólo interno'] ] },
    ],
    _fx: { stock: 'todos', minimo: 'todos', entrega: 'todos', pub: 'todos' },
    marcadosX() { return Object.values(this._fx).filter(v => v !== 'todos').length; },

    diasDe(p) {
      const cat = this.arbol.find(c => c.id === p.categoria_id);
      return global.DB.plazoDe(p, cat ? [cat] : []).dias;
    },

    pasaX(p) {
      const f = this._fx;
      const st = Number(p.stock) || 0;
      if (f.stock === 'hay' && !st) return false;
      if (f.stock === 'sin' && st) return false;
      if (f.minimo === 'bajo' && !(p.bajoMinimo > 0)) return false;
      if (f.minimo === 'con' && !(p.conMinimo > 0)) return false;
      if (f.minimo === 'sin' && p.conMinimo > 0) return false;
      if (f.entrega !== 'todos') {
        const d = this.diasDe(p);
        if (f.entrega === '15' && d > 15) return false;
        if (f.entrega === '30' && d > 30) return false;
        if (f.entrega === 'mas' && d <= 30) return false;
      }
      if (f.pub === 'tn' && !p.publicado_tn) return false;
      if (f.pub === 'interno' && p.publicado_tn) return false;
      return true;
    },

    // El pop-up. Cada grupo es una fila de opciones y se elige una sola.
    modalFiltros() {
      const antes = { ...this._fx };
      document.body.insertAdjacentHTML('beforeend', `
        <div class="mdl-back" id="mdl">
          <div class="card pad mdl-caja">
            <h3 class="h-title" style="font-size:18px">Filtrar muebles</h3>
            <p class="h-sub">Por cómo está el mueble hoy. Lo que <b>es</b> —ambiente, terminación,
              categoría— se elige en los costados.</p>
            ${this.FX.map(g => `<div class="fx-g">
              <div class="fx-t">${UI.esc(g.titulo)}</div>
              <div class="fx-ops">${g.ops.map(([k, l]) =>
                `<button class="fx-o ${this._fx[g.k] === k ? 'on' : ''}"
                  data-fx="${g.k}|${k}">${UI.esc(l)}</button>`).join('')}</div>
            </div>`).join('')}
            <div class="row" style="margin-top:18px;gap:10px">
              <button class="btn" id="mf-borrar">Borrar filtros</button>
              <div class="sp"></div>
              <button class="btn" id="mf-x">Cancelar</button>
              <button class="btn primary" id="mf-ok">Filtrar</button>
            </div>
          </div>
        </div>`);
      const cerrar = () => { const m = document.getElementById('mdl'); if (m) m.remove(); };
      const pintar = () => document.querySelectorAll('[data-fx]').forEach(b => {
        const [g, k] = b.dataset.fx.split('|');
        b.classList.toggle('on', this._fx[g] === k);
      });
      document.querySelectorAll('[data-fx]').forEach(b => b.onclick = () => {
        const [g, k] = b.dataset.fx.split('|');
        this._fx[g] = k; pintar();
      });
      document.getElementById('mf-borrar').onclick = () => {
        Object.keys(this._fx).forEach(k => { this._fx[k] = 'todos'; }); pintar();
      };
      document.getElementById('mf-x').onclick = () => { this._fx = antes; cerrar(); };
      document.getElementById('mdl').onclick = e => {
        if (e.target.id === 'mdl') { this._fx = antes; cerrar(); }
      };
      document.getElementById('mf-ok').onclick = () => { cerrar(); this.pintar(); };
    },

    htmlFiltros() {
      const gs = this.grupos();
      if (!gs.length) return '';
      return `<aside class="cat-f">
        ${this.chico() ? '' : `<button class="cat-fl izq dentro" data-plegar="f"
          title="Ocultar los filtros" aria-label="Ocultar los filtros">‹</button>`}
        <div class="cat-f-h">
          <span>Filtros</span>
          ${this.marcados() ? '<button class="lnk" id="cat-limpiar">limpiar</button>' : ''}
        </div>
        ${gs.map(g => {
          const sel = this.marcadosDe(g.k);
          // Con muchas opciones —las medidas son doce— la columna se hace
          // interminable: se muestran las primeras y el resto a pedido. Las
          // marcadas van siempre a la vista.
          const abierto = this._verMas.has(g.k);
          const tope = 6;
          const ops = abierto ? g.ops
            : [...g.ops.slice(0, tope), ...g.ops.slice(tope).filter(o => sel.includes(o.k))];
          const ocultas = g.ops.length - ops.length;
          const on = this.grupoAbierto(g.k);
          // Cerrado, el título lleva lo que esté marcado: "ESTRUCTURA · Blanca".
          const resumen = sel.length
            ? g.ops.filter(o => sel.includes(o.k)).map(o => o.label).join(', ')
            : '';
          return `<div class="cat-g ${on ? 'on' : ''}">
          <button class="cat-g-t" data-grupo="${UI.esc(g.k)}" aria-expanded="${on}">
            <span class="cat-g-fl">${on ? '▾' : '▸'}</span>
            <span class="cat-g-n">${UI.esc(g.titulo)}</span>
            ${sel.length ? `<span class="cat-g-m">${sel.length}</span>` : ''}
          </button>
          ${!on && resumen ? `<div class="cat-g-r">${UI.esc(resumen)}</div>` : ''}
          ${!on ? '' : ops.map(o => `<label class="cat-o ${sel.includes(o.k) ? 'on' : ''}">
            <input type="checkbox" data-f="${UI.esc(g.k)}" data-v="${UI.esc(String(o.k))}"
              ${sel.includes(o.k) ? 'checked' : ''}>
            ${g.color ? `<span class="pt" style="background:${global.DB.colorDe(o.label)}"></span>` : ''}
            <span class="cat-o-n">${UI.esc(o.label)}</span>
            <span class="cat-o-c tnum">${o.n}</span>
          </label>`).join('')}
          ${!on || !(ocultas > 0 || abierto) ? '' : `<button class="lnk lnk-mas"
            data-vermas="${UI.esc(g.k)}">${abierto ? 'ver menos' : `ver ${ocultas} más`}</button>`}
        </div>`; }).join('')}
      </aside>`;
    },

    engancharFiltros() {
      document.querySelectorAll('[data-f]').forEach(i => i.onchange = () => {
        // Las claves numéricas del árbol vuelven del DOM como texto.
        const v = /^\d+$/.test(i.dataset.v) ? Number(i.dataset.v) : i.dataset.v;
        this.ponerMarca(i.dataset.f, v, i.checked);
        this.pintar();
      });
      document.querySelectorAll('[data-grupo]').forEach(b => b.onclick = () => {
        this.abrirGrupo(b.dataset.grupo); this.pintar();
      });
      document.querySelectorAll('[data-vermas]').forEach(b => b.onclick = () => {
        const k = b.dataset.vermas;
        if (this._verMas.has(k)) this._verMas.delete(k); else this._verMas.add(k);
        this.pintar();
      });
      const l = document.getElementById('cat-limpiar');
      if (l) l.onclick = () => {
        this._f.ambiente = []; this._fp = {};
        this.pintar();
      };
    },

    // Las categorías de mueble, arriba y en una fila. Así se piensa el
    // catálogo: todas las mesas de luz, todas las cómodas — no por ambiente ni
    // por fecha de alta. Cada una dice cuántos muebles tiene.
    // Las categorías van a la derecha, en una lista con tilde: se marcan
    // varias a la vez —cómodas y mesas de luz— y cada una dice cuántos
    // muebles tiene. A la izquierda quedan las variables y sus opciones.
    htmlCats() {
      const g = this.grupoTipos();
      if (!g.length) return '';
      const sel = this._f.tipo;
      const flechaCat = this.chico() ? '' : `<button class="cat-fl der dentro" data-plegar="c"
        title="Ocultar las categorías" aria-label="Ocultar las categorías">›</button>`;
      const todos = (this._todo || []).filter(p => this.pasa(p, 'tipo')).length;
      const visibles = g.map(o => o.k);
      const todasPlegadas = visibles.length && visibles.every(k => this.plegada(k));
      return `<aside class="cat-c">
        <div class="cat-f-h"><span>Categorías</span>
          ${sel.length ? `<button class="lnk" data-tipo="">ver todas</button>` : ''}</div>
        ${this.orden === 'cat' && visibles.length > 1 ? `<div class="cat-c-sub">
          <button class="lnk" id="cat-plegar">${
            todasPlegadas ? 'abrir todas' : 'plegar todas'}</button></div>` : ''}
        ${flechaCat}
        <div class="cat-lc">
          <label class="cat-o ${sel.length ? '' : 'on'}">
            <input type="checkbox" data-tipo="" ${sel.length ? '' : 'checked'}>
            <span class="cat-o-n">Todas</span>
            <span class="cat-o-c tnum">${todos}</span></label>
          ${g.map(o => `<label class="cat-o ${sel.includes(o.k) ? 'on' : ''}">
            <input type="checkbox" data-tipo="${o.k}" ${sel.includes(o.k) ? 'checked' : ''}>
            <span class="cat-o-n">${UI.esc(o.label)}</span>
            <span class="cat-o-c tnum">${o.n}</span></label>`).join('')}
        </div>
      </aside>`;
    },

    engancharCats() {
      const pl = document.getElementById('cat-plegar');
      if (pl) pl.onclick = () => {
        const vis = this.grupoTipos().map(o => o.k);
        const todas = vis.every(k => this.plegada(k));
        vis.forEach(k => this.plegar(k, !todas));
        this.pintar();
      };
      document.querySelectorAll('[data-tipo]').forEach(el => {
        const usar = () => {
          const v = el.dataset.tipo;
          if (!v) this._f.tipo = [];
          else {
            const id = Number(v);
            this._f.tipo = this._f.tipo.includes(id)
              ? this._f.tipo.filter(x => x !== id) : [...this._f.tipo, id];
          }
          this.pintar();
        };
        if (el.tagName === 'INPUT') el.onchange = usar; else el.onclick = usar;
      });
    },

    // Las categorías que se ofrecen arriba, con su cuenta. Se calculan
    // ignorando la selección de categoría —si no, al elegir una las demás
    // quedarían en cero y no se podría sumar una segunda— pero sí respetan el
    // resto de los filtros.
    grupoTipos() {
      const m = new Map();
      (this._todo || []).filter(p => this.pasa(p, 'tipo') && this.pasaX(p)).forEach(p => {
        m.set(p.categoria_id, (m.get(p.categoria_id) || 0) + 1);
      });
      const nom = id => (this.arbol.find(c => c.id === id) || {}).nombre || '—';
      return [...m.entries()].map(([k, n]) => ({ k, n, label: nom(k) }))
        .sort((a, b) => a.label.localeCompare(b.label));
    },

    async pintar() {
      const cont = document.getElementById('cat-lista');
      cont.innerHTML = UI.spinner();
      const actual = this.ruta.length ? this.ruta[this.ruta.length - 1].id : null;

      try {
        await this.cargarTodo();
      } catch (e) {
        cont.innerHTML = `<div class="banner warn">No se pudo leer: ${UI.esc(e.message || e)}</div>`;
        return;
      }

      // Lo que se ve es: lo que cuelga de donde estoy parado, filtrado, y si
      // hay texto, lo que coincide en todo el catálogo.
      const bajo = id => {
        if (id == null) return () => true;
        const dentro = new Set([id]);
        let cambio = true;
        while (cambio) {
          cambio = false;
          this.arbol.forEach(c => {
            if (c.padre_id != null && dentro.has(c.padre_id) && !dentro.has(c.id)) {
              dentro.add(c.id); cambio = true;
            }
          });
        }
        return p => dentro.has(p.categoria_id);
      };
      const t = global.DB.sinTilde ? global.DB.sinTilde(this.texto) : this.texto.toLowerCase();
      const enTexto = p => !this.texto
        || (p.nombre + ' ' + (p.sku || '')).toLowerCase().includes(this.texto.toLowerCase());

      this._prods = (this._todo || [])
        .filter(this.texto ? enTexto : bajo(actual))
        .filter(p => this.pasa(p) && this.pasaX(p));

      // Tres columnas: las variables a la izquierda, los muebles en el medio
      // y las categorías a la derecha. Si la pantalla no da para las tres, el
      // costado que esté abierto se muestra encima, como un cajón, y el otro
      // se cierra: no tiene sentido tapar los muebles dos veces.
      const chico = this.chico();
      this._eraChico = chico;
      const fh = this.verFiltros ? this.htmlFiltros() : '';
      const ch = this.verCats ? this.htmlCats() : '';
      const cajon = chico && (fh || ch);
      const flecha = (id, abierto, lado) => `<button class="cat-fl ${lado}" data-plegar="${id}"
        title="${abierto ? 'Ocultar' : 'Mostrar'} ${id === 'f' ? 'los filtros' : 'las categorías'}"
        aria-label="${abierto ? 'Ocultar' : 'Mostrar'} ${id === 'f' ? 'los filtros' : 'las categorías'}"
        >${lado === 'izq' ? (abierto ? '‹' : '›') : (abierto ? '›' : '‹')}</button>`;
      cont.innerHTML = `<div class="cat-cols ${fh && !chico ? '' : 'sin-f'} ${ch && !chico ? '' : 'sin-c'}">
        ${chico ? '' : (fh || flecha('f', false, 'izq'))}
        <div class="cat-res" id="cat-res"></div>
        ${chico ? '' : (ch || flecha('c', false, 'der'))}
      </div>
      ${cajon ? `<div class="cat-back" id="cat-back"></div>
        <aside class="cat-cajon">
          <div class="cat-cajon-h">
            <button class="lx" id="cat-cerrar" title="Cerrar">›</button>
            <b>${fh ? 'Filtrar muebles' : 'Categorías'}</b>
          </div>
          <div class="cat-cajon-b">${fh || ch}</div>
        </aside>` : ''}`;
      this.engancharCats();
      const cerrar = () => {
        this.verFiltros = false; this.verCats = false;
        try { localStorage.setItem(FILTROS_KEY, '0'); localStorage.setItem(CATS_KEY, '0'); } catch {}
        this.pintar();
      };
      const bk = document.getElementById('cat-back'); if (bk) bk.onclick = cerrar;
      const cc = document.getElementById('cat-cerrar'); if (cc) cc.onclick = cerrar;
      // Cada costado se pliega con su flecha. Al plegarlo entra una tarjeta
      // más por fila, que es para lo que se pliega.
      document.querySelectorAll('[data-plegar]').forEach(b => b.onclick = () => {
        if (b.dataset.plegar === 'f') {
          this.verFiltros = !this.verFiltros;
          try { localStorage.setItem(FILTROS_KEY, this.verFiltros ? '1' : '0'); } catch {}
        } else {
          this.verCats = !this.verCats;
          try { localStorage.setItem(CATS_KEY, this.verCats ? '1' : '0'); } catch {}
        }
        this.pintar();
      });

      const bf = document.getElementById('cat-verf');
      if (bf) {
        bf.classList.toggle('on', !!this.marcadosX());
        const n = document.getElementById('cat-fn');
        if (n) n.textContent = this.marcadosX() || '';
      }
      this.pintarProductos(document.getElementById('cat-res') || cont, this.texto
        ? 'No hay muebles para esa búsqueda.'
        : (this.marcados() ? 'Ningún mueble cumple con esos filtros.' : 'No hay muebles acá.'));
      this.engancharFiltros();
      this.pintarSub();
    },

    // Cuántos se están viendo, arriba a la derecha.
    pintarSub() {
      const s = document.getElementById('cat-cuenta');
      if (!s) return;
      const n = (this._prods || []).length, tot = (this._todo || []).length;
      s.textContent = n === tot
        ? `${tot} ${tot === 1 ? 'mueble' : 'muebles'}`
        : `${n} de ${tot} muebles`;
    },

    async buscar() {
      this.ruta = [];
      this.pintar();
    },

    // Cambia entre bloques/listado y re-pinta lo que haya sin volver a la base.
    setVista(v) {
      if (v === this.vista) return;
      this.vista = v;
      try { localStorage.setItem(VISTA_KEY, v); } catch {}
      this.pintarTog();
      const cont = document.getElementById('cat-res') || document.getElementById('cat-lista');
      if (this._prods) this.pintarProductos(cont, 'Sin productos.');
    },

    pintarTog() {
      const b = document.getElementById('v-bloques'), l = document.getElementById('v-lista');
      if (!b || !l) return;
      b.className = this.vista === 'bloques' ? 'on' : '';
      l.className = this.vista === 'lista' ? 'on' : '';
    },

    // Dispatcher: pinta la lista de productos en el formato elegido. Cuando
    // se ordena por categoría, cada una lleva su título: recorrer "todo" es
    // recorrer el catálogo como está ordenado en la cabeza.
    pintarProductos(cont, vacio) {
      if (!cont) return;
      const prods = this.ordenados(this._prods || []);
      const uno = p => (this.vista === 'lista' ? this.htmlLista(p) : this.htmlBloques(p));
      if (!prods.length) { cont.innerHTML = UI.vacio(vacio); this.enganchar(cont); this.pintarSub(); return; }

      const grupos = this.orden === 'cat' ? this.porCategoria(prods) : null;
      // En el listado el encabezado de la tabla no se repite por categoría:
      // va una sola tabla con un renglón de título entre grupo y grupo.
      if (this.vista === 'lista' && grupos && grupos.length > 1) {
        cont.innerHTML = this.htmlLista(prods, grupos);
        this.enganchar(cont);
        this.engancharPlegar(cont);
        cont.querySelectorAll('[data-solo]').forEach(a => a.onclick = e => {
          e.preventDefault(); e.stopPropagation();
          this._f.tipo = [Number(a.dataset.solo)]; this.pintar();
        });
        this.pintarSub();
        return;
      }
      cont.innerHTML = grupos && grupos.length > 1
        ? grupos.map(g => {
            const cerrada = this.plegada(g.id);
            return `<section class="cat-sec ${cerrada ? 'plegada' : ''}">
            <div class="cat-sec-h">
              <button class="cat-sec-b" data-plegarcat="${g.id}"
                aria-expanded="${!cerrada}" title="${cerrada ? 'Mostrar' : 'Ocultar'} ${UI.esc(g.nombre)}">
                <span class="cat-sec-g">${cerrada ? '▸' : '▾'}</span>
                <span class="cat-sec-t">${UI.esc(g.nombre)}</span>
                <span class="cat-sec-n">${g.items.length} ${g.items.length === 1 ? 'mueble' : 'muebles'}</span>
              </button>
              <a class="cat-sec-v" href="#" data-solo="${g.id}">ver sólo esta ›</a>
            </div>
            ${cerrada ? '' : uno(g.items)}
          </section>`; }).join('')
        : uno(prods);
      this.enganchar(cont);
      this.engancharPlegar(cont);
      cont.querySelectorAll('[data-solo]').forEach(a => a.onclick = e => {
        e.preventDefault();
        this._f.tipo = [Number(a.dataset.solo)];
        this.pintar();
      });
      this.pintarSub();
    },

    orden: 'cat',
    _cerradas: (() => {
      try { return new Set(JSON.parse(localStorage.getItem(CERRADAS_KEY)) || []); }
      catch { return new Set(); }
    })(),
    plegada(id) { return this._cerradas.has(id); },
    plegar(id, valor) {
      if (valor === undefined) valor = !this.plegada(id);
      if (valor) this._cerradas.add(id); else this._cerradas.delete(id);
      try { localStorage.setItem(CERRADAS_KEY, JSON.stringify([...this._cerradas])); } catch {}
    },
    engancharPlegar(cont) {
      cont.querySelectorAll('[data-plegarcat]').forEach(b => b.onclick = e => {
        e.preventDefault(); e.stopPropagation();
        this.plegar(Number(b.dataset.plegarcat));
        this.pintar();
      });
    },
    ordenados(prods) {
      const l = [...prods];
      if (this.orden === 'nombre') return l.sort((a, b) => a.nombre.localeCompare(b.nombre));
      if (this.orden === 'precio') return l.sort((a, b) => (a.desde || 0) - (b.desde || 0));
      const nom = id => (this.arbol.find(c => c.id === id) || {}).nombre || '';
      return l.sort((a, b) => nom(a.categoria_id).localeCompare(nom(b.categoria_id))
        || a.nombre.localeCompare(b.nombre));
    },
    porCategoria(prods) {
      const m = new Map();
      prods.forEach(p => {
        if (!m.has(p.categoria_id)) m.set(p.categoria_id, []);
        m.get(p.categoria_id).push(p);
      });
      const nom = id => (this.arbol.find(c => c.id === id) || {}).nombre || 'Sin categoría';
      return [...m.entries()].map(([id, items]) => ({ id, nombre: nom(id), items }))
        .sort((a, b) => a.nombre.localeCompare(b.nombre));
    },

    // El estado del mueble de un vistazo, que es lo que cambia la conversación
    // con el cliente: si hay en depósito se entrega ya; si no, se fabrica.
    estado(p) {
      if (p.publicado_tn === false && p.publicado === false) return { label: 'Oculto', pill: 'soft' };
      if ((p.stock || 0) > 0) return { label: `Stock ${p.stock}`, pill: 'ok' };
      return { label: 'A pedido', pill: 'warn' };
    },
    puntos(p) {
      const ts = (p.terminaciones || []).slice(0, 5);
      if (!ts.length) return '';
      return `<span class="pts">${ts.map(t =>
        `<span class="pt" title="${UI.esc(t)}" style="background:${global.DB.colorDe(t)}"></span>`).join('')}
        ${(p.terminaciones || []).length > 5
          ? `<small class="muted">+${p.terminaciones.length - 5}</small>` : ''}</span>`;
    },
    catDe(id) { return (this.arbol.find(c => c.id === id) || {}).nombre || ''; },

    // El listado: lo mismo que la tarjeta pero apretado para comparar. Sin
    // código ni precio —no es lo que se mira acá—, con una foto chica para
    // reconocer el mueble de un vistazo. Se entra tocando el renglón; los
    // tres puntitos son para ir derecho a una solapa.
    htmlLista(prods, grupos) {
      // La foto va primera: es lo que identifica el mueble de un vistazo. El
      // estado y las terminaciones no van — para eso está la vista con fotos.
      const renglon = p => `<tr data-prod="${p.id}">
            <td class="td-foto"><span class="mini">${p.foto
              ? `<img src="${UI.esc(p.foto)}" alt="">`
              : this.silueta(p.categoria_id)}</span></td>
            <td><b>${UI.esc(p.nombre)}</b></td>
            <td class="muted">${UI.esc(this.catDe(p.categoria_id))}</td>
            <td style="text-align:right" class="tnum">${p.variantes}</td>
            <td style="text-align:right" class="tnum">${p.stock || '—'}</td>
            <td class="td-mas"><button class="lx" data-mas="${p.id}"
              title="Abrir en…" aria-label="Abrir en…">⋯</button></td></tr>`;
      const cuerpo = grupos
        ? grupos.map(g => {
            const cerrada = this.plegada(g.id);
            return `<tr class="cat-tr-h"><td colspan="6">
            <button class="cat-sec-b" data-plegarcat="${g.id}"
              aria-expanded="${!cerrada}" title="${cerrada ? 'Mostrar' : 'Ocultar'} ${UI.esc(g.nombre)}">
              <span class="cat-sec-g">${cerrada ? '▸' : '▾'}</span>
              <span class="cat-sec-t">${UI.esc(g.nombre)}</span>
              <span class="cat-sec-n">${g.items.length} ${g.items.length === 1 ? 'mueble' : 'muebles'}</span>
            </button>
            <a class="cat-sec-v" href="#" data-solo="${g.id}">ver sólo esta ›</a>
          </td></tr>${cerrada ? '' : g.items.map(renglon).join('')}`; }).join('')
        : prods.map(renglon).join('');
      return `<div class="card"><table class="cat-tabla">
        <thead><tr><th class="th-foto"></th><th>Producto</th><th>Tipo</th>
          <th style="text-align:right">Variantes</th><th style="text-align:right">Stock</th>
          <th></th></tr></thead>
        <tbody>${cuerpo}</tbody></table></div>`;
    },

    // El menú de los tres puntitos: entrar derecho a la solapa que hace falta.
    menuMueble(id, boton) {
      document.querySelectorAll('.cat-menu').forEach(m => m.remove());
      const solapas = [
        ['producto', 'Información general'], ['inventario', 'Inventario'],
        ['produccion', 'Producción'],
      ];
      if (global.App && global.App.puede && global.App.puede('verCostos')) {
        solapas.push(['costos', 'Compra y venta']);
      }
      solapas.push(['documentos', 'Documentos']);
      const r = boton.getBoundingClientRect();
      document.body.insertAdjacentHTML('beforeend', `
        <div class="cat-menu-back"></div>
        <div class="cat-menu" style="top:${Math.round(r.bottom + 4)}px;left:${Math.round(r.right - 190)}px">
          ${solapas.map(([k, l]) => `<button data-ir="${k}">${UI.esc(l)}</button>`).join('')}
        </div>`);
      const cerrar = () => document.querySelectorAll('.cat-menu,.cat-menu-back').forEach(x => x.remove());
      document.querySelector('.cat-menu-back').onclick = cerrar;
      document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
        const k = b.dataset.ir; cerrar();
        this.ficha(id).then(() => {
          if (global.ProductoDet && global.ProductoDet.p) {
            global.ProductoDet._tab = k; global.ProductoDet.pintar();
          }
        });
      });
    },

    // Silueta del mueble por tipo. Es un dibujo, no la foto: sirve para
    // reconocer el mueble de un vistazo hasta que estén las fotos de Tienda Nube.
    silueta(catId) {
      const t = { fill: 'none', s: 'currentColor' };
      const D = {
        2: '<rect x="14" y="26" width="92" height="58" rx="3"/><line x1="14" y1="45" x2="106" y2="45"/><line x1="14" y1="64" x2="106" y2="64"/><line x1="50" y1="35" x2="70" y2="35"/><line x1="50" y1="54" x2="70" y2="54"/><line x1="50" y1="74" x2="70" y2="74"/><line x1="22" y1="84" x2="22" y2="92"/><line x1="98" y1="84" x2="98" y2="92"/>',
        3: '<rect x="20" y="12" width="80" height="80" rx="3"/><line x1="60" y1="12" x2="60" y2="92"/><circle cx="54" cy="52" r="2.5"/><circle cx="66" cy="52" r="2.5"/><line x1="20" y1="30" x2="100" y2="30"/>',
        6: '<rect x="30" y="40" width="60" height="34" rx="3"/><line x1="30" y1="58" x2="90" y2="58"/><line x1="52" y1="49" x2="68" y2="49"/><line x1="36" y1="74" x2="36" y2="88"/><line x1="84" y1="74" x2="84" y2="88"/>',
        5: '<rect x="16" y="42" width="88" height="10" rx="2"/><line x1="30" y1="52" x2="24" y2="86"/><line x1="90" y1="52" x2="96" y2="86"/><line x1="34" y1="70" x2="86" y2="70"/>',
        7: '<rect x="12" y="40" width="96" height="34" rx="3"/><line x1="60" y1="40" x2="60" y2="74"/><line x1="12" y1="62" x2="108" y2="62"/><line x1="24" y1="74" x2="24" y2="86"/><line x1="96" y1="74" x2="96" y2="86"/>',
      };
      return `<svg class="sil" viewBox="0 0 120 100" fill="${t.fill}" stroke="${t.s}"
        stroke-width="2" stroke-linecap="round" aria-hidden="true">${D[catId] || D[2]}</svg>`;
    },

    // La tarjeta no muestra plata: acá se mira qué es el mueble, en cuántas
    // versiones viene y cuánto hay hecho. El precio está adentro.
    htmlBloques(prods) {
      return `<div class="grid-prod">${prods.map(p => {
        const e = this.estado(p);
        const st = Number(p.stock) || 0;
        return `<button class="prod-tile" data-prod="${p.id}">
            <div class="prod-img">${p.foto
              ? `<img src="${UI.esc(p.foto)}" alt="${UI.esc(p.nombre)}">`
              : this.silueta(p.categoria_id)}
              <span class="pill ${e.pill} prod-est">${UI.esc(e.label)}</span></div>
            <div class="prod-n">${UI.esc(p.nombre)}</div>
            <div class="prod-c">${UI.esc(this.catDe(p.categoria_id))}</div>
            <div class="prod-b">
              <span class="prod-v">${p.variantes} ${p.variantes === 1 ? 'variante' : 'variantes'}</span>
              ${this.puntos(p)}
            </div>
            <div class="prod-s ${st ? 'hay' : ''}">${st
              ? `<b class="tnum">${st}</b> en depósito`
              : 'sin stock — se fabrica'}</div>
          </button>`;
      }).join('')}</div>`;
    },

    enganchar(cont) {
      // En las dos vistas se entra a la FICHA del mueble: es la pantalla donde
      // el vendedor mira precios, medidas y terminaciones antes de cotizar.
      cont.querySelectorAll('[data-prod]').forEach(el =>
        el.onclick = e => {
          if (e.target.closest('[data-mas]')) return;   // los puntitos tienen lo suyo
          this.ficha(Number(el.dataset.prod));
        });
      cont.querySelectorAll('[data-mas]').forEach(b => b.onclick = e => {
        e.stopPropagation();
        this.menuMueble(Number(b.dataset.mas), b);
      });
    },

    // ---- Ficha del mueble --------------------------------------------------
    // Dirección y Producción entran al mueble para editarlo; el resto ve la
    // ficha de lectura.
    async ficha(prodId) {
      if (global.ProductoDet && global.App && global.App.tab === 'catalogo') {
        return global.ProductoDet.render(this._mount || 'view', prodId);
      }
      return this.fichaLectura(prodId);
    },

    async fichaLectura(prodId) {
      const v = document.getElementById(this._mount || 'view');
      v.innerHTML = UI.spinner('Abriendo el mueble…');
      let p, vars;
      try {
        p = await global.DB.producto(prodId);
        vars = await global.DB.variantes(prodId);
      } catch (e) {
        v.innerHTML = `<div class="banner warn">No se pudo abrir: ${UI.esc(e.message || e)}</div>`;
        return;
      }
      if (!p) { v.innerHTML = UI.vacio('Ese mueble no está en el catálogo.'); return; }

      // Los tres ejes con sus opciones, para el armador de la ficha.
      const eje = k => [...new Set(vars.map(x => x[k]).filter(Boolean))];
      const EJES = [
        { k: 'medida', lbl: 'Medida', ops: eje('medida') },
        { k: 'estructura', lbl: 'Estructura', ops: eje('estructura') },
        { k: 'frente', lbl: 'Frente', ops: eje('frente') },
      ].filter(e => e.ops.length);
      this._sel = {}; EJES.forEach(e => { this._sel[e.k] = e.ops[0]; });
      this._vars = vars; this._p = p; this._ejes = EJES;

      const tn = p.publicado_tn
        ? '<span class="pill ok">Publicado en Tienda Nube</span>'
        : '<span class="pill soft">Sólo interno</span>';
      const ruta = [p.ambiente && p.ambiente.nombre, p.categoria && p.categoria.nombre].filter(Boolean);

      v.innerHTML = `
        <div class="row" style="margin-bottom:14px;align-items:flex-start">
          <div>
            <div class="kick"><a href="#" id="fi-volver">‹ Catálogo</a>${
              ruta.length ? ` · ${UI.esc(ruta.join(' › '))}` : ''}</div>
            <h1 class="h-title">${UI.esc(p.nombre)}</h1>
            <div class="h-sub">${p.sku ? `<span class="tnum">${UI.esc(p.sku)}</span> · ` : ''}${tn}</div>
          </div>
          <div class="sp"></div>
          <button class="btn primary" id="fi-cotizar">Cotizar este mueble</button>
        </div>

        <div class="fi-cols">
          <div class="card pad fi-foto">
            <div class="fi-img">${this.silueta(p.categoria_id)}</div>
            <div class="hint" style="margin-top:8px">Dibujo de referencia — la foto viene de Tienda Nube.</div>
          </div>

          <div class="card pad">
            <div class="fi-precio">
              <span>Precio de lista</span>
              <b class="tnum" id="fi-p">—</b>
              <span class="fi-efe" id="fi-e"></span>
            </div>
            ${EJES.map(e => `<div class="fi-eje">
              <div class="fi-lbl">${UI.esc(e.lbl)}</div>
              <div class="fi-ops">${e.ops.map(o =>
                `<button class="opb" data-eje="${e.k}" data-op="${UI.esc(o)}">${UI.esc(o)}</button>`).join('')}</div>
            </div>`).join('')}
            <div class="fi-nota" id="fi-nota"></div>
          </div>
        </div>

        <div class="fi-cols" style="margin-top:14px">
          <div class="card pad">
            <div class="fi-h">Ficha técnica</div>
            <div class="fi-dl">
              ${p.alto ? `<div><span>Alto</span><b>${String(p.alto).replace('.', ',')} m</b></div>` : ''}
              ${p.prof ? `<div><span>Profundidad</span><b>${String(p.prof).replace('.', ',')} m</b></div>` : ''}
              <div><span>Medidas</span><b>${UI.esc((eje('medida').join(' · ')) || '—')}</b></div>
              <div><span>Plazo de fábrica</span><b>${p.dias ? `${p.dias} días` : 'a confirmar'}</b></div>
              <div class="ancho"><span>Materiales</span><b>${UI.esc(p.materiales || '—')}</b></div>
            </div>
            ${p.desc ? `<p class="fi-desc">${UI.esc(p.desc)}</p>` : ''}
          </div>
          <div class="card pad">
            <div class="fi-h">Todas las combinaciones <span class="muted">(${vars.length})</span></div>
            <div class="fi-tabla">${this.tablaVariantes(vars)}</div>
          </div>
        </div>
        ${this.estiloFicha()}`;

      document.getElementById('fi-volver').onclick = e => { e.preventDefault(); this.render(this._mount || 'view'); };
      document.getElementById('fi-cotizar').onclick = () => this.aCotizar();
      v.querySelectorAll('[data-eje]').forEach(b => b.onclick = () => {
        this._sel[b.dataset.eje] = b.dataset.op; this.refrescarFicha();
      });
      this.refrescarFicha();
    },

    // La variante que corresponde a lo elegido en los tres ejes.
    varSel() {
      return (this._vars || []).find(v => this._ejes.every(e => v[e.k] === this._sel[e.k])) || null;
    },

    refrescarFicha() {
      const v = this.varSel();
      document.querySelectorAll('[data-eje]').forEach(b =>
        b.classList.toggle('on', this._sel[b.dataset.eje] === b.dataset.op));
      const p = document.getElementById('fi-p'); if (!p) return;
      p.textContent = v ? UI.pesos(v.precio) : '—';
      // El de lista es el que se cotiza; el de efectivo sale del mismo lugar
      // que en la cotización (Configuración → Reglas de precio).
      const pct = global.DB.descuentoDe('efectivo');
      const e = document.getElementById('fi-e');
      e.innerHTML = v && pct
        ? `en efectivo <b class="tnum">${UI.pesos(Math.round(v.precio * (1 - pct / 100)))}</b> <span class="int">−${pct}%</span>`
        : '';
      const n = document.getElementById('fi-nota');
      n.innerHTML = v
        ? `<span class="muted">Combinación</span> <b>${UI.esc(this._ejes.map(x => this._sel[x.k]).join(' · '))}</b>`
        : `<span class="warn-t">Esa combinación no está en el catálogo — se cotiza <b>a medida</b>.</span>`;
    },

    // Desde la ficha se salta al presupuesto con el mueble ya cargado.
    aCotizar() {
      const v = this.varSel();
      if (!v) return UI.aviso('Elegí una combinación que exista para cotizarla', 'warn');
      global.Presupuesto._precarga = { nombre: this._p.nombre, variante: v };
      global.App.goSub('ventas', 'nueva');
    },

    estiloFicha() {
      return `<style>
        .fi-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
        @media(max-width:900px){.fi-cols{grid-template-columns:1fr}}
        .fi-foto .fi-img{display:grid;place-items:center;background:var(--panel-2);border-radius:10px;
          padding:18px;color:var(--muted);min-height:210px}
        .fi-foto .sil{width:100%;max-width:300px;height:180px}
        .fi-precio{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:12px;
          margin-bottom:12px;border-bottom:1px solid var(--line)}
        .fi-precio>span:first-child{font-size:11px;font-weight:700;letter-spacing:.06em;
          text-transform:uppercase;color:var(--muted)}
        .fi-precio b{font-size:26px;color:var(--navy)}
        .fi-efe{font-size:13px;color:var(--muted)}
        .fi-efe b{font-size:13px;color:var(--ok)}
        .fi-eje{margin-bottom:11px}
        .fi-lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
          color:var(--muted);margin-bottom:5px}
        .fi-ops{display:flex;gap:6px;flex-wrap:wrap}
        .opb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;
          font-size:13px;color:var(--ink-soft);cursor:pointer;transition:.12s}
        .opb:hover{border-color:var(--brand)}
        .opb.on{border-color:var(--brand);background:var(--brand);color:#fff;font-weight:650}
        .fi-nota{margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:12.5px}
        .fi-nota b{color:var(--navy)}
        .warn-t{color:var(--warn)}
        .fi-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
          color:var(--navy);margin-bottom:11px}
        .fi-dl{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px}
        .fi-dl .ancho{grid-column:1/-1}
        .fi-dl span{display:block;font-size:11px;color:var(--muted)}
        .fi-dl b{font-size:13px;color:var(--navy);font-weight:600}
        .fi-desc{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);
          font-size:13px;color:var(--ink-soft);line-height:1.55}
        .fi-tabla{max-height:340px;overflow:auto}
        .fi-tabla table{font-size:12.5px}
      </style>`;
    },

    tablaVariantes(vars) {
      if (!vars.length) return UI.vacio('Sin variantes cargadas.');
      return `<table style="margin:2px 0">
        <thead><tr><th>Medida</th><th>Estructura</th><th>Frente</th><th>Otros</th><th style="text-align:right">Precio</th></tr></thead>
        <tbody>${vars.map(v => {
          const extras = UI.extras(v).map(([k, val]) =>
            `<span class="pill soft">${UI.esc(k)}: ${UI.esc(val)}</span>`).join(' ') || '<span class="muted">—</span>';
          return `<tr>
            <td class="tnum">${UI.esc(v.medida || '—')}</td>
            <td>${UI.esc(v.estructura || '—')}</td>
            <td>${UI.esc(v.frente || '—')}</td>
            <td>${extras}</td>
            <td style="text-align:right"><b class="tnum">${UI.pesos(v.precio)}</b></td></tr>`;
        }).join('')}</tbody></table>`;
    },

    modalConexion() {
      const c = global.DB.cfg();
      document.body.insertAdjacentHTML('beforeend', `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:grid;place-items:center;padding:20px" id="mdl">
          <div class="card pad" style="max-width:460px;width:100%">
            <h3 class="h-title" style="font-size:18px">Conectar Belgrano Soft</h3>
            <p class="h-sub">Pegá la <b>anon key</b> (Settings → API → Project API keys → anon public). Es pública, va en el frontend.</p>
            <label class="fld" style="margin-top:14px"><span class="lbl">URL del proyecto</span>
              <input id="mc-url" value="${UI.esc(c.url || global.DB.DEFAULT_URL)}"></label>
            <label class="fld" style="margin-top:12px"><span class="lbl">anon key</span>
              <input id="mc-key" placeholder="eyJ…" value="${UI.esc(c.key || '')}"></label>
            <div class="row" style="margin-top:18px;justify-content:flex-end;gap:10px">
              <button class="btn" id="mc-cancel">Cancelar</button>
              <button class="btn primary" id="mc-ok">Conectar</button>
            </div>
          </div>
        </div>`);
      const cerrar = () => document.getElementById('mdl').remove();
      document.getElementById('mc-cancel').onclick = cerrar;
      document.getElementById('mc-ok').onclick = () => {
        const url = document.getElementById('mc-url').value.trim();
        const key = document.getElementById('mc-key').value.trim();
        if (!key) { UI.aviso('Falta la anon key', 'warn'); return; }
        global.DB.guardarCfg(url, key);
        UI.aviso('Conectado. Recargando…', 'ok');
        setTimeout(() => location.reload(), 600);
      };
    },
  };

  global.Catalogo = Catalogo;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================
//  Belgrano Soft · El mueble
//  Pantalla donde se CREA y se EDITA un mueble. Todo va en una sola
//  columna, un bloque abajo del otro: nombre, fotos, categorías,
//  propiedades, variantes, proveedores, abastecimiento y contabilidad.
//  Es interna: el vendedor no entra acá, y los costos los ve sólo
//  Dirección (Producción ve el resto, pero de lectura).
// =====================================================================
(function (global) {
  const Producto = {
    p: null,            // el mueble que se está editando
    vars: [],           // sus variantes
    _mount: 'view',
    _abierta: null,     // variante abierta en el panel lateral
    _fVar: '',          // filtro del listado de variantes

    // ---- Permisos ------------------------------------------------------
    verCostos() { return !global.App || !global.App.verCostos || global.App.verCostos(); },
    puedeEditar() { return !global.App || !global.App.editaCatalogo || global.App.editaCatalogo(); },

    async render(mount = 'view', id) {
      this._mount = mount;
      const v = document.getElementById(mount);
      v.innerHTML = UI.spinner('Abriendo el mueble…');
      try {
        this.p = await global.DB.producto(id);
        this.vars = await global.DB.variantes(Number(id));
        this._arbol = await global.DB.arbolCategorias();
        if (!this.p.categorias) this.p.categorias = this.p.categoria_id ? [this.p.categoria_id] : [];
      } catch (e) {
        v.innerHTML = `<div class="banner warn">No se pudo abrir: ${UI.esc(e.message || e)}</div>`;
        return;
      }
      if (!this.p) { v.innerHTML = UI.vacio('Ese mueble no está en el catálogo.'); return; }
      this.pintar();
    },

    // ---- Cálculo -------------------------------------------------------
    // Las propiedades que usa este mueble, con los valores que tiene activos.
    // El orden importa: es el que después ordena las variantes de abajo.
    props() {
      const dicc = global.DB.propiedades();
      return (this.p.propiedades || []).map(k => {
        const d = dicc.find(x => x.k === k) || { k, nombre: k.toUpperCase(), valores: [] };
        // Los valores en uso, en el orden del diccionario — no en el orden en
        // que se fueron cargando. El diccionario escribe "1,60" y la variante
        // "1.60": se comparan normalizados o no se encontrarían nunca.
        const norm = x => String(x || '').replace(',', '.').toLowerCase().trim();
        // Si el mismo valor está dos veces escrito distinto ("1,60" y "1.60"),
        // manda la primera aparición: si no, la copia del final pisa la
        // posición real y el orden que se acaba de guardar no se ve.
        const pos = new Map();
        d.valores.forEach((v, i) => { if (!pos.has(norm(v))) pos.set(norm(v), i); });
        const hay = [...new Set(this.vars.map(v => v[k]).filter(Boolean))];
        const usados = hay.sort((a, b) => {
          const ia = pos.has(norm(a)) ? pos.get(norm(a)) : Infinity;
          const ib = pos.has(norm(b)) ? pos.get(norm(b)) : Infinity;
          if (ia !== ib) return ia - ib;
          // Los que no están en el diccionario, en orden natural: 1.40 antes
          // que 1.60 y no "1.40" antes que "1.4" como texto.
          return String(a).localeCompare(String(b), 'es', { numeric: true });
        });
        return { ...d, usados };
      });
    },

    // Las variantes salen ordenadas por la propiedad 1, después la 2 y después
    // la 3 — respetando el orden de los valores de cada una. Así quedan todas
    // las de 0,40 blanca juntas, y adentro por frente.
    ordenadas(lista) {
      const ejes = this.p.propiedades || [];
      const pos = {};
      this.props().forEach(pr => {
        pos[pr.k] = {};
        pr.usados.forEach((v, i) => { pos[pr.k][v] = i; });
      });
      return [...(lista || this.vars)].sort((a, b) => {
        for (const k of ejes) {
          const ia = pos[k] && pos[k][a[k]] !== undefined ? pos[k][a[k]] : 999;
          const ib = pos[k] && pos[k][b[k]] !== undefined ? pos[k][b[k]] : 999;
          if (ia !== ib) return ia - ib;
        }
        return 0;
      });
    },
    // 3 estructuras × 3 frentes × 3 medidas = 27. Sale solo.
    combinatorio() {
      const ps = this.props().filter(p => p.usados.length);
      return ps.length ? ps.reduce((a, p) => a * p.usados.length, 1) : 0;
    },
    markupDe(v) { return global.DB.markupDe(v.costo, v.precio); },
    objetivoDe(v) { return Number(v.markupObj) || Number(this.p.markupObj) || global.DB.MARKUP_OBJETIVO; },
    activas() { return this.vars.filter(v => v.activa !== false); },
    // Estado del mueble entero: el peor de sus variantes manda.
    estado() {
      const ms = this.activas().map(v => this.markupDe(v)).filter(x => x > 0);
      if (!ms.length) return { k: 'sin', label: 'Sin costo', pill: 'soft' };
      return global.DB.bandaDe(Math.min(...ms));

    // ---- Pintado -------------------------------------------------------
    // Las solapas. La primera es la que se abre siempre: el mueble, sus

    SOLAPAS: [
      { k: 'producto', label: 'Información general' },

    // Los números de costo sólo se ven en su solapa, y sólo si el rol puede.

    _abre: { mueble: true, catprop: true, variantes: true, adicionales: false },

    modulo(k, n, titulo, resumen, cuerpo, ok) {

      const v = document.getElementById(this._mount); if (!v) return;

    listasDe() {

    tabInventario() {

    // Arriba, sólo cuántos rubros hacen falta. Cada uno se carga adentro de su

    bloqueQuienFabrica() {

    rubrosDe() {

    nombreRubro(k) { const r = global.DB.rubro(k); return r ? r.label : 'Sin definir'; },

    bloqueRubro(r, i) {
      const ed = this.puedeEditar();
      const pares = r.k ? global.DB.proveedores(r.k) : [];
      const letra = String.fromCharCode(65 + i);
      const nom = r.k ? this.nombreRubro(r.k) : `Rubro ${letra}`;
      const modo = (global.DB.OBTENCION.find(o => o.k === r.modo) || {}).label || '';

      const cuerpo = `

            ${global.DB.RUBROS.map(x => `<option value="${x.k}" ${r.k === x.k ? 'selected' : ''}

        ${r.k ? `<div class="fr fr-sep"><label>Proveedores</label>
          <div class="rb-pares">

              || '<span class="hint">Todavía no hay nadie cargado en este rubro.</span>'}
            ${ed ? `<button class="chip-add" data-nuevoprov="${r.k}">Agregar</button>` : ''}
          </div></div>` : ''}

        <div class="fr fr-sep"><label for="pd-modo-${i}">Cómo se pide</label>
          <select id="pd-modo-${i}" data-modo="${i}" ${ed ? '' : 'disabled'}>${
            global.DB.OBTENCION.map(o => `<option value="${o.k}" ${r.modo === o.k ? 'selected' : ''}
              >${UI.esc(o.label)}</option>`).join('')}</select></div>

        ${r.k ? `<div class="pd-sep2"></div>
          ${r.modo !== 'planilla' ? this.bloquePlanos(r, i) : ''}
          ${r.modo !== 'dibujo' ? this.bloquePlanilla(r, i) : ''}
          ${this.bloqueNotasRubro(r, i)}`
        : '<div class="hint" style="margin-top:11px">Elegí el rubro para cargarle el dibujo o la planilla.</div>'}`;

      return this.modulo(`rubro${i}`, letra, `Rubro ${letra}${r.k ? ` · ${nom}` : ''}`,
        `${r.k ? modo : 'sin definir'}${faltan ? ` · faltan ${faltan} dibujos` : ''}`,
        cuerpo, !!r.k && !faltan);
    },

    // Materiales y notas del rubro, cerrado por default.
    bloqueNotasRubro(r, i) {
      const ed = this.puedeEditar();

      return `<div class="pd-sepl"></div>
        <button class="sub-h" data-mod="${k}" aria-expanded="${on}">
          <span>${on ? '▴' : '▾'}</span> Materiales y notas para fábrica</button>
        ${on ? `<div style="margin-top:9px">
          <label class="lbl-t" for="pd-mat-${i}">Materiales y herrajes</label>
          <textarea id="pd-mat-${i}" class="pd-des" rows="2" data-notarub="${i}|materiales"
            ${ed ? '' : 'readonly'}
            placeholder="MDF 18 mm · guías telescópicas">${UI.esc((r.notas || {}).materiales || '')}</textarea>
          <label class="lbl-t" for="pd-not-${i}" style="margin-top:9px">Notas para fábrica</label>
          <textarea id="pd-not-${i}" class="pd-des" rows="2" data-notarub="${i}|notas"

    // Un dibujo por variante son muchos renglones: con 27 variantes el rubro
    // se come la pantalla. Se pliega, y cerrado sigue diciendo cuántos faltan.
    bloquePlanos(r, i) {
      const lista = this.ordenadas();
      const faltan = lista.filter(v => !(v.planos || [])[i]).length;
      const k = `planos${i}`;
      const on = this._abre[k] === true;
      return `<div class="grp ${on ? 'on' : ''}" style="margin-bottom:11px">
        <button class="grp-h click" data-mod="${k}" aria-expanded="${on}">
          <span class="grp-t">Dibujos para ${UI.esc(this.nombreRubro(r.k))}</span>
          <span class="grp-r">${lista.length} ${lista.length === 1 ? 'variante' : 'variantes'} ·
            ${faltan ? `<b>faltan ${faltan}</b>` : 'todos cargados'}</span>
          <span class="pd-mg">${on ? '▴' : '▾'}</span>
        </button>
        ${on ? `<div class="grp-b">
        <div class="hint" style="margin-bottom:10px">Cada variante tiene sus medidas, así que cada una
          lleva su dibujo. Se cargan todos desde acá.</div>
        <div class="dib">${lista.map(v => {
          const ref = (v.planos || [])[i] || (i === 0 ? v.imgProd : '');
          const url = this.urlDe(ref) || ref;
          return `<div class="dib-r">
            <button class="vimg ${url ? 'hay' : ''}" data-plano="${v.id}|${i}"
              title="Dibujo de ${UI.esc(this.nombreRubro(r.k))} para esta variante">

              <span class="vimg-e">✎</span></button>
            <div class="dib-n"><b>${UI.esc(this.nombreVar(v))}</b>
              <div class="vr-sku tnum">${UI.esc(v.sku || global.DB.skuDe(this.p, v))}</div></div>

      </div>`;

    // Las columnas de la planilla de un rubro. Si usa una PLANTILLA salen de

    planillaDe(r) {
      if (r && r.plantilla) {
        const t = global.DB.planilla(r.plantilla);
        if (t) return t.cols;
      }
      if (r && r.planilla) return r.planilla;
      return [
        { label: 'ESTADO', origen: 'orden' },

    valorPlanilla(col, v) {

      if (col.origen === 'propiedad') return v[col.campo] || '';
      if (col.origen === 'cantidad') return '1';

    // La planilla se ve como lo que es: la hoja que se le manda al proveedor.

    // controles adentro de cada encabezado la hacía ilegible.
    bloquePlanilla(r, i) {
      const cols = this.planillaDe(r);
      const ed = this.puedeEditar();
      const lista = this.ordenadas().slice(0, 4);
      const t = r.plantilla ? global.DB.planilla(r.plantilla) : null;
      const usos = t ? global.DB.usosPlanilla(t.k) : 0;
      const mias = this.props().map(x => x.k);

      return `<div class="ad-t">Planilla para ${UI.esc(this.nombreRubro(r.k))}</div>
        <div class="fx pl-sel">
          <select data-plantilla="${i}" ${ed ? '' : 'disabled'}>
            <option value="">Sólo para este mueble</option>
            ${global.DB.planillas().map(x => `<option value="${x.k}" ${r.plantilla === x.k ? 'selected' : ''}
              >${UI.esc(x.nombre)}</option>`).join('')}
          </select>
          ${ed ? `<button class="btn sm" data-guardarpl="${i}">Guardar como planilla</button>` : ''}
        </div>
        ${t ? `<div class="banner info">Usa la planilla <b>${UI.esc(t.nombre)}</b>${usos > 1
            ? `, que comparten <b>${usos}</b> muebles` : ''}. Lo que cambies acá les llega a todos.</div>`
          : ''}
        ${ed ? '<div class="hint" style="margin-bottom:7px">Tocá el título de una columna para '
          + 'cambiarle el nombre, de dónde sale el valor, moverla o sacarla.</div>' : ''}

        <div class="tp-wrap"><table class="tp">
          <thead><tr>${cols.map((c, j) => {
            const huerfana = c.origen === 'propiedad' && !mias.includes(c.campo);
            return `<th class="${huerfana ? 'vacia' : ''}">
              <button class="tp-th" data-col="${i}|${j}" ${ed ? '' : 'disabled'}>
                <span>${UI.esc(c.label)}</span>
                ${ed ? '<i>▾</i>' : ''}
              </button>
            </th>`;
          }).join('')}
          ${ed ? `<th class="tp-add"><button class="btn sm" data-addcol="${i}"
            title="Agregar columna">+</button></th>` : ''}</tr></thead>
          <tbody>${lista.map(v => `<tr>${cols.map(c => {
            const val = this.valorPlanilla(c, v);

        </table></div>
        <div class="hint" style="margin-top:8px">Los renglones son de ejemplo, con las primeras
          variantes. En <b>ESTADO</b> va el número de venta, o <b>STOCK</b> si se pide para reponer.
          Al juntar varios muebles en un pedido a ${UI.esc(this.nombreRubro(r.k))}, las columnas se
          suman y las que este mueble no usa quedan vacías.</div>`;
    },

    // Qué dice abajo del título: de dónde sale el valor de esa columna.
    origenCorto(c, huerfana) {
      if (huerfana) return `${c.campo} · no la tiene`;

        const pr = this.props().find(x => x.k === c.campo);
        return pr ? pr.nombre.toLowerCase() : 'de la variante';

      if (c.origen === 'producto') return c.campo === 'sku' ? 'código del mueble' : 'nombre del mueble';
      return o ? o.label.toLowerCase() : c.origen;

    // La configuración de una columna, al tocar su título.
    modalColumna(i, j) {

      const cols = this.planillaDe(r);
      const c = cols[j]; if (!c) return;
      const cerrar = this.modal(`
        <h3 class="h-title" style="font-size:17px">${c.label ? 'Columna ' + UI.esc(c.label) : 'Columna nueva'}</h3>
        <p class="h-sub">Cómo se llama en el papel y de dónde sale su valor.</p>
        <label class="fld" style="margin-top:12px"><span class="lbl">Título</span>

        <label class="fld" style="margin-top:10px"><span class="lbl">De dónde sale</span>
          <select id="mc2-org">${global.DB.ORIGENES.map(o =>
            `<option value="${o.k}" ${c.origen === o.k ? 'selected' : ''}>${UI.esc(o.label)}</option>`).join('')}</select></label>
        <div class="hint" style="margin-top:5px" id="mc2-pie">${UI.esc(

        <div id="mc2-campo" style="margin-top:10px"></div>
        <div class="row" style="margin-top:18px;gap:10px">
          <button class="btn" id="mc2-izq" ${j === 0 ? 'disabled' : ''}>‹ Mover</button>
          <button class="btn" id="mc2-der" ${j === cols.length - 1 ? 'disabled' : ''}>Mover ›</button>
          <button class="btn danger ghost" id="mc2-del">Quitar</button>
          <div class="sp"></div>
          <button class="btn" id="mc2-x">Cancelar</button>
          <button class="btn primary" id="mc2-ok">Guardar</button>
        </div>`, 480);

      const org = document.getElementById('mc2-org');
      const pintarCampo = () => {
        const caja = document.getElementById('mc2-campo');
        document.getElementById('mc2-pie').textContent =
          (global.DB.ORIGENES.find(o => o.k === org.value) || {}).pie || '';
        if (org.value === 'propiedad') {
          caja.innerHTML = `<label class="fld"><span class="lbl">Qué propiedad</span>
            <select id="mc2-cmp">${this.props().map(pr =>
              `<option value="${pr.k}" ${c.campo === pr.k ? 'selected' : ''}>${UI.esc(pr.nombre)}</option>`).join('')}
            </select></label>`;
        } else if (org.value === 'producto') {
          caja.innerHTML = `<label class="fld"><span class="lbl">Qué dato</span>
            <select id="mc2-cmp">
              <option value="nombre" ${c.campo === 'nombre' ? 'selected' : ''}>Nombre</option>

            </select></label>`;
        } else caja.innerHTML = '';
      };
      org.onchange = pintarCampo; pintarCampo();

      const guardar = () => {
        const cs = this.colsEditables(i);
        cs[j].label = document.getElementById('mc2-lbl').value.trim().toUpperCase() || 'COLUMNA';
        cs[j].origen = org.value;

        cs[j].campo = cmp ? cmp.value : undefined;

      const mover = d => {
        const cs = this.colsEditables(i);
        const destino = j + d;
        if (destino < 0 || destino >= cs.length) return;
        [cs[j], cs[destino]] = [cs[destino], cs[j]];
        this.persistirCols(i); cerrar(); this.pintar();
      };
      document.getElementById('mc2-ok').onclick = guardar;
      document.getElementById('mc2-x').onclick = () => {
        // Si se acaba de crear y todavía no tiene nombre, se descarta.
        if (!c.label) { this.colsEditables(i).splice(j, 1); this.persistirCols(i); cerrar(); this.pintar(); }
        else cerrar();
      };
      document.getElementById('mc2-izq').onclick = () => mover(-1);
      document.getElementById('mc2-der').onclick = () => mover(1);
      document.getElementById('mc2-del').onclick = () => {
        this.colsEditables(i).splice(j, 1);
        this.persistirCols(i); cerrar(); this.pintar();
      };
    },

    // Las columnas que hay que tocar: las de la plantilla si usa una, o las
    // propias del mueble.
    colsEditables(i) {
      this.p.rubros = this.rubrosDe();
      const r = this.p.rubros[i];
      if (r.plantilla) {
        const t = global.DB.planilla(r.plantilla);
        if (t) return t.cols;
      }
      r.planilla = r.planilla || this.planillaDe(r);
      return r.planilla;
    },
    // Si venían de una plantilla hay que guardarla, si no el cambio se pierde.
    persistirCols(i) {
      const r = this.rubrosDe()[i];
      if (r.plantilla) {
        const t = global.DB.planilla(r.plantilla);
        if (t) global.DB.guardarPlanilla(t.nombre, t.cols, t.k);
      }
      this.guardar();
    },

    bloqueComoSeHace() {
      const ed = this.puedeEditar();
      return `<section class="pd-b">
        <div class="pd-h">Cómo se hace</div>
        <label class="lbl-t" for="pd-mat">Materiales y herrajes</label>
        <textarea id="pd-mat" class="pd-des" rows="2" ${ed ? '' : 'readonly'}
          placeholder="MDF 18 mm · guías telescópicas · bisagras con freno">${UI.esc(this.p.materiales || '')}</textarea>
        <label class="lbl-t" for="pd-notaprod" style="margin-top:11px">Notas para fábrica</label>
        <textarea id="pd-notaprod" class="pd-des" rows="2" ${ed ? '' : 'readonly'}
          placeholder="Lo que hay que tener en cuenta al fabricarlo.">${UI.esc(this.p.notaProd || '')}</textarea>
      </section>`;
    },


    // 1 · Nombre y descripción ---------------------------------------------
    // La descripción es para lo que NO es una variante: el alto y la
    // profundidad cuando son siempre los mismos, cómo se arma, qué herrajes
    // lleva. Todo eso no puede ser una propiedad porque no multiplica nada.
    bloqueNombre() {
      const p = this.p, ed = this.puedeEditar();
      return `<div>
        <label class="lbl-t" for="pd-nombre">Nombre</label>
        <input id="pd-nombre" class="pd-nom" value="${UI.esc(p.nombre)}"
          placeholder="Nombre del mueble" ${ed ? '' : 'readonly'}>

        <label class="lbl-t" for="pd-desc" style="margin-top:11px">Descripción</label>
        <textarea id="pd-desc" class="pd-des" rows="2" ${ed ? '' : 'readonly'}
          placeholder="Las medidas y los detalles que no cambian entre variantes. Ej: alto 0,55 · profundidad 0,40 · la base se retira en los cuatro lados · corte de tapa a 45°."
          >${UI.esc(p.desc || '')}</textarea>
        <div class="hint">Lo que es igual en todas las variantes. Lo que cambia va como propiedad.</div>

        <div class="pd-nsub">
          <span class="muted">Código</span> <b class="tnum">${UI.esc(p.sku || '—')}</b>
        </div>
      </div>`;
    },

    // 2 · Fotos ------------------------------------------------------------
    // Todos los archivos del mueble en un solo lugar: fotos de venta, planos de
    // producción, folletos. Van a ser muchos, así que tienen su propia solapa y
    // no se mezclan con la información del mueble. Desde acá se elige cuál usa
    // cada variante.
    TIPOS: [
      { k: 'venta', label: 'Venta' },
      { k: 'produccion', label: 'Producción' },
      { k: 'otro', label: 'Otro' },
    ],
    archivos(tipo) {
      const a = this.p.archivos || [];
      return tipo ? a.filter(x => x.tipo === tipo) : a;
    },
    // Dónde está usado un archivo, para no borrar algo que está en uso.
    usoDe(id) {
      return this.vars.filter(v => v.imgVenta === id || v.imgProd === id).length;
    },
    urlDe(id) {
      const a = (this.p.archivos || []).find(x => x.id === id);
      return a ? a.url : '';
    },

    tabDocumentos() {
      const ed = this.puedeEditar();
      const grupo = t => {
        const fs = this.archivos(t.k);
        return `<section class="pd-b">
          <div class="pd-h">${UI.esc(t.label)} <span class="muted">(${fs.length})</span></div>
          ${ed ? `<div class="dropz chico" data-drop="${t.k}">
            <div class="dz-t">Arrastrá acá, o hacé clic para subir</div>
            <input type="file" data-file="${t.k}" accept="image/*,application/pdf,video/*" multiple hidden>
          </div>` : ''}
          <div class="docs">${fs.map(f => `<div class="doc">
            <div class="doc-im">${/^data:image|\.(png|jpe?g|webp|svg)$/i.test(f.url)
              ? `<img src="${UI.esc(f.url)}" alt="${UI.esc(f.nombre)}">` : UI.esc(t.label)}</div>
            <div class="doc-n" title="${UI.esc(f.nombre)}">${UI.esc(f.nombre)}</div>
            <div class="doc-u">${this.usoDe(f.id)
              ? `<span class="pill info">en ${this.usoDe(f.id)} ${this.usoDe(f.id) === 1 ? 'variante' : 'variantes'}</span>`
              : '<span class="pill soft">sin usar</span>'}</div>
            ${ed ? `<div class="doc-a">
              <select data-tipo="${f.id}">${this.TIPOS.map(x =>
                `<option value="${x.k}" ${f.tipo === x.k ? 'selected' : ''}>${UI.esc(x.label)}</option>`).join('')}</select>
              <button class="lx" data-borrar="${f.id}" title="Borrar">✕</button>
            </div>` : ''}
          </div>`).join('') || '<div class="hint">Todavía no hay archivos de este tipo.</div>'}</div>
        </section>`;
      };
      return `<div class="banner info">Los archivos se guardan en el <b>Storage del sistema</b>, no adentro
        de la cotización. Desde la solapa Información general, cada variante elige cuál de estos usa
        como imagen de venta, y desde Producción cuál usa como plano.</div>`
        + this.TIPOS.map(grupo).join('');
    },

    // Sube archivos a la biblioteca del mueble.
    subir(files, tipo) {
      [...(files || [])].forEach(f => {
        const r = new FileReader();
        r.onload = () => {
          this.p.archivos = this.p.archivos || [];
          this.p.archivos.push({
            id: 'a' + (Math.max(0, ...this.p.archivos.map(x => Number(String(x.id).slice(1)) || 0)) + 1),
            nombre: f.name, url: r.result, tipo: tipo || 'otro',
          });
          this.guardar(); this.pintar();
        };
        r.readAsDataURL(f);
      });
    },

    // 3 · Categorías -------------------------------------------------------
    // Un mueble puede estar en más de una: una mesa ratona que también entra
    // en Living y en Escritorios se carga una sola vez y aparece en las dos.
    cats() {
      // Se guardan en `categorias`; si el mueble es viejo y sólo tiene la de
      // siempre, esa es la lista.
      const ids = this.p.categorias || (this.p.categoria_id ? [this.p.categoria_id] : []);
      return ids.map(id => (this._arbol || []).find(c => c.id === id)
        || (this.p.categoria && this.p.categoria.id === id ? this.p.categoria : null)).filter(Boolean);
    },
    // El ambiente del que cuelga cada una: no hace falta cargarlo a mano.
    heredadas() {
      const out = new Map();
      this.cats().forEach(c => {
        let x = c;
        while (x && x.padre_id) {
          x = (this._arbol || []).find(y => y.id === x.padre_id);
          if (x) out.set(x.id, x);
        }
      });
      this.cats().forEach(c => out.delete(c.id));
      return [...out.values()];
    },

    bloqueCategorias(dentro) {
      const cs = this.cats(), her = this.heredadas();
      return `<${dentro ? 'div' : 'section class="pd-b"'}>
        <div class="pd-h">Categorías</div>
        <div class="chips">
          ${cs.map(c => `<span class="chip">${UI.esc(c.nombre)}${this.puedeEditar()
            ? `<button class="chip-x" data-quitarcat="${c.id}" aria-label="Quitar">✕</button>` : ''}</span>`).join('')
            || '<span class="hint">Sin categoría.</span>'}
          ${her.map(c => `<span class="chip her" title="Se hereda: ${UI.esc(c.nombre)} es el ambiente del que cuelga">${UI.esc(c.nombre)}</span>`).join('')}
          ${this.puedeEditar() ? '<button class="chip-add" id="pd-edcat">✎ editar</button>' : ''}
        </div>
        ${her.length ? `<div class="hint" style="margin-top:6px">
          <b>${UI.esc(her.map(c => c.nombre).join(' · '))}</b> ${her.length === 1 ? 'se hereda' : 'se heredan'} —
          con marcar la familia alcanza.</div>` : ''}
      </${dentro ? 'div' : 'section'}>`;
    },

    // Las dos clases de propiedad no son lo mismo y no tienen que parecerlo:
    // cada una va en su propia tarjeta, con su título. Las secundarias además
    // vienen plegadas — se cargan una vez y después no se tocan más.
    bloquePropiedades(dentro) {
      const ps = this.props(), n = this.combinatorio(), ed = this.puedeEditar();
      const secs = this.secsDe();
      const abSec = this._abre.secundarias === true;

      const principales = `
        <div class="props">${ps.map(p => `
          <div class="prow" draggable="${ed}" data-orden="${UI.esc(p.k)}">
            ${ed ? '<span class="prow-drag" title="Arrastrar para cambiar el orden">⠿</span>' : ''}
            <div class="prow-i">
              <div class="prow-n">${UI.esc(p.nombre)}
                ${ed ? `<button class="chip-e" data-prop="${UI.esc(p.k)}"
                    title="Editar ${UI.esc(p.nombre)}">✎</button>
                  <button class="chip-x" data-quitarprop="${UI.esc(p.k)}"
                    title="Quitar del mueble">✕</button>` : ''}</div>
              <div class="chips" data-vals="${UI.esc(p.k)}">${p.usados.map(v =>
                `<span class="chip val" draggable="${ed}" data-val="${UI.esc(v)}"
                  ${ed ? 'title="Arrastrá para cambiar el orden"' : ''}
                  >${ed ? '<span class="chip-drag">⠿</span>' : ''}${UI.esc(v)}</span>`).join('')
                || '<span class="hint">Sin valores todavía.</span>'}
                ${ed ? `<button class="chip-add" data-addv="${UI.esc(p.k)}">Agregar</button>` : ''}</div>
            </div>
          </div>`).join('') || '<div class="hint">Este mueble todavía no tiene propiedades.</div>'}
        </div>
        ${ed && ps.length ? '<div class="hint" style="margin-top:7px">Arrastrá una <b>propiedad</b> o un '
          + '<b>valor</b> para cambiar el orden: es el que ordena las variantes de abajo.</div>' : ''}
        ${ed ? '<button class="btn sm mas" id="pd-addprop">Agregar propiedad</button>' : ''}`;

      const secundarias = `
        <div class="chips" data-secs="1">
          ${secs.map(x => `<span class="chip sec" draggable="${ed}" data-sec="${UI.esc(x.k)}"
            ${ed ? 'title="Arrastrá para cambiar el orden"' : ''}>
            ${ed ? '<span class="chip-drag">⠿</span>' : ''}${UI.esc(x.nombre)}${x.unidad
              ? ` <small class="muted">${UI.esc(x.unidad)}</small>` : ''}
            ${ed ? `<button class="chip-e" data-editsec="${UI.esc(x.k)}" title="Editar">✎</button>
              <button class="chip-x" data-quitarsec="${UI.esc(x.k)}" title="Quitar">✕</button>` : ''}
          </span>`).join('')
            || '<span class="hint">Ninguna. La variante sale con la imagen y el nombre nada más.</span>'}
        </div>
        ${ed ? '<button class="btn sm mas" id="pd-addsec">Agregar secundaria</button>' : ''}`;

      return `<${dentro ? 'div' : 'section class="pd-b"'}>
        <div class="grp">
          <div class="grp-h">
            <span class="grp-t">Propiedades principales</span>
            <span class="grp-r">${ps.length
              ? `${ps.length} ${ps.length === 1 ? 'propiedad' : 'propiedades'}${n
                ? ` · <b class="tnum">${n}</b> ${n === 1 ? 'combinación' : 'combinaciones'}` : ''}`
              : 'ninguna todavía'}</span>
          </div>
          <div class="grp-b">
            <div class="hint" style="margin-bottom:9px">Multiplican las variantes y definen el precio y
              el pedido.</div>
            ${principales}
          </div>
        </div>

        <div class="grp ${abSec ? 'on' : ''}">
          <button class="grp-h click" data-mod="secundarias" aria-expanded="${abSec}">
            <span class="grp-t">Propiedades secundarias</span>
            <span class="grp-r">${secs.length
              ? UI.esc(secs.map(x => x.nombre).join(' · '))
              : 'ninguna'}</span>
            <span class="pd-mg">${abSec ? '▴' : '▾'}</span>
          </button>
          ${abSec ? `<div class="grp-b">
            <div class="hint" style="margin-bottom:9px">Datos de cada variante que <b>no</b> multiplican
              nada: se cargan al costado en la tabla de abajo. En una cómoda importa el alto; en un
              placard, la medida del hueco.</div>
            ${secundarias}
          </div>` : ''}
        </div>
      </${dentro ? 'div' : 'section'}>`;
    },

    // Las secundarias que usa este mueble, en orden.
    // El ancho de la tabla de variantes depende de cuántas secundarias haya.
    // Se arma acá porque repeat(0, …) no es CSS válido y rompía la grilla.
    gridVar(n) {
      return `grid-template-columns:76px minmax(180px,1fr)${' 86px'.repeat(n)} 50px;`
        + `min-width:${400 + n * 94}px`;
    },

    secsDe() {
      return (this.p.secundarias || [])
        .map(k => global.DB.secundaria(k))
        .filter(Boolean);
    },

    bloqueVariantes(dentro) {
      const f = this._fVar.trim().toLowerCase();
      const lista = this.ordenadas(this.vars.filter(v => !f || this.nombreVar(v).toLowerCase().includes(f)));
      const secs = this.secsDe();
      return `<${dentro ? 'div' : 'section class="pd-b"'}>
        ${dentro ? '' : '<div class="pd-h">Variantes</div>'}
        <div class="vr-tools">
          <input id="pd-fvar" class="busca" placeholder="Filtrar por medida, estructura, frente…" value="${UI.esc(this._fVar)}">
          <div class="sp"></div>
          <span class="hint">${this.activas().length} activas · ${this.vars.length - this.activas().length} desactivadas</span>
        </div>
        <div class="vr-tabla">
        <div class="vr-head" style="${this.gridVar(secs.length)}">
          <span>Imagen</span><span>Variante</span>
          ${secs.map(x => `<span class="num">${UI.esc(x.nombre)}</span>`).join('')}
          <span></span>
        </div>
        <div id="pd-vars">${lista.map(v => this.filaVar(v, secs)).join('')
          || UI.vacio('Ninguna variante coincide con el filtro.')}</div>
        </div>
        ${secs.length ? '' : `<div class="hint" style="margin-top:9px">Sin propiedades secundarias, la
          variante es sólo su imagen y su nombre. Agregá las que le sirvan a este mueble desde
          <b>Categorías y propiedades</b>.</div>`}
      </${dentro ? 'div' : 'section'}>`;
    },

    // "MEDIDAS 1.60 · ESTRUCTURA PARAÍSO · FRENTE BLANCO". Si el valor ya
    // arranca con el nombre de la propiedad no se repite: "ESTRUCTURA BLANCA"
    // queda así y no "ESTRUCTURA ESTRUCTURA BLANCA".
    nombreVar(v) {
      const ps = this.props();
      return (this.p.propiedades || []).map(k => {
        const val = v[k]; if (!val) return null;
        const pr = ps.find(x => x.k === k) || { nombre: k.toUpperCase() };
        const corto = String(pr.nombre).split(' ')[0];
        return String(val).toUpperCase().startsWith(corto) ? val : `${corto} ${val}`;
      }).filter(Boolean).join(' · ');
    },

    filaVar(v, secs) {
      const off = v.activa === false;
      const ref = v.imgVenta;
      const url = this.urlDe(ref) || ref;
      const ed = this.puedeEditar();
      return `<div class="vr ${off ? 'off' : ''}" data-v="${v.id}" style="${this.gridVar(secs.length)}">
        <button class="vimg ${url ? 'hay' : ''}" data-img="${v.id}|imgVenta"
          title="Imagen de venta — sale impresa en la cotización">
          ${url ? `<img src="${UI.esc(url)}" alt="">` : '<span class="vimg-v">sin foto</span>'}
          <span class="vimg-e">✎</span></button>
        <div class="vr-n">
          <button class="vr-nom" data-abrir="${v.id}">${UI.esc(this.nombreVar(v))}</button>
          <div class="vr-sku tnum">${UI.esc(v.sku || global.DB.skuDe(this.p, v))}${
            off ? ' · <b class="warn-t">desactivada</b>' : ''}</div>
        </div>
        ${secs.map(x => `<div class="vr-x">
          <div class="vr-xi"><input inputmode="decimal" class="pn" data-sec="${v.id}|${x.k}"
            value="${UI.esc(global.DB.valorSec(v, x.k))}" placeholder="—" ${ed ? '' : 'readonly'}
            >${x.unidad ? `<span class="uni">${UI.esc(x.unidad)}</span>` : ''}</div>
          <button class="aplic" data-aplic="${v.id}|${x.k}" hidden>Aplicar a todas</button>
        </div>`).join('')}
        <div class="vr-a">
          <button class="lx" data-hist="${v.id}" title="Historial">↺</button>
        </div>
      </div>`;
    },

    // El historial de precio todavía no se guarda: hace falta la tabla.
    historial(id) {
      const v = this.vars.find(x => x.id === id); if (!v) return;
      this.modal(`
        <h3 class="h-title" style="font-size:17px">Historial de precio</h3>
        <p class="h-sub">${UI.esc(this.nombreVar(v))}</p>
        <div class="banner info" style="margin:14px 0 0">Todavía no se guardan los cambios de precio.
          Cuando esté la tabla, acá va a estar cada cambio con la fecha y quién lo hizo.</div>
        <div class="row" style="margin-top:16px;justify-content:flex-end">
          <button class="btn" onclick="document.getElementById('mdlz').remove()">Cerrar</button>
        </div>`, 460);
    },

    // 6 · Simulador --------------------------------------------------------
    // Mover costo o precio y ver qué pasa, SIN tocar los datos reales.
    bloqueSimulador() {
      const v = this.vars.find(x => x.activa !== false) || this.vars[0];
      if (!v) return '';
      this._sim = this._sim || { id: v.id, costo: v.costo, precio: v.precio };
      return `<section class="pd-b">
        <div class="pd-h">Simular <span class="muted">· no modifica los datos reales</span></div>
        <div class="sim-sel">
          <select id="sim-v">${this.vars.map(x =>
            `<option value="${x.id}" ${this._sim.id === x.id ? 'selected' : ''}>${UI.esc(this.nombreVar(x))}</option>`).join('')}</select>
        </div>
        <div class="sim-g">
          <label>Costo <b class="tnum" id="sim-cl">${UI.pesos(this._sim.costo)}</b>
            <input type="range" id="sim-c" min="0" max="${Math.max(1, this._sim.costo * 3)}" value="${this._sim.costo}"></label>
          <label>Precio de lista <b class="tnum" id="sim-pl">${UI.pesos(this._sim.precio)}</b>
            <input type="range" id="sim-p" min="0" max="${Math.max(1, this._sim.precio * 2)}" value="${this._sim.precio}"></label>
        </div>
        <div class="banda"><div class="bz crit"></div><div class="bz warn"></div><div class="bz ok"></div>
          <div class="b-obj" id="sim-obj"></div><div class="b-pin" id="sim-pin"></div></div>
        <div class="banda-l"><span>1,00x</span><span>1,60x</span><span>1,90x</span><span>3,00x</span></div>
        <div class="sim-kv">
          <div><span>Markup</span><b id="sim-mk">—</b></div>
          <div><span>Margen</span><b id="sim-mg">—</b></div>
          <div><span>Ganancia por unidad</span><b id="sim-gan">—</b></div>
          <div><span>Objetivo</span><b id="sim-ob">—</b></div>
        </div>
      </section>`;
    },

    // 7 · Proveedores ------------------------------------------------------
    bloqueProveedores() {
      const ps = this.p.proveedores || [];
      return `<section class="pd-b">
        <div class="pd-h">Proveedores <span class="muted">· a quién se le puede pedir</span></div>
        <div class="chips">
          ${ps.map((x, i) => `<span class="chip">${UI.esc(x.nombre)}${this.puedeEditar()
            ? `<button class="chip-x" data-quitarprov="${i}" aria-label="Quitar">✕</button>` : ''}</span>`).join('')
            || '<span class="hint">Todavía no se cargó ninguno.</span>'}
          ${this.puedeEditar() ? '<button class="chip-add" id="pd-addprov">Agregar proveedor</button>' : ''}
        </div>
        <div class="hint" style="margin-top:8px">Van por mueble, no por variante: los mismos hacen todas las
          medidas. El costo sale del <b>promedio</b> de lo que pasa cada uno.</div>
      </section>`;
    },

    // ---- Interacción -------------------------------------------------------
    enganchar() {
      const g = id => document.getElementById(id);
      const p = this.p, ed = this.puedeEditar();

      const nom = g('pd-nombre');
      if (nom && ed) nom.onchange = () => { p.nombre = nom.value.trim() || p.nombre; this.guardar(); };
      const des = g('pd-desc');
      if (des && ed) des.onchange = () => { p.desc = des.value.trim(); this.guardar(); };
      const pub = g('pd-pub');
      if (pub && ed) pub.onchange = () => {
        p.publicado = pub.checked; this.guardar();
        const pill = g('pd-pub-pill');
        pill.className = 'pill ' + (p.publicado ? 'ok' : 'warn');
        pill.textContent = p.publicado ? 'Visible para los vendedores' : 'Oculto — no se puede vender';
      };

      // Fotos: se leen del disco y quedan como enlace del Storage.
      document.querySelectorAll('[data-drop]').forEach(dz => {
        const tipo = dz.dataset.drop;
        const file = document.querySelector(`[data-file="${tipo}"]`);
        dz.onclick = () => file.click();
        dz.ondragover = e => { e.preventDefault(); dz.classList.add('on'); };
        dz.ondragleave = () => dz.classList.remove('on');
        dz.ondrop = e => { e.preventDefault(); dz.classList.remove('on'); this.subir(e.dataTransfer.files, tipo); };
        file.onchange = () => this.subir(file.files, tipo);
      });
      document.querySelectorAll('[data-tipo]').forEach(sl => sl.onchange = () => {
        const a = (p.archivos || []).find(x => x.id === sl.dataset.tipo);
        if (a) { a.tipo = sl.value; this.guardar(); this.pintar(); }
      });
      document.querySelectorAll('[data-borrar]').forEach(b => b.onclick = () => {
        const id = b.dataset.borrar, uso = this.usoDe(id);
        if (uso) return UI.aviso(`No se puede: está en ${uso} ${uso === 1 ? 'variante' : 'variantes'}`, 'warn');
        p.archivos = (p.archivos || []).filter(x => x.id !== id);
        this.guardar(); this.pintar();
      });

      if (g('pd-edcat')) g('pd-edcat').onclick = () => this.modalCategorias();
      document.querySelectorAll('[data-prop]').forEach(b =>
        b.onclick = () => this.abrirPropiedad(b.dataset.prop));
      document.querySelectorAll('[data-addv]').forEach(b =>
        b.onclick = () => this.agregarValores(b.dataset.addv));
      this.arrastrarPropiedades();
      this.arrastrarValores();
      if (g('pd-addprop')) g('pd-addprop').onclick = () => this.desplegarPropiedades();
      if (g('pd-addsec')) g('pd-addsec').onclick = () => this.modalSecundarias();
      document.querySelectorAll('[data-quitarsec]').forEach(b => b.onclick = () => {
        p.secundarias = (p.secundarias || []).filter(x => x !== b.dataset.quitarsec);
        this.guardar(); this.pintar();
      });
      document.querySelectorAll('[data-editsec]').forEach(b => b.onclick = () =>
        this.modalEditarSecundaria(b.dataset.editsec));
      document.querySelectorAll('[data-quitarprop]').forEach(b => b.onclick = () => {
        const k = b.dataset.quitarprop;
        const pr = this.props().find(x => x.k === k);
        this.quitarPropiedad(k, pr ? pr.nombre : k);
      });
      document.querySelectorAll('[data-finv]').forEach(b => b.onclick = () => {
        this._fInv = b.dataset.finv; this.pintar();
      });
      // Las secundarias también se arrastran: el orden es el de las columnas.
      const cajaSec = document.querySelector('[data-secs]');
      if (cajaSec && ed) {
        let origen = null;
        cajaSec.querySelectorAll('.chip.sec').forEach(c => {
          c.ondragstart = e => { origen = c; c.classList.add('drag');
            if (e.dataTransfer) e.dataTransfer.setData('text/plain', c.dataset.sec); };
          c.ondragend = () => {
            c.classList.remove('drag'); origen = null;
            p.secundarias = [...cajaSec.querySelectorAll('.chip.sec')].map(x => x.dataset.sec);
            this.guardar(); this.pintar();
          };
          c.ondragover = e => {
            e.preventDefault();
            if (!origen || origen === c) return;
            const r = c.getBoundingClientRect();
            cajaSec.insertBefore(origen, e.clientX < r.left + r.width / 2 ? c : c.nextSibling);
          };
