<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belgrano Soft</title>
<style>
/* =====================================================================
   Belgrano Soft · sistema visual común
   Navy/azul + estados con color. Un solo lugar para todos los módulos.
   ===================================================================== */
:root{
  --bg:#eef1f6; --panel:#fff; --panel-2:#f7f9fc; --ink:#141a26; --ink-soft:#54607a;
  --line:#dbe1ec; --line-soft:#e8ecf3;
  --navy:#1c2b4a; --brand:#2f6fed; --brand-soft:#e6eefc; --brand-ink:#1b4fd0;
  --ok:#128a5b; --ok-bg:#e2f3ea; --warn:#b5730f; --warn-bg:#f8eeda;
  --crit:#c53b3b; --crit-bg:#fbe6e6; --muted:#7d8aa3;
  --shadow:0 1px 2px rgba(20,26,38,.06),0 4px 16px rgba(20,26,38,.05);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d111b; --panel:#151b2a; --panel-2:#111726; --ink:#eaeef7; --ink-soft:#9aa6c0;
    --line:#26304a; --line-soft:#1e2740; --navy:#dbe3f4; --brand:#5b8dff;
    --brand-soft:#1a2540; --brand-ink:#9dbcff; --ok:#43c98d; --ok-bg:#13291f;
    --warn:#e0a53c; --warn-bg:#2c2413; --crit:#f0736f; --crit-bg:#2c1717; --muted:#7f8cab;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font-variant-numeric:tabular-nums;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; letter-spacing:-.01em}
button{font:inherit}
a{color:var(--brand)}

/* Shell */
#top{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
  background:var(--navy); color:#fff; padding:10px 18px; box-shadow:var(--shadow);
}
@media (prefers-color-scheme:dark){ #top{color:#0d111b} }
#top .brand{font-weight:800; letter-spacing:-.02em; font-size:15px; display:flex; align-items:center; gap:8px}
#top .brand .m{opacity:.6; font-weight:500}
#top .sp{flex:1}
#top .verComo{display:flex; align-items:center; gap:8px; font-size:13px}
#top select{
  font:inherit; font-size:13px; padding:6px 10px; border-radius:8px; border:1px solid transparent;
  background:rgba(255,255,255,.15); color:inherit; font-weight:600;
}
@media (prefers-color-scheme:dark){ #top select{background:rgba(0,0,0,.15)} }
#top select option{color:#141a26}

#nav{
  display:flex; gap:4px; overflow-x:auto; background:var(--panel); border-bottom:1px solid var(--line);
  padding:0 12px; position:sticky; top:44px; z-index:15;
}
#nav button{
  border:0; background:transparent; color:var(--ink-soft); font-weight:600; font-size:14px;
  padding:13px 14px; cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap;
}
#nav button:hover{color:var(--brand)}
#nav button[aria-current="true"]{color:var(--brand); border-bottom-color:var(--brand)}
#nav button:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}

#view{max-width:1100px; margin:0 auto; padding:22px 18px 80px}

/* Bits */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex; align-items:center; gap:12px}
.wrap-row{display:flex; flex-wrap:wrap; gap:10px}
.sp{flex:1}
.muted{color:var(--muted)}
.h-title{font-size:22px; font-weight:800; color:var(--navy)}
.h-sub{color:var(--ink-soft); margin-top:4px; font-size:14px}
.kick{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--brand); font-weight:700}

input,select,textarea{
  font:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line);
  border-radius:9px; background:var(--panel); color:var(--ink); width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
label.fld{display:block}
label.fld .lbl{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600}

.btn{
  font-weight:650; font-size:14px; padding:9px 16px; border-radius:9px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); transition:.15s;
}
.btn:hover{border-color:var(--brand); color:var(--brand)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{background:var(--brand-ink); color:#fff}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.sm{padding:6px 11px; font-size:13px}

.pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; white-space:nowrap; display:inline-block}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.crit{background:var(--crit-bg); color:var(--crit)}
.pill.info{background:var(--brand-soft); color:var(--brand)}
.pill.soft{background:var(--line-soft); color:var(--ink-soft)}

table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--line)}
td{padding:11px 12px; border-bottom:1px solid var(--line-soft)}
tr:hover td{background:var(--panel-2)}

.empty{text-align:center; padding:48px 20px; color:var(--muted)}
.spin{display:inline-block; width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation:none} }

.banner{padding:10px 14px; border-radius:9px; font-size:13px; margin-bottom:16px}
.banner.warn{background:var(--warn-bg); color:var(--warn)}
.banner.info{background:var(--brand-soft); color:var(--brand-ink)}

</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =====================================================================
//  Belgrano Soft · capa de datos
//  Una sola puerta a Supabase. Si no hay conexión configurada, la app
//  igual arranca en modo DEMO con unos productos de ejemplo, así se puede
//  ver la interfaz antes de conectar la base.
// =====================================================================
(function (global) {
  const CFG_KEY = 'bh_supabase_cfg';

  // La URL del proyecto Belgrano Soft ya la sabemos; la anon key es pública
  // (va en el frontend) pero la carga la persona la primera vez, para no
  // dejarla escrita en el repo.
  const DEFAULT_URL = 'https://qwbdhpevgirsmfxqlgtg.supabase.co';

  function cfg() {
    try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; }
    catch { return {}; }
  }
  function guardarCfg(url, key) {
    localStorage.setItem(CFG_KEY, JSON.stringify({ url: url || DEFAULT_URL, key }));
  }
  function hayConexion() { return !!cfg().key && !!global.supabase; }

  let _cli = null;
  function cliente() {
    if (_cli) return _cli;
    const c = cfg();
    if (!c.key || !global.supabase) return null;
    // El catálogo vive en el esquema core.
    _cli = global.supabase.createClient(c.url || DEFAULT_URL, c.key, {
      db: { schema: 'core' },
    });
    return _cli;
  }

  // ---- Modo demo: árbol + productos para ver la UI sin conexión --------
  const DEMO = {
    categorias: [
      { id: 1, nombre: 'DORMITORIO', padre_id: null, nivel: 2 },
      { id: 2, nombre: 'CÓMODAS',    padre_id: 1,    nivel: 3 },
      { id: 3, nombre: 'PLACARD',    padre_id: 1,    nivel: 3 },
      { id: 4, nombre: 'LIVING',     padre_id: null, nivel: 2 },
      { id: 5, nombre: 'MESAS RATONAS', padre_id: 4, nivel: 3 },
    ],
    productos: [
      { id: 1, categoria_id: 2, nombre: 'CÓMODA AMBERES 55', publicado_tn: true },
      { id: 4, categoria_id: 2, nombre: 'CÓMODA OLIVER 60', publicado_tn: true },
      { id: 5, categoria_id: 2, nombre: 'CÓMODA NÓRDICA 90', publicado_tn: false },
      { id: 2, categoria_id: 3, nombre: 'PLACARD OLIVER', publicado_tn: true },
      { id: 3, categoria_id: 5, nombre: 'MESA RATONA NORUEGA', publicado_tn: false },
    ],
    variantes: [
      { id: 11, producto_id: 1, medida: '1.20', estructura: 'blanca', frente: 'paraiso', precio: 425750, atributos: { medida: '1.20', estructura: 'blanca', frente: 'paraiso' } },
      { id: 12, producto_id: 1, medida: '1.20', estructura: 'negra',  frente: 'blanca',  precio: 406250, atributos: { medida: '1.20', estructura: 'negra', frente: 'blanca' } },
      { id: 13, producto_id: 2, medida: '2.00', estructura: 'blanca', frente: 'paraiso', precio: 900000, atributos: { medida: '2.00', estructura: 'blanca', frente: 'paraiso', espejo: '2 espejos' } },
      { id: 14, producto_id: 3, medida: '1.00', estructura: 'blanca', frente: null,      precio: 300000, atributos: { medida: '1.00', estructura: 'blanca' } },
    ],
  };

  // ---- API que usan los módulos ---------------------------------------
  const DB = {
    modo() { return hayConexion() ? 'supabase' : 'demo'; },
    DEFAULT_URL, cfg, guardarCfg, hayConexion,

    // El árbol de categorías (ambiente → tipo de mueble).
    async arbolCategorias() {
      if (!hayConexion()) return DEMO.categorias;
      const { data, error } = await cliente().from('categoria')
        .select('id,nombre,padre_id,nivel').eq('activa', true).order('nombre');
      if (error) throw error;
      return data || [];
    },

    // Productos: por categoría (tipo de mueble) o por texto libre.
    async productos({ texto = '', categoriaId = null, limite = 200 } = {}) {
      if (!hayConexion()) {
        let ps = DEMO.productos.filter(p =>
          (!texto || p.nombre.toLowerCase().includes(texto.toLowerCase())) &&
          (categoriaId == null || p.categoria_id === categoriaId));
        return ps.map(p => ({ ...p, variantes: DEMO.variantes.filter(v => v.producto_id === p.id).length }));
      }
      let q = cliente().from('producto')
        .select('id,categoria_id,nombre,publicado_tn,variante(count)')
        .eq('activo', true).order('nombre').limit(limite);
      if (texto) q = q.ilike('nombre', `%${texto}%`);
      if (categoriaId != null) q = q.eq('categoria_id', categoriaId);
      const { data, error } = await q;
      if (error) throw error;
      return (data || []).map(p => ({ ...p, variantes: p.variante?.[0]?.count ?? 0 }));
    },

    async variantes(productoId) {
      if (!hayConexion()) return DEMO.variantes.filter(v => v.producto_id === productoId);
      const { data, error } = await cliente().from('variante')
        .select('id,medida,estructura,frente,precio,atributos,sku,tn_variant_id')
        .eq('producto_id', productoId).eq('activo', true)
        .order('medida').order('estructura').order('frente');
      if (error) throw error;
      return data || [];
    },

    async totales() {
      if (!hayConexion()) return { productos: DEMO.productos.length, variantes: DEMO.variantes.length };
      const p = await cliente().from('producto').select('*', { count: 'exact', head: true }).eq('activo', true);
      const v = await cliente().from('variante').select('*', { count: 'exact', head: true }).eq('activo', true);
      return { productos: p.count ?? 0, variantes: v.count ?? 0 };
    },
  };

  global.DB = DB;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================
//  Belgrano Soft · helpers de interfaz
// =====================================================================
(function (global) {
  const UI = {
    // Escape para no romper el HTML con nombres que traen comillas/símbolos.
    esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },
    // Pesos argentinos, sin decimales.
    pesos(n) {
      const x = Number(n) || 0;
      return '$' + x.toLocaleString('es-AR', { maximumFractionDigits: 0 });
    },
    // Los tres ejes + la bolsa, como texto legible: "1.20 · blanca · paraiso".
    ejes(v) {
      const base = [v.medida, v.estructura, v.frente].filter(Boolean);
      const extra = Object.entries(v.atributos || {})
        .filter(([k]) => !['medida', 'estructura', 'frente'].includes(k))
        .map(([, val]) => val);
      return [...base, ...extra].join(' · ') || '—';
    },
    // Los atributos de la bolsa que NO son los tres ejes, para mostrarlos aparte.
    extras(v) {
      return Object.entries(v.atributos || {})
        .filter(([k]) => !['medida', 'estructura', 'frente'].includes(k));
    },
    spinner(txt = 'Cargando…') {
      return `<div class="empty"><span class="spin"></span> ${UI.esc(txt)}</div>`;
    },
    vacio(txt) { return `<div class="empty">${UI.esc(txt)}</div>`; },
    // Toast simple.
    aviso(txt, tipo = 'info') {
      let t = document.getElementById('_toast');
      if (!t) {
        t = document.createElement('div');
        t.id = '_toast';
        t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 6px 22px rgba(0,0,0,.2);transition:.2s';
        document.body.appendChild(t);
      }
      const col = { info: ['#2f6fed', '#fff'], ok: ['#128a5b', '#fff'], warn: ['#b5730f', '#fff'], crit: ['#c53b3b', '#fff'] }[tipo] || ['#2f6fed', '#fff'];
      t.style.background = col[0]; t.style.color = col[1];
      t.textContent = txt; t.style.opacity = '1';
      clearTimeout(UI._tt);
      UI._tt = setTimeout(() => { t.style.opacity = '0'; }, 2400);
    },
  };
  global.UI = UI;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================
//  Belgrano Soft · Catálogo
//  Navegación como en Tienda Nube: ambiente → tipo de mueble → modelo →
//  variantes. O búsqueda directa por texto. Es el cimiento del presupuesto.
// =====================================================================
(function (global) {
  const VISTA_KEY = 'bh_catalogo_vista';
  const Catalogo = {
    arbol: [],           // categorías cargadas
    ruta: [],            // breadcrumb: [{id,nombre}] hasta la categoría actual
    texto: '',           // búsqueda libre
    vista: (() => { try { return localStorage.getItem(VISTA_KEY) || 'bloques'; } catch { return 'bloques'; } })(),
    _prods: null,        // últimos productos pintados (para re-render al cambiar de vista)

    async render() {
      const v = document.getElementById('view');
      v.innerHTML = `
        <div class="row" style="margin-bottom:16px">
          <div>
            <div class="kick">Catálogo</div>
            <h1 class="h-title">Productos</h1>
            <div class="h-sub" id="cat-sub"></div>
          </div>
          <div class="sp"></div>
          <label class="fld" style="width:260px">
            <span class="lbl">Buscar en todo el catálogo</span>
            <input id="cat-q" placeholder="Amberes, oliver, mesa…" value="${UI.esc(this.texto)}">
          </label>
          <div class="vista-tog" role="group" aria-label="Formato de vista" style="align-self:flex-end">
            <button id="v-bloques" title="Bloques" aria-label="Bloques">▦</button>
            <button id="v-lista"   title="Listado" aria-label="Listado">☰</button>
          </div>
        </div>
        <div id="cat-crumb"></div>
        <div id="cat-lista">${UI.spinner()}</div>
        <style>
          .vista-tog{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
          .vista-tog button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-size:16px;color:var(--muted);line-height:1}
          .vista-tog button+button{border-left:1px solid var(--line)}
          .vista-tog button.on{background:var(--brand-soft);color:var(--brand-ink)}
        </style>`;
      this.pintarTog();
      document.getElementById('v-bloques').onclick = () => this.setVista('bloques');
      document.getElementById('v-lista').onclick   = () => this.setVista('lista');

      if (global.DB.modo() === 'demo') {
        v.insertAdjacentHTML('afterbegin',
          `<div class="banner info">Modo demo — árbol y productos de ejemplo.
           <a href="#" id="cat-conectar">Conectar Belgrano Soft</a> para ver el catálogo real.</div>`);
        document.getElementById('cat-conectar').onclick = e => { e.preventDefault(); this.modalConexion(); };
      }

      const q = document.getElementById('cat-q');
      let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => {
        this.texto = q.value.trim();
        if (this.texto) this.buscar(); else { this.ruta = []; this.pintar(); }
      }, 250); };

      try {
        this.arbol = await global.DB.arbolCategorias();
        const tot = await global.DB.totales().catch(() => null);
        const sub = document.getElementById('cat-sub');
        if (sub && tot) sub.textContent = `${tot.productos.toLocaleString('es-AR')} productos · ${tot.variantes.toLocaleString('es-AR')} variantes`;
      } catch (e) { /* seguimos con lo que haya */ }
      this.pintar();
    },

    // Hijos de una categoría (o las raíces si padre es null).
    hijos(padreId) {
      return this.arbol.filter(c => (c.padre_id ?? null) === (padreId ?? null))
        .sort((a, b) => a.nombre.localeCompare(b.nombre));
    },

    crumb() {
      const c = document.getElementById('cat-crumb');
      if (!c) return;
      const items = [{ id: null, nombre: 'Todo' }, ...this.ruta];
      c.innerHTML = `<div class="wrap-row" style="margin-bottom:14px;align-items:center">` +
        items.map((it, i) => {
          const last = i === items.length - 1;
          return `<span>${last
            ? `<b style="color:var(--navy)">${UI.esc(it.nombre)}</b>`
            : `<a href="#" data-crumb="${i}">${UI.esc(it.nombre)}</a>`}</span>` +
            (last ? '' : '<span class="muted">›</span>');
        }).join('') + `</div>`;
      c.querySelectorAll('[data-crumb]').forEach(a =>
        a.onclick = e => { e.preventDefault(); this.ruta = this.ruta.slice(0, Number(a.dataset.crumb)); this.pintar(); });
    },

    async pintar() {
      this.crumb();
      const cont = document.getElementById('cat-lista');
      const actual = this.ruta.length ? this.ruta[this.ruta.length - 1].id : null;
      const subcats = this.hijos(actual);

      // Si la categoría actual tiene subcategorías, mostramos el árbol.
      if (subcats.length) {
        cont.innerHTML = `<div class="grid-cats">${subcats.map(c =>
          `<button class="cat-tile" data-cat="${c.id}">
             <span class="cat-n">${UI.esc(c.nombre)}</span>
             <span class="cat-go">›</span>
           </button>`).join('')}</div>
          <style>
            .grid-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
            .cat-tile{display:flex;align-items:center;gap:10px;padding:16px;border:1px solid var(--line);
              border-radius:12px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:.15s}
            .cat-tile:hover{border-color:var(--brand);transform:translateY(-1px)}
            .cat-n{font-weight:650;color:var(--navy);flex:1}
            .cat-go{color:var(--muted);font-size:18px}
          </style>`;
        cont.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
          const c = this.arbol.find(x => x.id === Number(b.dataset.cat));
          this.ruta.push({ id: c.id, nombre: c.nombre }); this.pintar();
        });
        return;
      }

      // Es una hoja (tipo de mueble): mostramos sus productos.
      cont.innerHTML = UI.spinner();
      try {
        this._prods = await global.DB.productos({ categoriaId: actual });
        this.pintarProductos(cont,
          actual ? 'Este tipo de mueble no tiene productos.' : 'Elegí un ambiente para empezar.');
      } catch (e) {
        this._prods = null;
        cont.innerHTML = `<div class="banner warn">No se pudo leer: ${UI.esc(e.message || e)}</div>`;
      }
    },

    async buscar() {
      this.ruta = [];
      document.getElementById('cat-crumb').innerHTML = '';
      const cont = document.getElementById('cat-lista');
      cont.innerHTML = UI.spinner();
      try {
        this._prods = await global.DB.productos({ texto: this.texto });
        this.pintarProductos(cont, 'No hay productos para esa búsqueda.');
      } catch (e) {
        this._prods = null;
        cont.innerHTML = `<div class="banner warn">${UI.esc(e.message || e)}</div>`;
      }
    },

    // Cambia entre bloques/listado y re-pinta lo que haya sin volver a la base.
    setVista(v) {
      if (v === this.vista) return;
      this.vista = v;
      try { localStorage.setItem(VISTA_KEY, v); } catch {}
      this.pintarTog();
      const cont = document.getElementById('cat-lista');
      if (this._prods) this.pintarProductos(cont, 'Sin productos.');
    },

    pintarTog() {
      const b = document.getElementById('v-bloques'), l = document.getElementById('v-lista');
      if (!b || !l) return;
      b.className = this.vista === 'bloques' ? 'on' : '';
      l.className = this.vista === 'lista' ? 'on' : '';
    },

    // Dispatcher: pinta la lista de productos en el formato elegido.
    pintarProductos(cont, vacio) {
      const prods = this._prods || [];
      cont.innerHTML = prods.length
        ? (this.vista === 'lista' ? this.htmlLista(prods) : this.htmlBloques(prods))
        : UI.vacio(vacio);
      this.enganchar(cont);
    },

    htmlLista(prods) {
      return `<div class="card"><table>
        <thead><tr><th>Producto</th><th style="text-align:right">Variantes</th><th></th></tr></thead>
        <tbody>${prods.map(p => {
          const tn = p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>';
          return `<tr data-prod="${p.id}" style="cursor:pointer">
            <td><b>${UI.esc(p.nombre)}</b> ${tn}</td>
            <td style="text-align:right" class="tnum">${p.variantes}</td>
            <td style="text-align:right" class="muted">ver ›</td></tr>`;
        }).join('')}</tbody></table></div>`;
    },

    htmlBloques(prods) {
      return `<div class="grid-prod">${prods.map(p => {
        const tn = p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>';
        return `<button class="prod-tile" data-prod="${p.id}">
            <div class="prod-top"><span class="prod-n">${UI.esc(p.nombre)}</span> ${tn}</div>
            <div class="prod-meta"><b class="tnum">${p.variantes}</b> variantes</div>
          </button>`;
      }).join('')}</div>
        <div id="cat-detalle"></div>
        <style>
          .grid-prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
          .prod-tile{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:16px;
            border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);
            cursor:pointer;text-align:left;transition:.15s}
          .prod-tile:hover{border-color:var(--brand);transform:translateY(-1px)}
          .prod-tile.on{border-color:var(--brand);background:var(--brand-soft)}
          .prod-top{display:flex;align-items:center;gap:8px}
          .prod-n{font-weight:650;color:var(--navy)}
          .prod-meta{color:var(--muted);font-size:13px}
        </style>`;
    },

    enganchar(cont) {
      cont.querySelectorAll('[data-prod]').forEach(el =>
        el.onclick = () => this.vista === 'lista'
          ? this.toggle(Number(el.dataset.prod))
          : this.abrirDetalle(Number(el.dataset.prod), el));
    },

    // Vista bloques: las variantes van a un panel debajo de la grilla.
    async abrirDetalle(prodId, tile) {
      const det = document.getElementById('cat-detalle');
      const yaAbierto = tile.classList.contains('on');
      document.querySelectorAll('.prod-tile.on').forEach(t => t.classList.remove('on'));
      if (yaAbierto) { det.innerHTML = ''; return; }
      tile.classList.add('on');
      det.innerHTML = `<div class="card pad" style="margin-top:12px">${UI.spinner('Variantes…')}</div>`;
      try {
        const vars = await global.DB.variantes(prodId);
        det.innerHTML = `<div class="card pad" style="margin-top:12px">${this.tablaVariantes(vars)}</div>`;
      } catch (e) {
        det.innerHTML = `<div class="banner warn" style="margin-top:12px">${UI.esc(e.message || e)}</div>`;
      }
    },

    async toggle(prodId) {
      const existe = document.getElementById('var-' + prodId);
      if (existe) { existe.remove(); return; }
      const tr = document.querySelector(`[data-prod="${prodId}"]`);
      const fila = document.createElement('tr');
      fila.id = 'var-' + prodId;
      fila.innerHTML = `<td colspan="3" style="background:var(--panel-2)">${UI.spinner('Variantes…')}</td>`;
      tr.after(fila);
      try {
        const vars = await global.DB.variantes(prodId);
        fila.querySelector('td').innerHTML = this.tablaVariantes(vars);
      } catch (e) {
        fila.querySelector('td').innerHTML = `<div class="banner warn">${UI.esc(e.message || e)}</div>`;
      }
    },

    tablaVariantes(vars) {
      if (!vars.length) return UI.vacio('Sin variantes cargadas.');
      return `<table style="margin:2px 0">
        <thead><tr><th>Medida</th><th>Estructura</th><th>Frente</th><th>Otros</th><th style="text-align:right">Precio</th></tr></thead>
        <tbody>${vars.map(v => {
          const extras = UI.extras(v).map(([k, val]) =>
            `<span class="pill soft">${UI.esc(k)}: ${UI.esc(val)}</span>`).join(' ') || '<span class="muted">—</span>';
          return `<tr>
            <td class="tnum">${UI.esc(v.medida || '—')}</td>
            <td>${UI.esc(v.estructura || '—')}</td>
            <td>${UI.esc(v.frente || '—')}</td>
            <td>${extras}</td>
            <td style="text-align:right"><b class="tnum">${UI.pesos(v.precio)}</b></td></tr>`;
        }).join('')}</tbody></table>`;
    },

    modalConexion() {
      const c = global.DB.cfg();
      document.body.insertAdjacentHTML('beforeend', `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:grid;place-items:center;padding:20px" id="mdl">
          <div class="card pad" style="max-width:460px;width:100%">
            <h3 class="h-title" style="font-size:18px">Conectar Belgrano Soft</h3>
            <p class="h-sub">Pegá la <b>anon key</b> (Settings → API → Project API keys → anon public). Es pública, va en el frontend.</p>
            <label class="fld" style="margin-top:14px"><span class="lbl">URL del proyecto</span>
              <input id="mc-url" value="${UI.esc(c.url || global.DB.DEFAULT_URL)}"></label>
            <label class="fld" style="margin-top:12px"><span class="lbl">anon key</span>
              <input id="mc-key" placeholder="eyJ…" value="${UI.esc(c.key || '')}"></label>
            <div class="row" style="margin-top:18px;justify-content:flex-end;gap:10px">
              <button class="btn" id="mc-cancel">Cancelar</button>
              <button class="btn primary" id="mc-ok">Conectar</button>
            </div>
          </div>
        </div>`);
      const cerrar = () => document.getElementById('mdl').remove();
      document.getElementById('mc-cancel').onclick = cerrar;
      document.getElementById('mc-ok').onclick = () => {
        const url = document.getElementById('mc-url').value.trim();
        const key = document.getElementById('mc-key').value.trim();
        if (!key) { UI.aviso('Falta la anon key', 'warn'); return; }
        global.DB.guardarCfg(url, key);
        UI.aviso('Conectado. Recargando…', 'ok');
        setTimeout(() => location.reload(), 600);
      };
    },
  };

  global.Catalogo = Catalogo;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================
//  Belgrano Soft · Presupuestos
//  Se carga buscando el producto en la propia línea (como el desplegable
//  de Odoo). Si algo no aparece escribiendo, el botón "Catálogo" abre el
//  buscador completo. Cada mueble es una línea = 1 unidad. Dos precios:
//  efectivo y tarjeta (recargo configurable). "suma / no suma" marca lo
//  que entra a la comisión (el flete no suma).
// =====================================================================
(function (global) {
  const RECARGO_KEY = 'bh_recargo_tarjeta';

  const Presupuesto = {
    lineas: [],                 // [{key, prodNombre, varId, ejes, precio, suma}]
    _uid: 0,
    recargo: (() => { try { return Number(localStorage.getItem(RECARGO_KEY)) || 0.15; } catch { return 0.15; } })(),

    render() {
      const v = document.getElementById('view');
      v.innerHTML = `
        <div class="row" style="margin-bottom:16px">
          <div>
            <div class="kick">Presupuestos</div>
            <h1 class="h-title">Armar un presupuesto</h1>
            <div class="h-sub">Buscá el mueble en la línea. Si no lo encontrás, abrí el catálogo.</div>
          </div>
        </div>

        <div class="card pad" style="margin-bottom:16px">
          <div class="ph-grid">
            <label class="fld"><span class="lbl">Cliente</span>
              <input id="pr-cli" placeholder="Empezá a escribir para encontrar al cliente…"></label>
            <label class="fld"><span class="lbl">Vendedor</span>
              <input id="pr-vend" placeholder="Quién atiende"></label>
            <label class="fld"><span class="lbl">Fecha</span>
              <input id="pr-fecha" value="${hoy()}"></label>
          </div>
        </div>

        <div class="card">
          <div class="row" style="padding:12px 14px;border-bottom:1px solid var(--line)">
            <b style="color:var(--navy)">Líneas de la orden</b>
            <div class="sp"></div>
            <button class="btn sm" id="pr-catalogo">☰ Catálogo</button>
          </div>
          <div id="pr-lineas"></div>
        </div>

        <div id="pr-pie"></div>

        <style>
          .ph-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
          @media(max-width:640px){.ph-grid{grid-template-columns:1fr}}
          .lrow{display:grid;grid-template-columns:1fr 150px 150px auto auto;gap:10px;align-items:center;
            padding:11px 14px;border-bottom:1px solid var(--line-soft)}
          .lrow:hover{background:var(--panel-2)}
          .lrow .n{font-weight:650;color:var(--navy)} .lrow .v{font-size:12px;color:var(--muted)}
          .lrow .pr{text-align:right;font-weight:650} .lrow .pr small{display:block;font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase}
          .lx{color:var(--muted);cursor:pointer;font-size:16px;border:0;background:transparent;padding:4px}
          .sw{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;user-select:none}
          .sw .b{width:34px;height:19px;border-radius:20px;background:var(--brand);position:relative;transition:.15s}
          .sw .b::after{content:"";position:absolute;top:2px;right:2px;width:15px;height:15px;border-radius:50%;background:#fff}
          .sw.off .b{background:var(--line)} .sw.off .b::after{left:2px;right:auto}
          .srow{position:relative;padding:11px 14px}
          .drop{position:absolute;left:14px;right:14px;top:100%;z-index:30;background:var(--panel);border:1px solid var(--brand);
            border-radius:11px;box-shadow:var(--shadow);overflow:hidden;max-height:320px;overflow-y:auto}
          .drop .it{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line-soft)}
          .drop .it:last-child{border-bottom:0} .drop .it:hover,.drop .it.sel{background:var(--brand-soft)}
          .drop .it .cnt{color:var(--muted);font-size:12px}
          .pie{display:flex;align-items:center;gap:20px;padding:16px;margin-top:16px;flex-wrap:wrap}
          .tot{font-size:13px;color:var(--muted)} .tot b{display:block;font-size:20px;color:var(--navy)}
          .mdlbg{position:fixed;inset:0;background:rgba(20,26,38,.4);z-index:50;display:grid;place-items:center;padding:20px}
        </style>`;

      document.getElementById('pr-catalogo').onclick = () => this.modalCatalogo();
      this.pintar();
    },

    // ---- Render de líneas + fila de búsqueda -----------------------------
    pintar() {
      const cont = document.getElementById('pr-lineas');
      const filas = this.lineas.map(l => `
        <div class="lrow" data-l="${l.key}">
          <div><div class="n">${UI.esc(l.prodNombre)}</div><div class="v">${UI.esc(l.ejes)}</div></div>
          <div class="pr"><small>efectivo</small>${UI.pesos(l.precio)}</div>
          <div class="pr"><small>tarjeta</small>${UI.pesos(l.precio * (1 + this.recargo))}</div>
          <span class="sw ${l.suma ? '' : 'off'}" data-suma="${l.key}">
            <span class="b"></span>${l.suma ? 'suma' : 'no suma'}</span>
          <button class="lx" data-del="${l.key}" title="Quitar">✕</button>
        </div>`).join('');

      cont.innerHTML = filas + `
        <div class="srow">
          <input id="pr-buscar" placeholder="Buscar un producto…" autocomplete="off">
          <div id="pr-drop"></div>
        </div>`;

      // enganches de líneas existentes
      cont.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
        this.lineas = this.lineas.filter(x => x.key !== Number(b.dataset.del));
        this.pintar();
      });
      cont.querySelectorAll('[data-suma]').forEach(s => s.onclick = () => {
        const l = this.lineas.find(x => x.key === Number(s.dataset.suma));
        if (l) { l.suma = !l.suma; this.pintar(); }
      });

      // buscador de la línea
      const inp = document.getElementById('pr-buscar');
      let t;
      inp.oninput = () => { clearTimeout(t); t = setTimeout(() => this.buscarInline(inp.value.trim()), 220); };
      inp.onblur = () => setTimeout(() => { const d = document.getElementById('pr-drop'); if (d) d.innerHTML = ''; }, 180);

      this.pintarPie();
    },

    async buscarInline(texto) {
      const drop = document.getElementById('pr-drop');
      if (!drop) return;
      if (!texto) { drop.innerHTML = ''; return; }
      drop.innerHTML = `<div class="drop"><div class="it muted">${UI.spinner('Buscando…')}</div></div>`;
      try {
        const prods = await global.DB.productos({ texto, limite: 20 });
        if (!prods.length) { drop.innerHTML = `<div class="drop"><div class="it muted">Nada con “${UI.esc(texto)}”. Probá el Catálogo.</div></div>`; return; }
        drop.innerHTML = `<div class="drop">${prods.map(p =>
          `<div class="it" data-pick="${p.id}">
             <span>${UI.esc(p.nombre)}</span>
             ${p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>'}
             <span class="sp"></span><span class="cnt">${p.variantes} var.</span>
           </div>`).join('')}</div>`;
        drop.querySelectorAll('[data-pick]').forEach(it =>
          it.onmousedown = e => { e.preventDefault(); this.elegirProducto(Number(it.dataset.pick), prods.find(p => p.id === Number(it.dataset.pick))); });
      } catch (e) {
        drop.innerHTML = `<div class="drop"><div class="it muted">${UI.esc(e.message || e)}</div></div>`;
      }
    },

    // Elegido el producto: si tiene una variante, la agrega; si tiene varias, pregunta cuál.
    async elegirProducto(prodId, prod) {
      const drop = document.getElementById('pr-drop'); if (drop) drop.innerHTML = '';
      const inp = document.getElementById('pr-buscar'); if (inp) inp.value = '';
      let vars;
      try { vars = await global.DB.variantes(prodId); }
      catch (e) { UI.aviso(String(e.message || e), 'crit'); return; }
      if (!vars.length) { UI.aviso('Ese producto no tiene variantes cargadas', 'warn'); return; }
      if (vars.length === 1) { this.agregar(prod.nombre, vars[0]); return; }
      this.modalVariante(prod.nombre, vars);
    },

    agregar(prodNombre, variante) {
      this.lineas.push({
        key: ++this._uid,
        prodNombre,
        varId: variante.id,
        ejes: UI.ejes(variante),
        precio: Number(variante.precio) || 0,
        suma: true,
      });
      this.pintar();
      UI.aviso('Mueble agregado', 'ok');
    },

    // ---- Pie: totales + acciones ----------------------------------------
    pintarPie() {
      const ef = this.lineas.reduce((a, l) => a + l.precio, 0);
      const ta = this.lineas.reduce((a, l) => a + l.precio * (1 + this.recargo), 0);
      const pie = document.getElementById('pr-pie');
      pie.innerHTML = `
        <div class="card pie">
          <div class="tot">Total efectivo <b class="tnum">${UI.pesos(ef)}</b></div>
          <div class="tot">Total tarjeta <b class="tnum">${UI.pesos(ta)}</b></div>
          <label class="sw" style="gap:8px">recargo tarjeta
            <input id="pr-recargo" value="${Math.round(this.recargo * 100)}" style="width:64px;text-align:right"> %</label>
          <div class="sp"></div>
          <button class="btn" id="pr-guardar" ${this.lineas.length ? '' : 'disabled'}>Guardar</button>
          <button class="btn primary" id="pr-venta" ${this.lineas.length ? '' : 'disabled'}>Convertir en venta →</button>
        </div>`;
      const rec = document.getElementById('pr-recargo');
      rec.onchange = () => {
        const n = Number(rec.value);
        this.recargo = (isFinite(n) && n >= 0 ? n : 15) / 100;
        try { localStorage.setItem(RECARGO_KEY, String(this.recargo)); } catch {}
        this.pintar();
      };
      document.getElementById('pr-guardar').onclick = () => UI.aviso('Guardar presupuesto: próximo paso (persistir en la base)', 'info');
      document.getElementById('pr-venta').onclick = () => UI.aviso('Convertir en venta: próximo paso (crea la orden en core)', 'info');
    },

    // ---- Modal: elegir variante de un producto --------------------------
    modalVariante(prodNombre, vars) {
      const html = `<div class="mdlbg" id="pr-mdl">
        <div class="card pad" style="max-width:560px;width:100%;max-height:80vh;overflow:auto">
          <div class="row" style="margin-bottom:12px"><h3 style="color:var(--navy)">${UI.esc(prodNombre)}</h3>
            <div class="sp"></div><button class="lx" id="pr-mdl-x" style="font-size:20px">✕</button></div>
          <p class="muted" style="margin:0 0 12px;font-size:13px">Elegí la variante:</p>
          <table><thead><tr><th>Medida</th><th>Estructura</th><th>Frente</th><th style="text-align:right">Precio</th><th></th></tr></thead>
          <tbody>${vars.map((v, i) => `<tr>
            <td class="tnum">${UI.esc(v.medida || '—')}</td>
            <td>${UI.esc(v.estructura || '—')}</td>
            <td>${UI.esc(v.frente || '—')}</td>
            <td style="text-align:right"><b class="tnum">${UI.pesos(v.precio)}</b></td>
            <td style="text-align:right"><button class="btn sm primary" data-v="${i}">Elegir</button></td>
          </tr>`).join('')}</tbody></table>
        </div></div>`;
      document.body.insertAdjacentHTML('beforeend', html);
      const cerrar = () => { const m = document.getElementById('pr-mdl'); if (m) m.remove(); };
      document.getElementById('pr-mdl-x').onclick = cerrar;
      document.getElementById('pr-mdl').onclick = e => { if (e.target.id === 'pr-mdl') cerrar(); };
      document.querySelectorAll('#pr-mdl [data-v]').forEach(b =>
        b.onclick = () => { this.agregar(prodNombre, vars[Number(b.dataset.v)]); cerrar(); });
    },

    // ---- Modal: catálogo completo (fallback de búsqueda) ----------------
    modalCatalogo() {
      const html = `<div class="mdlbg" id="pr-cat">
        <div class="card pad" style="max-width:720px;width:100%;max-height:82vh;display:flex;flex-direction:column">
          <div class="row" style="margin-bottom:12px"><h3 style="color:var(--navy)">Buscar: Producto</h3>
            <div class="sp"></div><button class="lx" id="pr-cat-x" style="font-size:20px">✕</button></div>
          <input id="pr-cat-q" placeholder="Buscar por nombre…" autocomplete="off" style="margin-bottom:12px">
          <div id="pr-cat-lista" style="overflow:auto">${UI.spinner()}</div>
        </div></div>`;
      document.body.insertAdjacentHTML('beforeend', html);
      const cerrar = () => { const m = document.getElementById('pr-cat'); if (m) m.remove(); };
      document.getElementById('pr-cat-x').onclick = cerrar;
      document.getElementById('pr-cat').onclick = e => { if (e.target.id === 'pr-cat') cerrar(); };

      const pintar = async (texto) => {
        const cont = document.getElementById('pr-cat-lista');
        cont.innerHTML = UI.spinner();
        try {
          const prods = await global.DB.productos({ texto, limite: 80 });
          cont.innerHTML = prods.length ? `<table>
            <thead><tr><th>Producto</th><th style="text-align:right">Variantes</th><th></th></tr></thead>
            <tbody>${prods.map(p => `<tr>
              <td><b>${UI.esc(p.nombre)}</b> ${p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>'}</td>
              <td style="text-align:right" class="tnum">${p.variantes}</td>
              <td style="text-align:right"><button class="btn sm primary" data-p="${p.id}">Elegir</button></td>
            </tr>`).join('')}</tbody></table>` : UI.vacio('Sin resultados.');
          cont.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
            cerrar();
            this.elegirProducto(Number(b.dataset.p), prods.find(p => p.id === Number(b.dataset.p)));
          });
        } catch (e) { cont.innerHTML = `<div class="banner warn">${UI.esc(e.message || e)}</div>`; }
      };
      const q = document.getElementById('pr-cat-q');
      let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => pintar(q.value.trim()), 220); };
      pintar('');
    },
  };

  function hoy() {
    try {
      const d = new Date();
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    } catch { return ''; }
  }

  global.Presupuesto = Presupuesto;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================
//  Belgrano Soft · shell
//  Selector "ver como" (sin login todavía) + navegación por rol.
//  Cada rol ve solo sus solapas. El login real llega después.
// =====================================================================
(function (global) {
  // Qué solapas ve cada rol. La clave es el módulo; el label lo que se lee.
  const MODULOS = {
    catalogo:   { label: 'Catálogo',    render: () => global.Catalogo.render() },
    presupuesto:{ label: 'Presupuestos',render: () => global.Presupuesto.render() },
  };
  const ROLES = {
    vendedor:   { label: 'Vendedor',            tabs: ['presupuesto', 'catalogo'] },
    produccion: { label: 'Producción · Iara',   tabs: ['catalogo'] },
    direccion:  { label: 'Dirección · Brian',   tabs: ['catalogo', 'presupuesto'] },
  };

  const App = {
    rol: 'vendedor',
    tab: null,

    async init() {
      this.montarShell();
      // Si no hay conexión configurada, ofrecer conectar (una sola vez).
      if (!global.DB.hayConexion()) this.pedirConexion();
      this.setRol(localStorage.getItem('bh_rol') || 'vendedor');
    },

    montarShell() {
      document.body.innerHTML = `
        <div id="top">
          <div class="brand">Belgrano&nbsp;Soft <span class="m" id="modo"></span></div>
          <div class="sp"></div>
          <div class="verComo">
            <span style="opacity:.7">Ver como</span>
            <select id="selRol"></select>
          </div>
        </div>
        <nav id="nav"></nav>
        <main id="view"></main>`;
      const sel = document.getElementById('selRol');
      sel.innerHTML = Object.entries(ROLES)
        .map(([k, r]) => `<option value="${k}">${UI.esc(r.label)}</option>`).join('');
      sel.onchange = () => this.setRol(sel.value);
      document.getElementById('modo').textContent =
        global.DB.modo() === 'demo' ? '· demo' : '';
    },

    setRol(rol) {
      if (!ROLES[rol]) rol = 'vendedor';
      this.rol = rol;
      localStorage.setItem('bh_rol', rol);
      document.getElementById('selRol').value = rol;
      const tabs = ROLES[rol].tabs;
      document.getElementById('nav').innerHTML = tabs
        .map(t => `<button data-tab="${t}">${UI.esc(MODULOS[t].label)}</button>`).join('');
      document.querySelectorAll('#nav button').forEach(b =>
        b.onclick = () => this.setTab(b.dataset.tab));
      this.setTab(tabs.includes(this.tab) ? this.tab : tabs[0]);
    },

    setTab(tab) {
      this.tab = tab;
      document.querySelectorAll('#nav button').forEach(b =>
        b.setAttribute('aria-current', b.dataset.tab === tab));
      document.getElementById('view').innerHTML = '';
      MODULOS[tab].render();
    },

    pedirConexion() {
      const v = document.getElementById('view');
      // Se muestra en la primera pantalla; no bloquea el modo demo.
      setTimeout(() => {
        if (global.DB.hayConexion()) return;
      }, 0);
    },
  };

  global.App = App;
  if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', () => App.init());
})(typeof window !== 'undefined' ? window : globalThis);

</script></body></html>
