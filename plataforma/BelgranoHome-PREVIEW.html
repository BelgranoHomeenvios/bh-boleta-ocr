<style>
:root{--navy:#16324f;--ink:#0f1a2a;--blue:#1e5fce;--muted:#8a94a3;--sec:#5b6675;--line:#d9e0e8;--bg:#f4f6f8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.previewbar{background:#fff7e6;color:#7a4a00;font-size:12.5px;font-weight:600;padding:7px 20px;text-align:center;border-bottom:1px solid #f0d9a8;flex:0 0 auto}
.app-header{background:var(--navy);color:#fff;height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.app-header .brand{display:flex;align-items:center;gap:12px}
.app-header .logo{width:30px;height:30px;border-radius:6px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.app-header .title{font-weight:700;font-size:15px;letter-spacing:-.01em}
.app-header .title small{display:block;font-size:10.5px;font-weight:600;opacity:.7;letter-spacing:.04em;text-transform:uppercase}
.app-nav{display:flex;gap:4px;margin-left:8px}
.app-nav button{background:transparent;border:none;color:rgba(255,255,255,.75);font:inherit;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.app-nav button:hover{background:rgba(255,255,255,.10);color:#fff}
.app-nav button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.app-nav button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app-user{display:flex;align-items:center;gap:12px}
.app-user .who{text-align:right;line-height:1.2}
.app-user .who b{font-size:13px;font-weight:700}
.app-user .who small{display:block;font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:.03em}
.app-user .avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
#moduleHost{flex:1 1 auto;position:relative;min-height:0}
#moduleHost iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#moduleHost iframe.hidden{display:none}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sec);font-size:14px;font-weight:600}
@media(max-width:640px){.app-header{padding:0 12px}.app-header .title small{display:none}.app-nav button .lbl{display:none}}
</style>

<script>
"use strict";
/* Vista previa en un solo archivo: cada módulo va embebido (base64) y se
   carga en su propio iframe aislado. NO es la arquitectura final (esa queda
   en archivos separados dentro de /plataforma); esto es solo para mirar. */
var NOMBRES={crm:'CRM',logistica:'Logística'};
var cargados={};
function b64ToUtf8(b64){
  var bin=atob(b64.trim()); var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function abrir(clave){
  var host=document.getElementById('moduleHost');
  var msg=document.getElementById('loadingMsg'); if(msg)msg.style.display='none';
  if(!cargados[clave]){
    var fr=document.createElement('iframe');
    fr.id='if_'+clave; fr.title=NOMBRES[clave];
    fr.srcdoc=b64ToUtf8(document.getElementById('src-'+clave).textContent);
    host.appendChild(fr);
    cargados[clave]=true;
  }
  Array.prototype.forEach.call(host.querySelectorAll('iframe'),function(fr){
    fr.classList.toggle('hidden', fr.id!=='if_'+clave);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#appNav button'),function(b){
    b.classList.toggle('on', b.getAttribute('data-mod')===clave);
  });
}
abrir('crm');
</script>
