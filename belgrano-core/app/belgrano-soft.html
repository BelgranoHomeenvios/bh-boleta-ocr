<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belgrano Soft</title>
<style>
/* =====================================================================
   Belgrano Soft · sistema visual común
   Navy/azul + estados con color. Un solo lugar para todos los módulos.
   ===================================================================== */
:root{
  --bg:#eef1f6; --panel:#fff; --panel-2:#f7f9fc; --ink:#141a26; --ink-soft:#54607a;
  --line:#dbe1ec; --line-soft:#e8ecf3;
  --navy:#1c2b4a; --brand:#2f6fed; --brand-soft:#e6eefc; --brand-ink:#1b4fd0;
  --ok:#128a5b; --ok-bg:#e2f3ea; --warn:#b5730f; --warn-bg:#f8eeda;
  --crit:#c53b3b; --crit-bg:#fbe6e6; --muted:#7d8aa3;
  --shadow:0 1px 2px rgba(20,26,38,.06),0 4px 16px rgba(20,26,38,.05);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d111b; --panel:#151b2a; --panel-2:#111726; --ink:#eaeef7; --ink-soft:#9aa6c0;
    --line:#26304a; --line-soft:#1e2740; --navy:#dbe3f4; --brand:#5b8dff;
    --brand-soft:#1a2540; --brand-ink:#9dbcff; --ok:#43c98d; --ok-bg:#13291f;
    --warn:#e0a53c; --warn-bg:#2c2413; --crit:#f0736f; --crit-bg:#2c1717; --muted:#7f8cab;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font-variant-numeric:tabular-nums;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; letter-spacing:-.01em}
button{font:inherit}
a{color:var(--brand)}

/* ===== Shell con sidebar izquierdo + topbar ===== */
.lay{display:grid; grid-template-columns:248px 1fr; min-height:100vh}
.side{background:var(--panel); border-right:1px solid var(--line); position:sticky; top:0; height:100vh;
  overflow-y:auto; display:flex; flex-direction:column; z-index:30}
.side .brandbox{display:flex; align-items:center; gap:10px; padding:16px 16px 12px}
.side .logo{width:30px; height:30px; border-radius:8px; background:var(--brand); color:#fff; font-weight:800;
  display:grid; place-items:center; font-size:16px}
.side .brandbox b{color:var(--navy); font-weight:800; letter-spacing:-.02em; display:block; font-size:14px; line-height:1.1}
.side .brandbox .m{color:var(--muted); font-size:11px}
.side nav{display:flex; flex-direction:column; gap:2px; padding:6px 10px}
.side .sect{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:800; padding:14px 14px 6px}
.navi{display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:10px; color:var(--ink-soft);
  font-weight:600; font-size:14px; cursor:pointer; border:0; background:transparent; text-align:left; width:100%}
.navi:hover{background:var(--panel-2); color:var(--brand)}
.navi[aria-current="true"]{background:var(--brand-soft); color:var(--brand-ink); font-weight:700}
.navi .ic{width:20px; text-align:center; font-size:15px; flex:none}
.navi .kbd{margin-left:auto; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:0 5px}
.navi:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}
.side .grow{flex:1}

.main{min-width:0; display:flex; flex-direction:column}
.tbar{position:sticky; top:0; z-index:25; display:flex; align-items:center; gap:12px; padding:10px 20px;
  background:var(--panel); border-bottom:1px solid var(--line)}
.tbar .ham{display:none; border:0; background:transparent; font-size:20px; cursor:pointer; color:var(--ink)}
.tbar .search{flex:1; max-width:560px; position:relative}
.tbar .search input{background:var(--panel-2); border-color:transparent; padding-left:36px}
.tbar .search .mag{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted)}
.tbar .search .kbd{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--muted);
  border:1px solid var(--line); border-radius:5px; padding:1px 6px; background:var(--panel)}
.tbar .sp{flex:1}
.tbar .verComo{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft)}
.tbar select{font:inherit; font-size:13px; padding:7px 10px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); font-weight:600; width:auto}
.tbar .ic-btn{position:relative; border:1px solid var(--line); background:var(--panel); width:36px; height:36px;
  border-radius:10px; cursor:pointer; font-size:15px}
.tbar .ic-btn .dot{position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; border-radius:9px;
  background:var(--crit); color:#fff; font-size:10px; font-weight:800; display:grid; place-items:center; padding:0 3px}
.tbar .avatar{width:36px; height:36px; border-radius:10px; background:var(--navy); color:#fff; font-weight:800;
  display:grid; place-items:center; font-size:13px}
@media (prefers-color-scheme:dark){ .tbar .avatar{color:#0d111b} }

#view{padding:22px 24px 80px; max-width:1400px; width:100%; margin:0 auto}

@media(max-width:860px){
  .lay{grid-template-columns:1fr}
  .side{position:fixed; left:0; top:0; width:248px; transform:translateX(-100%); transition:.2s; box-shadow:var(--shadow)}
  body.sideopen .side{transform:none}
  .tbar .ham{display:block}
  .tbar .search .kbd{display:none}
}

/* Bits */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex; align-items:center; gap:12px}
.wrap-row{display:flex; flex-wrap:wrap; gap:10px}
.sp{flex:1}
.muted{color:var(--muted)}
.h-title{font-size:22px; font-weight:800; color:var(--navy)}
.h-sub{color:var(--ink-soft); margin-top:4px; font-size:14px}
.kick{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--brand); font-weight:700}

input,select,textarea{
  font:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line);
  border-radius:9px; background:var(--panel); color:var(--ink); width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
label.fld{display:block}
label.fld .lbl{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600}

.btn{
  font-weight:650; font-size:14px; padding:9px 16px; border-radius:9px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); transition:.15s;
}
.btn:hover{border-color:var(--brand); color:var(--brand)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{background:var(--brand-ink); color:#fff}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.sm{padding:6px 11px; font-size:13px}

.pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; white-space:nowrap; display:inline-block}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.crit{background:var(--crit-bg); color:var(--crit)}
.pill.info{background:var(--brand-soft); color:var(--brand)}
.pill.soft{background:var(--line-soft); color:var(--ink-soft)}

table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--line)}
td{padding:11px 12px; border-bottom:1px solid var(--line-soft)}
tr:hover td{background:var(--panel-2)}

.empty{text-align:center; padding:48px 20px; color:var(--muted)}
.spin{display:inline-block; width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation:none} }

.banner{padding:10px 14px; border-radius:9px; font-size:13px; margin-bottom:16px}
.banner.warn{background:var(--warn-bg); color:var(--warn)}
.banner.info{background:var(--brand-soft); color:var(--brand-ink)}

/* ===== Sub-navegación de módulo (segundo nivel) ===== */
.modlay{display:grid; grid-template-columns:210px 1fr; gap:22px; align-items:start}
.subside{position:sticky; top:78px; display:flex; flex-direction:column; gap:2px}
.subside .subttl{font-size:17px; font-weight:800; color:var(--navy); padding:2px 12px 10px; letter-spacing:-.01em}
.subnavi{display:flex; align-items:center; gap:9px; padding:8px 12px; border-radius:9px; color:var(--ink-soft);
  font-weight:600; font-size:14px; cursor:pointer; border:0; background:transparent; text-align:left; width:100%}
.subnavi:hover{background:var(--panel); color:var(--brand)}
.subnavi[aria-current="true"]{background:var(--panel); color:var(--brand-ink); box-shadow:var(--shadow); font-weight:700}
.subnavi .tag{margin-left:auto}
.modbody{min-width:0}
@media(max-width:820px){
  .modlay{grid-template-columns:1fr}
  .subside{position:static; flex-direction:row; overflow-x:auto; gap:4px; padding-bottom:8px; border-bottom:1px solid var(--line)}
  .subside .subttl{display:none}
  .subnavi{white-space:nowrap; width:auto}
}

/* ===== Componentes de dashboard ===== */
.greet{font-size:26px; font-weight:800; color:var(--navy); letter-spacing:-.02em}
.greet-sub{color:var(--ink-soft); margin-top:2px}
.alerts{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; margin:16px 0}
.alert{display:flex; align-items:center; gap:11px; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--panel); box-shadow:var(--shadow); cursor:pointer; border-left-width:4px}
.alert:hover{transform:translateY(-1px); transition:.15s}
.alert.crit{border-left-color:var(--crit)} .alert.warn{border-left-color:var(--warn)}
.alert.ok{border-left-color:var(--ok)} .alert.info{border-left-color:var(--brand)}
.alert .em{font-size:18px} .alert b{display:block; color:var(--navy); font-size:14px} .alert span{font-size:12px; color:var(--muted)}
.alert .rt{margin-left:auto; font-size:12px; font-weight:700}
.alert.crit .rt{color:var(--crit)} .alert.warn .rt{color:var(--warn)}

.kpis{display:grid; grid-template-columns:repeat(6,1fr); gap:12px}
@media(max-width:1150px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:15px; box-shadow:var(--shadow)}
.kpi .top{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; font-weight:600}
.kpi .top .em{width:24px; height:24px; border-radius:7px; display:grid; place-items:center; font-size:13px}
.kpi .val{font-size:23px; font-weight:800; color:var(--navy); margin-top:8px; letter-spacing:-.02em}
.kpi .foot{font-size:12px; color:var(--muted); margin-top:3px}
.kpi .foot .up{color:var(--ok); font-weight:700} .kpi .foot .down{color:var(--crit); font-weight:700}
.kpi .obj{height:5px; background:var(--panel-2); border-radius:3px; margin-top:9px; overflow:hidden}
.kpi .obj span{display:block; height:100%; background:var(--brand); border-radius:3px}

.pipe{display:flex; gap:6px; align-items:stretch; overflow-x:auto; padding-bottom:4px}
.pstep{flex:1; min-width:118px; border:1px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center; background:var(--panel-2)}
.pstep .pl{font-size:12px; font-weight:700; color:var(--ink-soft)}
.pstep .pn{font-size:24px; font-weight:800; color:var(--navy); margin:4px 0} .pstep .pm{font-size:11px; color:var(--muted)}
.pstep.hot{border-color:var(--brand); background:var(--brand-soft)}
.pipe .arr{align-self:center; color:var(--muted); font-size:14px; flex:none}

.embudo{display:flex; flex-direction:column; gap:9px}
.erow{display:flex; align-items:center; gap:10px}
.erow .en{width:104px; font-size:13px; color:var(--ink-soft)}
.erow .eb{flex:1; height:20px; background:var(--panel-2); border-radius:6px; overflow:hidden}
.erow .eb span{display:block; height:100%; background:var(--brand); border-radius:6px}
.erow .ev{width:96px; text-align:right; font-size:13px} .erow .ev b{color:var(--navy)} .erow .ev small{color:var(--muted)}

.tl{display:flex; flex-direction:column}
.tl .ev{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:13px}
.tl .ev:last-child{border-bottom:0} .tl .ev .h{color:var(--muted); min-width:46px; font-size:12px} .tl .ev .d{width:8px; height:8px; border-radius:50%; margin-top:5px; flex:none}
.cols3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px} @media(max-width:980px){.cols3{grid-template-columns:1fr}}
.pcard{background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:16px}
.pcard h3{margin:0 0 12px; color:var(--navy); font-size:15px}
.pcard .more{display:inline-block; margin-top:10px; font-size:13px; color:var(--brand); cursor:pointer; font-weight:600}

</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =====================================================================
//  Belgrano Soft · capa de datos
//  Una sola puerta a Supabase. Si no hay conexión configurada, la app
//  igual arranca en modo DEMO con unos productos de ejemplo, así se puede
//  ver la interfaz antes de conectar la base.
// =====================================================================
(function (global) {
  const CFG_KEY = 'bh_supabase_cfg';

  // La URL del proyecto Belgrano Soft ya la sabemos; la anon key es pública
  // (va en el frontend) pero la carga la persona la primera vez, para no
  // dejarla escrita en el repo.
  const DEFAULT_URL = 'https://qwbdhpevgirsmfxqlgtg.supabase.co';

  // Saca tildes y pasa a minúscula: "CÓMODA" → "comoda". Así la búsqueda
  // reconoce todo aunque la persona no ponga el acento.
  function sinTilde(s) {
    return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }

  function cfg() {
    try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; }
    catch { return {}; }
  }
  function guardarCfg(url, key) {
    localStorage.setItem(CFG_KEY, JSON.stringify({ url: url || DEFAULT_URL, key }));
  }
  function hayConexion() { return !!cfg().key && !!global.supabase; }

  let _cli = null;
  function cliente() {
    if (_cli) return _cli;
    const c = cfg();
    if (!c.key || !global.supabase) return null;
    // El catálogo vive en el esquema core.
    _cli = global.supabase.createClient(c.url || DEFAULT_URL, c.key, {
      db: { schema: 'core' },
    });
    return _cli;
  }

  // ---- Modo demo: árbol + productos para ver la UI sin conexión --------
  const DEMO = {
    categorias: [
      { id: 1, nombre: 'DORMITORIO', padre_id: null, nivel: 2 },
      { id: 2, nombre: 'CÓMODAS',    padre_id: 1,    nivel: 3 },
      { id: 3, nombre: 'PLACARD',    padre_id: 1,    nivel: 3 },
      { id: 4, nombre: 'LIVING',     padre_id: null, nivel: 2 },
      { id: 5, nombre: 'MESAS RATONAS', padre_id: 4, nivel: 3 },
    ],
    productos: [
      { id: 1, categoria_id: 2, nombre: 'CÓMODA AMBERES 55', publicado_tn: true },
      { id: 4, categoria_id: 2, nombre: 'CÓMODA OLIVER 60', publicado_tn: true },
      { id: 5, categoria_id: 2, nombre: 'CÓMODA NÓRDICA 90', publicado_tn: false },
      { id: 2, categoria_id: 3, nombre: 'PLACARD OLIVER', publicado_tn: true },
      { id: 3, categoria_id: 5, nombre: 'MESA RATONA NORUEGA', publicado_tn: false },
    ],
    variantes: [
      { id: 11, producto_id: 1, medida: '1.20', estructura: 'blanca', frente: 'paraiso', precio: 425750, atributos: { medida: '1.20', estructura: 'blanca', frente: 'paraiso' } },
      { id: 12, producto_id: 1, medida: '1.20', estructura: 'negra',  frente: 'blanca',  precio: 406250, atributos: { medida: '1.20', estructura: 'negra', frente: 'blanca' } },
      { id: 13, producto_id: 2, medida: '2.00', estructura: 'blanca', frente: 'paraiso', precio: 900000, atributos: { medida: '2.00', estructura: 'blanca', frente: 'paraiso', espejo: '2 espejos' } },
      { id: 14, producto_id: 3, medida: '1.00', estructura: 'blanca', frente: null,      precio: 300000, atributos: { medida: '1.00', estructura: 'blanca' } },
    ],
    // Órdenes de venta de ejemplo (para ver la vista antes de conectar).
    ordenes: [
      { id: 2, numero: 'S00002', fecha: '2026-06-01', cliente: 'Abigail Galfre',   vendedor: 'Brian',    local: '2020', total: 968000,  estado: 'entregado' },
      { id: 1, numero: 'S00001', fecha: '2026-06-01', cliente: 'Abel Schoenmaker',  vendedor: 'Cristian', local: '2020', total: 1028500, estado: 'produccion' },
      { id: 3, numero: 'S00003', fecha: '2026-07-24', cliente: 'Bibiana',           vendedor: 'Ale',      local: '2020', total: 516000,  estado: 'confirmar' },
      { id: 4, numero: 'S00004', fecha: '2026-07-26', cliente: 'Laura y Hernán',    vendedor: 'Cristian', local: '2299', total: 731250,  estado: 'logistica' },
      { id: 5, numero: 'S00005', fecha: '2026-07-27', cliente: 'Diego',             vendedor: 'Sergio',   local: '2299', total: 733000,  estado: 'anulado' },
    ],
    // Cotizaciones de ejemplo.
    cotizaciones: [
      { id: 10, numero: 'C-4142', fecha: '2026-07-28', cliente: 'Paloma',          vendedor: 'Ale',      local: '2020', total: 490000, estado: 'borrador' },
      { id: 11, numero: 'C-4141', fecha: '2026-07-27', cliente: 'Camila',          vendedor: 'Ale',      local: '2299', total: 425750, estado: 'aceptada' },
      { id: 12, numero: 'C-4140', fecha: '2026-07-25', cliente: 'Jona',            vendedor: 'Nati',     local: '2020', total: 633700, estado: 'rechazada' },
    ],
    // Clientes de ejemplo (una fila por teléfono, como el CRM).
    clientes: [
      { id: 1, nombre: 'Bibiana',        telefono: '1161636645',    vendedor: 'Ale',      consultas: 2, concret: 2, seguim: 0, comprado: 1691700, ultima: 'Ayer' },
      { id: 2, nombre: 'Victoria',       telefono: '5491168145568', vendedor: 'Ale',      consultas: 1, concret: 1, seguim: 0, comprado: 1520000, ultima: 'Hace 6 días' },
      { id: 3, nombre: 'Liliana y Javier', telefono: '1151099144',  vendedor: 'Cristian', consultas: 1, concret: 1, seguim: 0, comprado: 1335750, ultima: 'Hace 2 días' },
      { id: 4, nombre: 'Diego',          telefono: '5491131554640', vendedor: 'Cristian', consultas: 1, concret: 1, seguim: 0, comprado: 733000,  ultima: 'Hace 9 días' },
      { id: 5, nombre: 'Paloma',         telefono: '5491141715700', vendedor: 'Ale',      consultas: 1, concret: 0, seguim: 1, comprado: 0,       ultima: 'Hoy' },
    ],
  };

  // Estados de la orden → etiqueta y color del pill (según el ciclo real).
  const ESTADO_ORDEN = {
    confirmar:   { label: 'Confirmar',   pill: 'warn' },
    produccion:  { label: 'Producción',  pill: 'info' },
    logistica:   { label: 'Logística',   pill: 'info' },
    entregado:   { label: 'Entregado',   pill: 'ok' },
    archivado:   { label: 'Archivado',   pill: 'soft' },
    anulado:     { label: 'Anulado',     pill: 'crit' },
    reclamo:     { label: 'Reclamo',     pill: 'crit' },
  };
  const ESTADO_COTIZ = {
    borrador:  { label: 'Borrador',  pill: 'soft' },
    aceptada:  { label: 'Aceptada',  pill: 'ok' },
    rechazada: { label: 'Rechazada', pill: 'crit' },
    vencida:   { label: 'Vencida',   pill: 'warn' },
  };

  // Serie de órdenes creadas en la sesión (demo). Arranca donde termina la muestra.
  let _seqOrden = 5;

  // ---- API que usan los módulos ---------------------------------------
  const DB = {
    modo() { return hayConexion() ? 'supabase' : 'demo'; },
    DEFAULT_URL, cfg, guardarCfg, hayConexion,

    // El árbol de categorías (ambiente → tipo de mueble).
    async arbolCategorias() {
      if (!hayConexion()) return DEMO.categorias;
      const { data, error } = await cliente().from('categoria')
        .select('id,nombre,padre_id,nivel').eq('activa', true).order('nombre');
      if (error) throw error;
      return data || [];
    },

    // Productos: por categoría (tipo de mueble) o por texto libre.
    async productos({ texto = '', categoriaId = null, limite = 200 } = {}) {
      if (!hayConexion()) {
        const t = sinTilde(texto);
        let ps = DEMO.productos.filter(p =>
          (!t || sinTilde(p.nombre).includes(t)) &&

(function (global) {
  const VISTA_KEY = 'bh_catalogo_vista';
  const Catalogo = {
    arbol: [],           // categorías cargadas
    ruta: [],            // breadcrumb: [{id,nombre}] hasta la categoría actual
    texto: '',           // búsqueda libre
    vista: (() => { try { return localStorage.getItem(VISTA_KEY) || 'bloques'; } catch { return 'bloques'; } })(),
    _prods: null,        // últimos productos pintados (para re-render al cambiar de vista)

    async render(mount = 'view') {
      const v = document.getElementById(mount);
      v.innerHTML = `
        <div class="row" style="margin-bottom:16px">
          <div>
            <div class="kick">Catálogo</div>
            <h1 class="h-title">Productos</h1>
            <div class="h-sub" id="cat-sub"></div>
          </div>
          <div class="sp"></div>
          <label class="fld" style="width:260px">
            <span class="lbl">Buscar en todo el catálogo</span>
            <input id="cat-q" placeholder="Amberes, oliver, mesa…" value="${UI.esc(this.texto)}">
          </label>
          <div class="vista-tog" role="group" aria-label="Formato de vista" style="align-self:flex-end">
            <button id="v-bloques" title="Bloques" aria-label="Bloques">▦</button>
            <button id="v-lista"   title="Listado" aria-label="Listado">☰</button>
          </div>
        </div>
        <div id="cat-crumb"></div>
        <div id="cat-lista">${UI.spinner()}</div>
        <style>
          .vista-tog{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
          .vista-tog button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-size:16px;color:var(--muted);line-height:1}
          .vista-tog button+button{border-left:1px solid var(--line)}
          .vista-tog button.on{background:var(--brand-soft);color:var(--brand-ink)}
        </style>`;
      this.pintarTog();
      document.getElementById('v-bloques').onclick = () => this.setVista('bloques');
      document.getElementById('v-lista').onclick   = () => this.setVista('lista');

      if (global.DB.modo() === 'demo') {
        v.insertAdjacentHTML('afterbegin',
          `<div class="banner info">Modo demo — árbol y productos de ejemplo.
           <a href="#" id="cat-conectar">Conectar Belgrano Soft</a> para ver el catálogo real.</div>`);
        document.getElementById('cat-conectar').onclick = e => { e.preventDefault(); this.modalConexion(); };
      }

      const q = document.getElementById('cat-q');
      let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => {
        this.texto = q.value.trim();
        if (this.texto) this.buscar(); else { this.ruta = []; this.pintar(); }
      }, 250); };

      try {
        this.arbol = await global.DB.arbolCategorias();
        const tot = await global.DB.totales().catch(() => null);
        const sub = document.getElementById('cat-sub');
        if (sub && tot) sub.textContent = `${tot.productos.toLocaleString('es-AR')} productos · ${tot.variantes.toLocaleString('es-AR')} variantes`;
      } catch (e) { /* seguimos con lo que haya */ }
      this.pintar();
    },

    // Hijos de una categoría (o las raíces si padre es null).
    hijos(padreId) {
      return this.arbol.filter(c => (c.padre_id ?? null) === (padreId ?? null))
        .sort((a, b) => a.nombre.localeCompare(b.nombre));
    },

    crumb() {
      const c = document.getElementById('cat-crumb');
      if (!c) return;
      const items = [{ id: null, nombre: 'Todo' }, ...this.ruta];
      c.innerHTML = `<div class="wrap-row" style="margin-bottom:14px;align-items:center">` +
        items.map((it, i) => {
          const last = i === items.length - 1;
          return `<span>${last
            ? `<b style="color:var(--navy)">${UI.esc(it.nombre)}</b>`
            : `<a href="#" data-crumb="${i}">${UI.esc(it.nombre)}</a>`}</span>` +
            (last ? '' : '<span class="muted">›</span>');
        }).join('') + `</div>`;
      c.querySelectorAll('[data-crumb]').forEach(a =>
        a.onclick = e => { e.preventDefault(); this.ruta = this.ruta.slice(0, Number(a.dataset.crumb)); this.pintar(); });
    },

    async pintar() {
      this.crumb();
      const cont = document.getElementById('cat-lista');
      const actual = this.ruta.length ? this.ruta[this.ruta.length - 1].id : null;
      const subcats = this.hijos(actual);

      // Si la categoría actual tiene subcategorías, mostramos el árbol.
      if (subcats.length) {
        cont.innerHTML = `<div class="grid-cats">${subcats.map(c =>
          `<button class="cat-tile" data-cat="${c.id}">
             <span class="cat-n">${UI.esc(c.nombre)}</span>
             <span class="cat-go">›</span>
           </button>`).join('')}</div>
          <style>
            .grid-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
            .cat-tile{display:flex;align-items:center;gap:10px;padding:16px;border:1px solid var(--line);
              border-radius:12px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:.15s}
            .cat-tile:hover{border-color:var(--brand);transform:translateY(-1px)}
            .cat-n{font-weight:650;color:var(--navy);flex:1}
            .cat-go{color:var(--muted);font-size:18px}
          </style>`;
        cont.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
          const c = this.arbol.find(x => x.id === Number(b.dataset.cat));
          this.ruta.push({ id: c.id, nombre: c.nombre }); this.pintar();
        });
        return;
      }

      // Es una hoja (tipo de mueble): mostramos sus productos.
      cont.innerHTML = UI.spinner();
      try {
        this._prods = await global.DB.productos({ categoriaId: actual });
        this.pintarProductos(cont,
          actual ? 'Este tipo de mueble no tiene productos.' : 'Elegí un ambiente para empezar.');
      } catch (e) {
        this._prods = null;
        cont.innerHTML = `<div class="banner warn">No se pudo leer: ${UI.esc(e.message || e)}</div>`;
      }
    },

    async buscar() {
      this.ruta = [];
      document.getElementById('cat-crumb').innerHTML = '';
      const cont = document.getElementById('cat-lista');
      cont.innerHTML = UI.spinner();
      try {
        this._prods = await global.DB.productos({ texto: this.texto });
        this.pintarProductos(cont, 'No hay productos para esa búsqueda.');
      } catch (e) {
        this._prods = null;
        cont.innerHTML = `<div class="banner warn">${UI.esc(e.message || e)}</div>`;
      }
    },

    // Cambia entre bloques/listado y re-pinta lo que haya sin volver a la base.
    setVista(v) {
      if (v === this.vista) return;
      this.vista = v;
      try { localStorage.setItem(VISTA_KEY, v); } catch {}
      this.pintarTog();
      const cont = document.getElementById('cat-lista');
      if (this._prods) this.pintarProductos(cont, 'Sin productos.');
    },

    pintarTog() {
      const b = document.getElementById('v-bloques'), l = document.getElementById('v-lista');
      if (!b || !l) return;
      b.className = this.vista === 'bloques' ? 'on' : '';
      l.className = this.vista === 'lista' ? 'on' : '';
    },

    // Dispatcher: pinta la lista de productos en el formato elegido.
    pintarProductos(cont, vacio) {
      const prods = this._prods || [];
      cont.innerHTML = prods.length
        ? (this.vista === 'lista' ? this.htmlLista(prods) : this.htmlBloques(prods))
        : UI.vacio(vacio);
      this.enganchar(cont);
    },

    htmlLista(prods) {
      return `<div class="card"><table>
        <thead><tr><th>Producto</th><th style="text-align:right">Variantes</th><th></th></tr></thead>
        <tbody>${prods.map(p => {
          const tn = p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>';
          return `<tr data-prod="${p.id}" style="cursor:pointer">
            <td><b>${UI.esc(p.nombre)}</b> ${tn}</td>
            <td style="text-align:right" class="tnum">${p.variantes}</td>
            <td style="text-align:right" class="muted">ver ›</td></tr>`;
        }).join('')}</tbody></table></div>`;
    },

    htmlBloques(prods) {
      return `<div class="grid-prod">${prods.map(p => {
        const tn = p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>';
        return `<button class="prod-tile" data-prod="${p.id}">
            <div class="prod-top"><span class="prod-n">${UI.esc(p.nombre)}</span> ${tn}</div>
            <div class="prod-meta"><b class="tnum">${p.variantes}</b> variantes</div>
          </button>`;
      }).join('')}</div>
        <div id="cat-detalle"></div>
        <style>
          .grid-prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
          .prod-tile{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:16px;
            border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);
            cursor:pointer;text-align:left;transition:.15s}
          .prod-tile:hover{border-color:var(--brand);transform:translateY(-1px)}
          .prod-tile.on{border-color:var(--brand);background:var(--brand-soft)}
          .prod-top{display:flex;align-items:center;gap:8px}
          .prod-n{font-weight:650;color:var(--navy)}
          .prod-meta{color:var(--muted);font-size:13px}
        </style>`;
    },

    enganchar(cont) {
      cont.querySelectorAll('[data-prod]').forEach(el =>
        el.onclick = () => this.vista === 'lista'
          ? this.toggle(Number(el.dataset.prod))
          : this.abrirDetalle(Number(el.dataset.prod), el));
    },

    // Vista bloques: las variantes van a un panel debajo de la grilla.
    async abrirDetalle(prodId, tile) {
      const det = document.getElementById('cat-detalle');
      const yaAbierto = tile.classList.contains('on');
      document.querySelectorAll('.prod-tile.on').forEach(t => t.classList.remove('on'));
      if (yaAbierto) { det.innerHTML = ''; return; }
      tile.classList.add('on');
      det.innerHTML = `<div class="card pad" style="margin-top:12px">${UI.spinner('Variantes…')}</div>`;
      try {
        const vars = await global.DB.variantes(prodId);
        det.innerHTML = `<div class="card pad" style="margin-top:12px">${this.tablaVariantes(vars)}</div>`;
      } catch (e) {
        det.innerHTML = `<div class="banner warn" style="margin-top:12px">${UI.esc(e.message || e)}</div>`;
      }
    },

    async toggle(prodId) {
      const existe = document.getElementById('var-' + prodId);
      if (existe) { existe.remove(); return; }
      const tr = document.querySelector(`[data-prod="${prodId}"]`);
      const fila = document.createElement('tr');
      fila.id = 'var-' + prodId;
      fila.innerHTML = `<td colspan="3" style="background:var(--panel-2)">${UI.spinner('Variantes…')}</td>`;
      tr.after(fila);
      try {
        const vars = await global.DB.variantes(prodId);
        fila.querySelector('td').innerHTML = this.tablaVariantes(vars);
      } catch (e) {
        fila.querySelector('td').innerHTML = `<div class="banner warn">${UI.esc(e.message || e)}</div>`;
      }
    },

    tablaVariantes(vars) {
      if (!vars.length) return UI.vacio('Sin variantes cargadas.');
      return `<table style="margin:2px 0">
        <thead><tr><th>Medida</th><th>Estructura</th><th>Frente</th><th>Otros</th><th style="text-align:right">Precio</th></tr></thead>
        <tbody>${vars.map(v => {
          const extras = UI.extras(v).map(([k, val]) =>
            `<span class="pill soft">${UI.esc(k)}: ${UI.esc(val)}</span>`).join(' ') || '<span class="muted">—</span>';
          return `<tr>
            <td class="tnum">${UI.esc(v.medida || '—')}</td>
            <td>${UI.esc(v.estructura || '—')}</td>
            <td>${UI.esc(v.frente || '—')}</td>
            <td>${extras}</td>
            <td style="text-align:right"><b class="tnum">${UI.pesos(v.precio)}</b></td></tr>`;
        }).join('')}</tbody></table>`;
    },

    modalConexion() {
      const c = global.DB.cfg();
      document.body.insertAdjacentHTML('beforeend', `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:grid;place-items:center;padding:20px" id="mdl">
          <div class="card pad" style="max-width:460px;width:100%">
            <h3 class="h-title" style="font-size:18px">Conectar Belgrano Soft</h3>
            <p class="h-sub">Pegá la <b>anon key</b> (Settings → API → Project API keys → anon public). Es pública, va en el frontend.</p>
            <label class="fld" style="margin-top:14px"><span class="lbl">URL del proyecto</span>
              <input id="mc-url" value="${UI.esc(c.url || global.DB.DEFAULT_URL)}"></label>
            <label class="fld" style="margin-top:12px"><span class="lbl">anon key</span>
              <input id="mc-key" placeholder="eyJ…" value="${UI.esc(c.key || '')}"></label>
            <div class="row" style="margin-top:18px;justify-content:flex-end;gap:10px">
              <button class="btn" id="mc-cancel">Cancelar</button>
              <button class="btn primary" id="mc-ok">Conectar</button>
            </div>
          </div>
        </div>`);
      const cerrar = () => document.getElementById('mdl').remove();
      document.getElementById('mc-cancel').onclick = cerrar;
      document.getElementById('mc-ok').onclick = () => {
        const url = document.getElementById('mc-url').value.trim();
        const key = document.getElementById('mc-key').value.trim();
        if (!key) { UI.aviso('Falta la anon key', 'warn'); return; }
        global.DB.guardarCfg(url, key);
        UI.aviso('Conectado. Recargando…', 'ok');
        setTimeout(() => location.reload(), 600);
      };
    },
  };

  global.Catalogo = Catalogo;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================
//  Belgrano Soft · Cotización → Venta (hasta "Confirmar")
//  Se busca el producto en la línea (estándar, precio bloqueado del
//  catálogo) o se agrega un ítem "a medida" (descripción + precio manual).
//  El precio depende del término de pago: todo nace del precio de lista;
//  efectivo lleva −35%; tarjeta/cuotas = lista; transferencia y mixto se
//  ajustan (mixto es editable por línea).
//  "Convertir en venta" crea la orden en estado CONFIRMAR (espera la seña).
// =====================================================================
(function (global) {
  const DESC_EFECTIVO = 0.35;     // −35% sobre lista (dato de Brian)
  const DESC_TRANSFER = 0.00;     // provisional, a definir (a·b·c·d)

  const TERMINOS = [
    { k: 'lista',         label: 'Tarjeta / Lista (3·6·12)' },
    { k: 'efectivo',      label: 'Efectivo (−35%)' },
    { k: 'transferencia', label: 'Transferencia' },
    { k: 'mixto',         label: 'Mixto (editable)' },
  ];

  const Presupuesto = {
    cli: { nombre: '', telefono: '', email: '', instagram: '', dni: '', canal: '' },
    vendedor: '', local: '2020', termino: 'efectivo', vence: '',
    lineas: [],   // {key,tipo:'estandar'|'medida',prodNombre,varId,ejes,base,cantidad,obs,precioManual}
    _uid: 0,
    _mount: 'view',

    factor() {
      if (this.termino === 'efectivo') return 1 - DESC_EFECTIVO;
      if (this.termino === 'transferencia') return 1 - DESC_TRANSFER;
      return 1; // lista, mixto
    },
    // Precio unitario según tipo de ítem y término.
    unit(l) {
      if (l.tipo === 'medida') return Number(l.precioManual) || 0;
      if (this.termino === 'mixto') return l.precioManual != null ? Number(l.precioManual) : l.base;
      return l.base * this.factor();
    },
    total() { return this.lineas.reduce((a, l) => a + this.unit(l) * l.cantidad, 0); },
    editable(l) { return l.tipo === 'medida' || this.termino === 'mixto'; },
    clienteValido() {
      const c = this.cli;
      return !!(String(c.telefono).trim() || String(c.email).trim() || String(c.instagram).trim());
    },
    // Un ítem salta a verificación de administración si es a medida o tiene observaciones.
    requiereVerif(l) { return l.tipo === 'medida' || !!String(l.obs).trim(); }
    ,

    render(mount = 'view') {
      this._mount = mount;
      const vends = global.DB.vendedores(), locs = global.DB.locales();
      document.getElementById(mount).innerHTML = `
        <div class="row" style="margin-bottom:12px;align-items:flex-start">
          <div><div class="kick">Ventas</div><h1 class="h-title">Nueva cotización</h1></div>
          <div class="sp"></div>
          <div class="wrap-row" style="justify-content:flex-end">
            <button class="btn sm" id="pr-guardar">💾 Guardar</button>
            <button class="btn sm" id="pr-preview">👁 Vista previa</button>
            <button class="btn sm" id="pr-print">🖨 Imprimir</button>
          </div>
        </div>

        <div class="card pad" style="margin-bottom:14px">
          <div class="kick" style="margin-bottom:8px">Cliente</div>
          <div class="cli-grid">
            <label class="fld"><span class="lbl">Teléfono</span><input id="c-tel" value="${UI.esc(this.cli.telefono)}" placeholder="11 5555-2020"></label>
            <label class="fld"><span class="lbl">Instagram</span><input id="c-ig" value="${UI.esc(this.cli.instagram)}" placeholder="@usuario"></label>
            <label class="fld"><span class="lbl">Mail</span><input id="c-mail" value="${UI.esc(this.cli.email)}" placeholder="cliente@correo.com"></label>
            <label class="fld"><span class="lbl">Nombre <span class="muted">(opcional)</span></span><input id="c-nombre" value="${UI.esc(this.cli.nombre)}" placeholder="Se completa después"></label>
            <label class="fld"><span class="lbl">DNI <span class="muted">(solo factura)</span></span><input id="c-dni" value="${UI.esc(this.cli.dni)}" placeholder="opcional"></label>
            <label class="fld"><span class="lbl">¿Cómo nos conoció?</span>
              <select id="c-canal"><option value="">—</option>
                ${['Instagram', 'Facebook', 'Recomendación', 'Pasó por el local', 'Google', 'Otro']
                  .map(o => `<option ${this.cli.canal === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
          </div>
          <div id="c-aviso"></div>
        </div>

        <div class="card pad" style="margin-bottom:14px">
          <div class="kick" style="margin-bottom:8px">Datos de la operación</div>
          <div class="op-grid">
            <label class="fld"><span class="lbl">Vendedor</span>
              <select id="op-vend"><option value="">Elegí…</option>${vends.map(v => `<option ${this.vendedor === v ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
            <label class="fld"><span class="lbl">Local de origen</span>
              <select id="op-local">${locs.map(l => `<option value="${l.k}" ${this.local === l.k ? 'selected' : ''}>${l.label}</option>`).join('')}</select></label>
            <label class="fld"><span class="lbl">Término de pago</span>
              <select id="op-term">${TERMINOS.map(t => `<option value="${t.k}" ${this.termino === t.k ? 'selected' : ''}>${t.label}</option>`).join('')}</select></label>
            <label class="fld"><span class="lbl">Vence</span><input id="op-vence" type="date" value="${UI.esc(this.vence)}"></label>
          </div>
          <div class="muted" id="op-nota" style="font-size:12px;margin-top:8px"></div>
        </div>

        <div class="card">
          <div class="row" style="padding:12px 14px;border-bottom:1px solid var(--line)">
            <b style="color:var(--navy)">Ítems</b><div class="sp"></div>
            <button class="btn sm" id="pr-medida">+ A medida</button>
            <button class="btn sm" id="pr-catalogo">☰ Catálogo</button>
          </div>
          <div class="lhead"><span>Producto</span><span>Cant.</span><span>Precio unit.</span><span>Observaciones</span><span style="text-align:right">Subtotal</span><span></span></div>
          <div id="pr-lineas"></div>
        </div>
        <div id="pr-pie"></div>

        <style>
          .cli-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
          .op-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
          @media(max-width:760px){.cli-grid,.op-grid{grid-template-columns:1fr 1fr}}
          @media(max-width:460px){.cli-grid,.op-grid{grid-template-columns:1fr}}
          .lhead,.lrow{display:grid;grid-template-columns:1.4fr 72px 130px 1.1fr 120px 34px;gap:10px;align-items:center}
          .lhead{padding:9px 14px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
          .lrow{padding:10px 14px;border-bottom:1px solid var(--line-soft)}
          .lrow:hover{background:var(--panel-2)}
          .lrow .n{font-weight:650;color:var(--navy);line-height:1.25} .lrow .v{font-size:12px;color:var(--muted)}
          .lrow input{padding:7px 9px} .lrow .sub{text-align:right;font-weight:700;color:var(--navy)}
          .lrow .lock{color:var(--muted);font-size:12px;text-align:right;padding-right:2px}
          .lx{color:var(--muted);cursor:pointer;font-size:16px;border:0;background:transparent;padding:4px}
          .badge-med{font-size:10px;font-weight:800;color:var(--warn);background:var(--warn-bg);border-radius:5px;padding:1px 6px;margin-left:6px}
          @media(max-width:760px){.lhead{display:none}.lrow{grid-template-columns:1fr 1fr;gap:8px}.lrow .sub,.lrow .lock{text-align:left}}
          .srow{position:relative;padding:11px 14px}
          .drop{position:absolute;left:14px;right:14px;top:100%;z-index:30;background:var(--panel);border:1px solid var(--brand);border-radius:11px;box-shadow:var(--shadow);overflow:hidden;max-height:320px;overflow-y:auto}
          .drop .it{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line-soft)}
          .drop .it:last-child{border-bottom:0} .drop .it:hover{background:var(--brand-soft)} .drop .it .cnt{color:var(--muted);font-size:12px}
          .pie{display:flex;align-items:center;gap:24px;padding:18px;margin-top:16px;flex-wrap:wrap}
          .tot{font-size:13px;color:var(--muted)} .tot b{display:block;font-size:22px;color:var(--navy)}
          .mdlbg{position:fixed;inset:0;background:rgba(20,26,38,.4);z-index:50;display:grid;place-items:center;padding:20px}
        </style>`;

      const bind = (id, campo) => { const el = document.getElementById(id); if (el) el.oninput = () => { this.cli[campo] = el.value; this.avisoCliente(); }; };
      bind('c-nombre', 'nombre'); bind('c-tel', 'telefono'); bind('c-mail', 'email'); bind('c-ig', 'instagram'); bind('c-dni', 'dni');
      document.getElementById('c-canal').onchange = e => { this.cli.canal = e.target.value; };
      document.getElementById('op-vend').onchange = e => { this.vendedor = e.target.value; };
      document.getElementById('op-local').onchange = e => { this.local = e.target.value; };
      document.getElementById('op-term').onchange = e => { this.termino = e.target.value; this.notaTermino(); this.pintar(); };
      document.getElementById('op-vence').onchange = e => { this.vence = e.target.value; };
      document.getElementById('pr-catalogo').onclick = () => this.modalCatalogo();
      document.getElementById('pr-medida').onclick = () => this.agregarMedida();
      document.getElementById('pr-guardar').onclick = () => this.accion('guardar');
      document.getElementById('pr-preview').onclick = () => this.accion('preview');
      document.getElementById('pr-print').onclick = () => this.accion('print');

      this.avisoCliente(); this.notaTermino(); this.pintar();
    },

    avisoCliente() {
      const a = document.getElementById('c-aviso'); if (!a) return;
      a.innerHTML = this.clienteValido() ? '' :
        `<div class="banner warn" style="margin:12px 0 0">Cargá al menos <b>teléfono, Instagram o mail</b> — es lo que arma al cliente. El nombre puede quedar para después.</div>`;
    },
    notaTermino() {
      const n = document.getElementById('op-nota'); if (!n) return;
      n.innerHTML = this.termino === 'efectivo' ? 'Efectivo: precio de lista <b>−35%</b>.'
        : this.termino === 'transferencia' ? 'Transferencia: <b>a definir</b> el descuento (por ahora = lista).'
        : this.termino === 'mixto' ? 'Mixto: el vendedor <b>edita cada precio</b> (parte efectivo + parte tarjeta/transferencia).'
        : 'Tarjeta / Lista: precio de lista, en 3 · 6 · 12 cuotas.';
    },

    pintar() {
      const cont = document.getElementById('pr-lineas'); if (!cont) return;
      const filas = this.lineas.map(l => {
        const unit = this.unit(l), sub = unit * l.cantidad, ed = this.editable(l);
        const nombre = l.tipo === 'medida'
          ? `<input value="${UI.esc(l.prodNombre)}" data-nom="${l.key}" placeholder="Mueble a medida" style="font-weight:650">`
          : `<div class="n">${UI.esc(l.prodNombre)}<span class="badge-med" ${this.requiereVerif(l) ? '' : 'style="display:none"'}>verifica admin</span></div><div class="v">${UI.esc(l.ejes)}</div>`;
        const precioCel = ed
          ? `<input type="number" min="0" value="${l.precioManual != null ? l.precioManual : Math.round(unit)}" data-precio="${l.key}" aria-label="Precio unitario">`
          : `<div class="lock tnum">${UI.pesos(unit)} 🔒</div>`;
        return `<div class="lrow" data-l="${l.key}">
          <div>${nombre}</div>
          <input type="number" min="1" value="${l.cantidad}" data-cant="${l.key}" aria-label="Cantidad">
          ${precioCel}
          <input value="${UI.esc(l.obs)}" data-obs="${l.key}" placeholder="—" aria-label="Observaciones">
          <div class="sub tnum">${UI.pesos(sub)}</div>
          <button class="lx" data-del="${l.key}" title="Quitar">✕</button></div>`;
      }).join('');

      cont.innerHTML = filas + `<div class="srow">
        <input id="pr-buscar" placeholder="Agregar del catálogo (estándar)…" autocomplete="off"><div id="pr-drop"></div></div>`;

      cont.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { this.lineas = this.lineas.filter(x => x.key !== Number(b.dataset.del)); this.pintar(); });
      cont.querySelectorAll('[data-cant]').forEach(i => i.onchange = () => { const l = this.get(i.dataset.cant); if (l) { l.cantidad = Math.max(1, Math.floor(Number(i.value) || 1)); this.pintar(); } });
      cont.querySelectorAll('[data-obs]').forEach(i => i.oninput = () => { const l = this.get(i.dataset.obs); if (l) { l.obs = i.value; this.marcaVerif(i); } });
      cont.querySelectorAll('[data-nom]').forEach(i => i.oninput = () => { const l = this.get(i.dataset.nom); if (l) l.prodNombre = i.value; });
      cont.querySelectorAll('[data-precio]').forEach(i => i.onchange = () => { const l = this.get(i.dataset.precio); if (l) { l.precioManual = Math.max(0, Number(i.value) || 0); this.pintar(); } });

      const inp = document.getElementById('pr-buscar');
      let t; inp.oninput = () => { clearTimeout(t); t = setTimeout(() => this.buscarInline(inp.value.trim()), 220); };
      inp.onblur = () => setTimeout(() => { const d = document.getElementById('pr-drop'); if (d) d.innerHTML = ''; }, 180);
      this.pintarPie();
    },
    get(key) { return this.lineas.find(x => x.key === Number(key)); },
    marcaVerif(inp) {
      const row = inp.closest ? null : null; // sin closest en shim; repintamos liviano
      const l = this.get(inp.dataset.obs);
      const badge = document.querySelector(`[data-l="${l.key}"] .badge-med`);
      if (badge) badge.style.display = this.requiereVerif(l) ? '' : 'none';
    },

    async buscarInline(texto) {
      const drop = document.getElementById('pr-drop'); if (!drop) return;
      if (!texto) { drop.innerHTML = ''; return; }
      drop.innerHTML = `<div class="drop"><div class="it muted">${UI.spinner('Buscando…')}</div></div>`;
      try {
        const prods = await global.DB.productos({ texto, limite: 20 });
        if (!prods.length) { drop.innerHTML = `<div class="drop"><div class="it muted">Nada con “${UI.esc(texto)}”. Probá el Catálogo o cargalo a medida.</div></div>`; return; }
        drop.innerHTML = `<div class="drop">${prods.map(p => `<div class="it" data-pick="${p.id}"><span>${UI.esc(p.nombre)}</span>${p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>'}<span class="sp"></span><span class="cnt">${p.variantes} var.</span></div>`).join('')}</div>`;
        drop.querySelectorAll('[data-pick]').forEach(it => it.onmousedown = e => { e.preventDefault(); this.elegirProducto(Number(it.dataset.pick), prods.find(p => p.id === Number(it.dataset.pick))); });
      } catch (e) { drop.innerHTML = `<div class="drop"><div class="it muted">${UI.esc(e.message || e)}</div></div>`; }
    },

    async elegirProducto(prodId, prod) {
      const drop = document.getElementById('pr-drop'); if (drop) drop.innerHTML = '';
      const inp = document.getElementById('pr-buscar'); if (inp) inp.value = '';
      let vars;
      try { vars = await global.DB.variantes(prodId); } catch (e) { UI.aviso(String(e.message || e), 'crit'); return; }
      if (!vars.length) { UI.aviso('Ese producto no tiene variantes', 'warn'); return; }
      if (vars.length === 1) return this.agregarEstandar(prod.nombre, vars[0]);
      this.modalVariante(prod.nombre, vars);
    },
    agregarEstandar(prodNombre, variante) {
      this.lineas.push({ key: ++this._uid, tipo: 'estandar', prodNombre, varId: variante.id, ejes: UI.ejes(variante), base: Number(variante.precio) || 0, cantidad: 1, obs: '', precioManual: null });
      this.pintar(); UI.aviso('Ítem agregado', 'ok');
    },
    agregarMedida() {
      this.lineas.push({ key: ++this._uid, tipo: 'medida', prodNombre: '', varId: null, ejes: 'a medida', base: 0, cantidad: 1, obs: '', precioManual: 0 });
      this.pintar();
    },

    pintarPie() {
      const total = this.total();
      const items = this.lineas.reduce((a, l) => a + l.cantidad, 0);
      const term = TERMINOS.find(t => t.k === this.termino)?.label || '';
      const pie = document.getElementById('pr-pie'); if (!pie) return;
      pie.innerHTML = `<div class="card pie">
        <div class="tot">${UI.esc(term)} · ${items} ${items === 1 ? 'ítem' : 'ítems'}<b class="tnum">${UI.pesos(total)}</b></div>
        <div class="sp"></div>
        <button class="btn" id="pr-guardar2">Guardar borrador</button>
        <button class="btn primary" id="pr-venta" ${this.lineas.length ? '' : 'disabled'}>Convertir en venta →</button></div>`;
      document.getElementById('pr-guardar2').onclick = () => this.accion('guardar');
      document.getElementById('pr-venta').onclick = () => this.convertir();
    },

    // ---- Acciones -------------------------------------------------------
    accion(tipo) {
      if ((tipo === 'preview' || tipo === 'print') && !this.clienteValido()) return this.popIdentidad(tipo);
      if (tipo === 'guardar' && !this.clienteValido()) { this.avisoCliente(); return this.popIdentidad('guardar'); }
      if ((tipo === 'preview' || tipo === 'print') && !this.lineas.length) { UI.aviso('Agregá al menos un ítem', 'warn'); return; }
      if (tipo === 'preview') return this.modalPreview(false);
      if (tipo === 'print') return this.modalPreview(true);
      if (tipo === 'guardar') return UI.aviso('Borrador guardado (demo)', 'ok');
    },

    // Pop-up: se entrega un presupuesto sin los datos para registrarlo.
    popIdentidad(tipoOrig) {
      this.modal(`<h3 style="color:var(--navy)">Falta la identidad del cliente</h3>
        <p style="margin:10px 0 0">Estás por entregar un presupuesto <b>sin teléfono, Instagram ni mail</b>. Sin alguno de esos datos <b>no queda registrado</b> el turno ni el cliente.</p>
        <p class="muted" style="font-size:13px">Pedí al menos uno para que quede el registro de la atención. Si el cliente no lo da, podés entregarlo igual, pero no se guarda.</p>
        <div class="row" style="margin-top:16px;justify-content:flex-end;gap:10px">
          <button class="btn" id="mp-cerrar">Volver a pedir el dato</button>
          ${tipoOrig !== 'guardar' ? '<button class="btn primary" id="mp-igual">Entregar igual (sin registrar)</button>' : ''}
        </div>`, m => {
        document.getElementById('mp-cerrar').onclick = () => m.remove();
        const ig = document.getElementById('mp-igual');
        if (ig) ig.onclick = () => { m.remove(); this.modalPreview(tipoOrig === 'print'); };
      });
    },

    // ---- Convertir en venta → estado CONFIRMAR --------------------------
    convertir() {
      if (!this.clienteValido()) { this.avisoCliente(); return this.popIdentidad('convertir'); }
      if (!this.lineas.length) return UI.aviso('Agregá al menos un ítem', 'warn');
      if (!this.vendedor) return UI.aviso('Elegí el vendedor de la operación', 'warn');
      const incompletos = this.lineas.filter(l => l.tipo === 'medida' && (!l.prodNombre.trim() || !(Number(l.precioManual) > 0)));
      if (incompletos.length) return UI.aviso('Completá nombre y precio de los ítems a medida', 'warn');

      const verif = this.lineas.filter(l => this.requiereVerif(l)).length;
      const total = this.total();
      const nombreCli = this.cli.nombre.trim() || this.cli.telefono.trim() || this.cli.instagram.trim() || this.cli.email.trim();
      this.modal(`<h3 style="color:var(--navy)">Convertir en venta</h3>
        <p style="margin:10px 0 0">Se crea la orden en estado <span class="pill warn">Confirmar</span> — a la espera de la seña (mínimo 30%).</p>
        <table style="margin-top:12px"><tbody>
          <tr><td class="muted">Cliente</td><td style="text-align:right"><b>${UI.esc(nombreCli)}</b></td></tr>
          <tr><td class="muted">Vendedor · Local</td><td style="text-align:right">${UI.esc(this.vendedor)} · ${UI.esc(this.local)}</td></tr>
          <tr><td class="muted">Término</td><td style="text-align:right">${UI.esc(TERMINOS.find(t => t.k === this.termino)?.label || '')}</td></tr>
          <tr><td class="muted">Ítems</td><td style="text-align:right">${this.lineas.length}${verif ? ` · <span style="color:var(--warn)">${verif} a verificar</span>` : ''}</td></tr>
          <tr><td class="muted">Total</td><td style="text-align:right"><b class="tnum">${UI.pesos(total)}</b></td></tr>
        </tbody></table>
        ${verif ? `<div class="banner warn" style="margin-top:12px">${verif} ítem(s) a medida / con observaciones van a <b>verificarse en Administración</b>.</div>` : ''}
        <div class="row" style="margin-top:16px;justify-content:flex-end;gap:10px">
          <button class="btn" id="cv-cancel">Cancelar</button>
          <button class="btn primary" id="cv-ok">Crear orden en Confirmar</button></div>`, m => {
        document.getElementById('cv-cancel').onclick = () => m.remove();
        document.getElementById('cv-ok').onclick = () => {
          const orden = global.DB.crearOrden({
            cliente: nombreCli, vendedor: this.vendedor, local: this.local, total,
            termino: this.termino, fecha: hoy(),
            lineas: this.lineas.map(l => ({ nombre: l.prodNombre, cant: l.cantidad, unit: this.unit(l), obs: l.obs, tipo: l.tipo })),
          });
          m.remove();
          this.reset();
          UI.aviso(`Orden ${orden.numero} creada en estado Confirmar`, 'ok');
          global.App.goSub('ventas', 'ordenes');
        };
      });
    },
    reset() {
      this.cli = { nombre: '', telefono: '', email: '', instagram: '', dni: '', canal: '' };
      this.vendedor = ''; this.termino = 'efectivo'; this.vence = ''; this.lineas = []; this._uid = 0;
    },

    // ---- Vista previa / impresión ---------------------------------------
    cuerpoPreview() {
      const term = TERMINOS.find(t => t.k === this.termino)?.label || '';
      const ident = [this.cli.telefono, this.cli.email, this.cli.instagram].filter(Boolean).join(' · ');
      return `<div class="pv">
        <div class="pv-h"><h2>Belgrano Home</h2><div class="muted">Cotización · ${UI.esc(term)}</div></div>
        <div class="pv-cli"><b>${UI.esc(this.cli.nombre || 'Cliente')}</b><div class="muted">${UI.esc(ident)}</div></div>
        <table><thead><tr><th>Producto</th><th>Cant.</th><th style="text-align:right">Precio</th><th style="text-align:right">Subtotal</th></tr></thead>
        <tbody>${this.lineas.map(l => { const u = this.unit(l), s = u * l.cantidad;
          return `<tr><td><b>${UI.esc(l.prodNombre || '—')}</b><br><span class="muted">${UI.esc(l.ejes)}${l.obs ? ' · ' + UI.esc(l.obs) : ''}</span></td>
          <td>${l.cantidad}</td><td style="text-align:right" class="tnum">${UI.pesos(u)}</td><td style="text-align:right" class="tnum">${UI.pesos(s)}</td></tr>`; }).join('')}</tbody></table>
        <div class="pv-tot">Total (${UI.esc(term)}): <b class="tnum">${UI.pesos(this.total())}</b></div></div>`;
    },
    modalPreview(imprimir) {
      const estilo = `<style>.pv{color:#141a26;font-family:-apple-system,system-ui,sans-serif}
        .pv-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #1c2b4a;padding-bottom:8px;margin-bottom:14px}
        .pv-h h2{color:#1c2b4a;margin:0}.pv .muted{color:#7d8aa3}.pv-cli{margin-bottom:14px}.pv table{width:100%;border-collapse:collapse;font-size:14px}
        .pv th{text-align:left;font-size:11px;text-transform:uppercase;color:#7d8aa3;border-bottom:1px solid #dbe1ec;padding:8px}
        .pv td{padding:9px 8px;border-bottom:1px solid #eef1f6;vertical-align:top}.pv-tot{text-align:right;margin-top:16px;font-size:18px;color:#1c2b4a}</style>`;
      const cuerpo = estilo + this.cuerpoPreview();
      if (imprimir) { try { const w = global.open('', '_blank'); if (w) { w.document.write(`<title>Cotización</title>${cuerpo}`); w.document.close(); w.focus(); w.print(); return; } } catch (e) {} }
      this.modal(`<div class="row" style="margin-bottom:12px"><b style="color:var(--navy)">Vista previa</b><div class="sp"></div>
        <button class="btn sm" id="pv-print">🖨 Imprimir</button></div>${cuerpo}`, m => {
        document.getElementById('pv-print').onclick = () => this.modalPreview(true);
      }, 640);
    },

    // ---- Modales --------------------------------------------------------
    modal(html, onready, ancho = 480) {
      const id = 'mdl-' + (++this._uid);
      document.body.insertAdjacentHTML('beforeend',
        `<div class="mdlbg" id="${id}"><div class="card pad" style="max-width:${ancho}px;width:100%;max-height:85vh;overflow:auto">${html}</div></div>`);
      const m = document.getElementById(id);
      m.onclick = e => { if (e.target.id === id) m.remove(); };
      onready && onready(m);
      return m;
    },
    modalVariante(prodNombre, vars) {
      this.modal(`<div class="row" style="margin-bottom:12px"><h3 style="color:var(--navy)">${UI.esc(prodNombre)}</h3><div class="sp"></div><button class="lx" id="mv-x" style="font-size:20px">✕</button></div>
        <p class="muted" style="margin:0 0 12px;font-size:13px">Elegí la variante:</p>
        <table><thead><tr><th>Medida</th><th>Estructura</th><th>Frente</th><th style="text-align:right">Precio lista</th><th></th></tr></thead>
        <tbody>${vars.map((v, i) => `<tr><td class="tnum">${UI.esc(v.medida || '—')}</td><td>${UI.esc(v.estructura || '—')}</td><td>${UI.esc(v.frente || '—')}</td>
          <td style="text-align:right"><b class="tnum">${UI.pesos(v.precio)}</b></td><td style="text-align:right"><button class="btn sm primary" data-v="${i}">Elegir</button></td></tr>`).join('')}</tbody></table>`,
        m => {
          document.getElementById('mv-x').onclick = () => m.remove();
          m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { this.agregarEstandar(prodNombre, vars[Number(b.dataset.v)]); m.remove(); });
        }, 560);
    },
    modalCatalogo() {
      this.modal(`<div class="row" style="margin-bottom:12px"><h3 style="color:var(--navy)">Buscar: Producto</h3><div class="sp"></div><button class="lx" id="mc-x" style="font-size:20px">✕</button></div>
        <input id="mc-q" placeholder="Buscar por nombre…" autocomplete="off" style="margin-bottom:12px"><div id="mc-lista" style="overflow:auto">${UI.spinner()}</div>`,
        m => {
          document.getElementById('mc-x').onclick = () => m.remove();
          const pintar = async (texto) => {
            const c = document.getElementById('mc-lista'); c.innerHTML = UI.spinner();
            try {
              const prods = await global.DB.productos({ texto, limite: 80 });
              c.innerHTML = prods.length ? `<table><thead><tr><th>Producto</th><th style="text-align:right">Var.</th><th></th></tr></thead>
                <tbody>${prods.map(p => `<tr><td><b>${UI.esc(p.nombre)}</b> ${p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>'}</td>
                <td style="text-align:right" class="tnum">${p.variantes}</td><td style="text-align:right"><button class="btn sm primary" data-p="${p.id}">Elegir</button></td></tr>`).join('')}</tbody></table>` : UI.vacio('Sin resultados.');
              c.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { m.remove(); this.elegirProducto(Number(b.dataset.p), prods.find(p => p.id === Number(b.dataset.p))); });
            } catch (e) { c.innerHTML = `<div class="banner warn">${UI.esc(e.message || e)}</div>`; }
          };
          const q = document.getElementById('mc-q'); let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => pintar(q.value.trim()), 220); };
          pintar('');
        }, 720);
    },
  };

  function hoy() {
    try { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    catch { return ''; }
  }

  global.Presupuesto = Presupuesto;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>

          UI.aviso('Abrir cotización: próximo paso', 'info'));
      } catch (e) { cont.innerHTML = `<div class="banner warn">${UI.esc(e.message || e)}</div>`; }
    },
  };
  global.Cotizaciones = Cotizaciones;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================

// =====================================================================
(function (global) {
  const Ordenes = {
    texto: '',
    async render(mount = 'view') {
      const v = document.getElementById(mount);
      v.innerHTML = UI.head('Ventas', 'Órdenes de venta',
        'El estado sigue el ciclo real: confirmar → producción → logística → entregado.',
        `<button class="btn primary" id="ov-nueva">+ Nueva</button>`) +

</script><script>
// =====================================================================
//  Belgrano Soft · Detalle de Orden (centro de control)

// =====================================================================
(function (global) {
  const M = () => global.Motor;
  const EST_COM = {
    borrador: ['Borrador', 'soft'], a_confirmar: ['A confirmar', 'warn'],
    confirmada: ['Confirmada', 'ok'], cerrada: ['Cerrada', 'soft'], cancelada: ['Cancelada', 'crit'],
  };
  const HAB = { pendiente: ['Pendiente', 'soft'], bloqueada: ['Bloqueada', 'crit'], liberada: ['Liberada', 'ok'] };

  const Detalle = {
    _mount: 'view', _o: null, _ctx: null, _volver: null,

    render(mount = 'view', data, volver) {
      this._mount = mount;

      if (data) { this._o = data.o; this._ctx = data.ctx; }

    },

    pintar() {
      const o = this._o, ctx = this._ctx, m = M();

      const libres = o.lineas.filter(l => l.habilitacion === 'liberada').length;
      const bloq = o.lineas.filter(l => l.habilitacion === 'bloqueada').length;
      const pagado = m.pagosValidados(o), saldo = m.saldo(o);
      const objs = o.lineas.flatMap(l => l.objetosOperativos.map(x => ({ ...x, linea: l.id })));

      document.getElementById(this._mount).innerHTML = `
        <button class="btn sm" id="od-volver" style="margin-bottom:14px">← Órdenes</button>

              <b>${UI.esc(o.cliente.nombre || 'Cliente')}</b>

    bloqueLineas(o) {

        const faltan = condL.filter(c => !c.ok);
        return `<div class="lrow2">

          ${l.bloqueos.length ? `<div class="lr-bloq">⛔ ${l.bloqueos.map(b => bloqTexto(b)).join(' · ')}</div>` : ''}
          ${faltan.length && l.habilitacion !== 'liberada' ? `<div class="lr-acc">${accionesLinea(l, faltan)}</div>` : ''}

    if (claves.includes('obs')) btns.push(btn('verificar_obs', l.id, 'Verificar observación'));
    if (claves.includes('sena_fabricacion')) {
      const pend = false;
      btns.push(btn('registrar_pago', l.id, 'Registrar pago'));
      btns.push(btn('solicitar_autorizacion', l.id, 'Solicitar autorización'));
      btns.push(btn('autorizar_sena', l.id, 'Autorizar (Dirección)', true));

  function btn(accion, linea, txt, primary) {

    ]},
  };

  // Cada rol ve un subconjunto de módulos. Permisos finos: se afinan después.
  const ROLES = {
    direccion:      { label: 'Dirección',              tabs: ['dashboard', 'crm', 'ventas', 'catalogo', 'produccion', 'compras', 'inventario', 'logistica', 'tesoreria', 'reclamos', 'config'] },
    vendedor:       { label: 'Vendedor',               tabs: ['dashboard', 'ventas', 'crm', 'catalogo'] },
    administrativo: { label: 'Administrativo',         tabs: ['dashboard', 'ventas', 'tesoreria', 'compras', 'catalogo', 'reclamos'] },
    prod:           { label: 'Encargado de Producción', tabs: ['dashboard', 'produccion', 'inventario', 'compras', 'catalogo'] },
    logi:           { label: 'Logística',              tabs: ['dashboard', 'logistica', 'reclamos'] },
    gestion:        { label: 'Gestión de Cliente',     tabs: ['dashboard', 'crm', 'ventas'] },
  };

  const App = {
    rol: 'direccion',
    tab: null,
    _sub: {},   // recuerda la última sub-solapa por módulo

    async init() {
      this.montarShell();
      this.setRol(localStorage.getItem('bh_rol') || 'direccion');
    },

    montarShell() {
      document.body.innerHTML = `
        <div class="lay">
          <aside class="side" id="side">
            <div class="brandbox"><span class="logo">B</span><div><b>Belgrano Soft</b><span class="m">· demo</span></div></div>
            <nav id="nav"></nav>
            <div class="grow"></div>
            <div class="sect">Atajos</div>
            <nav style="padding:0 10px 14px">
              <button class="navi" data-atajo="orden"><span class="ic">＋</span>Nueva orden<span class="kbd">N</span></button>
              <button class="navi" data-atajo="cliente"><span class="ic">＋</span>Nuevo cliente<span class="kbd">C</span></button>
              <button class="navi" data-atajo="cobro"><span class="ic">＄</span>Cobro rápido<span class="kbd">R</span></button>
            </nav>
          </aside>
          <div class="main">
            <div class="tbar">
              <button class="ham" id="ham">☰</button>
              <div class="search"><span class="mag">🔍</span><input placeholder="Buscar órdenes, clientes, productos…"><span class="kbd">⌘K</span></div>
              <div class="sp"></div>
              <div class="verComo"><span class="muted">Ver como</span><select id="selRol"></select></div>
              <button class="ic-btn" title="Notificaciones">🔔<span class="dot">8</span></button>
              <div class="avatar" title="Brian · Dirección">BJ</div>
            </div>
            <main id="view"></main>
          </div>
        </div>`;

      const sel = document.getElementById('selRol');
      sel.innerHTML = Object.entries(ROLES).map(([k, r]) => `<option value="${k}">${UI.esc(r.label)}</option>`).join('');
      sel.onchange = () => this.setRol(sel.value);
      document.getElementById('ham').onclick = () => document.body.classList.toggle('sideopen');
      document.querySelectorAll('[data-atajo]').forEach(b => b.onclick = () => {
        const a = b.dataset.atajo;
        if (a === 'orden') this.goSub('ventas', 'nueva');
        else if (a === 'cliente') this.goSub('crm', 'clientes');
        else if (a === 'cobro') this.goSub('tesoreria', 'cobros');
      });
    },

    setRol(rol) {
      if (!ROLES[rol]) rol = 'direccion';
      this.rol = rol;
      localStorage.setItem('bh_rol', rol);
      document.getElementById('selRol').value = rol;
      const tabs = ROLES[rol].tabs;
      const nav = document.getElementById('nav');
      nav.innerHTML = tabs.map(t =>
        `<button class="navi" data-tab="${t}"><span class="ic">${MODULOS[t].icon}</span>${UI.esc(MODULOS[t].label)}</button>`).join('');
      nav.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => this.setTab(b.dataset.tab));
      this.setTab(tabs.includes(this.tab) ? this.tab : tabs[0]);
    },

    setTab(key) {
      this.tab = key;
      document.querySelectorAll('#nav [data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === key));
      document.body.classList.remove('sideopen');
      const mod = MODULOS[key];
      const view = document.getElementById('view');
      if (!mod) { view.innerHTML = UI.vacio('Módulo no encontrado.'); return; }
      if (mod.home || !mod.subs) { view.innerHTML = '<div id="mview"></div>'; mod.r('mview'); return; }

      const cur = this._sub[key] || mod.subs[0].k;
      view.innerHTML = `<div class="modlay">
        <aside class="subside"><div class="subttl">${UI.esc(mod.label)}</div>
          ${mod.subs.map(s => `<button class="subnavi" data-sub="${s.k}">${UI.esc(s.label)}</button>`).join('')}
        </aside><div class="modbody" id="mview"></div></div>`;
      view.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => this.goSub(key, b.dataset.sub));
      this._renderSub(key, cur);
    },

    _renderSub(key, subK) {
      const mod = MODULOS[key];
      const s = mod.subs.find(x => x.k === subK) || mod.subs[0];
      this._sub[key] = s.k;
      document.querySelectorAll('#view [data-sub]').forEach(b => b.setAttribute('aria-current', b.dataset.sub === s.k));
      const mv = document.getElementById('mview');
      if (mv) mv.innerHTML = '';
      s.r('mview');
    },

    // Navegar a un módulo y una sub-solapa concreta (para atajos y saltos entre módulos).
    goSub(key, subK) {
      if (this.tab !== key) { this._sub[key] = subK; this.setTab(key); }
      else this._renderSub(key, subK);
    },
  };

  global.App = App;
  if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', () => App.init());
})(typeof window !== 'undefined' ? window : globalThis);
