<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belgrano Soft</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Belgrano Soft · sistema visual común
   Navy/azul + estados con color. Un solo lugar para todos los módulos.
   ===================================================================== */
:root{
  --bg:#f4f6f8; --panel:#fff; --panel-2:#fafbfc; --ink:#0f1a2a; --ink-soft:#5b6675;
  --line:#d9e0e8; --line-soft:#eef1f5;
  --navy:#16324f; --brand:#1e5fce; --brand-soft:#e7eefb; --brand-ink:#1a51b0;
  --ok:#15803d; --ok-bg:#e6f4ea; --warn:#b45309; --warn-bg:#fff7e6;
  --crit:#b42318; --crit-bg:#fdecea; --muted:#8a94a3;
  --shadow:0 1px 2px rgba(15,26,42,.06),0 1px 3px rgba(15,26,42,.04);
  --r:10px;

  /* --- Escala de espaciado ---------------------------------------------
     Todos los márgenes y separaciones del sistema salen de acá, en saltos
     de 4. Si algo necesita un número que no está en la escala, casi siempre
     es que el bloque está mal armado. Alto antes que ancho: la pantalla se
     lee sin bajar, así que se ajusta el aire vertical, no el tamaño de la
     letra. --------------------------------------------------------------- */
  --s1:4px;    /* pegado: un ícono y su texto            */
  --s2:6px;    /* adentro de un control                  */
  --s3:9px;    /* entre campos de un mismo bloque        */
  --s4:13px;   /* aire adentro de una tarjeta            */
  --s5:18px;   /* entre bloques distintos                */
  --s6:26px;   /* entre secciones de la pantalla         */
  --pad:13px;  /* relleno estándar de tarjeta            */
  --gap:10px;  /* separación estándar de una grilla      */
  --page:16px; /* margen de la pantalla contra el borde  */
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d111b; --panel:#151b2a; --panel-2:#111726; --ink:#eaeef7; --ink-soft:#9aa6c0;
    --line:#26304a; --line-soft:#1e2740; --navy:#dbe3f4; --brand:#5b8dff;
    --brand-soft:#1a2540; --brand-ink:#9dbcff; --ok:#43c98d; --ok-bg:#13291f;
    --warn:#e0a53c; --warn-bg:#2c2413; --crit:#f0736f; --crit-bg:#2c1717; --muted:#7f8cab;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font-variant-numeric:tabular-nums;
  font-family:'Public Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; letter-spacing:-.01em}
button{font:inherit}
a{color:var(--brand)}

/* ===== Shell con navegación ARRIBA de dos niveles (estética referencia) ===== */
.appbar{background:var(--navy); color:#fff; height:52px; display:flex; align-items:center; gap:8px;
  padding:0 12px; position:sticky; top:0; z-index:30}
.appbar .logo{width:28px; height:28px; border-radius:6px; background:rgba(255,255,255,.14); display:flex;
  align-items:center; justify-content:center; font-weight:800; font-size:12px; flex:none}
.appbar .brand{font-weight:800; font-size:14px; flex:none; white-space:nowrap}
.appbar .mods{display:flex; gap:2px; margin-left:5px; overflow-x:auto; flex:1 1 auto; min-width:0; scrollbar-width:none}
.appbar .mods::-webkit-scrollbar{display:none}
.appbar .modpill{font:inherit; font-size:11.5px; font-weight:700; border:0; padding:5px 8px; border-radius:15px;
  cursor:pointer; white-space:nowrap; background:rgba(255,255,255,.08); color:rgba(255,255,255,.72)}
.appbar .modpill:hover{background:rgba(255,255,255,.2); color:#fff}
.appbar .modpill[aria-current="true"]{background:#fff; color:var(--navy)}
.appbar .sp{display:none}
.appbar .vercomo{display:flex; align-items:center; gap:6px; font-size:11px; color:rgba(255,255,255,.75); flex:none}
.appbar select{font:inherit; font-size:12px; padding:5px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.12); color:#fff; font-weight:700; width:auto}
.appbar select option{color:var(--ink)}
.appbar .ic-btn{position:relative; border:0; background:rgba(255,255,255,.1); width:30px; height:30px;
  border-radius:8px; cursor:pointer; font-size:14px; color:#fff; flex:none}
.appbar .ic-btn .dot{position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; border-radius:9px;
  background:var(--crit); color:#fff; font-size:10px; font-weight:800; display:grid; place-items:center; padding:0 3px}
.appbar .user{font-size:12.5px; text-align:right; line-height:1.15; flex:none}
.appbar .user b{display:block; font-size:12.5px} .appbar .user small{font-size:9.5px; opacity:.8; text-transform:uppercase; letter-spacing:.03em}
.appbar .avatar{width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.16); display:flex;
  align-items:center; justify-content:center; font-size:12px; font-weight:800; flex:none}
@media(max-width:1340px){ .appbar .brand,.appbar .vercomo span,.appbar .user{display:none} }
@media(max-width:1040px){ .appbar .avatar{display:none} }

.subbar{background:var(--panel); border-bottom:1px solid var(--line); padding:0 var(--page); display:flex; gap:2px;
  overflow-x:auto; position:sticky; top:54px; z-index:25}
.subbar:empty{display:none}
.subtab{font:inherit; padding:10px 14px; font-size:13px; font-weight:600; cursor:pointer; background:none; border:0;
  border-bottom:2px solid transparent; white-space:nowrap; color:var(--ink-soft)}
.subtab:hover{color:var(--navy)}
.subtab[aria-current="true"]{color:var(--navy); border-bottom-color:var(--brand)}
.subtab:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}

#view{padding:var(--s4) var(--page) 44px; max-width:1400px; width:100%; margin:0 auto}

/* Bits */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:var(--pad) 14px}
.row{display:flex; align-items:center; gap:var(--gap)}
.wrap-row{display:flex; flex-wrap:wrap; gap:var(--s3)}
.sp{flex:1}
.muted{color:var(--muted)}
.h-title{font-size:19px; font-weight:800; color:var(--navy)}
.h-sub{color:var(--ink-soft); margin-top:3px; font-size:13px}
.kick{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--brand); font-weight:700}

input,select,textarea{
  font:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--line);
  border-radius:8px; background:var(--panel); color:var(--ink); width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
label.fld{display:block}
label.fld .lbl{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px; font-weight:600}

.btn{
  font-weight:650; font-size:13px; padding:7px 13px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); transition:.15s;
}
.btn:hover{border-color:var(--brand); color:var(--brand)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{background:var(--brand-ink); color:#fff}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.sm{padding:5px 10px; font-size:12.5px}

.pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; display:inline-block}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.crit{background:var(--crit-bg); color:var(--crit)}
.pill.info{background:var(--brand-soft); color:var(--brand)}
.pill.soft{background:var(--line-soft); color:var(--ink-soft)}

table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:8px 11px; border-bottom:1px solid var(--line)}
td{padding:8px 11px; border-bottom:1px solid var(--line-soft)}
tr:hover td{background:var(--panel-2)}

.empty{text-align:center; padding:30px 20px; color:var(--muted)}
.spin{display:inline-block; width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation:none} }

.banner{padding:9px 12px; border-radius:8px; font-size:12.5px; margin-bottom:var(--s4)}
.banner.warn{background:var(--warn-bg); color:var(--warn)}
.banner.info{background:var(--brand-soft); color:var(--brand-ink)}

/* ===== Sub-navegación de módulo (segundo nivel) ===== */
.modlay{display:grid; grid-template-columns:194px 1fr; gap:var(--s5); align-items:start}
.subside{position:sticky; top:78px; display:flex; flex-direction:column; gap:2px}
.subside .subttl{font-size:15.5px; font-weight:800; color:var(--navy); padding:2px 11px 8px; letter-spacing:-.01em}
.subnavi{display:flex; align-items:center; gap:9px; padding:6px 11px; border-radius:8px; color:var(--ink-soft);
  font-weight:600; font-size:13px; cursor:pointer; border:0; background:transparent; text-align:left; width:100%}
.subnavi:hover{background:var(--panel); color:var(--brand)}
.subnavi[aria-current="true"]{background:var(--panel); color:var(--brand-ink); box-shadow:var(--shadow); font-weight:700}
.subnavi .tag{margin-left:auto}
.modbody{min-width:0}
@media(max-width:820px){
  .modlay{grid-template-columns:1fr}
  .subside{position:static; flex-direction:row; overflow-x:auto; gap:4px; padding-bottom:8px; border-bottom:1px solid var(--line)}
  .subside .subttl{display:none}
  .subnavi{white-space:nowrap; width:auto}
}

/* ===== Componentes de dashboard ===== */
.greet{font-size:21px; font-weight:800; color:var(--navy); letter-spacing:-.02em}
.greet-sub{color:var(--ink-soft); margin-top:2px}
.alerts{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:var(--s3); margin:var(--s4) 0}
.alert{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); box-shadow:var(--shadow); cursor:pointer; border-left-width:4px}
.alert:hover{transform:translateY(-1px); transition:.15s}
.alert.crit{border-left-color:var(--crit)} .alert.warn{border-left-color:var(--warn)}
.alert.ok{border-left-color:var(--ok)} .alert.info{border-left-color:var(--brand)}
.alert .em{font-size:16px} .alert b{display:block; color:var(--navy); font-size:13px} .alert span{font-size:12px; color:var(--muted)}
.alert .rt{margin-left:auto; font-size:12px; font-weight:700}
.alert.crit .rt{color:var(--crit)} .alert.warn .rt{color:var(--warn)}

.kpis{display:grid; grid-template-columns:repeat(6,1fr); gap:var(--gap)}
@media(max-width:1150px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:var(--pad); box-shadow:var(--shadow)}
.kpi .top{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; font-weight:600}
.kpi .top .em{width:24px; height:24px; border-radius:7px; display:grid; place-items:center; font-size:13px}
.kpi .val{font-size:20px; font-weight:800; color:var(--navy); margin-top:6px; letter-spacing:-.02em}
.kpi .foot{font-size:12px; color:var(--muted); margin-top:3px}
.kpi .foot .up{color:var(--ok); font-weight:700} .kpi .foot .down{color:var(--crit); font-weight:700}
.kpi .obj{height:5px; background:var(--panel-2); border-radius:3px; margin-top:7px; overflow:hidden}
.kpi .obj span{display:block; height:100%; background:var(--brand); border-radius:3px}

.pipe{display:flex; gap:6px; align-items:stretch; overflow-x:auto; padding-bottom:4px}
.pstep{flex:1; min-width:112px; border:1px solid var(--line); border-radius:10px; padding:9px 9px; text-align:center; background:var(--panel-2)}
.pstep .pl{font-size:12px; font-weight:700; color:var(--ink-soft)}
.pstep .pn{font-size:20px; font-weight:800; color:var(--navy); margin:2px 0} .pstep .pm{font-size:11px; color:var(--muted)}
.pstep.hot{border-color:var(--brand); background:var(--brand-soft)}
.pipe .arr{align-self:center; color:var(--muted); font-size:14px; flex:none}

.embudo{display:flex; flex-direction:column; gap:7px}
.erow{display:flex; align-items:center; gap:10px}
.erow .en{width:104px; font-size:13px; color:var(--ink-soft)}
.erow .eb{flex:1; height:17px; background:var(--panel-2); border-radius:6px; overflow:hidden}
.erow .eb span{display:block; height:100%; background:var(--brand); border-radius:6px}
.erow .ev{width:96px; text-align:right; font-size:13px} .erow .ev b{color:var(--navy)} .erow .ev small{color:var(--muted)}

.tl{display:flex; flex-direction:column}
.tl .ev{display:flex; gap:10px; padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:13px}
.tl .ev:last-child{border-bottom:0} .tl .ev .h{color:var(--muted); min-width:46px; font-size:12px} .tl .ev .d{width:8px; height:8px; border-radius:50%; margin-top:5px; flex:none}
/* align-items:start, si no la tarjeta más corta se estira al alto de la más
   larga y deja un hueco enorme adentro. */
.cols3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--gap); align-items:start} @media(max-width:980px){.cols3{grid-template-columns:1fr}}
.pcard{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:var(--pad) 14px}
.pcard h3{margin:0 0 10px; color:var(--navy); font-size:14px}
.pcard .more{display:inline-block; margin-top:8px; font-size:12.5px; color:var(--brand); cursor:pointer; font-weight:600}

</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =====================================================================
//  Belgrano Soft · capa de datos
//  Una sola puerta a Supabase. Si no hay conexión configurada, la app
//  igual arranca en modo DEMO con unos productos de ejemplo, así se puede
//  ver la interfaz antes de conectar la base.
// =====================================================================
(function (global) {
  const CFG_KEY = 'bh_supabase_cfg';

  // La URL del proyecto Belgrano Soft ya la sabemos; la anon key es pública
  // (va en el frontend) pero la carga la persona la primera vez, para no
  // dejarla escrita en el repo.
  const DEFAULT_URL = 'https://qwbdhpevgirsmfxqlgtg.supabase.co';

  // Saca tildes y pasa a minúscula: "CÓMODA" → "comoda". Así la búsqueda
  // reconoce todo aunque la persona no ponga el acento.
  function sinTilde(s) {
    return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }

  // Clave estable a partir del nombre ("Vicente López" → "vicente_lopez").
  function slug(s) {
    return sinTilde(s).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  }

  // Distancia de edición: cuántas letras hay que cambiar para pasar de una
  // palabra a la otra. Sirve para cazar los errores de tipeo al cargar valores.
  function distancia(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m || !n) return m || n;
    let fila = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      let ant = fila[0]; fila[0] = i;
      for (let j = 1; j <= n; j++) {
        const tmp = fila[j];
        fila[j] = Math.min(fila[j] + 1, fila[j - 1] + 1, ant + (a[i - 1] === b[j - 1] ? 0 : 1));
        ant = tmp;
      }
    }
    return fila[n];
  }

  function cfg() {
    try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; }
    catch { return {}; }
  }
  function guardarCfg(url, key) {
    localStorage.setItem(CFG_KEY, JSON.stringify({ url: url || DEFAULT_URL, key }));
  }
  function hayConexion() { return !!cfg().key && !!global.supabase; }

  let _cli = null;
  function cliente() {
    if (_cli) return _cli;
    const c = cfg();
    if (!c.key || !global.supabase) return null;
    // El catálogo vive en el esquema core.
    _cli = global.supabase.createClient(c.url || DEFAULT_URL, c.key, {
      db: { schema: 'core' },
    });
    return _cli;
  }

  // Genera el combinatorio de variantes de un mueble (medida × estructura ×
  // frente) con un precio que crece con la medida. Es sólo para el demo: en
  // producción cada variante viene de la tabla `variante` con su precio real.
  // Se usa para que el armador por botones tenga con qué jugar (un mueble
  // puede tener 15+ variantes y no se muestran todos los precios juntos).
  let _vid = 100;
  function combinar(productoId, medidas, estructuras, frentes, base, paso) {
    const out = [];
    medidas.forEach((medida, i) => estructuras.forEach(estructura => frentes.forEach(frente => {
      const precio = base + paso * i;
      // El costo del demo sale de un markup que varía un poco por combinación,
      // para que se vean las tres bandas del semáforo y no todo verde.
      const mk = 1.45 + ((_vid % 7) * 0.13);
      out.push({
        id: ++_vid, producto_id: productoId, medida, estructura, frente,
        precio, atributos: { medida, estructura, frente },
        costo: Math.round(precio / mk),
        // Medida de costeo: a veces el proveedor no pasa la del mueble que
        // vendemos (el chiffonier de 0,90 se costea con el de 1,00).
        medidaCosteo: medida,
        markupObj: null,     // null = hereda el del mueble
        stock: 0, activa: true, mostrar: true,
        peso: 35, alto: 0, prof: 0,
        imgVenta: '', imgProd: '',
        minStock: 0, reponer: 'pedido',   // pedido | minimo
      });
    })));
    return out;
  }

  // ---- Diccionario de propiedades y valores ----------------------------
  // Las propiedades (ESTRUCTURA, FRENTE, MEDIDAS…) y sus valores son ÚNICOS
  // para todo el catálogo: si cada mueble escribiera los suyos, un error de
  // tipeo crearía "ESTRUCTURA BLANCA" y "ESTRUTURA BLANCA" como dos cosas
  // distintas. Sólo Dirección da de alta valores nuevos acá; lo que carga un
  // vendedor en un mueble a medida queda pegado a esa boleta y NO entra.
  const PROP_KEY = 'bh_propiedades';
  const PROPS_BASE = [
    { k: 'estructura', nombre: 'ESTRUCTURA', valores: ['ESTRUCTURA BLANCA', 'ESTRUCTURA NEGRA', 'ESTRUCTURA PARAÍSO', 'ESTRUCTURA NATURAL'] },
    { k: 'frente', nombre: 'FRENTE', valores: ['FRENTE BLANCO', 'FRENTE NEGRO', 'FRENTE PARAÍSO', 'FRENTE NOGAL'] },
    { k: 'medida', nombre: 'MEDIDAS DEL FRENTE', valores: ['0,50', '0,70', '0,80', '0,90', '1,00', '1,20', '1,40', '1,60', '1,80', '2,00', '2,20'] },
    { k: 'terminacion', nombre: 'TERMINACIÓN', valores: ['Laqueado', 'Melamina', 'Enchapado'] },
  ];

  // Plano de producción de ejemplo: la hoja que se le manda a fábrica, con el
  // material, la cantidad, el código y el despiece acotado. Es una
  // RECONSTRUCCIÓN del formato que ya usan, para ver cómo se ve cargada la
  // imagen de producción; el archivo real lo sube cada uno.
  function planoDemo(material, codigo, oscuro) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Georgia,serif">
      <rect width="700" height="460" fill="#fff"/>
      <g stroke="#000" fill="none" stroke-width="1.2">
        <rect x="8" y="8" width="684" height="444"/>
        <line x1="8" y1="48" x2="540" y2="48"/><line x1="130" y1="8" x2="130" y2="48"/>
        <line x1="330" y1="8" x2="330" y2="48"/><line x1="430" y1="8" x2="430" y2="48"/>
        <line x1="540" y1="8" x2="540" y2="452"/>
        <line x1="540" y1="60" x2="692" y2="60"/><line x1="540" y1="112" x2="692" y2="112"/>
        <line x1="540" y1="152" x2="692" y2="152"/><line x1="540" y1="204" x2="692" y2="204"/>
        <line x1="540" y1="244" x2="692" y2="244"/><line x1="540" y1="296" x2="692" y2="296"/>
        <line x1="540" y1="348" x2="692" y2="348"/><line x1="540" y1="380" x2="692" y2="380"/>
        <line x1="540" y1="412" x2="692" y2="412"/>
        <line x1="8" y1="330" x2="130" y2="330"/><line x1="130" y1="330" x2="130" y2="452"/>
        <line x1="8" y1="360" x2="130" y2="360"/><line x1="8" y1="390" x2="130" y2="390"/>
        <line x1="8" y1="421" x2="130" y2="421"/>
      </g>
      <g font-size="15" fill="#000">
        <text x="18" y="33">MATERIAL</text><text x="142" y="33" font-weight="bold">${material}</text>

    propiedades() {

      // Las de fábrica siempre están; lo guardado suma valores y propiedades nuevas.
      const mapa = new Map(PROPS_BASE.map(p => [p.k, { ...p, valores: [...p.valores] }]));

    // Da de alta un valor nuevo en el diccionario. Devuelve el valor tal como
    // quedó guardado: si ya existía uno igual (sin importar tildes ni
    // mayúsculas) devuelve ESE, para no duplicar por un error de tipeo.
    agregarValor(k, valor) {
      const v = String(valor || '').trim();
      if (!v) return null;
      const props = this.propiedades();
      const p = props.find(x => x.k === k);
      if (!p) return null;
      const ya = p.valores.find(x => sinTilde(x) === sinTilde(v));
      if (ya) return ya;
      p.valores.push(v);
      this.guardarPropiedades(props);
      return v;
    },
    // Un valor escrito con un error de tipeo ("ESTRUTURA BLANCA") no es igual a
    // ninguno, así que se colaría como valor nuevo. Antes de dar el alta se
    // busca el más parecido y se pregunta: es el caso que más ensucia el
    // catálogo, porque después hay dos valores donde tendría que haber uno.
    parecidoA(k, valor) {
      const v = sinTilde(valor);
      if (!v) return null;
      const p = this.propiedad(k); if (!p) return null;
      let mejor = null, mejorD = Infinity;
      p.valores.forEach(x => {
        const d = distancia(sinTilde(x), v);
        if (d < mejorD) { mejorD = d; mejor = x; }
      });
      // Hasta dos letras de diferencia (y nunca más del 25% de la palabra).
      const tope = Math.min(2, Math.floor(v.length * 0.25));
      return mejorD > 0 && mejorD <= Math.max(1, tope) ? mejor : null;
    },

      props.push(nueva);
      this.guardarPropiedades(props);
      return nueva;

    // Productos: por categoría (tipo de mueble) o por texto libre.
    async productos({ texto = '', categoriaId = null, limite = 200 } = {}) {
      if (!hayConexion()) {
        const t = sinTilde(texto);
        let ps = DEMO.productos.filter(p =>
          (!t || sinTilde(p.nombre).includes(t)) &&
          (categoriaId == null || p.categoria_id === categoriaId));
        return ps.map(p => {
          const vs = DEMO.variantes.filter(v => v.producto_id === p.id);

          // La grilla muestra "desde": el vendedor necesita el piso de precio

          return { ...p, variantes: vs.length, desde: pr.length ? Math.min(...pr) : 0, hasta: pr.length ? Math.max(...pr) : 0 };
        });
      }
      let q = cliente().from('producto')
        .select('id,categoria_id,nombre,publicado_tn,variante(count)')
        .eq('activo', true).order('nombre').limit(limite);
      // Búsqueda sin tildes: se compara contra nombre_norm (columna generada,
      // ver migración busqueda_sin_tilde.sql). Así "comoda" encuentra "CÓMODA".
      if (texto) q = q.ilike('nombre_norm', `%${sinTilde(texto)}%`);
      if (categoriaId != null) q = q.eq('categoria_id', categoriaId);
      const { data, error } = await q;
      if (error) throw error;
      return (data || []).map(p => ({ ...p, variantes: p.variante?.[0]?.count ?? 0 }));

    unidades(productoId) {
      const vs = DEMO.variantes.filter(v => v.producto_id === Number(productoId));
      const out = [];
      let n = 0;
      vs.forEach(v => {
        const hay = Math.max(0, Number(v.stock) || 0);
        for (let i = 0; i < hay; i++) {
          n++;
          out.push({
            serie: `${v.sku || 'SKU'}-${String(n).padStart(3, '0')}`,
            barras: `779${String(v.id).padStart(4, '0')}${String(n).padStart(6, '0')}`,
            varianteId: v.id, estado: 'stock', desde: '12/07',

      vs.slice(0, 2).forEach((v, i) => {

    composicion(prod, v) {

    guardarPlanilla(nombre, cols, k) {

      try { guardadas = JSON.parse(localStorage.getItem(this.PLAN_KEY)) || []; } catch {}

      const reg = { k: clave, nombre: n, cols: JSON.parse(JSON.stringify(cols || [])) };

      // Las de fábrica no se borran de verdad: se ocultan guardándolas vacías.
      if (this.PLAN_BASE.some(x => x.k === k)) guardadas.push({ k, nombre: '', cols: [], oculta: true });

    // La ficha de un mueble: el producto con su categoría y su rango de precios.
    async producto(id) {
      const n = Number(id);
      if (!hayConexion()) {
        const p0 = DEMO.productos.find(x => x.id === n);
        if (!p0) return null;
        const p = this._defProd(p0);
        const vs = DEMO.variantes.filter(v => v.producto_id === n).map(v => v.precio);
        const cat = DEMO.categorias.find(c => c.id === p.categoria_id) || null;
        const padre = cat && cat.padre_id ? DEMO.categorias.find(c => c.id === cat.padre_id) : null;
        return { ...p, categoria: cat, ambiente: padre, variantes: vs.length,
          desde: vs.length ? Math.min(...vs) : 0, hasta: vs.length ? Math.max(...vs) : 0 };
      }
      const { data, error } = await cliente().from('producto')
        .select('id,categoria_id,nombre,publicado_tn,sku,desc,alto,prof,materiales,dias,categoria(id,nombre,padre_id)')
        .eq('id', n).single();
      if (error) throw error;
      const vs = (await this.variantes(n)).map(v => v.precio);
      return { ...data, ambiente: null, variantes: vs.length,
        desde: vs.length ? Math.min(...vs) : 0, hasta: vs.length ? Math.max(...vs) : 0 };

        .eq('producto_id', productoId).eq('activo', true)
        .order('medida').order('estructura').order('frente');
      if (error) throw error;
      return data || [];
    },

      if (!hayConexion()) return { productos: DEMO.productos.length, variantes: DEMO.variantes.length };
      const p = await cliente().from('producto').select('*', { count: 'exact', head: true }).eq('activo', true);
      const v = await cliente().from('variante').select('*', { count: 'exact', head: true }).eq('activo', true);

    // Órdenes de venta con situación operativa + conteo por balde (tarjetas).
    async ordenesVenta({ texto = '', bucket = '' } = {}) {
      const t = sinTilde(texto);
      const activas = DEMO.ordenes.filter(o => (SITUACION_ORDEN[o.situacion] || {}).activa);
      const conteos = { '': activas.length };
      BUCKETS_ORDEN.forEach(b => { if (b.k) conteos[b.k] = activas.filter(o => (SITUACION_ORDEN[o.situacion] || {}).bucket === b.k).length; });
      const filas = activas.filter(o =>
        (!t || sinTilde(o.cliente).includes(t) || sinTilde(o.numero).includes(t)) &&
        (!bucket || (SITUACION_ORDEN[o.situacion] || {}).bucket === bucket));
      return { conteos, filas };
    },
    _orden(id) { return DEMO.ordenes.find(o => String(o.id) === String(id)); },

    // Transferencias declaradas que todavía no se acreditaron en el banco.
    async transferenciasPendientes() {
      const out = [];
      DEMO.ordenes.forEach(o => (o.cobros || []).forEach(c => {
        if (c.estado === 'pendiente_banco') out.push({ orden: o, cobro: c });
      }));
      return out;
    },

    // Recalcula seña/saldo de una orden: SOLO cuenta lo cobrado de verdad
    // (efectivo rendido + transferencia acreditada en banco).
    _recalc(o) {
      o.sena = (o.cobros || []).filter(c => c.estado === 'rendido' || c.estado === 'confirmado')
        .reduce((a, c) => a + (c.metodo === 'transferencia' ? (c.montoConfirmado ?? c.m) : c.m), 0);
      o.saldo = Math.max(0, (o.total || 0) - o.sena);
      return o;
    },
    // Registra una seña. Efectivo → rendido (cobrado). Transferencia →
    // pendiente_banco hasta que se acredite. Devuelve el cobro creado.
    registrarSena(ordenId, { metodo, monto, recibidoPor, depositante = '', referencia = '', fecha = 'hoy' }) {
      const o = this._orden(ordenId); if (!o) throw new Error('Orden no encontrada');
      const c = { id: 'c' + Date.now().toString(36), f: fecha, m: Math.round(Number(monto) || 0), metodo, recibidoPor };
      if (metodo === 'transferencia') { c.depositante = depositante; c.referencia = referencia; c.estado = 'pendiente_banco'; }
      else { c.estado = 'rendido'; }
      (o.cobros = o.cobros || []).push(c);
      this._recalc(o);
      return c;
    },
    // ¿Ya existe ese Nº de comprobante en cualquier orden? (evita duplicar pagos).
    comprobanteExiste(nro, exceptId) {
      const n = String(nro || '').trim().toLowerCase(); if (!n) return false;
      return DEMO.ordenes.some(o => (o.cobros || []).some(c => c.id !== exceptId && String(c.comprobante || '').trim().toLowerCase() === n));
    },
    // Confirmación bancaria (Administración/Dirección): vincula el pago al banco
    // con CUIT + Nº de comprobante + monto acreditado. Rechaza comprobante repetido.
    confirmarSenaBanco(ordenId, cobroId, { cuit, comprobante, montoConfirmado, confirmadoPor }) {
      const o = this._orden(ordenId); if (!o) throw new Error('Orden no encontrada');
      const c = (o.cobros || []).find(x => x.id === cobroId); if (!c) throw new Error('Cobro no encontrado');
      if (this.comprobanteExiste(comprobante, cobroId)) throw new Error('Ese N° de comprobante ya está cargado en otra seña. No se duplica.');
      c.cuit = String(cuit || '').trim();
      c.comprobante = String(comprobante || '').trim();
      c.montoConfirmado = Math.round(Number(montoConfirmado) || 0);
      c.confirmadoPor = confirmadoPor || 'Administración';
      c.estado = 'confirmado';
      this._recalc(o);
      return c;
    },

      l.objetosOperativos.push(obj); ctx.registry.set(key, obj);
      ctx.emit('objetoOperativo.creado', { linea: l.id, tipoObjeto: ef });
    }
    l.cumplimiento = cumplimientoDe(efectos);
  }
  function registrarCobro(o, cobro, ctx) { o.cobros.push(cobro); ctx.emit('cobro.registrado', { monto: cobro.monto, estado: cobro.estado }); evaluar(o, ctx, 'cobro.registrado'); }
  function solicitarExcepcion(o, regla, d, ctx) { o.solicitudes.push({ regla, ...d, estado: 'pendiente', responsable: 'Dirección', fecha: ahora() }); ctx.emit('autorizacion.requerida', { regla, ...d, responsable: 'Dirección' }); }
  function autorizarExcepcion(o, regla, d, ctx) {
    const sol = o.solicitudes.find(s => s.regla === regla && s.estado === 'pendiente'); if (sol) sol.estado = 'aprobada';
    const sv = regla === 'sena_fabricacion' ? senaVal(o) : {};
    o.excepciones.push({ regla, esperado: sv.esperado, valorReal: sv.valor, autorizadaPor: d.autorizadaPor, motivo: sol?.motivo, fecha: ahora() });
    ctx.emit('excepcion.autorizada', { regla, autorizadaPor: d.autorizadaPor }); evaluar(o, ctx, 'excepcion.autorizada');
  }

  function mkLinea(x) { return { habilitacion: 'pendiente', cumplimiento: 'sin_iniciar', bloqueos: [], objetosOperativos: [], ...x }; }
  function mkOrden(x) { return { estadoComercial: 'borrador', version: 1, cobros: [], bloqueos: [], excepciones: [], solicitudes: [], ...x }; }

  // Orden demo tipo OV-2048 (mezcla: reservada · en producción · bloqueada).
  function ordenDemo() {
    const o = mkOrden({ id: 'OV-2020-2048', total: 1200000, termino: 'efectivo', vendedor: 'Ale', local: '2020', canal: 'Instagram', cotizacionAceptada: true,
      cliente: { nombre: 'Laura Pérez', tel: '11 5555-2048', ig: '@lau.perez', dir: 'Av. Cabildo 2450' }, lineas: [
      mkLinea({ id: 'L1', tipo: 'estándar', producto: 'Cómoda Amberes 1.20', destinoPreliminar: 'stock', estrategia: 'stock', precio: 425750 }),
      mkLinea({ id: 'L2', tipo: 'a fabricar', producto: 'Mesa Noruega', destinoPreliminar: 'fabrica', estrategia: 'fabricacion_interna', requiereMedida: true, medidaConfirmada: true, precio: 380000 }),
      mkLinea({ id: 'L3', tipo: 'a medida', producto: 'Placard Oliver a medida', destinoPreliminar: 'fabrica', estrategia: 'fabricacion_interna', requiereAutorizacion: true, precioAutorizado: false, tieneObs: true, obsVerificada: false, precio: 394250 }),
    ] });
    const ctx = nuevoCtx();
    registrarCobro(o, { monto: 360000, estado: 'validado' }, ctx); // 30%
    return { o, ctx };
  }

  // Motivo legible por condición faltante (para la cola "A confirmar").
  const MOTIVO = {
    sena_fabricacion: 'Esperando seña para fabricar',
    precio: 'Esperando autorización de precio',
    obs: 'Esperando verificación de observaciones',
    medida: 'Falta confirmar la medida',
    destino: 'Falta definir el destino',
    mods: 'Modificación pendiente',
  };

  // Deriva los "pendientes" de una orden: qué falta, quién resuelve, qué acciones.
  function pendientesDe(o) {
    const items = [];
    if (o.estadoComercial === 'a_confirmar' || o.estadoComercial === 'borrador') {
      const falta = evalChecks(COND_ORDEN, o, null, 'orden', 'ui', o).filter(c => !c.ok);
      if (falta.length) items.push({
        nivel: 'orden', ordenId: o.id, cliente: o.cliente, desde: o._desde,
        motivo: 'Orden a confirmar: ' + falta.map(c => c.label).join(', '),
        responsable: falta[0].resp, acciones: ['ver_detalle'], o,
      });
    }
    for (const l of o.lineas) {
      if (l.habilitacion === 'bloqueada' && l.bloqueos.length) {
        const b = l.bloqueos.find(x => x.acciones) || l.bloqueos[0];
        const acciones = b.acciones ? b.acciones.slice()
          : b.clave === 'precio' ? ['autorizar_precio']
          : b.clave === 'obs' ? ['verificar_obs'] : ['ver_detalle'];
        items.push({
          nivel: 'linea', ordenId: o.id, cliente: o.cliente, producto: l.producto, lineaId: l.id,
          desde: o._desde, motivo: b.motivo || MOTIVO[b.clave] || b.clave,
          responsable: b.resp, acciones, o,
        });
      }
    }
    return items;
  }

  function mk(id, desde, extra, lineas) {
    const o = mkOrden({ id, total: extra.total || 800000, termino: 'efectivo', vendedor: extra.vendedor || 'Ale', local: '2020',
      cotizacionAceptada: extra.aceptada !== false, cliente: extra.cliente, lineas, _desde: desde });
    const ctx = nuevoCtx();
    if (extra.cobro) registrarCobro(o, { monto: extra.cobro, estado: 'validado' }, ctx); else evaluar(o, ctx, 'init');
    return { o, ctx };
  }

  // Cola demo: varias órdenes en distintos estados de pendiente.
  function colaDemo() {
    return [
      // Placard a medida esperando autorización de precio
      mk('OV-2020-2048', 'hace 2 días', { total: 1200000, cobro: 360000, cliente: { nombre: 'Laura Pérez', tel: '11 5555-2048', ig: '@lau.perez', dir: 'Av. Cabildo 2450' } }, [
        mkLinea({ id: 'L1', tipo: 'estándar', producto: 'Cómoda Amberes', destinoPreliminar: 'stock', estrategia: 'stock' }),
        mkLinea({ id: 'L2', tipo: 'a fabricar', producto: 'Mesa Noruega', destinoPreliminar: 'fabrica', estrategia: 'fabricacion_interna' }),
        mkLinea({ id: 'L3', tipo: 'a medida', producto: 'Placard Oliver a medida', destinoPreliminar: 'fabrica', estrategia: 'fabricacion_interna', requiereAutorizacion: true, precioAutorizado: false }),
      ]),
      // Vajillero a fabricar esperando seña
      mk('OV-2020-2049', 'hace 1 día', { total: 700000, cobro: 0, vendedor: 'Cristian', cliente: { nombre: 'Juan López', tel: '11 5555-2049' } }, [
        mkLinea({ id: 'L1', tipo: 'a fabricar', producto: 'Vajillero Nórdico', destinoPreliminar: 'fabrica', estrategia: 'fabricacion_interna' }),
      ]),
      // Orden a confirmar: falta aceptar la cotización
      mk('OV-2020-2050', 'hace 3 horas', { total: 500000, cobro: 0, vendedor: 'Nati', aceptada: false, cliente: { nombre: 'Camila Ruiz', ig: '@cami.ruiz' } }, [
        mkLinea({ id: 'L1', tipo: 'estándar', producto: 'Respaldo Milán', destinoPreliminar: 'stock', estrategia: 'stock' }),
      ]),
    ];
  }

  global.Motor = {
    COND_ORDEN, COND_LINEA, ETIQUETA_EFECTO, MOTIVO, senaVal, saldo, pagosValidados, requiereFabricacion,
    nuevoCtx, evaluar, evalChecks, registrarCobro, solicitarExcepcion, autorizarExcepcion,
    ordenDemo, colaDemo, pendientesDe,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================
//  Belgrano Soft · Catálogo
//  Navegación como en Tienda Nube: ambiente → tipo de mueble → modelo →
//  variantes. O búsqueda directa por texto. Es el cimiento del presupuesto.
// =====================================================================
(function (global) {
  const VISTA_KEY = 'bh_catalogo_vista';
  const Catalogo = {
    arbol: [],           // categorías cargadas
    ruta: [],            // breadcrumb: [{id,nombre}] hasta la categoría actual
    texto: '',           // búsqueda libre
    vista: (() => { try { return localStorage.getItem(VISTA_KEY) || 'bloques'; } catch { return 'bloques'; } })(),
    _prods: null,        // últimos productos pintados (para re-render al cambiar de vista)

    async render(mount = 'view') {
      this._mount = mount;
      const v = document.getElementById(mount);
      v.innerHTML = `
        <div class="row" style="margin-bottom:16px">
          <div>
            <div class="kick">Catálogo</div>
            <h1 class="h-title">Productos</h1>
            <div class="h-sub" id="cat-sub"></div>
          </div>
          <div class="sp"></div>
          <label class="fld" style="width:260px">
            <span class="lbl">Buscar en todo el catálogo</span>
            <input id="cat-q" placeholder="Amberes, oliver, mesa…" value="${UI.esc(this.texto)}">
          </label>
          <div class="vista-tog" role="group" aria-label="Formato de vista" style="align-self:flex-end">
            <button id="v-bloques" title="Bloques" aria-label="Bloques">▦</button>
            <button id="v-lista"   title="Listado" aria-label="Listado">☰</button>
          </div>
        </div>
        <div id="cat-crumb"></div>
        <div id="cat-lista">${UI.spinner()}</div>
        <style>
          .vista-tog{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
          .vista-tog button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-size:16px;color:var(--muted);line-height:1}
          .vista-tog button+button{border-left:1px solid var(--line)}
          .vista-tog button.on{background:var(--brand-soft);color:var(--brand-ink)}
        </style>`;
      this.pintarTog();
      document.getElementById('v-bloques').onclick = () => this.setVista('bloques');
      document.getElementById('v-lista').onclick   = () => this.setVista('lista');

      if (global.DB.modo() === 'demo') {
        v.insertAdjacentHTML('afterbegin',
          `<div class="banner info">Modo demo — árbol y productos de ejemplo.
           <a href="#" id="cat-conectar">Conectar Belgrano Soft</a> para ver el catálogo real.</div>`);
        document.getElementById('cat-conectar').onclick = e => { e.preventDefault(); this.modalConexion(); };
      }

      const q = document.getElementById('cat-q');
      let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => {
        this.texto = q.value.trim();
        if (this.texto) this.buscar(); else { this.ruta = []; this.pintar(); }
      }, 250); };

      try {
        this.arbol = await global.DB.arbolCategorias();
        const tot = await global.DB.totales().catch(() => null);
        const sub = document.getElementById('cat-sub');
        if (sub && tot) sub.textContent = `${tot.productos.toLocaleString('es-AR')} productos · ${tot.variantes.toLocaleString('es-AR')} variantes`;
      } catch (e) { /* seguimos con lo que haya */ }
      this.pintar();
    },

    // Hijos de una categoría (o las raíces si padre es null).
    hijos(padreId) {
      return this.arbol.filter(c => (c.padre_id ?? null) === (padreId ?? null))
        .sort((a, b) => a.nombre.localeCompare(b.nombre));
    },

    crumb() {
      const c = document.getElementById('cat-crumb');
      if (!c) return;
      const items = [{ id: null, nombre: 'Todo' }, ...this.ruta];
      c.innerHTML = `<div class="wrap-row" style="margin-bottom:14px;align-items:center">` +
        items.map((it, i) => {
          const last = i === items.length - 1;
          return `<span>${last
            ? `<b style="color:var(--navy)">${UI.esc(it.nombre)}</b>`
            : `<a href="#" data-crumb="${i}">${UI.esc(it.nombre)}</a>`}</span>` +
            (last ? '' : '<span class="muted">›</span>');
        }).join('') + `</div>`;
      c.querySelectorAll('[data-crumb]').forEach(a =>
        a.onclick = e => { e.preventDefault(); this.ruta = this.ruta.slice(0, Number(a.dataset.crumb)); this.pintar(); });
    },

    async pintar() {
      this.crumb();
      const cont = document.getElementById('cat-lista');
      const actual = this.ruta.length ? this.ruta[this.ruta.length - 1].id : null;
      const subcats = this.hijos(actual);

      // Si la categoría actual tiene subcategorías, mostramos el árbol.
      if (subcats.length) {
        cont.innerHTML = `<div class="grid-cats">${subcats.map(c =>
          `<button class="cat-tile" data-cat="${c.id}">
             <span class="cat-n">${UI.esc(c.nombre)}</span>
             <span class="cat-go">›</span>
           </button>`).join('')}</div>
          <style>
            .grid-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
            .cat-tile{display:flex;align-items:center;gap:10px;padding:16px;border:1px solid var(--line);
              border-radius:12px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:.15s}
            .cat-tile:hover{border-color:var(--brand);transform:translateY(-1px)}
            .cat-n{font-weight:650;color:var(--navy);flex:1}
            .cat-go{color:var(--muted);font-size:18px}
          </style>`;
        cont.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
          const c = this.arbol.find(x => x.id === Number(b.dataset.cat));
          this.ruta.push({ id: c.id, nombre: c.nombre }); this.pintar();
        });
        return;
      }

      // Es una hoja (tipo de mueble): mostramos sus productos.
      cont.innerHTML = UI.spinner();
      try {
        this._prods = await global.DB.productos({ categoriaId: actual });
        this.pintarProductos(cont,
          actual ? 'Este tipo de mueble no tiene productos.' : 'Elegí un ambiente para empezar.');
      } catch (e) {
        this._prods = null;
        cont.innerHTML = `<div class="banner warn">No se pudo leer: ${UI.esc(e.message || e)}</div>`;
      }
    },

    async buscar() {
      this.ruta = [];
      document.getElementById('cat-crumb').innerHTML = '';
      const cont = document.getElementById('cat-lista');
      cont.innerHTML = UI.spinner();
      try {
        this._prods = await global.DB.productos({ texto: this.texto });
        this.pintarProductos(cont, 'No hay productos para esa búsqueda.');
      } catch (e) {
        this._prods = null;
        cont.innerHTML = `<div class="banner warn">${UI.esc(e.message || e)}</div>`;
      }
    },

    // Cambia entre bloques/listado y re-pinta lo que haya sin volver a la base.
    setVista(v) {
      if (v === this.vista) return;
      this.vista = v;
      try { localStorage.setItem(VISTA_KEY, v); } catch {}
      this.pintarTog();
      const cont = document.getElementById('cat-lista');
      if (this._prods) this.pintarProductos(cont, 'Sin productos.');
    },

    pintarTog() {
      const b = document.getElementById('v-bloques'), l = document.getElementById('v-lista');
      if (!b || !l) return;
      b.className = this.vista === 'bloques' ? 'on' : '';
      l.className = this.vista === 'lista' ? 'on' : '';
    },

    // Dispatcher: pinta la lista de productos en el formato elegido.
    pintarProductos(cont, vacio) {
      const prods = this._prods || [];
      cont.innerHTML = prods.length
        ? (this.vista === 'lista' ? this.htmlLista(prods) : this.htmlBloques(prods))
        : UI.vacio(vacio);
      this.enganchar(cont);
    },

    htmlLista(prods) {
      return `<div class="card"><table>
        <thead><tr><th>Producto</th><th>Código</th><th style="text-align:right">Desde</th>
          <th style="text-align:right">Variantes</th><th></th></tr></thead>
        <tbody>${prods.map(p => {
          const tn = p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>';
          return `<tr data-prod="${p.id}" style="cursor:pointer">
            <td><b>${UI.esc(p.nombre)}</b> ${tn}</td>
            <td class="muted tnum">${UI.esc(p.sku || '—')}</td>
            <td style="text-align:right" class="tnum">${p.desde ? UI.pesos(p.desde) : '—'}</td>
            <td style="text-align:right" class="tnum">${p.variantes}</td>
            <td style="text-align:right" class="muted">ver ›</td></tr>`;
        }).join('')}</tbody></table></div>`;
    },

    // Silueta del mueble por tipo. Es un dibujo, no la foto: sirve para
    // reconocer el mueble de un vistazo hasta que estén las fotos de Tienda Nube.
    silueta(catId) {
      const t = { fill: 'none', s: 'currentColor' };
      const D = {
        2: '<rect x="14" y="26" width="92" height="58" rx="3"/><line x1="14" y1="45" x2="106" y2="45"/><line x1="14" y1="64" x2="106" y2="64"/><line x1="50" y1="35" x2="70" y2="35"/><line x1="50" y1="54" x2="70" y2="54"/><line x1="50" y1="74" x2="70" y2="74"/><line x1="22" y1="84" x2="22" y2="92"/><line x1="98" y1="84" x2="98" y2="92"/>',
        3: '<rect x="20" y="12" width="80" height="80" rx="3"/><line x1="60" y1="12" x2="60" y2="92"/><circle cx="54" cy="52" r="2.5"/><circle cx="66" cy="52" r="2.5"/><line x1="20" y1="30" x2="100" y2="30"/>',
        6: '<rect x="30" y="40" width="60" height="34" rx="3"/><line x1="30" y1="58" x2="90" y2="58"/><line x1="52" y1="49" x2="68" y2="49"/><line x1="36" y1="74" x2="36" y2="88"/><line x1="84" y1="74" x2="84" y2="88"/>',
        5: '<rect x="16" y="42" width="88" height="10" rx="2"/><line x1="30" y1="52" x2="24" y2="86"/><line x1="90" y1="52" x2="96" y2="86"/><line x1="34" y1="70" x2="86" y2="70"/>',
        7: '<rect x="12" y="40" width="96" height="34" rx="3"/><line x1="60" y1="40" x2="60" y2="74"/><line x1="12" y1="62" x2="108" y2="62"/><line x1="24" y1="74" x2="24" y2="86"/><line x1="96" y1="74" x2="96" y2="86"/>',
      };
      return `<svg class="sil" viewBox="0 0 120 100" fill="${t.fill}" stroke="${t.s}"
        stroke-width="2" stroke-linecap="round" aria-hidden="true">${D[catId] || D[2]}</svg>`;
    },

    htmlBloques(prods) {
      return `<div class="grid-prod">${prods.map(p => {
        const tn = p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>';
        return `<button class="prod-tile" data-prod="${p.id}">
            <div class="prod-img">${this.silueta(p.categoria_id)}</div>
            <div class="prod-top"><span class="prod-n">${UI.esc(p.nombre)}</span> ${tn}</div>
            <div class="prod-meta">${p.desde ? `desde <b class="tnum">${UI.pesos(p.desde)}</b> · ` : ''}<b class="tnum">${p.variantes}</b> variantes</div>
          </button>`;
      }).join('')}</div>
        <style>
          .grid-prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
          .prod-tile{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:12px;
            border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);
            cursor:pointer;text-align:left;transition:.15s}
          .prod-tile:hover{border-color:var(--brand);transform:translateY(-1px)}
          .prod-img{display:grid;place-items:center;background:var(--panel-2);border-radius:9px;
            padding:10px;color:var(--muted);min-height:104px}
          .prod-tile:hover .prod-img{color:var(--brand)}
          .sil{width:100%;max-width:150px;height:88px}
          .prod-top{display:flex;align-items:center;gap:8px}
          .prod-n{font-weight:650;color:var(--navy);flex:1;font-size:13.5px}
          .prod-meta{color:var(--muted);font-size:12.5px}
        </style>`;
    },

    enganchar(cont) {
      // En las dos vistas se entra a la FICHA del mueble: es la pantalla donde
      // el vendedor mira precios, medidas y terminaciones antes de cotizar.
      cont.querySelectorAll('[data-prod]').forEach(el =>
        el.onclick = () => this.ficha(Number(el.dataset.prod)));
    },

    // ---- Ficha del mueble --------------------------------------------------
    // Dirección y Producción entran al mueble para editarlo; el resto ve la
    // ficha de lectura.
    async ficha(prodId) {
      if (global.ProductoDet && global.App && global.App.tab === 'catalogo') {
        return global.ProductoDet.render(this._mount || 'view', prodId);
      }
      return this.fichaLectura(prodId);
    },

    async fichaLectura(prodId) {
      const v = document.getElementById(this._mount || 'view');
      v.innerHTML = UI.spinner('Abriendo el mueble…');
      let p, vars;
      try {
        p = await global.DB.producto(prodId);
        vars = await global.DB.variantes(prodId);
      } catch (e) {
        v.innerHTML = `<div class="banner warn">No se pudo abrir: ${UI.esc(e.message || e)}</div>`;
        return;
      }
      if (!p) { v.innerHTML = UI.vacio('Ese mueble no está en el catálogo.'); return; }

      // Los tres ejes con sus opciones, para el armador de la ficha.
      const eje = k => [...new Set(vars.map(x => x[k]).filter(Boolean))];
      const EJES = [
        { k: 'medida', lbl: 'Medida', ops: eje('medida') },
        { k: 'estructura', lbl: 'Estructura', ops: eje('estructura') },
        { k: 'frente', lbl: 'Frente', ops: eje('frente') },
      ].filter(e => e.ops.length);
      this._sel = {}; EJES.forEach(e => { this._sel[e.k] = e.ops[0]; });
      this._vars = vars; this._p = p; this._ejes = EJES;

      const tn = p.publicado_tn
        ? '<span class="pill ok">Publicado en Tienda Nube</span>'
        : '<span class="pill soft">Sólo interno</span>';
      const ruta = [p.ambiente && p.ambiente.nombre, p.categoria && p.categoria.nombre].filter(Boolean);

      v.innerHTML = `
        <div class="row" style="margin-bottom:14px;align-items:flex-start">
          <div>
            <div class="kick"><a href="#" id="fi-volver">‹ Catálogo</a>${
              ruta.length ? ` · ${UI.esc(ruta.join(' › '))}` : ''}</div>
            <h1 class="h-title">${UI.esc(p.nombre)}</h1>
            <div class="h-sub">${p.sku ? `<span class="tnum">${UI.esc(p.sku)}</span> · ` : ''}${tn}</div>
          </div>
          <div class="sp"></div>
          <button class="btn primary" id="fi-cotizar">Cotizar este mueble</button>
        </div>

        <div class="fi-cols">
          <div class="card pad fi-foto">
            <div class="fi-img">${this.silueta(p.categoria_id)}</div>
            <div class="hint" style="margin-top:8px">Dibujo de referencia — la foto viene de Tienda Nube.</div>
          </div>

          <div class="card pad">
            <div class="fi-precio">
              <span>Precio de lista</span>
              <b class="tnum" id="fi-p">—</b>
              <span class="fi-efe" id="fi-e"></span>
            </div>
            ${EJES.map(e => `<div class="fi-eje">
              <div class="fi-lbl">${UI.esc(e.lbl)}</div>
              <div class="fi-ops">${e.ops.map(o =>
                `<button class="opb" data-eje="${e.k}" data-op="${UI.esc(o)}">${UI.esc(o)}</button>`).join('')}</div>
            </div>`).join('')}
            <div class="fi-nota" id="fi-nota"></div>
          </div>
        </div>

        <div class="fi-cols" style="margin-top:14px">
          <div class="card pad">
            <div class="fi-h">Ficha técnica</div>
            <div class="fi-dl">
              ${p.alto ? `<div><span>Alto</span><b>${String(p.alto).replace('.', ',')} m</b></div>` : ''}
              ${p.prof ? `<div><span>Profundidad</span><b>${String(p.prof).replace('.', ',')} m</b></div>` : ''}
              <div><span>Medidas</span><b>${UI.esc((eje('medida').join(' · ')) || '—')}</b></div>
              <div><span>Plazo de fábrica</span><b>${p.dias ? `${p.dias} días` : 'a confirmar'}</b></div>
              <div class="ancho"><span>Materiales</span><b>${UI.esc(p.materiales || '—')}</b></div>
            </div>
            ${p.desc ? `<p class="fi-desc">${UI.esc(p.desc)}</p>` : ''}
          </div>
          <div class="card pad">
            <div class="fi-h">Todas las combinaciones <span class="muted">(${vars.length})</span></div>
            <div class="fi-tabla">${this.tablaVariantes(vars)}</div>
          </div>
        </div>
        ${this.estiloFicha()}`;

      document.getElementById('fi-volver').onclick = e => { e.preventDefault(); this.render(this._mount || 'view'); };
      document.getElementById('fi-cotizar').onclick = () => this.aCotizar();
      v.querySelectorAll('[data-eje]').forEach(b => b.onclick = () => {
        this._sel[b.dataset.eje] = b.dataset.op; this.refrescarFicha();
      });
      this.refrescarFicha();
    },

    // La variante que corresponde a lo elegido en los tres ejes.
    varSel() {
      return (this._vars || []).find(v => this._ejes.every(e => v[e.k] === this._sel[e.k])) || null;
    },

    refrescarFicha() {
      const v = this.varSel();
      document.querySelectorAll('[data-eje]').forEach(b =>
        b.classList.toggle('on', this._sel[b.dataset.eje] === b.dataset.op));
      const p = document.getElementById('fi-p'); if (!p) return;
      p.textContent = v ? UI.pesos(v.precio) : '—';
      // El de lista es el que se cotiza; el de efectivo sale del mismo lugar
      // que en la cotización (Configuración → Reglas de precio).
      const pct = global.DB.descuentoDe('efectivo');
      const e = document.getElementById('fi-e');
      e.innerHTML = v && pct
        ? `en efectivo <b class="tnum">${UI.pesos(Math.round(v.precio * (1 - pct / 100)))}</b> <span class="int">−${pct}%</span>`
        : '';
      const n = document.getElementById('fi-nota');
      n.innerHTML = v
        ? `<span class="muted">Combinación</span> <b>${UI.esc(this._ejes.map(x => this._sel[x.k]).join(' · '))}</b>`
        : `<span class="warn-t">Esa combinación no está en el catálogo — se cotiza <b>a medida</b>.</span>`;
    },

    // Desde la ficha se salta al presupuesto con el mueble ya cargado.
    aCotizar() {
      const v = this.varSel();
      if (!v) return UI.aviso('Elegí una combinación que exista para cotizarla', 'warn');
      global.Presupuesto._precarga = { nombre: this._p.nombre, variante: v };
      global.App.goSub('ventas', 'nueva');
    },

    estiloFicha() {
      return `<style>
        .fi-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
        @media(max-width:900px){.fi-cols{grid-template-columns:1fr}}
        .fi-foto .fi-img{display:grid;place-items:center;background:var(--panel-2);border-radius:10px;
          padding:18px;color:var(--muted);min-height:210px}
        .fi-foto .sil{width:100%;max-width:300px;height:180px}
        .fi-precio{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:12px;
          margin-bottom:12px;border-bottom:1px solid var(--line)}
        .fi-precio>span:first-child{font-size:11px;font-weight:700;letter-spacing:.06em;
          text-transform:uppercase;color:var(--muted)}
        .fi-precio b{font-size:26px;color:var(--navy)}
        .fi-efe{font-size:13px;color:var(--muted)}
        .fi-efe b{font-size:13px;color:var(--ok)}
        .fi-eje{margin-bottom:11px}
        .fi-lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
          color:var(--muted);margin-bottom:5px}
        .fi-ops{display:flex;gap:6px;flex-wrap:wrap}
        .opb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;
          font-size:13px;color:var(--ink-soft);cursor:pointer;transition:.12s}
        .opb:hover{border-color:var(--brand)}
        .opb.on{border-color:var(--brand);background:var(--brand);color:#fff;font-weight:650}
        .fi-nota{margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:12.5px}
        .fi-nota b{color:var(--navy)}
        .warn-t{color:var(--warn)}
        .fi-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
          color:var(--navy);margin-bottom:11px}
        .fi-dl{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px}
        .fi-dl .ancho{grid-column:1/-1}
        .fi-dl span{display:block;font-size:11px;color:var(--muted)}
        .fi-dl b{font-size:13px;color:var(--navy);font-weight:600}
        .fi-desc{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);
          font-size:13px;color:var(--ink-soft);line-height:1.55}
        .fi-tabla{max-height:340px;overflow:auto}
        .fi-tabla table{font-size:12.5px}
      </style>`;
    },

    tablaVariantes(vars) {
      if (!vars.length) return UI.vacio('Sin variantes cargadas.');
      return `<table style="margin:2px 0">
        <thead><tr><th>Medida</th><th>Estructura</th><th>Frente</th><th>Otros</th><th style="text-align:right">Precio</th></tr></thead>
        <tbody>${vars.map(v => {
          const extras = UI.extras(v).map(([k, val]) =>
            `<span class="pill soft">${UI.esc(k)}: ${UI.esc(val)}</span>`).join(' ') || '<span class="muted">—</span>';
          return `<tr>
            <td class="tnum">${UI.esc(v.medida || '—')}</td>
            <td>${UI.esc(v.estructura || '—')}</td>
            <td>${UI.esc(v.frente || '—')}</td>
            <td>${extras}</td>
            <td style="text-align:right"><b class="tnum">${UI.pesos(v.precio)}</b></td></tr>`;
        }).join('')}</tbody></table>`;
    },

    modalConexion() {
      const c = global.DB.cfg();
      document.body.insertAdjacentHTML('beforeend', `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:grid;place-items:center;padding:20px" id="mdl">
          <div class="card pad" style="max-width:460px;width:100%">
            <h3 class="h-title" style="font-size:18px">Conectar Belgrano Soft</h3>
            <p class="h-sub">Pegá la <b>anon key</b> (Settings → API → Project API keys → anon public). Es pública, va en el frontend.</p>
            <label class="fld" style="margin-top:14px"><span class="lbl">URL del proyecto</span>
              <input id="mc-url" value="${UI.esc(c.url || global.DB.DEFAULT_URL)}"></label>
            <label class="fld" style="margin-top:12px"><span class="lbl">anon key</span>
              <input id="mc-key" placeholder="eyJ…" value="${UI.esc(c.key || '')}"></label>
            <div class="row" style="margin-top:18px;justify-content:flex-end;gap:10px">
              <button class="btn" id="mc-cancel">Cancelar</button>
              <button class="btn primary" id="mc-ok">Conectar</button>
            </div>
          </div>
        </div>`);
      const cerrar = () => document.getElementById('mdl').remove();
      document.getElementById('mc-cancel').onclick = cerrar;
      document.getElementById('mc-ok').onclick = () => {
        const url = document.getElementById('mc-url').value.trim();
        const key = document.getElementById('mc-key').value.trim();
        if (!key) { UI.aviso('Falta la anon key', 'warn'); return; }
        global.DB.guardarCfg(url, key);
        UI.aviso('Conectado. Recargando…', 'ok');
        setTimeout(() => location.reload(), 600);
      };
    },
  };

  global.Catalogo = Catalogo;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================
//  Belgrano Soft · El mueble
//  Pantalla donde se CREA y se EDITA un mueble. Todo va en una sola
//  columna, un bloque abajo del otro: nombre, fotos, categorías,
//  propiedades, variantes, proveedores, abastecimiento y contabilidad.
//  Es interna: el vendedor no entra acá, y los costos los ve sólo
//  Dirección (Producción ve el resto, pero de lectura).
// =====================================================================
(function (global) {
  const Producto = {
    p: null,            // el mueble que se está editando
    vars: [],           // sus variantes
    _mount: 'view',
    _abierta: null,     // variante abierta en el panel lateral
    _fVar: '',          // filtro del listado de variantes

    // ---- Permisos ------------------------------------------------------
    verCostos() { return !global.App || !global.App.verCostos || global.App.verCostos(); },
    puedeEditar() { return !global.App || !global.App.editaCatalogo || global.App.editaCatalogo(); },

    async render(mount = 'view', id) {
      this._mount = mount;
      const v = document.getElementById(mount);
      v.innerHTML = UI.spinner('Abriendo el mueble…');
      try {
        this.p = await global.DB.producto(id);
        this.vars = await global.DB.variantes(Number(id));
        this._arbol = await global.DB.arbolCategorias();
        if (!this.p.categorias) this.p.categorias = this.p.categoria_id ? [this.p.categoria_id] : [];
      } catch (e) {
        v.innerHTML = `<div class="banner warn">No se pudo abrir: ${UI.esc(e.message || e)}</div>`;
        return;
      }
      if (!this.p) { v.innerHTML = UI.vacio('Ese mueble no está en el catálogo.'); return; }
      this.pintar();
    },

    // ---- Cálculo -------------------------------------------------------
    // Las propiedades que usa este mueble, con los valores que tiene activos.
    // El orden importa: es el que después ordena las variantes de abajo.
    props() {
      const dicc = global.DB.propiedades();
      return (this.p.propiedades || []).map(k => {
        const d = dicc.find(x => x.k === k) || { k, nombre: k.toUpperCase(), valores: [] };
        // Los valores en uso, en el orden del diccionario — no en el orden en
        // que se fueron cargando. El diccionario escribe "1,60" y la variante
        // "1.60": se comparan normalizados o no se encontrarían nunca.
        const norm = x => String(x || '').replace(',', '.').toLowerCase().trim();
        // Si el mismo valor está dos veces escrito distinto ("1,60" y "1.60"),
        // manda la primera aparición: si no, la copia del final pisa la
        // posición real y el orden que se acaba de guardar no se ve.
        const pos = new Map();
        d.valores.forEach((v, i) => { if (!pos.has(norm(v))) pos.set(norm(v), i); });
        const hay = [...new Set(this.vars.map(v => v[k]).filter(Boolean))];
        const usados = hay.sort((a, b) => {
          const ia = pos.has(norm(a)) ? pos.get(norm(a)) : Infinity;
          const ib = pos.has(norm(b)) ? pos.get(norm(b)) : Infinity;
          if (ia !== ib) return ia - ib;
          // Los que no están en el diccionario, en orden natural: 1.40 antes
          // que 1.60 y no "1.40" antes que "1.4" como texto.
          return String(a).localeCompare(String(b), 'es', { numeric: true });
        });
        return { ...d, usados };
      });
    },

    // Las variantes salen ordenadas por la propiedad 1, después la 2 y después
    // la 3 — respetando el orden de los valores de cada una. Así quedan todas
    // las de 0,40 blanca juntas, y adentro por frente.
    ordenadas(lista) {
      const ejes = this.p.propiedades || [];
      const pos = {};
      this.props().forEach(pr => {
        pos[pr.k] = {};
        pr.usados.forEach((v, i) => { pos[pr.k][v] = i; });
      });
      return [...(lista || this.vars)].sort((a, b) => {
        for (const k of ejes) {
          const ia = pos[k] && pos[k][a[k]] !== undefined ? pos[k][a[k]] : 999;
          const ib = pos[k] && pos[k][b[k]] !== undefined ? pos[k][b[k]] : 999;
          if (ia !== ib) return ia - ib;
        }
        return 0;
      });
    },
    // 3 estructuras × 3 frentes × 3 medidas = 27. Sale solo.
    combinatorio() {
      const ps = this.props().filter(p => p.usados.length);
      return ps.length ? ps.reduce((a, p) => a * p.usados.length, 1) : 0;
    },
    markupDe(v) { return global.DB.markupDe(v.costo, v.precio); },
    objetivoDe(v) { return Number(v.markupObj) || Number(this.p.markupObj) || global.DB.MARKUP_OBJETIVO; },
    activas() { return this.vars.filter(v => v.activa !== false); },
    // Estado del mueble entero: el peor de sus variantes manda.
    estado() {
      const ms = this.activas().map(v => this.markupDe(v)).filter(x => x > 0);
      if (!ms.length) return { k: 'sin', label: 'Sin costo', pill: 'soft' };
      return global.DB.bandaDe(Math.min(...ms));
    },

    // ---- Pintado -------------------------------------------------------
    // Las solapas. La primera es la que se abre siempre: el mueble, sus
    // atributos, sus variantes y el precio. Todo lo demás — lo que no hace
    // falta para saber qué es y cuánto sale — vive en las otras.
    SOLAPAS: [
      { k: 'producto', label: 'Información general' },
      { k: 'inventario', label: 'Inventario' },
      { k: 'produccion', label: 'Producción' },
      { k: 'costos', label: 'Compra y venta', costos: true },
      { k: 'contabilidad', label: 'Contabilidad' },
      { k: 'documentos', label: 'Documentos' },
    ],
    _tab: 'producto',
    solapas() {
      // El vendedor ve sólo la primera, y de lectura: el catálogo es interno.
      if (global.App && global.App.rol === 'vendedor') return [this.SOLAPAS[0]];
      return this.SOLAPAS.filter(t => !t.costos || this.verCostos());
    },
    // Los números de costo sólo se ven en su solapa, y sólo si el rol puede.

    _tab: 'producto',
    // Qué módulos están abiertos. Adicionales arranca cerrado: es lo que menos
    // se toca.
    _abre: { mueble: true, catprop: true, variantes: true, adicionales: false },

    muestraCostos() { return this.verCostos() && this._tab === 'costos'; },

    // Un módulo desplegable, igual que las etapas de la cotización: número,
    // título, un resumen de lo que hay adentro y la flecha.
    modulo(k, n, titulo, resumen, cuerpo, ok) {
      const on = this._abre[k] !== false;
      return `<section class="pd-m ${on ? 'on' : ''} ${ok ? 'ok' : ''}">
        <button class="pd-mh" data-mod="${k}" aria-expanded="${on}">
          <span class="pd-mn">${n}</span>
          <span class="pd-mt">${UI.esc(titulo)}</span>
          <span class="pd-mr">${on ? '' : UI.esc(resumen || '')}</span>
          <span class="pd-mg">${on ? '▴' : '▾'}</span>
        </button>
        ${on ? `<div class="pd-mb">${cuerpo}</div>` : ''}
      </section>`;
    },

    pintar() {
      const v = document.getElementById(this._mount); if (!v) return;
      const p = this.p, ed = this.puedeEditar();
      if (!this.solapas().some(t => t.k === this._tab)) this._tab = 'producto';
      v.innerHTML = `
        <div class="pd-wrap">
          <div class="pd-bar">
            <a href="#" id="pd-volver" class="kick">‹ Catálogo</a>
            <div class="sp"></div>
            ${ed ? '' : '<span class="pill soft">Sólo lectura</span>'}
          </div>
          <div class="pd-tit">
            <h1>${UI.esc(p.nombre)}</h1>
            <span class="pd-cod tnum">${UI.esc(p.sku || '')}</span>
            <div class="sp"></div>
            <span class="pill ${p.publicado ? 'ok' : 'warn'}" id="pd-pub-pill">${
              p.publicado ? 'Visible para los vendedores' : 'Oculto — no se puede vender'}</span>
          </div>
          <div class="pd-tabs">${this.solapas().map(t =>
            `<button class="pd-tab ${this._tab === t.k ? 'on' : ''}" data-tab="${t.k}"
              aria-current="${this._tab === t.k}">${UI.esc(t.label)}</button>`).join('')}</div>
          ${this['tab' + this._tab.charAt(0).toUpperCase() + this._tab.slice(1)]()}
          <div id="pd-panel"></div>
        </div>
        ${this.estilos()}`;

      document.getElementById('pd-volver').onclick = e => { e.preventDefault(); global.Catalogo.render(this._mount); };
      document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
        this._tab = b.dataset.tab; this.pintar();
      });
      document.querySelectorAll('[data-mod]').forEach(b => b.onclick = () => {
        const k = b.dataset.mod; this._abre[k] = this._abre[k] === false; this.pintar();
      });
      this.enganchar();
    },

    // Los cuatro módulos: qué es · de qué depende · qué variantes salen de eso
    // · cómo se entrega.
    tabProducto() {
      const cs = this.cats();
      const ps = this.props().filter(x => x.usados.length);
      const secs = this.secsDe();
      return this.modulo('mueble', 1, 'El mueble',
          `${this.p.nombre} · ${cs.map(c => c.nombre).join(' · ') || 'sin categoría'}`,
          this.bloqueNombre() + '<div class="pd-sepl"></div>' + this.bloqueCategorias(true),
          !!this.p.nombre && cs.length > 0)
        + this.modulo('catprop', 2, 'Propiedades',
          `${ps.length} ${ps.length === 1 ? 'principal' : 'principales'} · ${secs.length} ${secs.length === 1 ? 'secundaria' : 'secundarias'}`,
          this.bloquePropiedades(true), ps.length > 0)
        + this.modulo('variantes', 3, 'Variantes',
          `${this.vars.length} ${this.vars.length === 1 ? 'variante' : 'variantes'} · ${this.activas().length} activas`,
          this.bloqueVariantes(true), this.vars.length > 0)
        + this.modulo('entrega', 4, 'Entrega',
          `${this.p.instalacion ? 'Requiere instalación' : 'Sin instalación'} · `
          + `${this.p.bultos || 1} ${(this.p.bultos || 1) === 1 ? 'bulto' : 'bultos'}`,
          this.bloqueEntrega(), true);
    },
    // De dónde salen los costos: una lista por rubro. Si el mueble lleva
    // carpintería y herrería, son dos listas distintas y cada una pone su
    // parte. Es lo primero que hay que definir: sin eso, el costo se carga a
    // mano y se pierde la comparación entre muebles parecidos.
    listasDe() {
      const rubros = this.rubrosDe().filter(r => r.k);
      return rubros.map((r, i) => ({
        rubro: r.k,
        label: this.nombreRubro(r.k),
        lista: (this.p.listas || [])[i] || (global.DB.listasDe(r.k)[0] || {}).k || '',
      }));
    },

    bloqueListas() {
      const ed = this.puedeEditar();
      const ls = this.listasDe();
      const sinLista = ls.filter(x => !x.lista).length;
      return `<section class="pd-b">
        <div class="pd-h">De dónde salen los costos</div>
        <div class="hint" style="margin-bottom:11px">Una lista por rubro. El costo de cada variante
          baja de ahí, para no cargarlo mueble por mueble y poder comparar productos parecidos.</div>
        ${ls.map((x, i) => {
          const opciones = global.DB.listasDe(x.rubro);
          return `<div class="fr"><label for="pd-lista-${i}">${UI.esc(x.label)}</label>
            <select id="pd-lista-${i}" data-lista="${i}" ${ed ? '' : 'disabled'}>
              <option value="">Elegir lista…</option>
              ${opciones.map(o => `<option value="${o.k}" ${x.lista === o.k ? 'selected' : ''}
                >${UI.esc(o.label)}</option>`).join('')}
            </select></div>`;
        }).join('') || '<div class="hint">Definí primero los rubros en <b>Producción</b>.</div>'}
        ${sinLista ? `<div class="banner warn" style="margin-top:9px">Falta${sinLista === 1 ? '' : 'n'}
          elegir <b>${sinLista}</b> ${sinLista === 1 ? 'lista' : 'listas'}: sin eso el costo hay que
          cargarlo a mano.</div>` : ''}
        <div class="banner info" style="margin-top:9px">El <b>módulo Precios</b> todavía no está hecho.
          Cuando esté, estas listas van a ser las tablas reales y el costo de cada variante va a salir
          de cruzar sus propiedades contra ellas.</div>
      </section>`;
    },

    // El precio de EFECTIVO es el que se carga: es lo que realmente entra. El
    // de lista sale solo aplicándole el descuento al revés, y el margen y el
    // markup se miden contra el efectivo, no contra la lista.
    descEfectivo() { return global.DB.descuentoDe('efectivo') / 100; },
    listaDe(efectivo) {
      const d = this.descEfectivo();
      return d < 1 ? Math.round((Number(efectivo) || 0) / (1 - d)) : 0;
    },
    efectivoDe(v) {
      // Lo que hay guardado es el precio de lista; el efectivo se deriva.
      return v.efectivo != null ? v.efectivo : Math.round((Number(v.precio) || 0) * (1 - this.descEfectivo()));
    },

    tabCostos() {
      const ed = this.puedeEditar();
      const ejes = this.props();
      const f = this._fVar.trim().toLowerCase();
      const lista = this.ordenadas(this.vars.filter(v => !f || this.nombreVar(v).toLowerCase().includes(f)));
      this._abiertos = this._abiertos || new Set();

      const fila = v => {
        const ef = this.efectivoDe(v);
        const mk = global.DB.markupDe(v.costo, ef);
        const mg = global.DB.margenDe(v.costo, ef);
        const banda = global.DB.bandaDe(mk);
        // Los números bajan de la plantilla de precios. Se muestran, no se
        // escriben: recién con el lápiz se pisan para esta variante.
        const abierto = this._abiertos.has(v.id);
