      const c = this.cli, DB = global.DB;
      const ident = this.nombreCli();
      const ficha = DB.fichaCliente(ident);

      s.innerHTML = `
        <div class="card cz-sc">
          <div class="tabs sm">
            <button class="tab ${this.lado === 'notas' ? 'on' : ''}" data-l="notas">Notas</button>
            <button class="tab ${this.lado === 'historico' ? 'on' : ''}" data-l="historico">Histórico</button>
            <button class="tab ${this.lado === 'actividad' ? 'on' : ''}" data-l="actividad">Actividad</button>
          </div>
          <div class="cz-sb">${
            this.lado === 'notas' ? this.notasHTML()
            : this.lado === 'historico'
              ? (this.cambios.length ? `<div class="cbav">${this.cambios.length} ${this.cambios.length === 1 ? 'cambio sin confirmar' : 'cambios sin confirmar'} — se revisan al guardar</div>` : '') + this.actividadHTML()
              : this.pendientesHTML()}</div>
        </div>

        <div class="card cz-sc">
          <div class="cz-sh">Cliente</div>
          <div class="cz-sb">
            ${ident ? `<div class="cli-row">
              <span class="ava">${UI.esc(inic(ident))}</span>
              <b>${UI.esc(ident)}</b>
              ${ficha && ficha.recurrente ? '<span class="pill ok">Frecuente</span>' : '<span class="pill soft">Nuevo</span>'}
            </div>
            <div class="cli-d">${[
              c.telefono && `☎ ${UI.esc(c.telefono)}`,
              c.tel2 && `☎ ${UI.esc(c.tel2)}`,
              c.email && `✉ ${UI.esc(c.email)}`,
              c.instagram && `◎ ${UI.esc(c.instagram)}`,
              c.domicilio && `⌂ ${UI.esc(c.domicilio)}`,
            ].filter(Boolean).join('<br>') || '<span class="muted">Sin datos de contacto todavía.</span>'}</div>
            <button class="btn sm" id="cz-ficha" style="width:100%;margin-top:10px">Ver ficha completa</button>`
            : `<div class="muted" style="font-size:12.5px">Cargá el nombre o el contacto y acá aparece la ficha.</div>`}
          </div>
        </div>

        <div class="card cz-sc">
          <div class="cz-sh">Documentos relacionados</div>
          <div class="cz-sb">${
            this.archivos.map(a => `<div class="doc"><span class="di">📎</span>
                <div><div class="dt">${UI.esc(a.nombre)}</div>
                  <div class="dr">${UI.esc(a.de)}</div></div></div>`).join('')
            + (ficha && ficha.docs.length
              ? ficha.docs.map(d => `<div class="doc"><span class="di">▤</span>
                  <div><div class="dt">${UI.esc(d.tipo)}</div>
                    <div class="dr">${UI.esc(d.ref)}${d.f ? ` (${UI.esc(d.f)})` : ''}</div></div></div>`).join('')
              : (this.archivos.length ? '' : '<div class="muted" style="font-size:12.5px">Sin antecedentes para este cliente.</div>'))
          }</div>
        </div>`;

      s.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { this.lado = b.dataset.l; this.pintarSide(); });
      const at = document.getElementById('ac-tipo');
      if (at) {
        at.onchange = e => { this._nuevaAct.tipo = e.target.value; this.pintarSide(); };
        document.getElementById('ac-fecha').onchange = e => { this._nuevaAct.fecha = e.target.value; };
        document.getElementById('ac-nota').oninput = e => { this._nuevaAct.nota = e.target.value; };
        document.getElementById('ac-ok').onclick = () => {
          const p = this._nuevaAct;
          if (!p.nota.trim()) return UI.aviso('Escribí de qué se trata', 'warn');
          if (!p.fecha) return UI.aviso('Poné la fecha', 'warn');
          this.pendientes.unshift({ ...p });
          // Queda agendado y también en el histórico, para que no se pierda.
          this.log(this.vendedor, `Agendó ${p.tipo === 'mensaje' ? 'un mensaje' : 'un recordatorio'} para el ${fechaLarga(p.fecha)}: ${p.nota.trim()}`);
          this._nuevaAct = { tipo: p.tipo, fecha: enDias(7), nota: '' };
          UI.aviso('Agendado', 'ok');
          this.lado = 'notas'; this.pintarSide();
        };
      }
      const fi = document.getElementById('cz-ficha');
      // Va directo a la ficha de ESTE cliente, no al listado.
      if (fi) fi.onclick = () => {
        const busca = (c.telefono || '').trim() || (c.nombre || '').trim() || ident;
        global.App.goSub('ventas', 'clientes');
        setTimeout(() => global.Clientes.render('mview', { buscar: busca }), 0);
      };
      const na = document.getElementById('cz-nota');
      if (na) na.oninput = () => { this.obsInt = na.value; };
    },

    actividadHTML() {
      if (!this.registrando) return `<div class="muted" style="font-size:12.5px">
        El histórico arranca cuando se <b>guarda</b>, imprime, descarga o confirma la
        cotización. Desde ahí queda registrado quién cambió qué.</div>`;
      if (!this.actividad.length) return '<div class="muted" style="font-size:12.5px">Sin movimientos todavía.</div>';
      return this.actividad.map(a => `<div class="act">
        <span class="ava ${a.quien === 'Sistema' ? 'sys' : ''}">${UI.esc(inic(a.quien))}</span>
        <div><div class="aq">${UI.esc(a.quien)}<span class="ah">${UI.esc(a.hora)}</span></div>
          <div class="at">${UI.esc(a.texto)}</div></div></div>`).join('');
    },
    notasHTML() {
      return `<div class="muted" style="font-size:12px;margin-bottom:7px">Observaciones <b>internas</b> — no salen impresas.</div>
        <textarea id="cz-nota" rows="5" placeholder="Notas para producción, administración o para vos…">${UI.esc(this.obsInt)}</textarea>
        ${this.pendientes.length ? `<div class="pend-tit">Agendado</div>${this.pendientesLista()}` : ''}`;
    },

    // Actividad: agendar algo para esta cotización (recordatorio o mensaje).
    pendientesHTML() {
      const p = this._nuevaAct || { tipo: 'recordatorio', fecha: enDias(7), nota: '' };
      this._nuevaAct = p;
      return `<div class="muted" style="font-size:12px;margin-bottom:9px">
          Agendá algo para esta cotización. Ese día te salta el aviso.</div>
        <div class="fr sm"><label for="ac-tipo">Tipo</label>
          <select id="ac-tipo">
            <option value="recordatorio" ${p.tipo === 'recordatorio' ? 'selected' : ''}>Recordatorio</option>
            <option value="mensaje" ${p.tipo === 'mensaje' ? 'selected' : ''}>Mensaje</option>
          </select></div>
        <div class="fr sm" style="margin-top:7px"><label for="ac-fecha">Fecha</label>
          <input id="ac-fecha" type="date" value="${UI.esc(p.fecha)}"></div>
        <textarea id="ac-nota" rows="3" style="margin-top:9px" placeholder="${p.tipo === 'mensaje' ? 'Qué mensaje mandarle…' : 'De qué te tenés que acordar…'}">${UI.esc(p.nota)}</textarea>
        <button class="btn sm primary" id="ac-ok" style="width:100%;margin-top:9px">Guardar</button>
        ${this.pendientes.length ? `<div class="pend-tit">Agendado</div>${this.pendientesLista()}` : ''}`;
    },
    pendientesLista() {
      return this.pendientes.map(a => `<div class="pend">
        <span class="pi">${a.tipo === 'mensaje' ? '💬' : '🔔'}</span>
        <div><div class="pf">${UI.esc(fechaLarga(a.fecha))}</div>
          <div class="pn">${UI.esc(a.nota)}</div></div></div>`).join('');
    },

    // ---- Acciones ---------------------------------------------------------
    accion(tipo) {
      if (!this.clienteValido()) {
        if (tipo === 'guardar') { this.avisoCliente(); return this.popIdentidad('guardar'); }
        return this.popIdentidad(tipo);
      }
      if (tipo !== 'guardar' && !this.lineas.length) { UI.aviso('Agregá al menos un producto', 'warn'); return; }
      if (tipo === 'preview') return this.modalPreview('ver');
      if (tipo === 'print') { this.arrancarRegistro('Imprimió la cotización'); return this.modalPreview('print'); }
      if (tipo === 'descargar') return this.modalPreview('descargar');
      if (tipo === 'guardar') return this.conCambiosConfirmados(() => this.guardar());
    },

    // Guardar, imprimir, descargar o confirmar dejan la cotización "en el sistema":
    // de ahí en más todo lo que se toque queda registrado.
    arrancarRegistro(texto) {
      const primera = !this.registrando;
      this.registrando = true;
      this.log(this.vendedor, texto);
      if (primera) this.pintarSide();
      return primera;
    },

    guardar() {
      const primera = !this.registrando;
      this.guardada = true;          // el número queda tomado en firme
      this.registrando = true;       // de acá en más sí queda historial
      this.log(this.vendedor, primera
        ? `Guardó la cotización ${global.DB.numeroCotizacion(this.nro)}`
        : `Guardó los cambios${this.esOrden() ? ` de ${this.nroOrden}` : ''}`);
      this.pintarSide();
      UI.aviso(`${global.DB.numeroCotizacion(this.nro)} guardada (demo)`, 'ok');
    },

    // Antes de guardar, lo que movió el precio o la entrega se muestra y se
    // confirma: nadie guarda un cambio de flete o de producto sin verlo.
    conCambiosConfirmados(seguir) {
      if (!this.cambios.length) return seguir();
      const filas = this.cambios.map(c => {
        const movio = c.antes != null && c.ahora != null && c.antes !== c.ahora;
        return `<div class="cbf">
          <div class="cbt">${UI.esc(c.texto)}</div>
          ${movio ? `<div class="cbm"><span class="tnum">${UI.pesos(c.antes)}</span>
            <span class="fl">→</span><b class="tnum">${UI.pesos(c.ahora)}</b>
            <span class="dif ${c.ahora > c.antes ? 'sube' : 'baja'}">${c.ahora > c.antes ? '+' : '−'}${UI.pesos(Math.abs(c.ahora - c.antes))}</span></div>`
            : '<div class="cbm muted">sin cambio en el total</div>'}
        </div>`;
      }).join('');
      this.modal(`<h3 style="color:var(--navy)">Confirmá los cambios</h3>
        <p class="muted" style="font-size:13px;margin:8px 0 12px">
          Esto se modificó desde la última vez que se guardó. Revisá el impacto antes de seguir.</p>
        <div class="cblist">${filas}</div>
        <div class="row" style="margin-top:14px;justify-content:flex-end;gap:10px">
          <button class="btn" id="cb-volver">Volver a revisar</button>
          <button class="btn primary" id="cb-ok">Confirmo que vi los cambios</button></div>`, m => {
        document.getElementById('cb-volver').onclick = () => m.remove();
        document.getElementById('cb-ok').onclick = () => {
          this.cambios.forEach(c => this.log(c.quien || this.vendedor, `Confirmó: ${c.texto}`));
          this.cambios = [];
          m.remove(); seguir();
        };
      }, 480);
    },

    // Pop-up: se entrega un presupuesto sin los datos para registrarlo.
    popIdentidad(tipoOrig) {
      this.modal(`<h3 style="color:var(--navy)">Falta la identidad del cliente</h3>
        <p style="margin:10px 0 0">Estás por entregar un presupuesto <b>sin teléfono, Instagram ni mail</b>. Sin alguno de esos datos <b>no queda registrado</b> el turno ni el cliente.</p>
        <p class="muted" style="font-size:13px">Pedí al menos uno para que quede el registro de la atención. Si el cliente no lo da, podés entregarlo igual, pero no se guarda.</p>
        <div class="row" style="margin-top:16px;justify-content:flex-end;gap:10px">
          <button class="btn" id="mp-cerrar">Volver a pedir el dato</button>
          ${tipoOrig !== 'guardar' ? '<button class="btn primary" id="mp-igual">Entregar igual (sin registrar)</button>' : ''}
        </div>`, m => {
        document.getElementById('mp-cerrar').onclick = () => m.remove();
        const ig = document.getElementById('mp-igual');
        if (ig) ig.onclick = () => { m.remove(); this.modalPreview(tipoOrig === 'print' ? 'print' : 'ver'); };
      });
    },

    // ---- Confirmar → Venta (estado CONFIRMAR) ------------------------------
    convertir() {
      if (this.cambios.length) return this.conCambiosConfirmados(() => this.convertir());
      if (!this.clienteValido()) { this.avisoCliente(); return this.popIdentidad('convertir'); }
      if (!this.lineas.length) return UI.aviso('Agregá al menos un producto', 'warn');
      if (!this.vendedor) return UI.aviso('Elegí el vendedor de la operación', 'warn');
      const incompletos = this.lineas.filter(l => l.tipo === 'medida' && (!l.prodNombre.trim() || !(Number(l.precioManual) > 0)));
      if (incompletos.length) return UI.aviso('Completá nombre y precio de los productos a medida', 'warn');
      // Si la orden lleva instalación, su costo es obligatorio.
      if (this.ad.instalacion === 'si' && !this.ad.instalacionCosto) {
        this.etapa = 'adicionales'; this.pintarMain();
        return UI.aviso('Cargá el costo de instalación', 'warn');
      }

      const nro = global.DB.proximoNumeroOrden(this.local);
      const nombreCli = this.nombreCli();
      // Nada de resumen: se confirma y se pasa a la orden, que es donde se
      // termina de cargar lo que en la cotización todavía no importaba.
      this.modal(`<h3 style="color:var(--navy);margin:0 0 6px">¿Confirmamos la orden ${UI.esc(nro)}?</h3>
        <p class="muted" style="font-size:13px;margin:0">
          La cotización ${UI.esc(global.DB.numeroCotizacion(this.nro))} de <b>${UI.esc(nombreCli)}</b>
          pasa a orden de venta y se abre para completarla.</p>
        <div class="row" style="margin-top:18px;justify-content:flex-end;gap:10px">
          <button class="btn" id="cv-no">No, seguir editando</button>
          <button class="btn primary" id="cv-si">Sí, confirmar</button></div>`, m => {
        document.getElementById('cv-no').onclick = () => m.remove();
        document.getElementById('cv-si').onclick = () => {
          const orden = global.DB.crearOrden({
            cliente: nombreCli, vendedor: this.vendedor, local: this.local, total: this.totalFinal(),
            termino: this.termino, fecha: hoy(),
            lineas: this.lineas.map(l => ({ nombre: l.prodNombre, cant: l.cantidad, unit: this.unit(l), obs: l.obs, tipo: l.tipo, img: l.img })),
          });
          m.remove();
          // No se pierde nada: sigue el MISMO editor, ahora como orden, para
          // completar lo que en la cotización todavía no hacía falta.
          this.guardada = true;   // el número de cotización queda usado por la venta
          this.registrando = true;
          this.modo = 'orden'; this.nroOrden = orden.numero; this.fechaOrden = hoy();
          this.confirmadas = {};   // se revisa todo de nuevo antes de cobrar
          this.etapa = 'cliente';
          this.log(this.vendedor, `Confirmó la venta ${orden.numero}`);
          UI.aviso(`Orden ${orden.numero} creada — completala`, 'ok');
          this.render(this._mount);
        };
      }, 420);

      // Si la anterior nunca se guardó ni se convirtió, su número se reutiliza.
      if (this.nro != null && !this.guardada) global.DB.liberarNumeroCotizacion(this.nro);

    // ---- Vista previa / descarga / impresión -------------------------------

    cuerpoPreview() {

            ${cond('Saldo se abona en', a.saldoEn)}

            ${this.instalacionMonto() ? tot('Instalación', UI.pesos(this.instalacionMonto())) : ''}
            ${this.pideEnvio() ? tot('Envío', this.envioTexto()) : tot('Envío', 'Retira')}
            <div class="pv-total"><span>Total</span><b>${UI.esc(UI.pesos(this.totalFinal()))}</b></div>
          </div>

        <div class="pv-obs">${this.obsExt ? UI.esc(this.obsExt) : ''}</div>

        <footer class="pv-pie">

          <div class="pv-marca">
            <b>${UI.esc(E.nombre)}</b>
            <span>${UI.esc(E.direccion)}</span>
            <span>${UI.esc(E.instagram)}</span>
            <span class="tel">${UI.esc(E.telefono)}</span>

      </div>`;
      // Las observaciones INTERNAS nunca entran acá: son para nosotros.
    },

    // Hoja A4 en blanco y negro, con el sello de la marca. Mismo HTML para ver,

    // Se abre para ver, imprimir o bajar el archivo — hoy la cotización se
    // manda por la plataforma que usan, así que alcanza con el archivo.
    modalPreview(modo) {
      const cuerpo = this.estiloPreview() + this.cuerpoPreview();
      const nombre = `${this.esOrden() ? 'Orden' : 'Cotizacion'}-${(this.nombreCli() || 'cliente').replace(/[^\w\-]+/g, '_')}.html`;
      if (modo === 'print') {
        try { const w = global.open('', '_blank'); if (w) { w.document.write(`<title>Cotización</title>${cuerpo}`); w.document.close(); w.focus(); w.print(); return; } } catch (e) {}
      }
      if (modo === 'descargar') return this.bajar(nombre, `<!doctype html><meta charset="utf-8"><title>Cotización</title>${cuerpo}`);
      this.modal(`<div class="row" style="margin-bottom:12px"><b style="color:var(--navy)">Vista previa</b><div class="sp" style="flex:1"></div>
        <button class="btn sm" id="pv-baja">Descargar</button>
        <button class="btn sm" id="pv-print">Imprimir</button></div>
        <div class="pv-hoja"><div class="pv-zoom">${cuerpo}</div></div>`, m => {
        this.ajustarHoja(m);
        document.getElementById('pv-print').onclick = () => this.modalPreview('print');
        document.getElementById('pv-baja').onclick = () => this.bajar(nombre, `<!doctype html><meta charset="utf-8"><title>Cotización</title>${cuerpo}`);
      }, 900);
    },
    // La A4 se muestra completa: se achica lo necesario para que entre en el
    // ancho disponible, manteniendo la proporción de la hoja.
    ajustarHoja(m) {
      const hoja = m.querySelector('.pv-hoja'), zoom = m.querySelector('.pv-zoom');
      if (!hoja || !zoom) return;
      const A4 = 794;                       // 210 mm a 96 dpi
      zoom.style.width = A4 + 'px';
      zoom.style.transform = 'none';
      const alto = zoom.offsetHeight;
      // Entra completa: se achica por lo que quede más justo, el ancho o el alto.
      const dispoW = hoja.clientWidth - 28;
      const dispoH = (global.innerHeight || 900) * 0.85 - 96;   // menos la barra del modal
      const k = Math.min(1, dispoW / A4, dispoH / alto);
      zoom.style.transform = `scale(${k})`;
      zoom.style.marginLeft = Math.max(0, (dispoW - A4 * k) / 2) + 'px';
      hoja.style.height = Math.round(alto * k + 28) + 'px';
    },
    bajar(nombre, html) {
      try {
        const a = document.createElement('a');
        a.href = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);
        a.download = nombre;
        document.body.appendChild(a); a.click(); a.remove();
        this.arrancarRegistro('Descargó la cotización'); this.pintarSide();
        UI.aviso('Cotización descargada', 'ok');
      } catch (e) { UI.aviso('No se pudo descargar', 'crit'); }
    },

    // ---- Modales -----------------------------------------------------------
    modal(html, onready, ancho = 480) {
      const id = 'mdl-' + (++this._uid);
      document.body.insertAdjacentHTML('beforeend',
        `<div class="mdlbg" id="${id}"><div class="card pad" style="max-width:${ancho}px;width:100%;max-height:85vh;overflow:auto">${html}</div></div>`);
      const m = document.getElementById(id);
      m.onclick = e => { if (e.target.id === id) m.remove(); };
      onready && onready(m);
      return m;
    },

    // Armador de variante CON BOTONES: se elige Medida, después Estructura,
    // después Frente, y el precio se actualiza en cada paso. A propósito NO se
    // listan los precios de todas las variantes (un mueble puede tener 15+):
    // se muestra sólo el del combo que se está armando.
    modalVariante(prod, vars) {
      const ejes = EJES.filter(e => vars.some(v => v[e.k]));
      const sel = {};
      ejes.forEach(e => { const o = opciones(vars, e.k, sel); if (o.length === 1) sel[e.k] = o[0]; });

      const m = this.modal('', null, 560);
      const caja = m.firstChild;
      const cant = Math.max(1, this.cantNueva || 1);   // copiada del renglón de carga
      let tipo = 'estandar';   // estándar toma el precio del catálogo; a medida queda a definir
      const libre = {};        // en a medida cada eje admite un valor escrito a mano

      const calzan = () => vars.filter(v => ejes.every(e => sel[e.k] == null || v[e.k] === sel[e.k]));
      const elegida = () => { const c = calzan(); return c.length === 1 || ejes.every(e => sel[e.k] != null) ? c[0] : null; };
      // Valor final de cada eje: lo escrito a mano gana sobre lo elegido.
      const valorDe = k => (libre[k] || '').trim() || sel[k] || '';
      const armado = () => ejes.filter(e => valorDe(e.k)).map(e => ({ lbl: e.label, val: valorDe(e.k) }));
      // Estándar necesita una variante exacta; a medida alcanza con algo definido.
      const listo = () => tipo === 'medida' ? armado().length > 0 : !!elegida();

      const pintar = () => {
        const v = elegida();
        const partes = armado();
        caja.innerHTML = `
          <div class="row" style="margin-bottom:4px"><h3 style="color:var(--navy);margin:0">${UI.esc(prod.nombre)}</h3>
            <div class="sp" style="flex:1"></div><button class="lx" id="mv-x" style="font-size:20px">✕</button></div>
          <p class="muted" style="margin:0 0 12px;font-size:13px">Armá el mueble: elegí ${ejes.map(e => e.label.toLowerCase()).join(', ')}.</p>
          <div class="vgrp"><div class="vlbl">Tipo</div>
            <div class="vopts">
              <button class="vopt ${tipo === 'estandar' ? 'on' : ''}" data-t="estandar">Estándar</button>
              <button class="vopt ${tipo === 'medida' ? 'on med' : ''}" data-t="medida">A medida</button>
            </div></div>
          ${ejes.map(e => {
            const opts = opciones(vars, e.k, sel);
            return `<div class="vgrp"><div class="vlbl">${UI.esc(e.label)}</div>
              <div class="vopts">${opts.map(o =>
                `<button class="vopt ${!libre[e.k] && sel[e.k] === o ? 'on' : ''}" data-e="${e.k}" data-o="${UI.esc(o)}">${UI.esc(o)}</button>`).join('')}
                ${tipo === 'medida'
                  ? `<input class="vlibre" data-lib="${e.k}" value="${UI.esc(libre[e.k] || '')}"
                       placeholder="otra ${e.label.toLowerCase()}… (ej. a convenir)">`
                  : ''}</div></div>`;
          }).join('')}
          <div class="vpre">
            <div>
              <div class="muted" style="font-size:12px">${partes.length ? UI.esc(textoEjes(partes)) : 'Elegí las opciones'}</div>
              ${tipo === 'medida'
                ? `<b style="font-size:19px;color:var(--warn)">A definir</b>
                   <span class="muted" style="font-size:12px">el precio se carga en el renglón</span>`
                : `<b class="tnum" style="font-size:21px;color:var(--navy)">${v ? UI.pesos(v.precio * cant) : '—'}</b>
                   <span class="muted" style="font-size:12px">precio de lista${cant > 1 && v ? ` · ${cant} × ${UI.pesos(v.precio)}` : ''}</span>`}
            </div>
            <div class="sp" style="flex:1"></div>
            <button class="btn primary" id="mv-ok" ${listo() ? '' : 'disabled'}>Agregar${cant > 1 ? ` ${cant}` : ''}</button>
          </div>`;
        caja.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
          tipo = b.dataset.t;
          if (tipo !== 'medida') Object.keys(libre).forEach(k => delete libre[k]);
          pintar();
        });
        caja.querySelectorAll('[data-lib]').forEach(i => {
          i.oninput = () => {
            libre[i.dataset.lib] = i.value;
            // Sólo se refresca lo que depende del valor escrito, para no perder el foco.
            const pre = caja.querySelector('.vpre .muted');
            if (pre) pre.textContent = armado().length ? textoEjes(armado()) : 'Elegí las opciones';
            const ok2 = document.getElementById('mv-ok'); if (ok2) ok2.disabled = !listo();
            caja.querySelectorAll(`[data-e="${i.dataset.lib}"]`).forEach(b => b.classList.remove('on'));
          };
        });

        document.getElementById('mv-x').onclick = () => m.remove();
        caja.querySelectorAll('[data-e]').forEach(b => b.onclick = () => {
          const e = b.dataset.e, o = b.dataset.o;
          if (sel[e] === o) delete sel[e]; else sel[e] = o;
          // Al cambiar un eje de arriba, los de abajo pueden quedar inválidos.
          ejes.forEach(x => { if (sel[x.k] && !opciones(vars, x.k, sel, x.k).includes(sel[x.k])) delete sel[x.k]; });
          pintar();
        });
        const ok = document.getElementById('mv-ok');
        if (ok) ok.onclick = () => {
          if (!listo()) return;
          this.agregarEstandar(prod.nombre, elegida() || { id: null, precio: 0 }, prod.img, cant, tipo, armado());
          m.remove();
        };
      };
      pintar();
    },

    // Al catálogo se entra por los dos lados: bajando por categorías (rubro →
    // tipo de mueble) o escribiendo el nombre. Se combinan: se puede filtrar
    // una categoría y encima buscar por texto adentro.
    modalCatalogo() {
      this.modal(`<div class="row" style="margin-bottom:12px"><h3 style="color:var(--navy)">Catálogo</h3><div class="sp" style="flex:1"></div><button class="lx" id="mc-x" style="font-size:20px">✕</button></div>
        <input id="mc-q" placeholder="Buscar por nombre…" autocomplete="off" style="margin-bottom:12px">
        <div class="mc-wrap">
          <div class="mc-cats" id="mc-cats">${UI.spinner()}</div>
          <div class="mc-prods" id="mc-lista">${UI.spinner()}</div>
        </div>
        <style>
          .mc-wrap{display:grid;grid-template-columns:216px minmax(0,1fr);gap:14px;align-items:start}
          @media(max-width:640px){.mc-wrap{grid-template-columns:1fr}}

          @media(max-width:640px){.mc-cats{border-right:0;border-bottom:1px solid var(--line);padding:0 0 10px;max-height:150px}}
          .mc-prods{max-height:400px;overflow:auto}
          .mc-cat{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;font:inherit;font-size:13px;color:var(--ink);
            text-align:left;padding:6px 8px;border-radius:7px;cursor:pointer}
          .mc-cat:hover{background:var(--panel-2)}
          .mc-cat.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
          .mc-cat.hija{padding-left:22px;font-size:12.5px;color:var(--ink-soft)}
          .mc-cat .cn{margin-left:auto;font-size:11.5px;color:var(--muted)}
          .mc-cat.on .cn{color:var(--brand)}
        </style>`,
        m => {
          document.getElementById('mc-x').onclick = () => m.remove();
          let cat = null, texto = '', cats = [];

          const pintarCats = () => {
            const c = document.getElementById('mc-cats'); if (!c) return;
            // Se listan los rubros y, debajo, los tipos de mueble de cada uno.
            const padres = cats.filter(x => x.padre_id == null);
            const fila = (x, hija) => `<button class="mc-cat ${hija ? 'hija' : ''} ${cat === x.id ? 'on' : ''}" data-cat="${x.id}">
              ${UI.esc(x.nombre)}<span class="cn">${this._cuenta[x.id] ?? ''}</span></button>`;
            c.innerHTML = `<button class="mc-cat ${cat == null ? 'on' : ''}" data-cat="">Todas<span class="cn">${this._cuenta.total ?? ''}</span></button>`
              + padres.map(p => fila(p, false) + cats.filter(h => h.padre_id === p.id).map(h => fila(h, true)).join('')).join('');
            c.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
              cat = b.dataset.cat ? Number(b.dataset.cat) : null;
              pintarCats(); pintarProds();
            });
          };

          const pintarProds = async () => {
            const c = document.getElementById('mc-lista'); c.innerHTML = UI.spinner();
            try {
              // Los rubros no tienen productos propios: se busca en sus hijas.
              const hijas = cat != null ? cats.filter(x => x.padre_id === cat).map(x => x.id) : [];
              let prods;
              if (hijas.length) {
                const packs = await Promise.all(hijas.map(id => global.DB.productos({ texto, categoriaId: id, limite: 80 })));
                prods = packs.flat();
              } else {
                prods = await global.DB.productos({ texto, categoriaId: cat, limite: 80 });
              }
              c.innerHTML = prods.length ? `<table><thead><tr><th>Producto</th><th style="text-align:right">Var.</th><th></th></tr></thead>
                <tbody>${prods.map(p => `<tr><td><b>${UI.esc(p.nombre)}</b> ${p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>'}</td>
                <td style="text-align:right" class="tnum">${p.variantes}</td><td style="text-align:right"><button class="btn sm primary" data-p="${p.id}">Elegir</button></td></tr>`).join('')}</tbody></table>`
                : UI.vacio(texto || cat != null ? 'Nada acá. Probá otra categoría o cambiá el texto.' : 'Sin resultados.');
              c.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { m.remove(); this.elegirProducto(Number(b.dataset.p), prods.find(p => p.id === Number(b.dataset.p))); });
            } catch (e) { c.innerHTML = `<div class="banner warn">${UI.esc(e.message || e)}</div>`; }
          };

          const q = document.getElementById('mc-q');
          let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => { texto = q.value.trim(); pintarProds(); }, 220); };

          (async () => {
            try {
              cats = await global.DB.arbolCategorias();
              const todos = await global.DB.productos({ limite: 500 });
              // Cuántos productos cuelgan de cada categoría (el rubro suma sus hijas).
              this._cuenta = { total: todos.length };
              cats.forEach(x => { this._cuenta[x.id] = todos.filter(p => p.categoria_id === x.id).length; });
              cats.filter(x => x.padre_id == null).forEach(p => {
                this._cuenta[p.id] = cats.filter(h => h.padre_id === p.id)
                  .reduce((a, h) => a + (this._cuenta[h.id] || 0), 0);
              });
            } catch (e) { cats = []; this._cuenta = {}; }
            pintarCats(); pintarProds();
          })();
        }, 760);
    },

            <span class="ob-num">${UI.esc(o.numero)}</span>
            <div>
              <div class="ob-cli">${UI.esc(o.cliente)}</div>
              <div class="muted" style="font-size:12.5px">Vendedor ${UI.esc(o.vendedor)} · Entrega ${o.entrega ? UI.esc(o.entrega) : 'a definir'}</div>
            </div>
          </div>
          <div class="ob-h-r">
            ${UI.estado(DB.ESTADO_ORDEN, o.estado)}
            ${o.reclamo ? '<span class="pill crit">Reclamo</span>' : ''}
            ${o.factura !== 'no' ? `<span class="pill ${o.factura === 'hecha' ? 'ok' : 'warn'}">${facTxt}</span>` : ''}
          </div>
        </div>

        <div class="ob-pay">
          <div class="ob-pay-f">
            <label>Forma de pago</label>
            <select id="ob-forma">${FORMAS.map(f => `<option ${f === o.pago ? 'selected' : ''}>${f}</option>`).join('')}</select>
            ${recargo ? `<span class="ob-rec">+${Math.round(recargoPct * 100)}% recargo</span>` : '<span class="muted" style="font-size:12px">sin recargo</span>'}
          </div>
          <div class="ob-acc">
            <button class="btn sm" id="ob-modif">Modificar orden</button>
            <button class="btn sm" id="ob-prod">Ver producción</button>
            <button class="btn sm" id="ob-logi">Ver logística</button>
          </div>
        </div>

        <div class="ob-cols">
          <div>
            ${card('Muebles', `<table class="ob-mueb">
              <thead><tr><th></th><th>Producto</th><th>Tipo</th><th style="text-align:center">Cant.</th><th style="text-align:right">Monto</th></tr></thead>
              <tbody>${(o.lineas || []).map(l => `<tr>
              <td class="mimg"><div class="mono">${inic(l.producto)}</div></td>
              <td><b>${UI.esc(l.producto)}</b>${l.variante ? `<div class="muted" style="font-size:12px">${UI.esc(l.variante)}</div>` : ''}
                ${l.bloqueo ? `<div class="ob-blq-tag">Falta ${l.bloqueo === 'precio' ? 'autorizar precio' : 'verificar obs.'}</div>` : ''}</td>
              <td><span class="tipo ${l.tipo}">${l.tipo === 'medida' ? 'A medida' : 'Estándar'}</span></td>
              <td class="muted" style="text-align:center">${l.cantidad}</td>
              <td class="tnum" style="text-align:right"><b>${UI.pesos(l.precio * l.cantidad)}</b></td></tr>`).join('')}</tbody></table>`)}

            ${card('Historial de comentarios', `
              <div id="ob-coms">${this.comentariosHTML(o)}</div>
              <div class="wrap-row" style="gap:8px;margin-top:8px">
                <input id="ob-com" placeholder="Sumá una nota (queda con tu área)…" style="flex:1">
                <button class="btn sm primary" id="ob-com-add">Agregar</button></div>`)}
          </div>

          <div>
            ${card('Totales y pago', `
              <div class="pg"><span>Subtotal muebles</span><b class="tnum">${UI.pesos(base)}</b></div>
              ${recargo ? `<div class="pg"><span>Recargo (${o.pago})</span><b class="tnum" style="color:var(--warn)">+${UI.pesos(recargo)}</b></div>` : ''}
              ${flete ? `<div class="pg"><span>Flete${o.flete?.detalle ? ' · ' + UI.esc(o.flete.detalle) : ''}</span><b class="tnum">${UI.pesos(flete)}</b></div>` : ''}
              ${inst ? `<div class="pg"><span>Instalación${o.instalacion?.detalle ? ' · ' + UI.esc(o.instalacion.detalle) : ''}</span><b class="tnum">${UI.pesos(inst)}</b></div>` : ''}
              <div class="pg pg-tot"><span>Total</span><b class="tnum" style="color:var(--navy)">${UI.pesos(o.total)}</b></div>
              <div class="pg"><span>Pagado (seña)</span><b class="tnum" style="color:var(--ok)">${UI.pesos(o.sena || 0)}${rendida ? ' ✓' : (pend ? ' ⏳' : '')}</b></div>
              <div class="pg"><span>Saldo</span><b class="tnum" style="color:${o.saldo ? 'var(--crit)' : 'var(--ok)'}">${UI.pesos(o.saldo || 0)}</b></div>
              <div class="muted" style="font-size:12px;margin-top:4px">${rendida ? 'Rendición confirmada por el vendedor ✓' : (pend ? 'Falta acreditar en banco' : 'Sin cobros')}</div>
              <button class="btn sm" id="ob-sena" style="margin-top:10px;width:100%">Señas y cobros</button>`)}

            ${card('Flete e instalación', `
              <div class="ob-file"><span style="flex:1">Flete</span><b class="tnum">${flete ? UI.pesos(flete) : '—'}</b></div>
              ${o.flete?.detalle ? `<div class="muted" style="font-size:11.5px;margin:-2px 0 6px">${UI.esc(o.flete.detalle)}${o.flete?.escalera ? ' · subida por escalera' : ''}</div>` : ''}
              <div class="ob-file"><span style="flex:1">Instalación</span><b class="tnum">${inst ? UI.pesos(inst) : '—'}</b></div>
              ${o.instalacion?.detalle ? `<div class="muted" style="font-size:11.5px;margin:-2px 0 6px">${UI.esc(o.instalacion.detalle)}</div>` : ''}
              <button class="btn sm" id="ob-flete" style="margin-top:6px;width:100%">Editar flete / instalación</button>`)}

            ${bloqueos.length ? `<div class="pcard ob-blq" style="margin-bottom:14px"><h3 style="color:var(--crit)">Bloqueos</h3>
              ${bloqueos.map(b => `<div class="ob-blq-row">${UI.esc(b)}</div>`).join('')}</div>` : ''}

            ${card('Archivos', `${(o.archivos || []).length
              ? (o.archivos || []).map(a => `<div class="ob-file"><span style="flex:1">${UI.esc(a.nombre)}</span><span class="pill soft" style="font-size:10px">${UI.esc(a.area)}</span></div>`).join('')
              : '<div class="muted" style="font-size:13px">Sin archivos cargados.</div>'}
              <button class="btn sm" id="ob-file-add" style="margin-top:8px;width:100%">+ Subir archivo</button>
              <div class="muted" style="font-size:11px;margin-top:6px">Se guardan en el cajón exclusivo de Contabilidad.</div>`)}
          </div>
        </div>
        ${ESTILO}`;

      document.getElementById('ob-volver').onclick = () => { if (V) V(); else global.App.goSub('ventas', 'resumen'); };
      document.getElementById('ob-forma').onchange = e => { o.pago = e.target.value; this.renderBoleta(); UI.aviso('Total recalculado por forma de pago', 'info'); };
      document.getElementById('ob-modif').onclick = () => UI.aviso('Modificar orden — próximo paso', 'info');
      document.getElementById('ob-prod').onclick = () => global.App.goSub('produccion', 'resumen');
      document.getElementById('ob-logi').onclick = () => global.App.goSub('logistica', 'resumen');
      document.getElementById('ob-sena').onclick = () => global.VentasPanel.modalSenas(o);
      document.getElementById('ob-flete').onclick = () => UI.aviso('Editar flete / instalación — próximo paso', 'info');
      document.getElementById('ob-file-add').onclick = () => UI.aviso('Subir archivo — se guarda en Contabilidad (próximo paso)', 'info');
      const add = () => {
        const el = document.getElementById('ob-com'); const t = el.value.trim(); if (!t) return;
        const area = { direccion: 'Dirección', vendedor: 'Ventas', administrativo: 'Administración', prod: 'Producción', logi: 'Logística', gestion: 'CRM' }[global.App.rol] || 'Ventas';
        (o.comentarios = o.comentarios || []).push({ area, texto: t, f: 'hoy' });
        el.value = ''; document.getElementById('ob-coms').innerHTML = this.comentariosHTML(o);
      };
      document.getElementById('ob-com-add').onclick = add;
      document.getElementById('ob-com').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
    },

    comentariosHTML(o) {
      return (o.comentarios || []).length
        ? (o.comentarios || []).map(c => `<div class="ob-com-row">
            <span class="pill soft" style="font-size:10px">${UI.esc(c.area || '—')}</span>
            <span style="flex:1">${UI.esc(c.texto)}</span>
            <span class="muted" style="font-size:11px">${UI.esc(c.f || '')}</span></div>`).join('')
        : '<div class="muted" style="font-size:13px">Todavía no hay comentarios.</div>';
    },

    pintar() {
      const o = this._o, ctx = this._ctx, m = M();
      const condO = m.evalChecks(m.COND_ORDEN, o, null, 'orden', 'ui', o);
      const [ecLabel, ecTone] = EST_COM[o.estadoComercial] || ['—', 'soft'];
      const libres = o.lineas.filter(l => l.habilitacion === 'liberada').length;
      const bloq = o.lineas.filter(l => l.habilitacion === 'bloqueada').length;
      const pagado = m.pagosValidados(o), saldo = m.saldo(o);
      const objs = o.lineas.flatMap(l => l.objetosOperativos.map(x => ({ ...x, linea: l.id })));

      document.getElementById(this._mount).innerHTML = `
        <button class="btn sm" id="od-volver" style="margin-bottom:14px">← Órdenes</button>
        <div class="od-head">
          <div>
            <div class="kick">Orden de venta</div>
            <h1 class="h-title">${o.id}</h1>
            <div class="od-cli">
              <b>${UI.esc(o.cliente.nombre || 'Cliente')}</b>
              <span class="muted">${[o.cliente.tel, o.cliente.ig, o.cliente.dir].filter(Boolean).map(UI.esc).join(' · ')}</span>
            </div>
          </div>
          <div class="od-estados">
            <div class="od-badge"><span class="lb">Comercial</span> <span class="pill ${ecTone}">${ecLabel}</span></div>
            <div class="od-badge"><span class="lb">Operativo</span> <span class="muted">${libres} liberada(s) · ${bloq} bloqueada(s)</span></div>
          </div>
        </div>

        <div class="od-cols">
          <div class="od-main">
            ${this.bloqueLineas(o)}
            ${this.bloqueObjetos(objs)}
            ${this.bloqueActividad(ctx)}
          </div>
          <div class="od-side">
            ${this.bloqueCondiciones('Condiciones de la orden', condO)}
            ${this.bloquePagos(o, pagado, saldo)}
            ${this.bloqueAcciones(o)}
          </div>
        </div>
        ${ESTILO}`;

      const V = this._volver;
      document.getElementById('od-volver').onclick = () => { if (V) V(); else global.App.goSub('ventas', 'ordenes'); };
      this.enganchar();
    },

    bloqueLineas(o) {
      const m = M();
      return card('Líneas del pedido', o.lineas.map(l => {
        const [hLabel, hTone] = HAB[l.habilitacion] || ['—', 'soft'];
        const condL = m.evalChecks(m.COND_LINEA, l, null, 'linea', 'ui', o);
        const faltan = condL.filter(c => !c.ok);
        return `<div class="lrow2">
          <div class="lr-top">
            <div><b>${UI.esc(l.producto)}</b> <span class="muted" style="font-size:12px">· ${UI.esc(l.tipo)}</span></div>
            <span class="pill ${hTone}">${hLabel}${l.cumplimiento && l.cumplimiento !== 'sin_iniciar' ? ' · ' + l.cumplimiento : ''}</span>
          </div>
          ${l.objetosOperativos.length ? `<div class="muted" style="font-size:12px">→ ${l.objetosOperativos.map(x => m.ETIQUETA_EFECTO[x.tipoObjeto] || x.tipoObjeto).join(' + ')}</div>` : ''}
          ${l.bloqueos.length ? `<div class="lr-bloq">⛔ ${l.bloqueos.map(b => bloqTexto(b)).join(' · ')}</div>` : ''}
          ${faltan.length && l.habilitacion !== 'liberada' ? `<div class="lr-acc">${accionesLinea(l, faltan)}</div>` : ''}
        </div>`;
      }).join(''));
    },

    bloqueCondiciones(titulo, checks) {
      return card(titulo, `<div class="chk">${checks.map(c =>
        `<div class="chk-row"><span class="chk-i ${c.ok ? 'ok' : 'no'}">${c.ok ? '✓' : '✕'}</span>
          <span>${UI.esc(c.label)}</span><span class="muted" style="margin-left:auto;font-size:12px">${UI.esc(c.resp)}</span></div>`).join('')}</div>`);
    },

    bloquePagos(o, pagado, saldo) {
      return card('Pagos y saldo', `
        <div class="pg"><span>Total</span><b class="tnum">${UI.pesos(o.total)}</b></div>
        <div class="pg"><span>Pagado</span><b class="tnum" style="color:var(--ok)">${UI.pesos(pagado)}</b></div>
        <div class="pg"><span>Saldo</span><b class="tnum" style="color:var(--warn)">${UI.pesos(saldo)}</b></div>
        <div class="muted" style="font-size:12px;margin-top:8px">${o.cobros.filter(c => c.estado === 'validado').length} cobro(s) · término ${UI.esc(o.termino)}</div>
        <button class="btn sm" id="od-pago" style="margin-top:10px;width:100%">+ Registrar pago</button>`);
    },

    bloqueObjetos(objs) {
      if (!objs.length) return '';
      const m = M();
      return card('Objetos operativos generados', `<div class="obj">${objs.map(x =>
        `<div class="obj-row"><span class="pill info">${m.ETIQUETA_EFECTO[x.tipoObjeto] || x.tipoObjeto}</span>
          <span class="muted" style="font-size:12px">línea ${x.linea}</span></div>`).join('')}</div>`);
    },

    bloqueActividad(ctx) {
      const evs = ctx.eventos.slice().reverse().slice(0, 10);
      return card('Actividad', `<div class="tl">${evs.map(e =>
        `<div class="ev"><span class="d" style="background:var(--brand)"></span>
          <span><b>${UI.esc(e.evento)}</b> <span class="muted" style="font-size:12px">${UI.esc(JSON.stringify(e.payload))}</span></span></div>`).join('')}</div>`);
    },

    bloqueAcciones(o) {
      return card('Acciones', `<div class="wrap-row">
        <button class="btn sm" id="od-modif">Modificar orden</button>
        <button class="btn sm" id="od-prod">Ver producción</button>
        <button class="btn sm" id="od-logi">Ver logística</button>
      </div>`);
    },

    enganchar() {
      const o = this._o, ctx = this._ctx, m = M(), self = this;
      document.getElementById('od-pago').onclick = () => this.modalPago();
      ['od-modif', 'od-prod', 'od-logi'].forEach(id => { const b = document.getElementById(id); if (b) b.onclick = () => UI.aviso('Próximo paso', 'info'); });
      document.querySelectorAll('[data-accion]').forEach(b => b.onclick = () => {
        const l = o.lineas.find(x => x.id === b.dataset.linea);
        const a = b.dataset.accion;
        if (a === 'autorizar_precio') { l.precioAutorizado = true; ctx.emit('autorizacion.aprobada', { linea: l.id, resp: 'Administración' }); }
        else if (a === 'verificar_obs') { l.obsVerificada = true; ctx.emit('obs.verificada', { linea: l.id }); }
        else if (a === 'solicitar_autorizacion') { m.solicitarExcepcion(o, 'sena_fabricacion', { solicitadaPor: o.vendedor, motivo: 'autorizado desde detalle' }, ctx); }
        else if (a === 'autorizar_sena') { m.autorizarExcepcion(o, 'sena_fabricacion', { autorizadaPor: 'Dirección' }, ctx); }
        else if (a === 'registrar_pago') { return this.modalPago(); }
        m.evaluar(o, ctx, 'ui.accion');
        self.pintar();
      });
    },

    modalPago() {
      const o = this._o, ctx = this._ctx, m = M(), self = this;
      const saldo = m.saldo(o);
      const id = 'od-mp';
      document.body.insertAdjacentHTML('beforeend', `
        <div class="mdlbg" id="${id}" style="position:fixed;inset:0;background:rgba(20,26,38,.4);z-index:50;display:grid;place-items:center;padding:20px">
          <div class="card pad" style="max-width:380px;width:100%">
            <h3 style="color:var(--navy);margin:0 0 4px">Registrar pago</h3>
            <p class="muted" style="font-size:13px;margin:0 0 12px">Saldo: ${UI.pesos(saldo)}. El cobro es del cliente (Tesorería) e imputa a la orden.</p>
            <label class="fld"><span class="lbl">Monto</span><input id="mp-monto" type="number" value="${Math.max(0, saldo)}"></label>
            <label class="fld" style="margin-top:10px"><span class="lbl">Forma</span>
              <select id="mp-forma"><option>efectivo</option><option>transferencia</option><option>tarjeta</option></select></label>
            <div class="row" style="justify-content:flex-end;gap:10px;margin-top:16px">
              <button class="btn sm" id="mp-x">Cancelar</button>
              <button class="btn sm primary" id="mp-ok">Registrar</button></div>
          </div></div>`);
      const cerrar = () => { const e = document.getElementById(id); if (e) e.remove(); };
      document.getElementById('mp-x').onclick = cerrar;
      document.getElementById(id).onclick = e => { if (e.target.id === id) cerrar(); };
      document.getElementById('mp-ok').onclick = () => {
        const monto = Math.max(0, Number(document.getElementById('mp-monto').value) || 0);
        m.registrarCobro(o, { monto, estado: 'validado', forma: document.getElementById('mp-forma').value }, ctx);
        cerrar(); self.pintar(); UI.aviso('Pago registrado', 'ok');
      };
    },
  };

  function card(titulo, cuerpo) { return `<div class="pcard" style="margin-bottom:14px"><h3>${UI.esc(titulo)}</h3>${cuerpo}</div>`; }
  function bloqTexto(b) {
    if (b.motivo === 'reversion') return `reversión (${b.clave}) — ${b.accion || ''}`;
    return `${b.motivo || b.clave} <span class="muted">(${b.alcance})</span>`;
  }
  function accionesLinea(l, faltan) {
    const claves = faltan.map(c => c.clave);
    const btns = [];
    if (claves.includes('precio')) btns.push(btn('autorizar_precio', l.id, 'Autorizar precio', true));
    if (claves.includes('obs')) btns.push(btn('verificar_obs', l.id, 'Verificar observación'));
    if (claves.includes('sena_fabricacion')) {
      const pend = false;
      btns.push(btn('registrar_pago', l.id, 'Registrar pago'));
      btns.push(btn('solicitar_autorizacion', l.id, 'Solicitar autorización'));
      btns.push(btn('autorizar_sena', l.id, 'Autorizar (Dirección)', true));
    }
    return btns.join('');
  }
  function btn(accion, linea, txt, primary) {
    return `<button class="btn sm ${primary ? 'primary' : ''}" data-accion="${accion}" data-linea="${linea}">${txt}</button>`;
  }

  const ESTILO = `<style>
    .od-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
    .od-cli{margin-top:6px;display:flex;flex-direction:column} .od-cli b{color:var(--navy)}
    .od-estados{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
    .od-badge{display:flex;align-items:center;gap:8px} .od-badge .lb{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
    .od-cols{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start} @media(max-width:860px){.od-cols{grid-template-columns:1fr}}
    .lrow2{padding:12px 0;border-bottom:1px solid var(--line-soft)} .lrow2:last-child{border-bottom:0}
    .lr-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .lr-bloq{color:var(--crit);font-size:13px;margin-top:6px} .lr-acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .chk-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
    .chk-i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
    .chk-i.ok{background:var(--ok-bg);color:var(--ok)} .chk-i.no{background:var(--crit-bg);color:var(--crit)}
    .pg{display:flex;justify-content:space-between;padding:5px 0;font-size:14px} .pg span{color:var(--ink-soft)}
    .obj-row{display:flex;align-items:center;gap:10px;padding:5px 0}
    /* Detalle de boleta */
    .ob-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
    .ob-h-l{display:flex;align-items:center;gap:12px}
    .ob-num{font-size:22px;font-weight:800;color:var(--brand)}
    .ob-cli{font-size:17px;font-weight:800;color:var(--navy)}
    .ob-h-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .ob-acc{display:flex;gap:8px;flex-wrap:wrap}
    .ob-pay{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
    .ob-pay-f{display:flex;align-items:center;gap:10px}
    .ob-pay-f label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
    .ob-pay-f select{font-size:16px;font-weight:700;color:var(--navy);padding:7px 10px;border-radius:9px;border:1px solid var(--line)}
    .ob-rec{background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px}
    .ob-cols{display:grid;grid-template-columns:1fr 350px;gap:16px;align-items:start}
    @media(max-width:900px){.ob-cols{grid-template-columns:1fr}}
    .ob-mueb{width:100%;border-collapse:collapse}
    .ob-mueb thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;padding:0 6px 8px}
    .ob-mueb td{padding:9px 6px;border-top:1px solid var(--line-soft);vertical-align:middle}
    .ob-mueb .mimg{width:44px} .ob-mueb .mono{width:38px;height:38px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink-soft)}
    .ob-mueb .tipo{font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft)}
    .ob-mueb .tipo.medida{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
    .ob-blq-tag{color:var(--crit);font-size:12px;font-weight:600;margin-top:2px}
    .pg-tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-size:15px}
    .ob-blq{border:1px solid var(--crit)} .ob-blq-row{color:var(--crit);font-size:13px;padding:5px 0;border-bottom:1px solid var(--crit-bg)}
    .ob-blq-row:last-child{border-bottom:0}
    .ob-file{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
    .ob-com-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
    .ob-com-row:last-child{border-bottom:0}
  </style>`;

  global.OrdenDetalle = Detalle;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================
//  Belgrano Soft · Ventas · Panel (Resumen para Dirección)
//  Tablero arriba (KPIs + filtro de fecha + nueva venta/cotización),
//  "Mis pendientes" (consultas de cualquier módulo en un solo lugar) y
//  abajo la tabla de TODAS las boletas con su estado resumen y filtros.
//  Entrar a una fila → el historial de la boleta (Detalle de Orden).
// =====================================================================
(function (global) {
  const FILTROS = [
    { k: 'activas', label: 'Activas' },
    { k: 'a_confirmar', label: 'A confirmar' },
    { k: 'preproduccion', label: 'Preproducción' },
    { k: 'fabricacion', label: 'En fabricación' },
    { k: 'listo', label: 'Listos' },
    { k: 'logistica', label: 'En logística' },
    { k: 'reclamo', label: 'Reclamos' },
    { k: 'entregado', label: 'Entregadas' },
    { k: 'archivado', label: 'Archivadas' },
    { k: '', label: 'Todas' },
  ];
  // Columnas ordenables → cómo obtener el valor de comparación.
  const SORT = {
    numero: o => o.numero, cliente: o => o.cliente, pago: o => o.pago,
    total: o => o.total, sena: o => o.sena, saldo: o => o.saldo,
    items: o => o.items, estado: o => o.estado, entrega: o => o.entrega || '',
  };

  const VentasPanel = {
    _mount: 'view', grupo: 'activas', vendedor: '', texto: '', periodo: 'hoy',
    orden: { campo: '', dir: 1 }, _expand: {},

    async render(mount = 'view') {
      this._mount = mount;
      const v = document.getElementById(mount);
      const st = await global.DB.estadisticasVentas();
      const W = global.Widgets;

      v.innerHTML = `
        ${UI.head('Ventas', 'Panel', 'Todas las boletas de un vistazo. Filtrá por estado o vendedor y entrá al historial.',
          `<div class="wrap-row" style="justify-content:flex-end">
             <button class="btn primary" id="vp-venta">+ Nueva venta</button>
             <button class="btn" id="vp-cotiz">+ Nueva cotización</button>
           </div>`)}

        <div class="per" style="margin-bottom:12px" id="vp-per">
          ${['Hoy', 'Ayer', '7 días', '30 días', 'Personalizado'].map((p, i) =>
            `<button class="${i === 0 ? 'on' : ''}">${p}</button>`).join('')}
        </div>

        ${W.kpis([
          { lab: 'Ventas de hoy', em: '💵', tono: 'ok', val: UI.pesos(st.ventasHoy), foot: '<span class="up">▲ 14%</span> vs ayer' },
          { lab: 'Ventas del mes', em: '📈', tono: 'info', val: UI.pesos(st.ventasMes), foot: 'Objetivo ' + Math.round(st.ventasMes / st.objetivoMes * 100) + '%', obj: st.ventasMes / st.objetivoMes * 100 },
          { lab: 'Órdenes activas', em: '🧾', tono: 'soft', val: st.ordenesActivas, foot: st.aConfirmar + ' a confirmar' },
          { lab: 'Por cobrar', em: '💰', tono: 'warn', val: UI.pesos(st.porCobrar) },
          { lab: 'Cotizaciones abiertas', em: '📄', tono: 'soft', val: st.cotizacionesAbiertas },
          { lab: 'Ticket promedio', em: '🎟️', tono: 'info', val: UI.pesos(st.ticket), foot: st.operaciones + ' operaciones' },
        ])}

        <div class="pcard" style="margin-top:14px">
          <div class="row" style="margin-bottom:8px"><h3 style="margin:0;color:var(--navy);font-size:15px">Boletas</h3><div class="sp"></div>
            <select id="vp-vend" class="vp-vend"><option value="">Todos los vendedores</option>
              ${global.DB.vendedores().map(x => `<option ${this.vendedor === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
            <input id="vp-q" placeholder="Cliente o N°…" style="width:160px">
          </div>
          <div class="chips" id="vp-chips">${FILTROS.map(f =>
            `<button class="chip ${this.grupo === f.k ? 'on' : ''}" data-g="${f.k}">${f.label}</button>`).join('')}</div>
          <div id="vp-tabla" style="margin-top:10px">${UI.spinner()}</div>
        </div>

        <style>
          .per{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
          .per button{border:0;background:var(--panel);color:var(--muted);padding:7px 12px;font-size:13px;cursor:pointer}
          .per button+button{border-left:1px solid var(--line)}
          .per button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
          .vp-vend{width:auto;font-size:13px;padding:7px 10px}
          .chips{display:flex;gap:6px;flex-wrap:wrap}
          .chip{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-size:13px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer}
          .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
        </style>`;

      document.getElementById('vp-venta').onclick = () => global.App.goSub('ventas', 'nueva');
      document.getElementById('vp-cotiz').onclick = () => global.App.goSub('ventas', 'nueva');
      document.getElementById('vp-vend').onchange = e => { this.vendedor = e.target.value; this.pintarTabla(); };
      const q = document.getElementById('vp-q'); let t;
      q.oninput = () => { clearTimeout(t); t = setTimeout(() => { this.texto = q.value.trim(); this.pintarTabla(); }, 200); };
      v.querySelectorAll('#vp-chips [data-g]').forEach(b => b.onclick = () => {
        this.grupo = b.dataset.g;
        v.querySelectorAll('#vp-chips .chip').forEach(x => x.classList.toggle('on', x.dataset.g === this.grupo));
        this.pintarTabla();
      });
      v.querySelectorAll('#vp-per button').forEach(b => b.onclick = () => {
        v.querySelectorAll('#vp-per button').forEach(x => x.classList.remove('on')); b.classList.add('on');
      });
      this.pintarTabla();
    },

    // Encabezado ordenable: click alterna asc/desc; muestra ▲/▼.
    th(campo, label, extra = '') {
      const act = this.orden.campo === campo;
      const fl = act ? (this.orden.dir === 1 ? ' ▲' : ' ▼') : '';
      return `<th class="so" data-sort="${campo}" ${extra}>${label}<span class="fl">${fl}</span></th>`;
    },

    async pintarTabla() {
      const cont = document.getElementById('vp-tabla'); if (!cont) return;
      let bs = await global.DB.boletas({ texto: this.texto, grupo: this.grupo, vendedor: this.vendedor });
      if (this.orden.campo && SORT[this.orden.campo]) {
        const g = SORT[this.orden.campo], d = this.orden.dir;
        bs = bs.slice().sort((a, b) => {
          const x = g(a), y = g(b);
          return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'es')) * d;
        });
      }
      this._bs = bs;
      const DB = global.DB;
      cont.innerHTML = bs.length ? `<div style="overflow-x:auto"><table class="vp-t">
        <thead><tr>
          ${this.th('numero', 'N°')}${this.th('cliente', 'Cliente')}${this.th('pago', 'Pago')}
          ${this.th('total', 'Total', 'style="text-align:right"')}${this.th('sena', 'Seña', 'style="text-align:right"')}${this.th('saldo', 'Saldo', 'style="text-align:right"')}
          ${this.th('items', 'Muebles', 'style="text-align:center"')}${this.th('estado', 'Estado')}${this.th('entrega', 'Entrega')}
          <th title="Recordatorios">🔔</th><th title="Comentarios">💬</th><th></th></tr></thead>
        <tbody>${bs.map(o => {
          const cob = o.cobros || [];
          const pend = cob.filter(c => c.estado === 'pendiente_banco').reduce((a, c) => a + c.m, 0);
          const desglose = cob.length
            ? cob.map(c => `${c.f}  ${UI.pesos(c.metodo === 'transferencia' ? (c.montoConfirmado ?? c.m) : c.m)}  ${c.metodo === 'transferencia' ? 'transf.' : 'efvo.'} · ${(DB.ESTADO_COBRO[c.estado] || {}).label || c.estado}`).join('\n')
            : 'Sin señas registradas';
          const senaCell = o.sena
            ? `<span style="color:var(--ok);font-weight:700">${UI.pesos(o.sena)}</span> <span style="color:var(--ok)" title="Seña cobrada y verificada">✓</span>${pend ? `<div style="font-size:10.5px;color:var(--warn);white-space:nowrap">⏳ +${UI.pesos(pend)} sin acreditar</div>` : ''}`
            : (pend ? `<span style="color:var(--warn);font-weight:700">⏳ ${UI.pesos(pend)}</span><div style="font-size:10.5px;color:var(--warn);white-space:nowrap">transf. sin acreditar</div>` : '<span class="muted">—</span>');
          const bloqueaMueble = (o.lineas || []).some(l => l.bloqueo);
          const nc = (o.comentarios || []).length, nr = (o.recordatorios || []).length;
          const abierto = !!this._expand[o.id];
          const detalle = abierto ? `<tr class="vp-det" data-detrow="${o.id}"><td colspan="12"><div class="vp-mueb">
            ${(o.lineas || []).map(l => `<div class="ml">
              <div class="mimg">🪑</div>
              <div style="flex:1"><b>${UI.esc(l.producto)}</b> <span class="pill soft" style="font-size:10px">${l.tipo === 'medida' ? '📐 a medida' : '📦 estándar'}</span>${l.bloqueo ? ` <span class="pill crit" style="font-size:10px">⛔ ${UI.esc(l.bloqueo)}</span>` : ''}</div>
              <div class="muted" style="width:60px;text-align:center">x${l.cantidad}</div>
              <div class="tnum" style="width:110px;text-align:right"><b>${UI.pesos(l.precio * l.cantidad)}</b></div></div>`).join('')}
          </div></td></tr>` : '';
          return `<tr data-b="${o.id}">
          <td data-open><b style="color:var(--brand)">${UI.esc(o.numero)}</b><div class="muted" style="font-size:11px">${UI.esc(o.fecha)}</div></td>
          <td data-open style="font-weight:600">${UI.esc(o.cliente)}</td>
          <td class="muted">${UI.esc(o.pago)}</td>
          <td class="tnum" style="text-align:right"><b style="color:var(--navy)">${UI.pesos(o.total)}</b></td>
          <td class="tnum" style="text-align:right;cursor:pointer" data-sena title="${UI.esc(desglose)}">${senaCell}</td>
          <td class="tnum" style="text-align:right">${o.saldo ? `<span style="color:var(--crit);font-weight:700">${UI.pesos(o.saldo)}</span>` : '<span class="pill ok" style="font-size:10px">saldado</span>'}</td>
          <td style="text-align:center"><button class="mueb ${bloqueaMueble ? 'blq' : ''}" data-exp title="Ver muebles">🪑 ${o.items} <span class="ch">${abierto ? '▲' : '▾'}</span></button></td>
          <td data-open>${UI.estado(DB.ESTADO_ORDEN, o.estado)}${o.reclamo ? ' <span class="pill crit" style="font-size:10px">⚠ Reclamo</span>' : ''}</td>
          <td>${o.entrega ? `📅 ${UI.esc(o.entrega)}` : '<span class="muted">a definir</span>'}</td>
          <td style="text-align:center"><button class="ib" data-rec title="Recordatorios">🔔${nr ? `<span class="cbadge">${nr}</span>` : ''}</button></td>
          <td style="text-align:center"><button class="ib" data-nota title="Comentarios">💬${nc ? `<span class="cbadge">${nc}</span>` : ''}</button></td>
          <td style="text-align:center"><button class="ib" data-menu title="Vendedor y acciones">⋮</button></td></tr>${detalle}`;
        }).join('')}</tbody></table></div>
        <style>
          .vp-t td{vertical-align:middle}
          .vp-t th.so{cursor:pointer;user-select:none;white-space:nowrap}
          .vp-t th.so:hover{color:var(--brand)}.vp-t th .fl{color:var(--brand);font-size:10px}
          .vp-t .ib{position:relative;border:0;background:none;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:7px;line-height:1;color:var(--ink-soft)}
          .vp-t .ib:hover{background:var(--line-soft)}
          .vp-t .cbadge{position:absolute;top:-2px;right:-2px;background:var(--brand);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 3px}
          .vp-t .mueb{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:3px 9px;font-size:12px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
          .vp-t .mueb:hover{border-color:var(--brand)}.vp-t .mueb .ch{color:var(--muted);font-size:10px}
          .vp-t .mueb.blq{border-color:var(--crit);color:var(--crit)}
          .vp-det td{background:var(--panel-2);padding:6px 12px 10px}
          .vp-mueb{display:flex;flex-direction:column;gap:6px}
          .vp-mueb .ml{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line-soft);border-radius:9px;padding:7px 10px}
          .vp-mueb .mimg{width:34px;height:34px;border-radius:7px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:16px}
          [data-open]{cursor:pointer}
        </style>`
        : UI.vacio('No hay boletas para ese filtro.');

      cont.querySelectorAll('th.so').forEach(th => th.onclick = () => {
        const c = th.dataset.sort;
        if (this.orden.campo === c) this.orden.dir *= -1; else { this.orden.campo = c; this.orden.dir = 1; }
        this.pintarTabla();
      });
      const abrir = o => global.OrdenDetalle.render(this._mount, { boleta: o }, () => this.render(this._mount));
      cont.querySelectorAll('tr[data-b]').forEach(tr => {
        const o = bs.find(x => String(x.id) === tr.dataset.b);
        tr.querySelectorAll('[data-open]').forEach(td => td.onclick = () => abrir(o));
        tr.querySelector('[data-sena]').onclick = e => { e.stopPropagation(); this.modalSenas(o); };
        tr.querySelector('[data-exp]').onclick = e => { e.stopPropagation(); this._expand[o.id] = !this._expand[o.id]; this.pintarTabla(); };
        tr.querySelector('[data-rec]').onclick = e => { e.stopPropagation(); this.modalRecordatorios(o); };
        tr.querySelector('[data-nota]').onclick = e => { e.stopPropagation(); this.modalNota(o); };
        tr.querySelector('[data-menu]').onclick = e => { e.stopPropagation(); this.menuAcciones(o, e.currentTarget); };
      });
    },

    // Popover de acciones (⋮): abrir la orden, señas, confirmar en banco, nota.
    menuAcciones(o, btn) {
      document.getElementById('_vpmenu')?.remove();
      const r = btn.getBoundingClientRect();
      const m = document.createElement('div');
      m.id = '_vpmenu';
      m.style.cssText = `position:fixed;top:${Math.round(r.bottom + 4)}px;left:${Math.round(r.right - 210)}px;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 26px rgba(15,26,42,.16);width:210px;padding:5px;font-size:13px`;
      const item = (emo, txt) => `<button class="mi" style="display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 9px;border-radius:7px;cursor:pointer;font:inherit;color:var(--ink)"><span>${emo}</span>${txt}</button>`;
      // Confirmar en banco: solo si hay una transferencia sin acreditar y el rol lo permite.
      const hayPend = (o.cobros || []).some(c => c.estado === 'pendiente_banco');
      const puedeConfirmar = ['direccion', 'administrativo'].includes(global.App.rol);
      m.innerHTML = `<div style="padding:7px 10px 8px;border-bottom:1px solid var(--line-soft);margin-bottom:4px">
          <div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.04em">Vendedor</div>
          <b style="font-size:13px">${UI.esc(o.vendedor)}</b></div>`
        + item('📂', 'Abrir orden') + item('💵', 'Señas y cobros')
        + (hayPend && puedeConfirmar ? item('🏦', 'Confirmar seña en banco') : '')
        + item('💬', 'Agregar comentario');
      document.body.appendChild(m);
      m.querySelectorAll('.mi').forEach(b => { b.onmouseenter = () => b.style.background = 'var(--line-soft)'; b.onmouseleave = () => b.style.background = 'none'; });
      const items = m.querySelectorAll('.mi');
      items[0].onclick = () => { m.remove(); global.OrdenDetalle.render(this._mount, null, () => this.render(this._mount)); };
      items[1].onclick = () => { m.remove(); this.modalSenas(o); };
      if (hayPend && puedeConfirmar) {
        items[2].onclick = () => { m.remove(); this.modalSenas(o); };   // abre señas; ahí está el botón "Confirmar en banco"
        items[3].onclick = () => { m.remove(); this.modalNota(o); };
      } else {
        items[2].onclick = () => { m.remove(); this.modalNota(o); };
      }
      setTimeout(() => document.addEventListener('click', function h() { m.remove(); document.removeEventListener('click', h); }), 0);
    },

    _shell(inner, ancho = 480) {
      document.getElementById('_vpmodal')?.remove();
      const ov = document.createElement('div');
      ov.id = '_vpmodal';
      ov.style.cssText = 'position:fixed;inset:0;z-index:90;background:rgba(15,26,42,.42);display:flex;align-items:center;justify-content:center;padding:16px';
      ov.innerHTML = `<div style="background:var(--panel);border-radius:14px;width:min(${ancho}px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(15,26,42,.3)">${inner}</div>`;
      document.body.appendChild(ov);
      ov.onclick = e => { if (e.target === ov) ov.remove(); };
      return ov;
    },

    // Diálogo de señas y cobros: lista cada cobro con su método y estado de
    // verificación, permite registrar una nueva seña (efvo/transf.) y —para
    // Dirección/Administración— confirmar una transferencia contra el banco.
    modalSenas(o) {
      const DB = global.DB;
      const puedeConfirmar = ['direccion', 'administrativo'].includes(global.App.rol);
      const fila = c => {
        const e = DB.ESTADO_COBRO[c.estado] || { label: c.estado, pill: 'soft', icon: '•' };
        const monto = c.metodo === 'transferencia' ? (c.montoConfirmado ?? c.m) : c.m;
        const sub = c.metodo === 'transferencia'
          ? `Transferencia · ${UI.esc(c.recibidoPor || '')}${c.depositante ? ' · depositó ' + UI.esc(c.depositante) : ''}${c.comprobante ? ' · comp. ' + UI.esc(c.comprobante) : ''}${c.cuit ? ' · CUIT ' + UI.esc(c.cuit) : ''}`
          : `Efectivo · rendido a ${UI.esc(c.recibidoPor || '')}`;
        const conf = (c.estado === 'pendiente_banco' && puedeConfirmar)
          ? `<button class="btn sm primary" data-conf="${c.id}" style="margin-top:6px">🏦 Confirmar en banco</button>` : '';
        return `<div style="padding:9px 11px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;margin-bottom:7px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <b>${UI.pesos(monto)}</b>
            <span class="pill ${e.pill}" style="font-size:11px">${e.icon} ${UI.esc(e.label)}</span></div>
          <div class="muted" style="font-size:11.5px;margin-top:3px">${UI.esc(c.f)} · ${sub}</div>${conf}</div>`;
      };
      const cobros = (o.cobros || []).length
        ? (o.cobros || []).map(fila).join('')
        : `<div class="muted" style="font-size:13px;padding:6px 0">Sin señas registradas.</div>`;
      const pend = (o.cobros || []).filter(c => c.estado === 'pendiente_banco').reduce((a, c) => a + c.m, 0);
      const opciones = DB.autorizadosCobro().map(a => `<option>${UI.esc(a)}</option>`).join('');

      const ov = this._shell(`
        <div style="padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px">
          <b style="color:var(--brand)">${UI.esc(o.numero)}</b><span style="font-weight:600">${UI.esc(o.cliente)}</span>
          <span style="flex:1"></span><button id="vpm-x" style="border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)">✕</button></div>
        <div style="padding:14px 16px">
          <div class="wrap-row" style="gap:16px;margin-bottom:12px;flex-wrap:wrap">
            <div><div class="kick">Total</div><b style="color:var(--navy);font-size:16px">${UI.pesos(o.total)}</b></div>
            <div><div class="kick">Seña cobrada</div><b style="color:var(--ok);font-size:16px">${UI.pesos(o.sena || 0)}</b></div>
            ${pend ? `<div><div class="kick">Sin acreditar</div><b style="color:var(--warn);font-size:16px">${UI.pesos(pend)}</b></div>` : ''}
            <div><div class="kick">Saldo</div><b style="color:var(--crit);font-size:16px">${UI.pesos(o.saldo || 0)}</b></div>
          </div>
          <div class="kick" style="margin-bottom:6px">Señas y cobros</div>${cobros}

          <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">
            <div class="kick" style="margin-bottom:8px">Registrar una seña</div>
            <div class="seg" id="vpm-metodo">
              <button class="on" data-met="efectivo">💵 Efectivo</button>
              <button data-met="transferencia">🏦 Transferencia</button>
            </div>
            <div class="wrap-row" style="gap:8px;margin-top:10px">
              <input id="vpm-m" type="number" placeholder="Monto recibido" style="flex:1" min="1">
            </div>
            <label class="lbl">Recibido por / cuenta
              <select id="vpm-recibido">${opciones}</select></label>
            <div id="vpm-transf" style="display:none">
              <label class="lbl">Nombre de quien depositó (puede no ser el cliente)
                <input id="vpm-dep" placeholder="Ej. Juan Pérez"></label>
              <label class="lbl">Referencia / dónde ubicarla
                <input id="vpm-ref" placeholder="Ej. Mercado Pago, alias, banco…"></label>
              <div class="banner info" style="font-size:12px;margin-top:8px">Queda <b>sin acreditar</b> hasta que Administración/Dirección la confirme contra el banco (CUIT + N° de comprobante).</div>
            </div>
          </div>
          <div class="wrap-row" style="justify-content:flex-end;margin-top:14px">
            <button class="btn" id="vpm-cancel">Cerrar</button>

      const cerrar = () => ov.remove();
      ov.querySelector('#vpm-x').onclick = cerrar;
      ov.querySelector('#vpm-cancel').onclick = cerrar;
      let metodo = 'efectivo';
      const transfBox = ov.querySelector('#vpm-transf');

        ov.querySelectorAll('#vpm-metodo button').forEach(x => x.classList.remove('on')); b.classList.add('on');

        transfBox.style.display = metodo === 'transferencia' ? 'block' : 'none';
      });
      ov.querySelectorAll('[data-conf]').forEach(b => b.onclick = () => { cerrar(); this.modalConfirmarBanco(o, b.dataset.conf); });
      const mi = ov.querySelector('#vpm-m'); mi.focus();
      ov.querySelector('#vpm-save').onclick = () => {
        const m = Math.round(Number(mi.value) || 0);
        if (m <= 0) { mi.focus(); return; }
        if (metodo === 'transferencia' && !ov.querySelector('#vpm-dep').value.trim()) {
          UI.aviso('Poné el nombre de quien depositó', 'warn'); return;
        }
        DB.registrarSena(o.id, {
          metodo, monto: m,
          recibidoPor: ov.querySelector('#vpm-recibido').value,
          depositante: ov.querySelector('#vpm-dep')?.value.trim(),
          referencia: ov.querySelector('#vpm-ref')?.value.trim(),
        });
        UI.aviso(metodo === 'transferencia'
          ? 'Transferencia registrada — queda sin acreditar hasta confirmarla'
          : 'Seña en efectivo registrada', metodo === 'transferencia' ? 'warn' : 'ok');
        cerrar();
        this.pintarTabla();
        this.modalSenas(o);   // reabre con el nuevo cobro a la vista
      };
    },

    // Confirmación bancaria: Administración/Dirección acredita la transferencia,
    // carga CUIT + N° de comprobante + monto acreditado. No permite duplicar
    // un comprobante ya cargado (un cliente puede mandar 2 comprobantes).
    modalConfirmarBanco(o, cobroId, after) {
      const c = (o.cobros || []).find(x => x.id === cobroId); if (!c) return;
      after = after || (() => { this.pintarTabla(); this.modalSenas(o); });
      const ov = this._shell(`
        <div style="padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px">
          <span>🏦</span><b>Confirmar transferencia en banco</b>
          <span style="flex:1"></span><button id="cb-x" style="border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)">✕</button></div>
        <div style="padding:14px 16px">
          <div class="banner info" style="font-size:12.5px;margin-bottom:12px">
            ${UI.esc(o.numero)} · ${UI.esc(o.cliente)} — declaró <b>${UI.pesos(c.m)}</b> por transferencia a

          <label class="lbl">CUIT / CUIL del titular de la cuenta
            <input id="cb-cuit" placeholder="20-30111222-3"></label>
          <label class="lbl">N° de comprobante bancario
            <input id="cb-comp" placeholder="Único — así no se duplica el pago"></label>
          <label class="lbl">Monto acreditado en el banco
            <input id="cb-monto" type="number" value="${c.m}" min="1"></label>
          <div class="wrap-row" style="justify-content:flex-end;margin-top:14px">
            <button class="btn" id="cb-cancel">Cancelar</button>
            <button class="btn primary" id="cb-ok">Acreditar y confirmar</button>
          </div>
        </div>
        <style>.lbl{display:block;font-size:12px;color:var(--ink-soft);margin-top:10px}.lbl input{width:100%;margin-top:4px}</style>`, 440);
      const cerrar = () => ov.remove();
      ov.querySelector('#cb-x').onclick = cerrar;
      ov.querySelector('#cb-cancel').onclick = () => { cerrar(); this.modalSenas(o); };
      ov.querySelector('#cb-cuit').focus();
      ov.querySelector('#cb-ok').onclick = () => {
        const cuit = ov.querySelector('#cb-cuit').value.trim();
        const comp = ov.querySelector('#cb-comp').value.trim();
        const monto = Math.round(Number(ov.querySelector('#cb-monto').value) || 0);
        if (!cuit || !comp || monto <= 0) { UI.aviso('Completá CUIT, comprobante y monto', 'warn'); return; }
        try {
          global.DB.confirmarSenaBanco(o.id, cobroId, {
            cuit, comprobante: comp, montoConfirmado: monto,
            confirmadoPor: global.App.rol === 'direccion' ? 'Dirección' : 'Administración',
          });
        } catch (e) { UI.aviso(e.message || String(e), 'crit'); return; }
        UI.aviso('Transferencia acreditada en ' + o.numero, 'ok');
        cerrar();
        after();
      };
    },

    // Diálogo de comentarios (historial por área): cada nota queda con el área
    // que la escribió, así fábrica/logística/ventas arman la historia de la venta.
    modalNota(o) {
      const area = AREA_ROL[global.App.rol] || 'Ventas';
