<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belgrano Soft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="comun/estilos.css">
</head>
<body>
  <!-- El shell (comun/app.js) reemplaza el body al arrancar. -->

  <!-- Cliente de Supabase (CDN). El front lo carga desde el hosting, no
       desde un artifact, así que el CDN está permitido. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Infraestructura común -->
  <script src="comun/db.js"></script>
  <script src="comun/ui.js"></script>
  <script src="comun/widgets.js"></script>
  <script src="comun/motor.js"></script>

  <!-- Módulos -->
  <script src="catalogo/catalogo.js"></script>
  <script src="catalogo/producto.js"></script>
  <script src="ventas/presupuesto.js"></script>
  <script src="ventas/cotizaciones.js"></script>
  <script src="ventas/ordenes.js"></script>
  <script src="ventas/orden-detalle.js"></script>
  <script src="ventas/ventas-panel.js"></script>
  <script src="ventas/clientes.js"></script>
  <script src="modulos/inicio.js"></script>
  <script src="modulos/pendientes.js"></script>
  <script src="modulos/precios.js"></script>
  <script src="modulos/resumen.js"></script>
  <script src="modulos/produccion.js"></script>
  <script src="modulos/esqueletos.js"></script>

  <!-- El shell arranca último -->
  <script src="comun/app.js"></script>
</body>
</html>
