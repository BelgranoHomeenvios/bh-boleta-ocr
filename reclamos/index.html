<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reclamos · Belgrano Home</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📣</text></svg>" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brand:#b91c1c;--brand-dark:#991b1b;--brand-soft:#fee2e2;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--green:#16a34a;--yellow:#ca8a04;--orange:#ea580c;--red:#dc2626;--blue:#2563eb;--shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.app-header{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;padding:18px 16px}
.app-header .wrap{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.app-header h1{font-size:20px;margin:0;font-weight:700}
.app-header .sub{opacity:.85;font-size:13px;margin-top:2px}
.app-header .logo{font-size:28px}.app-header .spacer{flex:1}
.tabs{display:flex;gap:4px;max-width:1100px;margin:0 auto;padding:0 8px;overflow-x:auto}
.tabs button{border:none;background:transparent;color:rgba(255,255,255,.8);padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.active{color:#fff;border-bottom-color:#fff}
.container{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:17px}.card h3{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600}
.grid{display:grid;gap:14px}.grid-stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat .value{font-size:28px;font-weight:800;margin-top:6px}.stat .value small{font-size:14px;font-weight:600;color:var(--muted)}
.stat.s-abierto{background:#fef2f2;border-color:#fecaca}
.stat.s-espera{background:#fffbeb;border-color:#fde68a}
.stat.s-prod{background:#eff6ff;border-color:#bfdbfe}
.stat.s-cerrado{background:#f0fdf4;border-color:#bbf7d0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;align-items:end}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
label.field .hint{font-weight:400;color:var(--muted);font-size:12px}
input,select,textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.sub-h{font-size:13px;font-weight:700;color:var(--brand-dark);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 2px}
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc>summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;gap:10px;background:#f8fafc;user-select:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'▸';margin-left:auto;transition:transform .2s;color:var(--muted);font-size:13px}
.acc[open]>summary::after{transform:rotate(90deg)}
.acc[open]>summary{border-bottom:1px solid var(--line)}
.acc .acc-body{padding:16px}
.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:11px 18px;border:1px solid transparent}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-dark)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}.btn-ghost:hover{background:var(--bg)}
.btn-danger{background:#fff;border-color:#fecaca;color:var(--red)}
.btn-sm{padding:7px 12px;font-size:13px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.error-msg{color:var(--red);font-size:13px;font-weight:600;margin-top:8px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700;white-space:nowrap}
tbody tr:hover{background:#f8fafc}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.e-abierto{background:#fee2e2;color:#991b1b}.e-espera{background:#fef9c3;color:#854d0e}.e-prod{background:#dbeafe;color:#1e40af}.e-cerrado{background:#dcfce7;color:#166534}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.filters label.field{min-width:150px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}.empty .big{font-size:40px;margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:130px 1fr 42px;gap:10px;align-items:center;font-size:13px}
.bar-track{background:var(--bg);border-radius:6px;height:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar-row .n{text-align:right;font-weight:700}
.bar-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.charts-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.txt-clip{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact th,.compact td{padding:4px 8px;font-size:12.5px;border-bottom:1px solid #eef2f7}
.compact tbody tr{line-height:1.25}
.stat.clickable{cursor:pointer;transition:transform .08s,box-shadow .12s}
.stat.clickable:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(15,23,42,.12)}
.act-btn{cursor:pointer;border:none;background:transparent;font-size:15px;padding:2px 4px;border-radius:6px;line-height:1}
.act-btn:hover{background:var(--bg)}
.cfg-list{display:flex;flex-direction:column;gap:6px}
.cfg-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--bg);border-radius:8px;font-size:14px}
.cfg-item .cfg-acts{display:flex;gap:2px;flex:0 0 auto}
.login-wrap{max-width:380px;margin:8vh auto;padding:16px}
.login-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 24px}
.login-card .logo{font-size:40px;text-align:center}
.login-card h2{text-align:center;margin:8px 0 4px}
.login-card p{text-align:center;color:var(--muted);font-size:13px;margin:0 0 18px}
.login-card label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.login-card input{margin-bottom:14px}
.login-card .btn{width:100%}
.user-pill{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px}
.banner{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50;max-width:90%}
.banner.err{background:#b91c1c}
.banner.ok{background:#16a34a}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
#compOverlay{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:100;overflow:auto;padding:18px;display:none}
.comp-sheet{max-width:800px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.comp-toolbar{display:flex;gap:8px;justify-content:flex-end;padding:12px;position:sticky;top:0;background:#f8fafc;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.doc{padding:26px 32px;color:#0f172a}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:10px}
.doc-brand{font-size:22px;font-weight:800;color:var(--brand-dark);line-height:1}
.doc-brand small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.25em;margin-top:3px}
.doc-note{font-size:11px;color:var(--muted);text-align:right;line-height:1.4}
.doc-title{text-align:center;letter-spacing:.35em;margin:16px 0 2px;font-size:20px;font-weight:800}
.doc-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 16px}
.doc-grid2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.doc-cell{padding:8px 12px;border-bottom:1px solid var(--line)}
.doc-cell:nth-child(odd){border-right:1px solid var(--line)}
.doc-cell .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.doc-cell .v{font-size:15px;font-weight:600;min-height:20px}
.doc-sec{margin-top:16px}
.doc-sec h3{background:var(--brand-soft);color:var(--brand-dark);padding:6px 12px;border-radius:6px;font-size:12px;letter-spacing:.12em;margin:0 0 8px}
.doc-box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;font-size:14px;white-space:pre-wrap}
.doc-firmas{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:54px}
.doc-firma{border-top:1px solid #94a3b8;text-align:center;padding-top:6px;font-size:12px;color:var(--muted)}
@media print{
  body *{visibility:hidden}
  #compOverlay,#compOverlay *{visibility:visible}
  #compOverlay{position:absolute;inset:0;background:#fff;padding:0;display:block}
  .comp-sheet{box-shadow:none;max-width:none;margin:0;border-radius:0}
  .comp-toolbar{display:none!important}
  @page{size:A4;margin:14mm}
}
@media(max-width:600px){.stat .value{font-size:24px}.bar-row{grid-template-columns:100px 1fr 36px}}
</style>
</head>
<body>
<header class="app-header">
  <div class="wrap">
    <span class="logo">📣</span>
    <div><h1>Reclamos</h1><div class="sub">Belgrano Home Envíos · seguimiento y estadísticas</div></div>
    <span class="spacer"></span>
    <div class="row-actions" id="topActions" style="display:none">
      <span class="user-pill" id="userEmail"></span>
      <button class="btn btn-ghost btn-sm" id="btnBackup">⬇️ Backup</button>
      <button class="btn btn-ghost btn-sm" id="btnImport">⬆️ Importar</button>
      <button class="btn btn-ghost btn-sm" id="btnLogout">Salir</button>
      <input type="file" id="fileImport" accept="application/json" hidden />
    </div>
  </div>
  <nav class="tabs" id="tabs" style="display:none"></nav>
</header>
<main class="container" id="view"></main>

<script>
"use strict";
const K_REC='rc_reclamos_v1';
// Estados del ciclo del reclamo
const ESTADOS=['ABIERTO','EN ESPERA','EN PRODUCCIÓN','CERRADO'];
function estClass(e){return {'ABIERTO':'e-abierto','EN ESPERA':'e-espera','EN PRODUCCIÓN':'e-prod','CERRADO':'e-cerrado'}[e]||'e-abierto'}
const RESPONSABLES=['1 FLETE','2 PROVEEDOR','3 FABRICA','4 CARPINTERO','5 NO TIENE SOLUCION','6 ASESORÍA'];
const TIPOS_SOLUCION=['1- TRAE EL MUEBLE A FABRICA','2- VA EL FLETE A DOMICILIO','3- VA CARPINTERO A DOMICILIO','4- REINTEGRAMOS PARTE DEL DINERO','5- RECOMENDACIONES DE USO','6- CAMBIO DEL MUEBLE EN FABRICA','7- CAMBIO DEL MUEBLE EN DOMICILIO','8- OTROS'];
const COSTOS=['SIN COSTO','COSTO BAJO','COSTO MEDIO','COSTO ALTO','DEVOLUCION'];
// Sugerencias (se pueden escribir otras igual)
const FLETES=['1 IVAN','2 FABIAN','3 JUAN','5 EXPRESO','7 MARCOS','8 RETIRO','9 PEDRO (jony)','10 LALO','11 MAURO'];
const PROVEEDORES=['7 TONY','8 MATIAS','9 RAUL','10 HERNAN','11 MICHELLE','12 LUCIANO','13 VICENTE','2 PROVEEDOR','3 FABRICA'];
const MUEBLES=['CÓMODAS','MESAS','MUEBLES DE TV','MESAS DE LUZ','ESCRITORIOS','APARADORES','MESAS RATONAS','BIBLIOTECAS','PLACARD','MODULARES','SILLAS','VAJILLEROS','CAMAS','RESPALDOS','BOTINEROS','COMEDOR','CHIFONIER','ESTANTE FLOTANTE'];
const COL_COSTO={'SIN COSTO':'#16a34a','COSTO BAJO':'#65a30d','COSTO MEDIO':'#ca8a04','COSTO ALTO':'#dc2626','DEVOLUCION':'#7c3aed'};

function read(k,f){try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch(e){return f}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function nuevoId(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function getReclamos(){return read(K_REC,[])}
function setReclamos(l){write(K_REC,l);state.reclamos=l}

// Listas editables desde Configuración
const K_CFG='rc_config_v1';
const DEFAULT_LISTS={muebles:MUEBLES,fletes:FLETES,proveedores:PROVEEDORES,responsables:RESPONSABLES,tiposSolucion:TIPOS_SOLUCION,costos:COSTOS};
function getConfig(){let c=read(K_CFG,null);if(!c){c={};for(const k in DEFAULT_LISTS)c[k]=DEFAULT_LISTS[k].slice();write(K_CFG,c);return c}
  let ch=false;for(const k in DEFAULT_LISTS){if(!Array.isArray(c[k])){c[k]=DEFAULT_LISTS[k].slice();ch=true}}if(ch)write(K_CFG,c);return c}
function setConfig(c){write(K_CFG,c);state.config=c}

// ====== Nube (Supabase) ======
const SUPA_URL='https://lyppcndfgwhxjjgpqufp.supabase.co';
const SUPA_KEY='sb_publishable_f9MJ9jnBPDXBRbLbtDj69g_NgR3iOgV';
const APP='reclamos';
let db=null;
function initDb(){try{if(window.supabase){db=window.supabase.createClient(SUPA_URL,SUPA_KEY);return true}}catch(e){}return false}
function banner(msg,tipo){let b=document.getElementById('banner');if(!b){b=document.createElement('div');b.id='banner';document.body.appendChild(b)}b.className='banner '+(tipo||'');b.innerHTML=msg;b.style.display='block';if(tipo!=='load'){clearTimeout(banner._t);banner._t=setTimeout(()=>{b.style.display='none'},3500)}}
function ocultarBanner(){const b=document.getElementById('banner');if(b)b.style.display='none'}
function avisoError(e){console.error(e);banner('⚠️ No se pudo sincronizar con la nube. Revisá tu internet.','err')}
async function supaLoad(){const {data,error}=await db.from('store').select('kind,id,data').eq('app',APP);if(error)throw error;
  const reclamos=data.filter(r=>r.kind==='reclamo').map(r=>r.data);const cfg=data.find(r=>r.kind==='config');return {reclamos,config:cfg?cfg.data:null}}
async function supaUpsertReclamo(reg){const {error}=await db.from('store').upsert({app:APP,kind:'reclamo',id:reg.id,data:reg},{onConflict:'app,kind,id'});if(error)throw error}
async function supaDeleteReclamo(id){const {error}=await db.from('store').delete().match({app:APP,kind:'reclamo',id});if(error)throw error}
async function supaUpsertConfig(cfg){const {error}=await db.from('store').upsert({app:APP,kind:'config',id:'config',data:cfg},{onConflict:'app,kind,id'});if(error)throw error}
async function supaUpsertMany(reclamos,cfg){const rows=reclamos.map(r=>({app:APP,kind:'reclamo',id:r.id,data:r}));if(cfg)rows.push({app:APP,kind:'config',id:'config',data:cfg});const {error}=await db.from('store').upsert(rows,{onConflict:'app,kind,id'});if(error)throw error}

let _refrescando=false;
function suscribirRealtime(){try{db.channel('rt-'+APP).on('postgres_changes',{event:'*',schema:'public',table:'store',filter:'app=eq.'+APP},()=>refrescarNube()).subscribe()}catch(e){}}
function refrescarNube(){if(_refrescando)return;_refrescando=true;setTimeout(async()=>{_refrescando=false;try{const {reclamos,config}=await supaLoad();state.reclamos=reclamos;write(K_REC,reclamos);if(config){state.config=config;write(K_CFG,config)}render()}catch(e){}},500)}

function mostrarLogin(msg){
  document.getElementById('topActions').style.display='none';
  document.getElementById('tabs').style.display='none';
  view.innerHTML=`<div class="login-wrap"><div class="login-card">
    <div class="logo">📣</div><h2>Reclamos</h2><p>Belgrano Home Envíos · ingresá para continuar</p>
    <form id="loginForm">
      <label>Email</label><input type="email" id="lg_email" placeholder="tu@email.com" autocomplete="username">
      <label>Contraseña</label><input type="password" id="lg_pass" placeholder="••••••••" autocomplete="current-password">
      <button type="submit" class="btn btn-primary" id="lg_btn">Entrar</button>
      <div class="error-msg" id="lg_err" style="display:${msg?'block':'none'}">${msg?('⚠️ '+esc(msg)):''}</div>
    </form></div></div>`;
  document.getElementById('loginForm').onsubmit=async ev=>{ev.preventDefault();
    const email=document.getElementById('lg_email').value.trim();const pass=document.getElementById('lg_pass').value;
    const btn=document.getElementById('lg_btn');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Entrando…';
    const {error}=await db.auth.signInWithPassword({email,password:pass});
    if(error){btn.disabled=false;btn.textContent='Entrar';const el=document.getElementById('lg_err');el.style.display='block';el.textContent='⚠️ '+(error.message==='Invalid login credentials'?'Email o contraseña incorrectos.':error.message)}
    else{await entrarApp()}};
}
async function entrarApp(){
  banner('<span class="spin"></span> Cargando datos de la nube…','load');
  try{const {reclamos,config}=await supaLoad();state.reclamos=reclamos;write(K_REC,reclamos);
    if(config){state.config=config;write(K_CFG,config)}else{await supaUpsertConfig(state.config)}
    ocultarBanner();
  }catch(e){state.reclamos=getReclamos();avisoError(e)}
  await asignarNumerosFaltantes();
  const {data:{user}}=await db.auth.getUser();
  document.getElementById('userEmail').textContent='👤 '+(user?user.email:'');
  document.getElementById('topActions').style.display='flex';
  document.getElementById('tabs').style.display='flex';
  state.tab='tablero';render();suscribirRealtime();
}
async function start(){
  if(!initDb()){view.innerHTML='<div class="card" style="margin:24px">No se pudo cargar la conexión con la nube. Revisá tu internet y recargá la página (Ctrl+F5).</div>';return}
  try{const {data:{session}}=await db.auth.getSession();if(session)return entrarApp()}catch(e){}
  mostrarLogin();
}

const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function parseFecha(iso){if(!iso)return null;const a=iso.split('-').map(Number);if(!a[0]||!a[1]||!a[2])return null;return new Date(a[0],a[1]-1,a[2])}
function dosD(n){return String(n).padStart(2,'0')}
function formatFecha(iso){const d=parseFecha(iso);return d?dosD(d.getDate())+'/'+dosD(d.getMonth()+1)+'/'+d.getFullYear():'—'}
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+dosD(d.getMonth()+1)+'-'+dosD(d.getDate())}
function claveMes(iso){return iso?iso.slice(0,7):''}
function nombreMes(c){if(!c)return'';const a=c.split('-').map(Number);return MESES[a[1]-1]+' '+a[0]}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function abierto(r){return r.estado!=='CERRADO'}
function countBy(arr,fn){const m=new Map();for(const r of arr){let v=fn(r);if(v==null||String(v).trim()==='')continue;v=String(v).trim();m.set(v,(m.get(v)||0)+1)}return [...m.entries()].map(([label,n])=>({label,n})).sort((a,b)=>b.n-a.n)}
function nextNum(){let m=0;for(const r of state.reclamos){const n=+r.num||0;if(n>m)m=n}return m+1}
async function asignarNumerosFaltantes(){
  const sinNum=state.reclamos.filter(r=>!(+r.num>0));
  if(!sinNum.length)return;
  let max=state.reclamos.reduce((a,r)=>Math.max(a,+r.num||0),0);
  sinNum.sort((a,b)=>{const fa=a.fechaReclamo||'',fb=b.fechaReclamo||'';return fa<fb?-1:fa>fb?1:(a.id<b.id?-1:1)});
  for(const r of sinNum)r.num=++max;
  write(K_REC,state.reclamos);
  try{await supaUpsertMany(sinNum,null)}catch(e){avisoError(e)}
}

const state={tab:'tablero',reclamos:getReclamos(),config:getConfig(),editando:null,_q:'',_fEstado:'',_fMes:''};
const TABS=[['tablero','📊 Tablero'],['cargar','➕ Cargar reclamo'],['lista','📋 Reclamos'],['config','⚙️ Configuración']];
const $=id=>document.getElementById(id);
const view=$('view');

function renderTabs(){
  $('tabs').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${state.tab===t[0]?'active':''}">${t[1]}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;if(state.tab!=='cargar')state.editando=null;render()});
}
function render(){renderTabs();({tablero:vistaTablero,cargar:vistaCargar,lista:vistaLista,config:vistaConfig}[state.tab])();}

function dl(id,arr,extra){const vals=[...new Set([...(arr||[]),...extra])];return `<datalist id="${id}">${vals.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`}
function opts(arr,sel){return arr.map(v=>`<option value="${esc(v)}" ${sel===v?'selected':''}>${esc(v)}</option>`).join('')}
// como opts pero conserva el valor guardado aunque ya no esté en la lista (datos viejos)
function optsV(arr,sel){const extra=(sel&&!arr.includes(sel))?`<option value="${esc(sel)}" selected>${esc(sel)}</option>`:'';return extra+opts(arr,sel)}

// ---------- Lista ----------
function vistaLista(){
  const meses=[...new Set(state.reclamos.map(r=>claveMes(r.fechaReclamo)).filter(Boolean))].sort().reverse();
  const q=state._q.toLowerCase();
  const fil=state.reclamos
    .filter(r=>{if(!state._fEstado)return true;if(state._fEstado==='__SINCERRAR__')return r.estado!=='CERRADO';return r.estado===state._fEstado})
    .filter(r=>!state._fMes||claveMes(r.fechaReclamo)===state._fMes)
    .filter(r=>{if(!q)return true;if(q[0]==='#')return String(r.num||'')===q.slice(1).trim();return [r.num,r.nombre,r.orden,r.problema,r.mueble,r.flete,r.proveedor].some(v=>String(v||'').toLowerCase().includes(q))})
    .sort((a,b)=>a.fechaReclamo<b.fechaReclamo?1:-1);
  const rows=fil.map(r=>`<tr>
    <td style="white-space:nowrap"><button class="act-btn" title="Editar" data-ed="${r.id}">✏️</button><button class="act-btn" title="Imprimir comprobante" data-print="${r.id}">🧾</button><button class="act-btn" title="Borrar" data-del="${r.id}">🗑️</button></td>
    <td><strong>${r.num?'#'+r.num:'—'}</strong></td>
    <td><span class="badge ${estClass(r.estado)}">${esc(r.estado)}</span></td>
    <td style="white-space:nowrap">${formatFecha(r.fechaReclamo)}</td>
    <td><strong>${esc(r.nombre)||'—'}</strong></td>
    <td>${esc(r.orden)||'—'}</td>
    <td>${esc(r.mueble)||'—'}</td>
    <td class="txt-clip" title="${esc(r.problema)}">${esc(r.problema)||'—'}</td></tr>`).join('');
  const selEstado=state._fEstado==='__SINCERRAR__'?'<option value="__SINCERRAR__" selected>Sin cerrar</option>':'<option value="__SINCERRAR__">Sin cerrar</option>';
  view.innerHTML=`<div class="card"><div class="section-title"><h2>📋 Reclamos</h2><span class="muted">${fil.length} de ${state.reclamos.length}</span></div>
    <div class="filters" style="margin-bottom:14px">
      <label class="field" style="min-width:200px">Buscar<input id="lq" value="${esc(state._q)}" placeholder="Nombre, orden, mueble, problema…"></label>
      <label class="field">Estado<select id="lEstado"><option value="">Todos</option>${selEstado}${opts(ESTADOS,state._fEstado)}</select></label>
      <label class="field">Mes<select id="lMes"><option value="">Todos</option>${meses.map(m=>`<option value="${m}" ${state._fMes===m?'selected':''}>${nombreMes(m)}</option>`).join('')}</select></label>
    </div>
    ${fil.length===0?`<div class="empty"><div class="big">📣</div>${state.reclamos.length===0?'Todavía no cargaste reclamos.':'No hay reclamos con esos filtros.'}</div>`:
    `<div class="table-wrap"><table class="compact"><thead><tr><th></th><th>N°</th><th>Estado</th><th>Fecha</th><th>Cliente</th><th>Orden</th><th>Mueble</th><th>Problema</th></tr></thead><tbody>${rows}</tbody></table></div>`}
  </div>`;
  const lq=$('lq');lq.oninput=()=>{state._q=lq.value;const p=lq.selectionStart;vistaLista();const n=$('lq');n.focus();n.setSelectionRange(p,p)};
  $('lEstado').onchange=e=>{state._fEstado=e.target.value;vistaLista()};
  $('lMes').onchange=e=>{state._fMes=e.target.value;vistaLista()};
  view.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{state.editando=state.reclamos.find(x=>x.id===b.dataset.ed);state.tab='cargar';render()});
  view.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>mostrarComprobante(state.reclamos.find(x=>x.id===b.dataset.print)));
  view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const r=state.reclamos.find(x=>x.id===b.dataset.del);if(confirm('¿Borrar el reclamo de '+(r.nombre||r.orden||'')+'?')){setReclamos(state.reclamos.filter(x=>x.id!==b.dataset.del));supaDeleteReclamo(b.dataset.del).catch(avisoError);vistaLista()}});
}

// ---------- Tablero ----------
function bars(items,color){
  if(!items.length)return '<p class="muted">Sin datos todavía.</p>';
  const max=Math.max(...items.map(i=>i.n));
  return '<div class="bars">'+items.map(i=>{const c=typeof color==='function'?color(i.label):color;
    return `<div class="bar-row"><span class="bar-lbl" title="${esc(i.label)}">${esc(i.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(i.n/max*100)}%;background:${c}"></div></div><span class="n">${i.n}</span></div>`}).join('')+'</div>';
}
function trendSVG(items){
  if(!items.length)return '<p class="muted">Sin datos todavía.</p>';
  const W=720,H=220,pl=30,pb=34,pt=10,pr=10;const iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(1,...items.map(i=>i.n));const n=items.length;const step=iw/n;const bw=Math.min(46,step*0.6);
  const yy=v=>pt+ih*(1-v/max);
  let bars='';
  items.forEach((p,i)=>{const cx=pl+step*i+step/2;const h=ih*p.n/max;
    bars+=`<rect x="${cx-bw/2}" y="${pt+ih-h}" width="${bw}" height="${h}" rx="3" fill="#b91c1c"/>`;
    bars+=`<text x="${cx}" y="${pt+ih-h-4}" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="700">${p.n}</text>`;
    bars+=`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="10" fill="#64748b">${esc(p.label)}</text>`;});
  const grid=[0,.5,1].map(f=>{const v=Math.round(max*f);return `<line x1="${pl}" y1="${yy(v)}" x2="${W-pr}" y2="${yy(v)}" stroke="#eef2f7"/><text x="${pl-4}" y="${yy(v)+4}" text-anchor="end" font-size="10" fill="#64748b">${v}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%">${grid}${bars}</svg>`;
}
function vistaTablero(){
  const R=state.reclamos;
  if(R.length===0){view.innerHTML=`<div class="card"><div class="empty"><div class="big">📊</div>Cargá tu primer reclamo y acá vas a ver el seguimiento por estado y las estadísticas (flete, mueble, proveedor, costos y tendencia).</div></div>`;return}
  const fil=R.filter(r=>!state._fMes||claveMes(r.fechaReclamo)===state._fMes);
  const cont=e=>fil.filter(r=>r.estado===e).length;
  const abiertos=fil.filter(abierto).length, cerrados=cont('CERRADO');
  const pctCerr=fil.length?Math.round(cerrados/fil.length*100):0;
  const montos=fil.map(r=>+r.costoMonto||0).reduce((a,b)=>a+b,0);
  const meses=[...new Set(R.map(r=>claveMes(r.fechaReclamo)).filter(Boolean))].sort().reverse();
  // tendencia por mes (cronológica, últimos 12)
  const porMes=countBy(R,r=>claveMes(r.fechaReclamo)).sort((a,b)=>a.label<b.label?-1:1).slice(-12).map(i=>({label:nombreMes(i.label).split(' ')[0].slice(0,3),n:i.n}));
  view.innerHTML=`<div class="card"><div class="section-title"><h2>📊 Tablero de reclamos</h2>
    <select id="tbMes" style="width:auto"><option value="">Todos los meses</option>${meses.map(m=>`<option value="${m}" ${state._fMes===m?'selected':''}>${nombreMes(m)}</option>`).join('')}</select></div>
    <p class="muted" style="margin:0 0 10px">👆 Tocá una tarjeta para ver esos reclamos en el listado.</p>
    <div class="grid grid-stats">
      <div class="stat s-abierto clickable" data-go="ABIERTO"><div class="label">🆕 Abiertos</div><div class="value">${cont('ABIERTO')}</div></div>
      <div class="stat s-espera clickable" data-go="EN ESPERA"><div class="label">🟡 En espera</div><div class="value">${cont('EN ESPERA')}</div></div>
      <div class="stat s-prod clickable" data-go="EN PRODUCCIÓN"><div class="label">🔵 En producción</div><div class="value">${cont('EN PRODUCCIÓN')}</div></div>
      <div class="stat s-abierto clickable" data-go="__SINCERRAR__"><div class="label">🔴 Sin cerrar</div><div class="value">${abiertos}</div></div>
      <div class="stat s-cerrado clickable" data-go="CERRADO"><div class="label">🟢 Cerrados</div><div class="value">${cerrados}<small> (${pctCerr}%)</small></div></div>
      <div class="stat clickable" data-go=""><div class="label">📋 Total reclamos</div><div class="value">${fil.length}</div></div>
      ${montos>0?`<div class="stat"><div class="label">💲 Costo total</div><div class="value">$${montos.toLocaleString('es-AR')}</div></div>`:''}
    </div></div>
    <div class="card"><h3>📅 Reclamos por mes</h3>${trendSVG(porMes)}</div>
    <div class="charts-2">
      <div class="card"><h3>🚚 Reclamos por flete / chofer</h3>${bars(countBy(fil,r=>r.flete),'#b91c1c')}</div>
      <div class="card"><h3>🛋️ Reclamos por mueble</h3>${bars(countBy(fil,r=>r.mueble),'#ea580c')}</div>
      <div class="card"><h3>🏭 Reclamos por proveedor</h3>${bars(countBy(fil,r=>r.proveedor),'#0f766e')}</div>
      <div class="card"><h3>👤 Responsable del problema</h3>${bars(countBy(fil,r=>r.respProblema),'#7c3aed')}</div>
      <div class="card"><h3>🛠️ Tipo de solución</h3>${bars(countBy(fil,r=>r.tipoSolucion),'#2563eb')}</div>
      <div class="card"><h3>💲 Costo de las soluciones</h3>${bars(countBy(fil,r=>r.costoCat),l=>COL_COSTO[l]||'#64748b')}</div>
    </div>`;
  $('tbMes').onchange=e=>{state._fMes=e.target.value;vistaTablero()};
  view.querySelectorAll('.stat.clickable').forEach(c=>c.onclick=()=>{state._fEstado=c.getAttribute('data-go');state._q='';state.tab='lista';render()});
}

// ---------- Configuración ----------
function vistaConfig(){
  const grupos=[
    ['muebles','🛋️ Muebles'],['fletes','🚚 Fletes / Choferes'],['proveedores','🏭 Proveedores'],
    ['responsables','👤 Responsables (problema y solución)'],['tiposSolucion','🛠️ Tipos de solución'],['costos','💲 Costos'],
  ];
  view.innerHTML=`<div class="card"><h2>⚙️ Configuración</h2>
    <p class="muted">Editá las opciones que aparecen en los desplegables al cargar un reclamo. Tocá 🗑️ para borrar, ✏️ para renombrar, o escribí abajo para agregar. Los cambios se guardan solos.</p>
    <p class="muted">Los <strong>estados</strong> (Abierto / En espera / En producción / Cerrado) son fijos porque mueven los colores y el tablero.</p></div>`
  + grupos.map(([k,t])=>`<div class="card"><h3>${t} <span class="muted">(${state.config[k].length})</span></h3>
      <div class="cfg-list">${state.config[k].length? state.config[k].map((v,i)=>`<div class="cfg-item"><span>${esc(v)}</span><span class="cfg-acts"><button class="act-btn" title="Renombrar" data-ren="${k}|${i}">✏️</button><button class="act-btn" title="Borrar" data-del="${k}|${i}">🗑️</button></span></div>`).join(''):'<span class="muted">Sin opciones todavía.</span>'}</div>
      <div class="row-actions" style="margin-top:10px"><input id="new_${k}" placeholder="Agregar nueva opción…" style="max-width:320px"><button class="btn btn-primary btn-sm" data-add="${k}">Agregar</button></div>
    </div>`).join('');
  view.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const k=b.dataset.add;const inp=$('new_'+k);const val=inp.value.trim();if(!val)return;
    if(state.config[k].some(x=>x.toLowerCase()===val.toLowerCase())){alert('Esa opción ya existe.');return}
    const c={...state.config};c[k]=[...c[k],val];setConfig(c);supaUpsertConfig(c).catch(avisoError);vistaConfig()});
  view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.del.split('|');if(!confirm('¿Borrar "'+state.config[k][+i]+'" de la lista?'))return;const c={...state.config};c[k]=c[k].filter((_,idx)=>idx!==+i);setConfig(c);supaUpsertConfig(c).catch(avisoError);vistaConfig()});
  view.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.ren.split('|');const cur=state.config[k][+i];const nv=(prompt('Editar opción:',cur)||'').trim();if(!nv||nv===cur)return;const c={...state.config};c[k]=c[k].map((x,idx)=>idx===+i?nv:x);setConfig(c);supaUpsertConfig(c).catch(avisoError);vistaConfig()});
}

// ---------- Comprobante imprimible ----------
function comprobanteHTML(r){
  const cell=(k,v)=>`<div class="doc-cell"><div class="k">${k}</div><div class="v">${esc(v)||'—'}</div></div>`;
  const costo=r.costoCat?(esc(r.costoCat)+((r.costoMonto!==''&&r.costoMonto!=null)?(' · $'+Number(r.costoMonto).toLocaleString('es-AR')):'')):'';
  return `<div class="doc">
    <div class="doc-head"><div class="doc-brand">Belgrano Home<small>ENVÍOS</small></div>
      <div class="doc-note">Uso interno<br>Documento no válido como factura</div></div>
    <div class="doc-title">R E C L A M O</div>
    <div class="doc-sub">N° de reclamo <b>${r.num?'#'+r.num:'—'}</b> · Estado: <b>${esc(r.estado)}</b></div>
    <div class="doc-grid2">
      ${cell('Fecha del reclamo',formatFecha(r.fechaReclamo))}
      ${cell('N° de orden',r.orden)}
      ${cell('Cliente',r.nombre)}
      ${cell('Celular',r.celular)}
      ${cell('Producto / Mueble',r.mueble)}
      ${cell('Fecha de entrega',r.fechaEntrega?formatFecha(r.fechaEntrega):'')}
      ${cell('Chofer / Flete',r.flete)}
      ${cell('Proveedor',r.proveedor)}
    </div>
    <div class="doc-sec"><h3>DETALLES DEL PROBLEMA</h3><div class="doc-box">${esc(r.problema)||'—'}</div></div>
    <div class="doc-sec"><h3>RESOLUCIÓN</h3><div class="doc-grid2">
      ${cell('Responsable del problema',r.respProblema)}
      ${cell('Tipo de solución',r.tipoSolucion)}
      ${cell('Responsable de la solución',r.respSolucion)}
      ${cell('Costo de la solución',costo)}
    </div></div>
    ${r.observaciones?`<div class="doc-sec"><h3>OBSERVACIONES</h3><div class="doc-box">${esc(r.observaciones)}</div></div>`:''}
    <div class="doc-firmas"><div class="doc-firma">Firma cliente</div><div class="doc-firma">Firma responsable</div></div>
  </div>`;
}
function mostrarComprobante(r){
  if(!r)return;
  let o=document.getElementById('compOverlay');if(!o){o=document.createElement('div');o.id='compOverlay';document.body.appendChild(o)}
  o.innerHTML=`<div class="comp-sheet"><div class="comp-toolbar no-print">
    <button class="btn btn-primary btn-sm" id="comp_print">🖨️ Imprimir / Guardar PDF</button>
    <button class="btn btn-ghost btn-sm" id="comp_close">Cerrar</button></div>${comprobanteHTML(r)}</div>`;
  o.style.display='block';
  document.getElementById('comp_print').onclick=()=>window.print();
  document.getElementById('comp_close').onclick=()=>{o.style.display='none'};
}

// ---------- Backup ----------
$('btnBackup').onclick=()=>{const data={app:'reclamos',version:2,exportadoEn:new Date().toISOString(),reclamos:state.reclamos,config:state.config};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='backup-reclamos-'+hoyISO()+'.json';a.click();URL.revokeObjectURL(url)};
$('btnImport').onclick=()=>$('fileImport').click();
$('fileImport').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Esto sube los reclamos del archivo a la nube (se combinan con los que ya haya). ¿Continuar?'))return;
    if(Array.isArray(d.reclamos))setReclamos(d.reclamos);if(d.config&&typeof d.config==='object')setConfig(d.config);render();
    banner('<span class="spin"></span> Subiendo a la nube…','load');
    supaUpsertMany(state.reclamos,state.config).then(()=>banner('✅ Datos subidos a la nube','ok')).catch(avisoError);}
    catch(e){alert('No pude leer el archivo. ¿Es un archivo de backup válido?')}};
  r.readAsText(f);ev.target.value=''};
$('btnLogout').onclick=async()=>{try{await db.auth.signOut()}catch(e){}location.reload()};

start();
</script>
</body>
</html>
