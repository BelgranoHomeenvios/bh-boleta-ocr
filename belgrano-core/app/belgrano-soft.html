<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belgrano Soft</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Belgrano Soft · sistema visual común
   Navy/azul + estados con color. Un solo lugar para todos los módulos.
   ===================================================================== */
:root{
  --bg:#f4f6f8; --panel:#fff; --panel-2:#fafbfc; --ink:#0f1a2a; --ink-soft:#5b6675;
  --line:#d9e0e8; --line-soft:#eef1f5;
  --navy:#16324f; --brand:#1e5fce; --brand-soft:#e7eefb; --brand-ink:#1a51b0;
  --ok:#15803d; --ok-bg:#e6f4ea; --warn:#b45309; --warn-bg:#fff7e6;
  --crit:#b42318; --crit-bg:#fdecea; --muted:#8a94a3;
  --shadow:0 1px 2px rgba(15,26,42,.06),0 1px 3px rgba(15,26,42,.04);
  --r:11px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d111b; --panel:#151b2a; --panel-2:#111726; --ink:#eaeef7; --ink-soft:#9aa6c0;
    --line:#26304a; --line-soft:#1e2740; --navy:#dbe3f4; --brand:#5b8dff;
    --brand-soft:#1a2540; --brand-ink:#9dbcff; --ok:#43c98d; --ok-bg:#13291f;
    --warn:#e0a53c; --warn-bg:#2c2413; --crit:#f0736f; --crit-bg:#2c1717; --muted:#7f8cab;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font-variant-numeric:tabular-nums;
  font-family:'Public Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; letter-spacing:-.01em}
button{font:inherit}
a{color:var(--brand)}

/* ===== Shell con navegación ARRIBA de dos niveles (estética referencia) ===== */
.appbar{background:var(--navy); color:#fff; height:52px; display:flex; align-items:center; gap:8px;
  padding:0 12px; position:sticky; top:0; z-index:30}
.appbar .logo{width:28px; height:28px; border-radius:6px; background:rgba(255,255,255,.14); display:flex;
  align-items:center; justify-content:center; font-weight:800; font-size:12px; flex:none}
.appbar .brand{font-weight:800; font-size:14px; flex:none; white-space:nowrap}
.appbar .mods{display:flex; gap:2px; margin-left:5px; overflow-x:auto; flex:1 1 auto; min-width:0; scrollbar-width:none}
.appbar .mods::-webkit-scrollbar{display:none}
.appbar .modpill{font:inherit; font-size:11.5px; font-weight:700; border:0; padding:5px 8px; border-radius:15px;
  cursor:pointer; white-space:nowrap; background:rgba(255,255,255,.08); color:rgba(255,255,255,.72)}
.appbar .modpill:hover{background:rgba(255,255,255,.2); color:#fff}
.appbar .modpill[aria-current="true"]{background:#fff; color:var(--navy)}
.appbar .sp{display:none}
.appbar .vercomo{display:flex; align-items:center; gap:6px; font-size:11px; color:rgba(255,255,255,.75); flex:none}
.appbar select{font:inherit; font-size:12px; padding:5px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.12); color:#fff; font-weight:700; width:auto}
.appbar select option{color:var(--ink)}
.appbar .ic-btn{position:relative; border:0; background:rgba(255,255,255,.1); width:30px; height:30px;
  border-radius:8px; cursor:pointer; font-size:14px; color:#fff; flex:none}
.appbar .ic-btn .dot{position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; border-radius:9px;
  background:var(--crit); color:#fff; font-size:10px; font-weight:800; display:grid; place-items:center; padding:0 3px}
.appbar .user{font-size:12.5px; text-align:right; line-height:1.15; flex:none}
.appbar .user b{display:block; font-size:12.5px} .appbar .user small{font-size:9.5px; opacity:.8; text-transform:uppercase; letter-spacing:.03em}
.appbar .avatar{width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.16); display:flex;
  align-items:center; justify-content:center; font-size:12px; font-weight:800; flex:none}
@media(max-width:1340px){ .appbar .brand,.appbar .vercomo span,.appbar .user{display:none} }
@media(max-width:1040px){ .appbar .avatar{display:none} }

.subbar{background:var(--panel); border-bottom:1px solid var(--line); padding:0 18px; display:flex; gap:2px;
  overflow-x:auto; position:sticky; top:54px; z-index:25}
.subbar:empty{display:none}
.subtab{font:inherit; padding:13px 15px; font-size:13.5px; font-weight:600; cursor:pointer; background:none; border:0;
  border-bottom:2px solid transparent; white-space:nowrap; color:var(--ink-soft)}
.subtab:hover{color:var(--navy)}
.subtab[aria-current="true"]{color:var(--navy); border-bottom-color:var(--brand)}
.subtab:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}

#view{padding:18px 18px 64px; max-width:1420px; width:100%; margin:0 auto}

/* Bits */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex; align-items:center; gap:12px}
.wrap-row{display:flex; flex-wrap:wrap; gap:10px}
.sp{flex:1}
.muted{color:var(--muted)}
.h-title{font-size:22px; font-weight:800; color:var(--navy)}
.h-sub{color:var(--ink-soft); margin-top:4px; font-size:14px}
.kick{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--brand); font-weight:700}

input,select,textarea{
  font:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line);
  border-radius:9px; background:var(--panel); color:var(--ink); width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
label.fld{display:block}
label.fld .lbl{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600}

.btn{
  font-weight:650; font-size:14px; padding:8px 15px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); transition:.15s;
}
.btn:hover{border-color:var(--brand); color:var(--brand)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{background:var(--brand-ink); color:#fff}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.sm{padding:6px 11px; font-size:13px}

.pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; display:inline-block}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.crit{background:var(--crit-bg); color:var(--crit)}
.pill.info{background:var(--brand-soft); color:var(--brand)}
.pill.soft{background:var(--line-soft); color:var(--ink-soft)}

table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--line)}
td{padding:11px 12px; border-bottom:1px solid var(--line-soft)}
tr:hover td{background:var(--panel-2)}

.empty{text-align:center; padding:48px 20px; color:var(--muted)}
.spin{display:inline-block; width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation:none} }

.banner{padding:10px 14px; border-radius:9px; font-size:13px; margin-bottom:16px}
.banner.warn{background:var(--warn-bg); color:var(--warn)}
.banner.info{background:var(--brand-soft); color:var(--brand-ink)}

/* ===== Sub-navegación de módulo (segundo nivel) ===== */
.modlay{display:grid; grid-template-columns:210px 1fr; gap:22px; align-items:start}
.subside{position:sticky; top:78px; display:flex; flex-direction:column; gap:2px}
.subside .subttl{font-size:17px; font-weight:800; color:var(--navy); padding:2px 12px 10px; letter-spacing:-.01em}
.subnavi{display:flex; align-items:center; gap:9px; padding:8px 12px; border-radius:9px; color:var(--ink-soft);
  font-weight:600; font-size:14px; cursor:pointer; border:0; background:transparent; text-align:left; width:100%}
.subnavi:hover{background:var(--panel); color:var(--brand)}
.subnavi[aria-current="true"]{background:var(--panel); color:var(--brand-ink); box-shadow:var(--shadow); font-weight:700}
.subnavi .tag{margin-left:auto}
.modbody{min-width:0}
@media(max-width:820px){
  .modlay{grid-template-columns:1fr}
  .subside{position:static; flex-direction:row; overflow-x:auto; gap:4px; padding-bottom:8px; border-bottom:1px solid var(--line)}
  .subside .subttl{display:none}
  .subnavi{white-space:nowrap; width:auto}
}

/* ===== Componentes de dashboard ===== */
.greet{font-size:26px; font-weight:800; color:var(--navy); letter-spacing:-.02em}
.greet-sub{color:var(--ink-soft); margin-top:2px}
.alerts{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; margin:16px 0}
.alert{display:flex; align-items:center; gap:11px; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--panel); box-shadow:var(--shadow); cursor:pointer; border-left-width:4px}
.alert:hover{transform:translateY(-1px); transition:.15s}
.alert.crit{border-left-color:var(--crit)} .alert.warn{border-left-color:var(--warn)}
.alert.ok{border-left-color:var(--ok)} .alert.info{border-left-color:var(--brand)}
.alert .em{font-size:18px} .alert b{display:block; color:var(--navy); font-size:14px} .alert span{font-size:12px; color:var(--muted)}
.alert .rt{margin-left:auto; font-size:12px; font-weight:700}
.alert.crit .rt{color:var(--crit)} .alert.warn .rt{color:var(--warn)}

.kpis{display:grid; grid-template-columns:repeat(6,1fr); gap:12px}
@media(max-width:1150px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:15px; box-shadow:var(--shadow)}
.kpi .top{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; font-weight:600}
.kpi .top .em{width:24px; height:24px; border-radius:7px; display:grid; place-items:center; font-size:13px}
.kpi .val{font-size:23px; font-weight:800; color:var(--navy); margin-top:8px; letter-spacing:-.02em}
.kpi .foot{font-size:12px; color:var(--muted); margin-top:3px}
.kpi .foot .up{color:var(--ok); font-weight:700} .kpi .foot .down{color:var(--crit); font-weight:700}
.kpi .obj{height:5px; background:var(--panel-2); border-radius:3px; margin-top:9px; overflow:hidden}
.kpi .obj span{display:block; height:100%; background:var(--brand); border-radius:3px}

.pipe{display:flex; gap:6px; align-items:stretch; overflow-x:auto; padding-bottom:4px}
.pstep{flex:1; min-width:118px; border:1px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center; background:var(--panel-2)}
.pstep .pl{font-size:12px; font-weight:700; color:var(--ink-soft)}
.pstep .pn{font-size:24px; font-weight:800; color:var(--navy); margin:4px 0} .pstep .pm{font-size:11px; color:var(--muted)}
.pstep.hot{border-color:var(--brand); background:var(--brand-soft)}
.pipe .arr{align-self:center; color:var(--muted); font-size:14px; flex:none}

.embudo{display:flex; flex-direction:column; gap:9px}
.erow{display:flex; align-items:center; gap:10px}
.erow .en{width:104px; font-size:13px; color:var(--ink-soft)}
.erow .eb{flex:1; height:20px; background:var(--panel-2); border-radius:6px; overflow:hidden}
.erow .eb span{display:block; height:100%; background:var(--brand); border-radius:6px}
.erow .ev{width:96px; text-align:right; font-size:13px} .erow .ev b{color:var(--navy)} .erow .ev small{color:var(--muted)}

.tl{display:flex; flex-direction:column}
.tl .ev{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:13px}
.tl .ev:last-child{border-bottom:0} .tl .ev .h{color:var(--muted); min-width:46px; font-size:12px} .tl .ev .d{width:8px; height:8px; border-radius:50%; margin-top:5px; flex:none}
.cols3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px} @media(max-width:980px){.cols3{grid-template-columns:1fr}}
.pcard{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:16px}
.pcard h3{margin:0 0 12px; color:var(--navy); font-size:15px}
.pcard .more{display:inline-block; margin-top:10px; font-size:13px; color:var(--brand); cursor:pointer; font-weight:600}

</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =====================================================================
//  Belgrano Soft · capa de datos
//  Una sola puerta a Supabase. Si no hay conexión configurada, la app
//  igual arranca en modo DEMO con unos productos de ejemplo, así se puede
//  ver la interfaz antes de conectar la base.
// =====================================================================
(function (global) {
  const CFG_KEY = 'bh_supabase_cfg';

  // La URL del proyecto Belgrano Soft ya la sabemos; la anon key es pública
  // (va en el frontend) pero la carga la persona la primera vez, para no
  // dejarla escrita en el repo.
  const DEFAULT_URL = 'https://qwbdhpevgirsmfxqlgtg.supabase.co';

  // Saca tildes y pasa a minúscula: "CÓMODA" → "comoda". Así la búsqueda
  // reconoce todo aunque la persona no ponga el acento.
  function sinTilde(s) {
    return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }

  // Clave estable a partir del nombre ("Vicente López" → "vicente_lopez").
  function slug(s) {
    return sinTilde(s).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  }

  function cfg() {
    try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; }
    catch { return {}; }
  }
  function guardarCfg(url, key) {
    localStorage.setItem(CFG_KEY, JSON.stringify({ url: url || DEFAULT_URL, key }));
  }
  function hayConexion() { return !!cfg().key && !!global.supabase; }

  let _cli = null;
  function cliente() {
    if (_cli) return _cli;
    const c = cfg();
    if (!c.key || !global.supabase) return null;
    // El catálogo vive en el esquema core.
    _cli = global.supabase.createClient(c.url || DEFAULT_URL, c.key, {
      db: { schema: 'core' },
    });
    return _cli;
  }

  // Genera el combinatorio de variantes de un mueble (medida × estructura ×
  // frente) con un precio que crece con la medida. Es sólo para el demo: en
  // producción cada variante viene de la tabla `variante` con su precio real.
  // Se usa para que el armador por botones tenga con qué jugar (un mueble
  // puede tener 15+ variantes y no se muestran todos los precios juntos).
  let _vid = 100;
  function combinar(productoId, medidas, estructuras, frentes, base, paso) {
    const out = [];
    medidas.forEach((medida, i) => estructuras.forEach(estructura => frentes.forEach(frente => {
      out.push({
        id: ++_vid, producto_id: productoId, medida, estructura, frente,
        precio: base + paso * i, atributos: { medida, estructura, frente },
      });
    })));
    return out;
  }

  // ---- Modo demo: árbol + productos para ver la UI sin conexión --------
  const DEMO = {
    categorias: [
      { id: 1, nombre: 'DORMITORIO', padre_id: null, nivel: 2 },
      { id: 2, nombre: 'CÓMODAS',    padre_id: 1,    nivel: 3 },
      { id: 3, nombre: 'PLACARD',    padre_id: 1,    nivel: 3 },
      { id: 4, nombre: 'LIVING',     padre_id: null, nivel: 2 },
      { id: 5, nombre: 'MESAS RATONAS', padre_id: 4, nivel: 3 },
    ],
    productos: [
      { id: 1, categoria_id: 2, nombre: 'CÓMODA AMBERES 55', publicado_tn: true },
      { id: 4, categoria_id: 2, nombre: 'CÓMODA OLIVER 60', publicado_tn: true },
      { id: 5, categoria_id: 2, nombre: 'CÓMODA NÓRDICA 90', publicado_tn: false },
      { id: 2, categoria_id: 3, nombre: 'PLACARD OLIVER', publicado_tn: true },
      { id: 3, categoria_id: 5, nombre: 'MESA RATONA NORUEGA', publicado_tn: false },
    ],
    variantes: [
      ...combinar(1, ['1.00', '1.20', '1.40', '1.60'], ['Blanca', 'Negra'], ['Paraíso', 'Blanco'], 385000, 42000),
      ...combinar(4, ['1.20', '1.60'], ['Blanca', 'Negra'], ['Paraíso', 'Nogal'], 410000, 55000),
      ...combinar(5, ['0.90'], ['Natural'], ['Paraíso'], 352000, 0),
      ...combinar(2, ['1.80', '2.00', '2.20'], ['Blanca', 'Negra'], ['Paraíso', 'Blanco'], 860000, 90000),
      ...combinar(3, ['0.80x0.50', '1.00x0.60'], ['Paraíso'], ['Negro', 'Natural'], 720000, 148000),
    ],
    // Órdenes de venta de ejemplo (para ver la vista antes de conectar).
    // saldo = total - sena. sena = suma de señas/cobros CONFIRMADOS hasta hoy.
    // situacion = estado operativo semántico (ver SITUACION_ORDEN).
    // cobros[]: cada seña con su método y estado de verificación:
    //   metodo 'efectivo'  → estado 'rendido'  (basta con rendirlo a un autorizado).
    //   metodo 'transferencia' → 'pendiente_banco' hasta que Administración/Dirección
    //     lo acredita en el banco (cuit + comprobante + monto) → 'confirmado'.
    // Nuevos campos por orden:
    //  lineas[]  : muebles {producto, cantidad, precio, tipo estandar|medida, img, bloqueo}
    //  reclamo   : marca que CONVIVE con el estado del ciclo (listo+reclamo, entregado+reclamo)
    //  factura   : 'no' | 'solicitada' | 'hecha'
    //  recordatorios[] : {f, texto}
    //  comentarios[]   : {area, texto, f}   (historial por área)
    //  archivos[]      : {nombre, tipo, area}  (se guardan en el "cajón" de Contabilidad)
    ordenes: [
      { id: 1, numero: 'S00021', fecha: '29/07', cliente: 'Laura Pérez',    vendedor: 'Ale',      local: '2020', pago: 'Efectivo',      items: 3, total: 1200000, sena: 360000, saldo: 840000, entrega: '15/08', estado: 'a_confirmar',     situacion: 'a_confirmar', reclamo: false, factura: 'solicitada',
        flete: { monto: 45000, detalle: 'Envío CABA' }, instalacion: { monto: 0 },
        lineas: [
          { id: 'L1', producto: 'Cómoda Amberes 1.20', variante: 'Paraíso / Blanco', cantidad: 1, precio: 406250, tipo: 'estandar', img: null },
          { id: 'L2', producto: 'Mesa Noruega',        variante: 'Nogal',           cantidad: 1, precio: 500000, tipo: 'estandar', img: null },
          { id: 'L3', producto: 'Respaldo Milán a medida', variante: 'Boucle Beige', cantidad: 1, precio: 293750, tipo: 'medida', img: null, bloqueo: 'precio' }],
        recordatorios: [{ f: '05/08', texto: 'Llamar para coordinar entrega' }],
        comentarios: [{ area: 'Ventas', texto: 'Cliente pidió llamar antes de entregar', f: '29/07' }],
        archivos: [{ nombre: 'Plano Respaldo Milán.pdf', tipo: 'plano', area: 'Producción' }],
        cobros: [{ id: 'c1', f: '29/07', m: 360000, metodo: 'efectivo', recibidoPor: 'Caja Belgrano 2020', estado: 'rendido' }] },
      { id: 2, numero: 'S00020', fecha: '29/07', cliente: 'Juan López',     vendedor: 'Cristian', local: '2299', pago: 'Transferencia', items: 1, total: 700000,  sena: 0,      saldo: 700000, entrega: null,    estado: 'preproduccion',   situacion: 'con_frenos',  reclamo: false, factura: 'no',
        lineas: [{ id: 'L1', producto: 'Vajillero Nórdico', cantidad: 1, precio: 700000, tipo: 'estandar', img: null }],
        recordatorios: [], comentarios: [{ area: 'Tesorería', texto: 'Cliente dice que transfirió — sin acreditar en el banco', f: '29/07' }], archivos: [],
        cobros: [{ id: 'c2', f: '29/07', m: 700000, metodo: 'transferencia', recibidoPor: 'Cuenta Cristian', depositante: 'Juan López', referencia: 'Mercado Pago', estado: 'pendiente_banco' }] },
      { id: 3, numero: 'S00019', fecha: '28/07', cliente: 'Bibiana',        vendedor: 'Ale',      local: '2020', pago: 'Tarjeta',       items: 2, total: 516000,  sena: 516000, saldo: 0,      entrega: '05/08', estado: 'listo',           situacion: 'lista',       reclamo: true,  factura: 'no',
        lineas: [{ id: 'L1', producto: 'Mesa de Luz Estocolmo', cantidad: 2, precio: 258000, tipo: 'estandar', img: null }],

    async arbolCategorias() {

    // Productos: por categoría (tipo de mueble) o por texto libre.
    async productos({ texto = '', categoriaId = null, limite = 200 } = {}) {
      if (!hayConexion()) {
        const t = sinTilde(texto);
        let ps = DEMO.productos.filter(p =>
          (!t || sinTilde(p.nombre).includes(t)) &&
          (categoriaId == null || p.categoria_id === categoriaId));
        return ps.map(p => ({ ...p, variantes: DEMO.variantes.filter(v => v.producto_id === p.id).length }));

      let q = cliente().from('producto')
        .select('id,categoria_id,nombre,publicado_tn,variante(count)')
        .eq('activo', true).order('nombre').limit(limite);
      // Búsqueda sin tildes: se compara contra nombre_norm (columna generada,
      // ver migración busqueda_sin_tilde.sql). Así "comoda" encuentra "CÓMODA".
      if (texto) q = q.ilike('nombre_norm', `%${sinTilde(texto)}%`);
      if (categoriaId != null) q = q.eq('categoria_id', categoriaId);
      const { data, error } = await q;
      if (error) throw error;
      return (data || []).map(p => ({ ...p, variantes: p.variante?.[0]?.count ?? 0 }));

      return data || [];
    },

      const activas = DEMO.ordenes.filter(o => (SITUACION_ORDEN[o.situacion] || {}).activa);
      const conteos = { '': activas.length };
      BUCKETS_ORDEN.forEach(b => { if (b.k) conteos[b.k] = activas.filter(o => (SITUACION_ORDEN[o.situacion] || {}).bucket === b.k).length; });

    async transferenciasPendientes() {
      const out = [];
      DEMO.ordenes.forEach(o => (o.cobros || []).forEach(c => {
        if (c.estado === 'pendiente_banco') out.push({ orden: o, cobro: c });

    // Recalcula seña/saldo de una orden: SOLO cuenta lo cobrado de verdad
    // (efectivo rendido + transferencia acreditada en banco).
    _recalc(o) {
      o.sena = (o.cobros || []).filter(c => c.estado === 'rendido' || c.estado === 'confirmado')
        .reduce((a, c) => a + (c.metodo === 'transferencia' ? (c.montoConfirmado ?? c.m) : c.m), 0);
      o.saldo = Math.max(0, (o.total || 0) - o.sena);
      return o;
    },
    // Registra una seña. Efectivo → rendido (cobrado). Transferencia →
    // pendiente_banco hasta que se acredite. Devuelve el cobro creado.
    registrarSena(ordenId, { metodo, monto, recibidoPor, depositante = '', referencia = '', fecha = 'hoy' }) {
      const o = this._orden(ordenId); if (!o) throw new Error('Orden no encontrada');
      const c = { id: 'c' + Date.now().toString(36), f: fecha, m: Math.round(Number(monto) || 0), metodo, recibidoPor };
      if (metodo === 'transferencia') { c.depositante = depositante; c.referencia = referencia; c.estado = 'pendiente_banco'; }
      else { c.estado = 'rendido'; }
      (o.cobros = o.cobros || []).push(c);
      this._recalc(o);
      return c;
    },
    // ¿Ya existe ese Nº de comprobante en cualquier orden? (evita duplicar pagos).
    comprobanteExiste(nro, exceptId) {
      const n = String(nro || '').trim().toLowerCase(); if (!n) return false;
      return DEMO.ordenes.some(o => (o.cobros || []).some(c => c.id !== exceptId && String(c.comprobante || '').trim().toLowerCase() === n));
    },
    // Confirmación bancaria (Administración/Dirección): vincula el pago al banco
    // con CUIT + Nº de comprobante + monto acreditado. Rechaza comprobante repetido.
    confirmarSenaBanco(ordenId, cobroId, { cuit, comprobante, montoConfirmado, confirmadoPor }) {
      const o = this._orden(ordenId); if (!o) throw new Error('Orden no encontrada');
      const c = (o.cobros || []).find(x => x.id === cobroId); if (!c) throw new Error('Cobro no encontrado');
      if (this.comprobanteExiste(comprobante, cobroId)) throw new Error('Ese N° de comprobante ya está cargado en otra seña. No se duplica.');
      c.cuit = String(cuit || '').trim();
      c.comprobante = String(comprobante || '').trim();
      c.montoConfirmado = Math.round(Number(montoConfirmado) || 0);
      c.confirmadoPor = confirmadoPor || 'Administración';
      c.estado = 'confirmado';
      this._recalc(o);
      return c;
    },

        const causa = rO.find(c => !c.ok && c.clave !== 'sin_bloqueos_orden')?.clave || 'condicion';
        if (!o.bloqueos.some(b => b.motivo === 'reversion')) o.bloqueos.push({ alcance: 'orden', motivo: 'reversion', clave: causa, resp: 'Dirección', activo: true });
        ctx.emit('impacto.detectado', { orden: o.id, causa }); ctx.emit('accion.requerida', { orden: o.id, tipoAccion: 'cancelacion_o_modificacion' });
      } else { o.estadoComercial = 'a_confirmar'; ctx.emit('orden.a_confirmar', { orden: o.id, falta: rO.filter(c => !c.ok).map(c => c.clave) }); }
    } else if (o.estadoComercial === 'borrador') { o.estadoComercial = 'a_confirmar'; }
  }
  function evaluar(o, ctx, disparadoPor = 'manual') {
    transicionOrden(o, ctx, disparadoPor);
    const ordenBloqueada = o.bloqueos.some(b => b.motivo === 'reversion');
    for (const l of o.lineas) {
      const rL = evalChecks(COND_LINEA, l, ctx, 'linea:' + l.id, disparadoPor, o);
      const lineaOk = rL.every(c => c.ok);
      if (l.habilitacion === 'liberada') {
        if (!lineaOk && l.objetosOperativos.length && !l.bloqueos.some(b => b.motivo === 'reversion')) {
          const causa = rL.find(c => !c.ok)?.clave || 'condicion';
          l.bloqueos.push({ alcance: 'linea', motivo: 'reversion', clave: causa, resp: 'Dirección', accion: 'cancelar o modificar' });
          ctx.emit('impacto.detectado', { linea: l.id, causa }); ctx.emit('accion.requerida', { linea: l.id, tipoAccion: 'cancelacion_o_modificacion' });
        }
        continue;
      }
      if (ordenBloqueada) continue;
      if (o.estadoComercial === 'confirmada' && lineaOk) {
        l.habilitacion = 'liberada'; l.bloqueos = []; ctx.emit('linea.liberada', { linea: l.id }); generarEfectos(o, l, ctx);
      } else {
        l.habilitacion = 'bloqueada';
        l.bloqueos = rL.filter(c => !c.ok).map(c => ({ clave: c.clave, resp: c.resp, ...(BLOQUEO_INFO[c.clave] || { alcance: 'liberacion' }) }));
      }
    }
  }
  function generarEfectos(o, l, ctx) {
    const efectos = EFECTOS[l.estrategia] || ['pendiente_decision'];
    for (const ef of efectos) {
      const key = `${o.id}:${l.id}:v${o.version}:${ef}`;
      if (ctx.registry.has(key)) continue;
      const obj = { tipoObjeto: ef, ref: { orden: o.id, linea: l.id, version: o.version } };
      l.objetosOperativos.push(obj); ctx.registry.set(key, obj);
      ctx.emit('objetoOperativo.creado', { linea: l.id, tipoObjeto: ef });
    }
    l.cumplimiento = cumplimientoDe(efectos);
  }
  function registrarCobro(o, cobro, ctx) { o.cobros.push(cobro); ctx.emit('cobro.registrado', { monto: cobro.monto, estado: cobro.estado }); evaluar(o, ctx, 'cobro.registrado'); }
  function solicitarExcepcion(o, regla, d, ctx) { o.solicitudes.push({ regla, ...d, estado: 'pendiente', responsable: 'Dirección', fecha: ahora() }); ctx.emit('autorizacion.requerida', { regla, ...d, responsable: 'Dirección' }); }
  function autorizarExcepcion(o, regla, d, ctx) {
    const sol = o.solicitudes.find(s => s.regla === regla && s.estado === 'pendiente'); if (sol) sol.estado = 'aprobada';
    const sv = regla === 'sena_fabricacion' ? senaVal(o) : {};
    o.excepciones.push({ regla, esperado: sv.esperado, valorReal: sv.valor, autorizadaPor: d.autorizadaPor, motivo: sol?.motivo, fecha: ahora() });
    ctx.emit('excepcion.autorizada', { regla, autorizadaPor: d.autorizadaPor }); evaluar(o, ctx, 'excepcion.autorizada');
  }

  function mkLinea(x) { return { habilitacion: 'pendiente', cumplimiento: 'sin_iniciar', bloqueos: [], objetosOperativos: [], ...x }; }
  function mkOrden(x) { return { estadoComercial: 'borrador', version: 1, cobros: [], bloqueos: [], excepciones: [], solicitudes: [], ...x }; }

  // Orden demo tipo OV-2048 (mezcla: reservada · en producción · bloqueada).
  function ordenDemo() {
    const o = mkOrden({ id: 'OV-2020-2048', total: 1200000, termino: 'efectivo', vendedor: 'Ale', local: '2020', canal: 'Instagram', cotizacionAceptada: true,
      cliente: { nombre: 'Laura Pérez', tel: '11 5555-2048', ig: '@lau.perez', dir: 'Av. Cabildo 2450' }, lineas: [
      mkLinea({ id: 'L1', tipo: 'estándar', producto: 'Cómoda Amberes 1.20', destinoPreliminar: 'stock', estrategia: 'stock', precio: 425750 }),
      mkLinea({ id: 'L2', tipo: 'a fabricar', producto: 'Mesa Noruega', destinoPreliminar: 'fabrica', estrategia: 'fabricacion_interna', requiereMedida: true, medidaConfirmada: true, precio: 380000 }),
      mkLinea({ id: 'L3', tipo: 'a medida', producto: 'Placard Oliver a medida', destinoPreliminar: 'fabrica', estrategia: 'fabricacion_interna', requiereAutorizacion: true, precioAutorizado: false, tieneObs: true, obsVerificada: false, precio: 394250 }),
    ] });
    const ctx = nuevoCtx();
    registrarCobro(o, { monto: 360000, estado: 'validado' }, ctx); // 30%
    return { o, ctx };
  }

  // Motivo legible por condición faltante (para la cola "A confirmar").
  const MOTIVO = {
    sena_fabricacion: 'Esperando seña para fabricar',
    precio: 'Esperando autorización de precio',
    obs: 'Esperando verificación de observaciones',
    medida: 'Falta confirmar la medida',
    destino: 'Falta definir el destino',
    mods: 'Modificación pendiente',
  };

  // Deriva los "pendientes" de una orden: qué falta, quién resuelve, qué acciones.
  function pendientesDe(o) {
    const items = [];
    if (o.estadoComercial === 'a_confirmar' || o.estadoComercial === 'borrador') {
      const falta = evalChecks(COND_ORDEN, o, null, 'orden', 'ui', o).filter(c => !c.ok);
      if (falta.length) items.push({
        nivel: 'orden', ordenId: o.id, cliente: o.cliente, desde: o._desde,
        motivo: 'Orden a confirmar: ' + falta.map(c => c.label).join(', '),
        responsable: falta[0].resp, acciones: ['ver_detalle'], o,
      });
    }
    for (const l of o.lineas) {
      if (l.habilitacion === 'bloqueada' && l.bloqueos.length) {
        const b = l.bloqueos.find(x => x.acciones) || l.bloqueos[0];
        const acciones = b.acciones ? b.acciones.slice()
          : b.clave === 'precio' ? ['autorizar_precio']
          : b.clave === 'obs' ? ['verificar_obs'] : ['ver_detalle'];
        items.push({
          nivel: 'linea', ordenId: o.id, cliente: o.cliente, producto: l.producto, lineaId: l.id,
          desde: o._desde, motivo: b.motivo || MOTIVO[b.clave] || b.clave,
          responsable: b.resp, acciones, o,
        });
      }
    }
    return items;
  }

  function mk(id, desde, extra, lineas) {
    const o = mkOrden({ id, total: extra.total || 800000, termino: 'efectivo', vendedor: extra.vendedor || 'Ale', local: '2020',
      cotizacionAceptada: extra.aceptada !== false, cliente: extra.cliente, lineas, _desde: desde });
    const ctx = nuevoCtx();
    if (extra.cobro) registrarCobro(o, { monto: extra.cobro, estado: 'validado' }, ctx); else evaluar(o, ctx, 'init');
    return { o, ctx };
  }

  // Cola demo: varias órdenes en distintos estados de pendiente.
  function colaDemo() {
    return [
      // Placard a medida esperando autorización de precio
      mk('OV-2020-2048', 'hace 2 días', { total: 1200000, cobro: 360000, cliente: { nombre: 'Laura Pérez', tel: '11 5555-2048', ig: '@lau.perez', dir: 'Av. Cabildo 2450' } }, [
        mkLinea({ id: 'L1', tipo: 'estándar', producto: 'Cómoda Amberes', destinoPreliminar: 'stock', estrategia: 'stock' }),
        mkLinea({ id: 'L2', tipo: 'a fabricar', producto: 'Mesa Noruega', destinoPreliminar: 'fabrica', estrategia: 'fabricacion_interna' }),
        mkLinea({ id: 'L3', tipo: 'a medida', producto: 'Placard Oliver a medida', destinoPreliminar: 'fabrica', estrategia: 'fabricacion_interna', requiereAutorizacion: true, precioAutorizado: false }),
      ]),
      // Vajillero a fabricar esperando seña
      mk('OV-2020-2049', 'hace 1 día', { total: 700000, cobro: 0, vendedor: 'Cristian', cliente: { nombre: 'Juan López', tel: '11 5555-2049' } }, [
        mkLinea({ id: 'L1', tipo: 'a fabricar', producto: 'Vajillero Nórdico', destinoPreliminar: 'fabrica', estrategia: 'fabricacion_interna' }),
      ]),
      // Orden a confirmar: falta aceptar la cotización
      mk('OV-2020-2050', 'hace 3 horas', { total: 500000, cobro: 0, vendedor: 'Nati', aceptada: false, cliente: { nombre: 'Camila Ruiz', ig: '@cami.ruiz' } }, [
        mkLinea({ id: 'L1', tipo: 'estándar', producto: 'Respaldo Milán', destinoPreliminar: 'stock', estrategia: 'stock' }),
      ]),
    ];
  }

  global.Motor = {
    COND_ORDEN, COND_LINEA, ETIQUETA_EFECTO, MOTIVO, senaVal, saldo, pagosValidados, requiereFabricacion,
    nuevoCtx, evaluar, evalChecks, registrarCobro, solicitarExcepcion, autorizarExcepcion,
    ordenDemo, colaDemo, pendientesDe,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================
//  Belgrano Soft · Catálogo
//  Navegación como en Tienda Nube: ambiente → tipo de mueble → modelo →
//  variantes. O búsqueda directa por texto. Es el cimiento del presupuesto.
// =====================================================================
(function (global) {
  const VISTA_KEY = 'bh_catalogo_vista';
  const Catalogo = {
    arbol: [],           // categorías cargadas
    ruta: [],            // breadcrumb: [{id,nombre}] hasta la categoría actual
    texto: '',           // búsqueda libre
    vista: (() => { try { return localStorage.getItem(VISTA_KEY) || 'bloques'; } catch { return 'bloques'; } })(),
    _prods: null,        // últimos productos pintados (para re-render al cambiar de vista)

    async render(mount = 'view') {
      const v = document.getElementById(mount);
      v.innerHTML = `
        <div class="row" style="margin-bottom:16px">
          <div>
            <div class="kick">Catálogo</div>
            <h1 class="h-title">Productos</h1>
            <div class="h-sub" id="cat-sub"></div>
          </div>
          <div class="sp"></div>
          <label class="fld" style="width:260px">
            <span class="lbl">Buscar en todo el catálogo</span>
            <input id="cat-q" placeholder="Amberes, oliver, mesa…" value="${UI.esc(this.texto)}">
          </label>
          <div class="vista-tog" role="group" aria-label="Formato de vista" style="align-self:flex-end">
            <button id="v-bloques" title="Bloques" aria-label="Bloques">▦</button>
            <button id="v-lista"   title="Listado" aria-label="Listado">☰</button>
          </div>
        </div>
        <div id="cat-crumb"></div>
        <div id="cat-lista">${UI.spinner()}</div>
        <style>
          .vista-tog{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
          .vista-tog button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-size:16px;color:var(--muted);line-height:1}
          .vista-tog button+button{border-left:1px solid var(--line)}
          .vista-tog button.on{background:var(--brand-soft);color:var(--brand-ink)}
        </style>`;
      this.pintarTog();
      document.getElementById('v-bloques').onclick = () => this.setVista('bloques');
      document.getElementById('v-lista').onclick   = () => this.setVista('lista');

      if (global.DB.modo() === 'demo') {
        v.insertAdjacentHTML('afterbegin',
          `<div class="banner info">Modo demo — árbol y productos de ejemplo.
           <a href="#" id="cat-conectar">Conectar Belgrano Soft</a> para ver el catálogo real.</div>`);
        document.getElementById('cat-conectar').onclick = e => { e.preventDefault(); this.modalConexion(); };
      }

      const q = document.getElementById('cat-q');
      let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => {
        this.texto = q.value.trim();
        if (this.texto) this.buscar(); else { this.ruta = []; this.pintar(); }
      }, 250); };

      try {
        this.arbol = await global.DB.arbolCategorias();
        const tot = await global.DB.totales().catch(() => null);
        const sub = document.getElementById('cat-sub');
        if (sub && tot) sub.textContent = `${tot.productos.toLocaleString('es-AR')} productos · ${tot.variantes.toLocaleString('es-AR')} variantes`;
      } catch (e) { /* seguimos con lo que haya */ }
      this.pintar();
    },

    // Hijos de una categoría (o las raíces si padre es null).
    hijos(padreId) {
      return this.arbol.filter(c => (c.padre_id ?? null) === (padreId ?? null))
        .sort((a, b) => a.nombre.localeCompare(b.nombre));
    },

    crumb() {
      const c = document.getElementById('cat-crumb');
      if (!c) return;
      const items = [{ id: null, nombre: 'Todo' }, ...this.ruta];
      c.innerHTML = `<div class="wrap-row" style="margin-bottom:14px;align-items:center">` +
        items.map((it, i) => {
          const last = i === items.length - 1;
          return `<span>${last
            ? `<b style="color:var(--navy)">${UI.esc(it.nombre)}</b>`
            : `<a href="#" data-crumb="${i}">${UI.esc(it.nombre)}</a>`}</span>` +
            (last ? '' : '<span class="muted">›</span>');
        }).join('') + `</div>`;
      c.querySelectorAll('[data-crumb]').forEach(a =>
        a.onclick = e => { e.preventDefault(); this.ruta = this.ruta.slice(0, Number(a.dataset.crumb)); this.pintar(); });
    },

    async pintar() {
      this.crumb();
      const cont = document.getElementById('cat-lista');
      const actual = this.ruta.length ? this.ruta[this.ruta.length - 1].id : null;
      const subcats = this.hijos(actual);

      // Si la categoría actual tiene subcategorías, mostramos el árbol.
      if (subcats.length) {
        cont.innerHTML = `<div class="grid-cats">${subcats.map(c =>
          `<button class="cat-tile" data-cat="${c.id}">
             <span class="cat-n">${UI.esc(c.nombre)}</span>
             <span class="cat-go">›</span>
           </button>`).join('')}</div>
          <style>
            .grid-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
            .cat-tile{display:flex;align-items:center;gap:10px;padding:16px;border:1px solid var(--line);
              border-radius:12px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:.15s}
            .cat-tile:hover{border-color:var(--brand);transform:translateY(-1px)}
            .cat-n{font-weight:650;color:var(--navy);flex:1}
            .cat-go{color:var(--muted);font-size:18px}
          </style>`;
        cont.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
          const c = this.arbol.find(x => x.id === Number(b.dataset.cat));
          this.ruta.push({ id: c.id, nombre: c.nombre }); this.pintar();
        });
        return;
      }

      // Es una hoja (tipo de mueble): mostramos sus productos.
      cont.innerHTML = UI.spinner();
      try {
        this._prods = await global.DB.productos({ categoriaId: actual });
        this.pintarProductos(cont,
          actual ? 'Este tipo de mueble no tiene productos.' : 'Elegí un ambiente para empezar.');
      } catch (e) {
        this._prods = null;
        cont.innerHTML = `<div class="banner warn">No se pudo leer: ${UI.esc(e.message || e)}</div>`;
      }
    },

    async buscar() {
      this.ruta = [];
      document.getElementById('cat-crumb').innerHTML = '';
      const cont = document.getElementById('cat-lista');
      cont.innerHTML = UI.spinner();
      try {
        this._prods = await global.DB.productos({ texto: this.texto });
        this.pintarProductos(cont, 'No hay productos para esa búsqueda.');
      } catch (e) {
        this._prods = null;
        cont.innerHTML = `<div class="banner warn">${UI.esc(e.message || e)}</div>`;
      }
    },

    // Cambia entre bloques/listado y re-pinta lo que haya sin volver a la base.
    setVista(v) {
      if (v === this.vista) return;
      this.vista = v;
      try { localStorage.setItem(VISTA_KEY, v); } catch {}
      this.pintarTog();
      const cont = document.getElementById('cat-lista');
      if (this._prods) this.pintarProductos(cont, 'Sin productos.');
    },

    pintarTog() {
      const b = document.getElementById('v-bloques'), l = document.getElementById('v-lista');
      if (!b || !l) return;
      b.className = this.vista === 'bloques' ? 'on' : '';
      l.className = this.vista === 'lista' ? 'on' : '';
    },

    // Dispatcher: pinta la lista de productos en el formato elegido.
    pintarProductos(cont, vacio) {
      const prods = this._prods || [];
      cont.innerHTML = prods.length
        ? (this.vista === 'lista' ? this.htmlLista(prods) : this.htmlBloques(prods))
        : UI.vacio(vacio);
      this.enganchar(cont);
    },

    htmlLista(prods) {
      return `<div class="card"><table>
        <thead><tr><th>Producto</th><th style="text-align:right">Variantes</th><th></th></tr></thead>
        <tbody>${prods.map(p => {
          const tn = p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>';
          return `<tr data-prod="${p.id}" style="cursor:pointer">
            <td><b>${UI.esc(p.nombre)}</b> ${tn}</td>
            <td style="text-align:right" class="tnum">${p.variantes}</td>
            <td style="text-align:right" class="muted">ver ›</td></tr>`;
        }).join('')}</tbody></table></div>`;
    },

    htmlBloques(prods) {
      return `<div class="grid-prod">${prods.map(p => {
        const tn = p.publicado_tn ? '<span class="pill ok">TN</span>' : '<span class="pill soft">interno</span>';
        return `<button class="prod-tile" data-prod="${p.id}">
            <div class="prod-top"><span class="prod-n">${UI.esc(p.nombre)}</span> ${tn}</div>
            <div class="prod-meta"><b class="tnum">${p.variantes}</b> variantes</div>
          </button>`;
      }).join('')}</div>
        <div id="cat-detalle"></div>
        <style>
          .grid-prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
          .prod-tile{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:16px;
            border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);
            cursor:pointer;text-align:left;transition:.15s}
          .prod-tile:hover{border-color:var(--brand);transform:translateY(-1px)}
          .prod-tile.on{border-color:var(--brand);background:var(--brand-soft)}
          .prod-top{display:flex;align-items:center;gap:8px}
          .prod-n{font-weight:650;color:var(--navy)}
          .prod-meta{color:var(--muted);font-size:13px}
        </style>`;
    },

    enganchar(cont) {
      cont.querySelectorAll('[data-prod]').forEach(el =>
        el.onclick = () => this.vista === 'lista'
          ? this.toggle(Number(el.dataset.prod))
          : this.abrirDetalle(Number(el.dataset.prod), el));
    },

    // Vista bloques: las variantes van a un panel debajo de la grilla.
    async abrirDetalle(prodId, tile) {
      const det = document.getElementById('cat-detalle');
      const yaAbierto = tile.classList.contains('on');
      document.querySelectorAll('.prod-tile.on').forEach(t => t.classList.remove('on'));
      if (yaAbierto) { det.innerHTML = ''; return; }
      tile.classList.add('on');
      det.innerHTML = `<div class="card pad" style="margin-top:12px">${UI.spinner('Variantes…')}</div>`;
      try {
        const vars = await global.DB.variantes(prodId);
        det.innerHTML = `<div class="card pad" style="margin-top:12px">${this.tablaVariantes(vars)}</div>`;
      } catch (e) {
        det.innerHTML = `<div class="banner warn" style="margin-top:12px">${UI.esc(e.message || e)}</div>`;
      }
    },

    async toggle(prodId) {
      const existe = document.getElementById('var-' + prodId);
      if (existe) { existe.remove(); return; }
      const tr = document.querySelector(`[data-prod="${prodId}"]`);
      const fila = document.createElement('tr');
      fila.id = 'var-' + prodId;
      fila.innerHTML = `<td colspan="3" style="background:var(--panel-2)">${UI.spinner('Variantes…')}</td>`;
      tr.after(fila);
      try {
        const vars = await global.DB.variantes(prodId);
        fila.querySelector('td').innerHTML = this.tablaVariantes(vars);
      } catch (e) {
        fila.querySelector('td').innerHTML = `<div class="banner warn">${UI.esc(e.message || e)}</div>`;
      }
    },

    tablaVariantes(vars) {
      if (!vars.length) return UI.vacio('Sin variantes cargadas.');
      return `<table style="margin:2px 0">
        <thead><tr><th>Medida</th><th>Estructura</th><th>Frente</th><th>Otros</th><th style="text-align:right">Precio</th></tr></thead>
        <tbody>${vars.map(v => {
          const extras = UI.extras(v).map(([k, val]) =>
            `<span class="pill soft">${UI.esc(k)}: ${UI.esc(val)}</span>`).join(' ') || '<span class="muted">—</span>';
          return `<tr>
            <td class="tnum">${UI.esc(v.medida || '—')}</td>
            <td>${UI.esc(v.estructura || '—')}</td>
            <td>${UI.esc(v.frente || '—')}</td>
            <td>${extras}</td>
            <td style="text-align:right"><b class="tnum">${UI.pesos(v.precio)}</b></td></tr>`;
        }).join('')}</tbody></table>`;
    },

    modalConexion() {
      const c = global.DB.cfg();
      document.body.insertAdjacentHTML('beforeend', `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:grid;place-items:center;padding:20px" id="mdl">
          <div class="card pad" style="max-width:460px;width:100%">
            <h3 class="h-title" style="font-size:18px">Conectar Belgrano Soft</h3>
            <p class="h-sub">Pegá la <b>anon key</b> (Settings → API → Project API keys → anon public). Es pública, va en el frontend.</p>
            <label class="fld" style="margin-top:14px"><span class="lbl">URL del proyecto</span>
              <input id="mc-url" value="${UI.esc(c.url || global.DB.DEFAULT_URL)}"></label>
            <label class="fld" style="margin-top:12px"><span class="lbl">anon key</span>
              <input id="mc-key" placeholder="eyJ…" value="${UI.esc(c.key || '')}"></label>
            <div class="row" style="margin-top:18px;justify-content:flex-end;gap:10px">
              <button class="btn" id="mc-cancel">Cancelar</button>
              <button class="btn primary" id="mc-ok">Conectar</button>
            </div>
          </div>
        </div>`);
      const cerrar = () => document.getElementById('mdl').remove();
      document.getElementById('mc-cancel').onclick = cerrar;
      document.getElementById('mc-ok').onclick = () => {
        const url = document.getElementById('mc-url').value.trim();
        const key = document.getElementById('mc-key').value.trim();
        if (!key) { UI.aviso('Falta la anon key', 'warn'); return; }
        global.DB.guardarCfg(url, key);
        UI.aviso('Conectado. Recargando…', 'ok');
        setTimeout(() => location.reload(), 600);
      };
    },
  };

  global.Catalogo = Catalogo;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
// =====================================================================
//  Belgrano Soft · Nueva cotización (Cotización → Venta)
//
//  Layout de dos columnas, al estilo de la ficha de documento:
//    · Columna principal — cabecera con el total, los datos agrupados en dos
//      bloques (cliente / operación) y las solapas Productos · Adicionales,
//      con el desglose de totales abajo a la derecha.
//    · Costado — Actividad y Notas, la ficha del cliente y los documentos
//      relacionados (última consulta, última cotización, última orden).
//
//  Los tres espacios que pidió Brian siguen estando, sólo que agrupados:
//    1) Datos del cliente (cabecera)  2) Productos  3) Adicionales (solapas)
//
//  Productos: se busca en una línea corta (sin importar tildes) y al elegir el
//  mueble se arma la variante CON BOTONES — Medida, después Estructura, después
//  Frente — y el precio se actualiza solo. No se listan los precios de todas
//  las variantes (puede haber 15 por mueble): sólo el del combo armado.
//
//  El precio nace del precio de lista y lo ajusta la condición de pago:
//  efectivo −35%; tarjeta/cuotas = lista; transferencia y mixto se ajustan
//  (mixto es editable por línea).
//  "Confirmar → Venta" crea la orden en estado CONFIRMAR (espera la seña).
// =====================================================================
(function (global) {
  // Las condiciones de pago y su descuento salen de Configuración → Reglas de
  // precio. Acá sólo se usan: el nombre es lo único que ve el cliente
  // ("Efectivo"), el % que lleva cada una es interno.
  const cond = () => global.DB.condiciones();

  // Los tres ejes con su nombre, para que la línea diga QUÉ es cada cosa
  // ("Medida 1.20 · Estructura Blanca · Frente Paraíso", no "1.20 · blanca").
  const EJES = [
    { k: 'medida',     label: 'Medida' },
    { k: 'estructura', label: 'Estructura' },
    { k: 'frente',     label: 'Frente' },
  ];

  // Campos que arrancan ocultos detrás de su botón: sólo se cargan si hacen
  // falta (IG cuando no hay teléfono, DNI cuando va factura, etc.).
  const OPCIONALES = [
    { k: 'tel2',      btn: '+ Teléfono', lbl: 'Teléfono adicional', ph: '11 5555-2020' },
    { k: 'instagram', btn: '+ IG',       lbl: 'Instagram',          ph: '@usuario' },
    { k: 'dni',       btn: '+ DNI',      lbl: 'DNI o CUIT',         ph: '00.000.000' },
  ];

  // Cómo llega el mueble. Decide qué domicilio se pregunta y si hay flete que
  // cotizar: retirando no hay envío; por expreso el flete es hasta el expreso;
  // "a confirmar" deja todo cargable pero sin exigirlo.
  const ENTREGAS = [
    { k: 'envio',     label: 'Envío CABA o GBA' },
    { k: 'retira',    label: 'Retira cliente' },
    { k: 'expreso',   label: 'Expreso' },
    { k: 'confirmar', label: 'A confirmar' },
  ];

  const Presupuesto = {
    cli: null,
    abiertos: {},        // campos opcionales revelados
    etapa: 'cliente',    // desplegable abierto: cliente | productos | adicionales | ''
    lado: 'notas',       // notas | historico | actividad
    vendedor: '', local: '', fecha: '', termino: 'efectivo',
    nro: null, guardada: false,   // el número se toma al abrir; si no se usa, vuelve
    modo: 'cotizacion',           // cotizacion | orden (misma pantalla, otro documento)
    nroOrden: null, fechaOrden: '',
    confirmadas: {},              // en la orden hay que revalidar cada etapa
    cabAbierta: false,            // la cabecera se lee; el lápiz la abre
    cantNueva: 1,                 // cantidad del renglón de carga (cantidad + producto)
    obsExt: '', obsInt: '', terminos: '',
    pendientes: [],               // recordatorios / mensajes agendados
    cobros: [],                   // señas registradas en la orden
    dto: null,                    // descuento comercial extra {modo, alcance, linea, valor}
    archivos: [],                 // adjuntos de la cotización (van a Documentos)
    registrando: false,           // el historial arranca al guardar / confirmar
    cambios: [],                  // cambios con impacto, a confirmar antes de guardar
    ad: null,            // adicionales
    actividad: [],       // historial de la cotización (se arma sola)
    lineas: [],   // {key,tipo,prodNombre,varId,ejes,partes,base,cantidad,obs,precioManual,img}
    _uid: 0,
    _mount: 'view',

    // ---- Cálculo ---------------------------------------------------------
    // El vendedor cotiza a medida con UNO de los dos precios y el otro sale solo:
    // lista −35% = efectivo · efectivo ÷ 0,65 (≈ ×1,54) = lista.
    factorEfectivo() { return 1 - (global.DB.descuentoDe('efectivo') / 100); },
    aEfectivo(lista) { return Math.round((Number(lista) || 0) * this.factorEfectivo()); },
    aLista(efectivo) {
      const f = this.factorEfectivo();
      return f > 0 ? Math.round((Number(efectivo) || 0) / f) : 0;
    },
    descEfectivoPct() { return global.DB.descuentoDe('efectivo'); },
    multLista() {
      const f = this.factorEfectivo();
      return f > 0 ? (1 / f).toFixed(2).replace('.', ',') : '—';
    },
    // El vendedor carga el precio en la condición que eligió arriba; el de
    // lista sale solo (efectivo ÷ 0,65, lista tal cual).
    labelPrecio() {
      const f = this.factor();
      return f === 1 ? 'Precio de lista' : `Precio en ${this.terminoLabel().toLowerCase()}`;
    },
    desdeCondicion(monto) {
      const f = this.factor();
      return f > 0 ? Math.round((Number(monto) || 0) / f) : Math.round(Number(monto) || 0);
    },
    // Un mueble a medida puede estar todavía sin precio: se define después.
    sinPrecio(l) { return l.tipo === 'medida' && l.precioManual == null; },

    // Descuento de la condición de pago, en % (se configura en Configuración).
    descPct() { return this.termino === 'mixto' ? 0 : global.DB.descuentoDe(this.termino); },
    factor() { return 1 - this.descPct() / 100; },
    // Precio de lista, antes del descuento por condición de pago. En los muebles
    // a medida el vendedor carga el precio de LISTA, igual que en los estándar.
    lista(l) { return l.tipo === 'medida' ? (Number(l.precioManual) || 0) : l.base; },
    // Precio final por unidad. El descuento sale de la condición de pago y aplica
    // igual a estándar y a medida — lo único que cambia es de dónde sale la lista.
    unit(l) {
      // Mixto: el vendedor arma cada precio a mano (parte efectivo + parte tarjeta).
      if (this.termino === 'mixto') return l.precioManual != null ? Number(l.precioManual) : l.base;
      return this.lista(l) * this.factor();
    },
    totalLista() { return this.lineas.reduce((a, l) => a + this.lista(l) * l.cantidad, 0); },
    total() { return this.lineas.reduce((a, l) => a + this.unit(l) * l.cantidad, 0); },
    descuento() { return this.totalLista() - this.total(); },
    envioMonto() { return this.pideEnvio() ? (this.ad.envio || 0) : 0; },
    // Descuento comercial extra, aparte del que da la condición de pago. Puede
    // ser en % o en $, sobre todos los muebles o sobre un producto puntual.
    descuentoExtra() {
      const d = this.dto;
      if (!d || !(Number(d.valor) > 0)) return 0;
      const base = d.alcance === 'linea'
        ? (() => { const l = this.get(d.linea); return l ? this.unit(l) * l.cantidad : 0; })()
        : this.total();
      const monto = d.modo === 'pct' ? base * (Number(d.valor) / 100) : Number(d.valor);
      return Math.round(Math.min(monto, base));   // nunca más que lo que se descuenta
    },
    dtoTexto() {
      const d = this.dto;
      if (!d || !(Number(d.valor) > 0)) return '';
      const cuanto = d.modo === 'pct' ? `${d.valor}%` : UI.pesos(d.valor);
      if (d.alcance !== 'linea') return `${cuanto} sobre los muebles`;
      const l = this.get(d.linea);
      return `${cuanto} en ${l ? l.prodNombre : 'un producto'}`;
    },
    // ---- Seña ------------------------------------------------------------
    // La orden no entra a fábrica sin la seña mínima (30% del total).
    senaMinima() { return Math.round(this.totalFinal() * (global.DB.SENA_PCT / 100)); },
    senaTotal() { return (this.cobros || []).reduce((a, c) => a + (Number(c.m) || 0), 0); },
    saldo() { return Math.max(0, this.totalFinal() - this.senaTotal()); },
    senaSuficiente() { return this.senaTotal() >= this.senaMinima(); },

    instalacionMonto() { return this.ad.instalacion === 'si' ? (this.ad.instalacionCosto || 0) : 0; },
    totalFinal() { return this.total() + this.envioMonto() + this.instalacionMonto() - this.descuentoExtra(); },
    items() { return this.lineas.reduce((a, l) => a + l.cantidad, 0); },

    // Estándar → precio bloqueado (sale del catálogo). A medida → se libera.
    editable(l) { return l.tipo === 'medida' || this.termino === 'mixto'; },
    clienteValido() {
      const c = this.cli;
      return !!(String(c.telefono).trim() || String(c.email).trim() || String(c.instagram).trim());
    },
    // Un ítem salta a verificación de administración si es a medida o tiene detalle.
    requiereVerif(l) { return l.tipo === 'medida' || !!String(l.obs).trim(); },
    // Cambiar el plazo de entrega no es una edición libre: se audita.
    entregaEditada() { return !!this.ad.entregaTocada; },
    // "entre el 5 de septiembre y el 10 de septiembre". SIEMPRE es un rango:
    // la fábrica no compromete un día puntual.
    entregaTexto() {
      const a = this.ad;
      if (this.todoListo() && a.entregaModo !== 'fecha') return 'A convenir con logística';
      if (!a.desde || !a.hasta) return 'A confirmar';
      if (a.hasta === a.desde) return `el ${fechaLarga(a.desde)}`;
      return `entre el ${fechaLarga(a.desde)} y el ${fechaLarga(a.hasta)}`;
    },
    // El plazo en días, para el resumen de la cabecera: "30 a 35 días".
    entregaDias() {
      const a = this.ad;
      if (this.todoListo() && a.entregaModo !== 'fecha') return 'a convenir';
      if (!a.desde || !a.hasta) return 'a confirmar';
      return `${diasHasta(a.desde)} a ${diasHasta(a.hasta)} días`;
    },
    // Si nada va a fábrica, no hay plazo de fabricación que esperar.
    todoListo() { return !!this.lineas.length && this.lineas.every(l => l.estadoProd === 'listo'); },
    // Corrige el rango: nunca puede quedar en un solo día.
    normalizarEntrega() {
      const a = this.ad, d = global.DB.ENTREGA_DIAS;
      if (!a.desde) return false;
      if (!a.hasta || a.hasta <= a.desde) {
        a.hasta = sumarDias(a.desde, Math.max(1, d.max - d.min));
        return true;   // hubo que corregirlo
      }
      return false;
    },
    // Retirando no hay flete. Con envío a CABA/GBA el costo sale solo de la
    // localidad; por expreso o a confirmar se puede cargar a mano, pero no
    // se inventa un número.
    entregaModoLabel() { return (ENTREGAS.find(o => o.k === this.cli.entrega) || ENTREGAS[0]).label; },
    pideEnvio() { return this.cli.entrega !== 'retira'; },
    envioCotizable() { return this.cli.entrega === 'envio' && !!(String(this.cli.domicilio).trim() && this.cli.localidad); },
    // El flete se puede escribir a mano siempre que haya algo que enviar.
    envioCargable() { return this.pideEnvio(); },
    envioTexto() {
      if (!this.pideEnvio()) return 'Sin envío — retira';
      if (this.envioCotizable() || this.ad.envioTocado) return UI.pesos(this.ad.envio);
      return global.DB.ENVIO_SIN_DOMICILIO;
    },
    instalacionTexto() {
      const i = this.ad.instalacion;
      return i === 'si' ? 'Sí' : i === 'no' ? 'No' : global.DB.INSTALACION_DEFAULT;
    },
    terminoLabel() { return global.DB.condicion(this.termino).label; },
    esOrden() { return this.modo === 'orden'; },
    // El documento se llama distinto según en qué etapa está.
    nroDoc() { return this.esOrden() ? this.nroOrden : global.DB.numeroCotizacion(this.nro); },
    nombreCli() {
      const c = this.cli;
      return c.nombre.trim() || c.telefono.trim() || c.instagram.trim() || c.email.trim();
    },

    // Un cambio con impacto (precio, envío, plazo) no se guarda a la callada:
    // queda pendiente y hay que confirmarlo antes de volver a guardar.
    cambio(texto, antes) {
      if (!this.registrando) return;
      const ahora = this.totalFinal();
      this.cambios.push({ texto, antes, ahora, quien: this.vendedor });
      this.log(this.vendedor, texto);
    },
    // Foto del total antes de tocar algo, para poder contar la diferencia.
    antes() { return this.registrando ? this.totalFinal() : null; },

    // Cada movimiento queda anotado en el costado (y después va al CRM).
    // El historial NO registra el armado inicial: mientras la cotización se está
    // cargando por primera vez no hay nada que auditar. Recién cuando se guarda
    // (o se pasa a venta) empieza a quedar registro de lo que se toca después.
    log(quien, texto, clave) {
      if (!this.registrando) return;
      const ult = this.actividad[0];
      if (clave && ult && ult.clave === clave && ult.quien === quien) {
        ult.texto = texto; ult.hora = hora(); return;
      }
      this.actividad.unshift({ quien, texto, clave, hora: hora() });
      if (this.actividad.length > 40) this.actividad.pop();
    },

    // ---- Render ----------------------------------------------------------
    render(mount = 'view') {
      this._mount = mount;
      if (!this.cli) this.reset();
      document.getElementById(mount).innerHTML = `
        <div class="cz-bar">
          <div class="kick">Ventas · ${this.esOrden() ? 'Órdenes' : 'Cotizaciones'}</div>
        </div>
        <div class="cz-wrap">
          <div id="cz-main"></div>
          <aside id="cz-side"></aside>
        </div>
        ${this.estilos()}`;

      this.pintarTodo();
    },

    pintarTodo() { this.pintarMain(); this.pintarSide(); },

    // ---- Columna principal -----------------------------------------------
    // Cabecera fija + las tres etapas como desplegables: se completa una, se
    // cierra sola y se abre la siguiente. Igual se puede abrir/cerrar a mano,
    // así queda todo en una sola pantalla.
    pintarMain() {
      const m = document.getElementById('cz-main'); if (!m) return;
      const secs = [
        { k: 'cliente',     n: 1, tit: 'Datos del cliente' },
        { k: 'productos',   n: 2, tit: 'Productos' },
        { k: 'adicionales', n: 3, tit: 'Adicionales' },
        // La seña sólo tiene sentido con la venta confirmada.
        ...(this.esOrden() ? [{ k: 'sena', n: 4, tit: 'Registrar pago' }] : []),
      ];
      m.innerHTML = `
        <div class="${this.esOrden() ? 'card ordbar' : 'card pad cz-head'}" id="cz-cab"></div>
        ${secs.map(s => {
          const on = this.etapa === s.k;
          const ok = this.esOrden() && s.k !== 'sena' && this.confirmadas[s.k];
          return `<section class="card sec ${on ? 'on' : ''} ${ok ? 'ok' : ''}">
            <button class="sec-h" data-sec="${s.k}" aria-expanded="${on}">
              <span class="sec-n">${ok ? '✓' : s.n}</span>
              <span class="sec-t">${UI.esc(s.tit)}</span>
              <span class="sec-r" id="res-${s.k}">${this.resumen(s.k)}</span>
              <span class="sec-c">${on ? '▲' : '▼'}</span>
            </button>
            ${on ? `<div class="sec-b" id="sec-${s.k}"></div>` : ''}
          </section>`;
        }).join('')}
        <div class="card cz-foot">
          <div class="cz-tyc">
            <div class="lbl">Observaciones para el cliente
              <span class="muted">salen impresas en la cotización</span></div>
            <textarea id="obs-ext" rows="2" placeholder="Lo que tiene que ver el cliente…">${UI.esc(this.obsExt)}</textarea>
            <div class="int-box">
              <div class="lbl">Comentarios internos
                <span class="muted">no salen impresas — para nosotros o producción</span></div>
              <textarea id="obs-int" rows="2" placeholder="Notas para producción, administración o para vos…">${UI.esc(this.obsInt)}</textarea>
            </div>
            <div class="lbl" style="margin-top:11px">Términos y condiciones
              <span class="muted">salen siempre, no se editan</span></div>
            <div class="tyc-fijo">${UI.esc(global.DB.TYC_DEFAULT)}</div>
          </div>
          <div id="cz-tot"></div>
        </div>`;

      m.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => {
        const k = b.dataset.sec;
        // No se cotiza sin saber a quién: Productos y Adicionales quedan
        // cerrados hasta tener nombre + un contacto.
        if (k !== 'cliente' && this.etapa !== k && !this.clienteCompleto()) {
          this.etapa = 'cliente'; this.pintarMain(); this.avisoCliente(true);
          UI.aviso('Falta el nombre o un contacto del cliente', 'warn');
          return;
        }
        this.etapa = this.etapa === k ? '' : k;
        this.pintarMain();
      });
      document.getElementById('obs-ext').oninput = e => { this.obsExt = e.target.value; };
      document.getElementById('obs-int').oninput = e => { this.obsInt = e.target.value; };

      if (!this.esOrden()) this.pintarCabecera(); else this.pintarBarraOrden();
      if (this.etapa === 'cliente') this.pintarCliente();
      if (this.etapa === 'productos') this.pintarProductos();
      if (this.etapa === 'adicionales') this.pintarAdicionales();
      if (this.etapa === 'sena') this.pintarSena();
      this.pintarTotales();
    },

    // Línea corta al costado del título, para saber qué hay adentro sin abrir.
    resumen(k) {
      if (k === 'cliente') {
        const c = this.cli;
        const partes = [c.nombre.trim(), c.telefono.trim() || c.email.trim() || c.instagram.trim()].filter(Boolean);
        if (!partes.length) return '<i>sin cargar</i>';
        return UI.esc(partes.concat(this.entregaModoLabel()).join(' · '));
      }
      if (k === 'productos') {
        const n = this.items();
        return n ? `${n} ${n === 1 ? 'producto' : 'productos'} · ${UI.pesos(this.total())} · ${UI.esc(this.terminoLabel())}`
          : '<i>sin productos</i>';
      }
      if (k === 'adicionales') return `entrega ${UI.esc(this.entregaDias())} · envío ${UI.esc(this.envioTexto())}`;
      const x = this.senaTotal();
      return x ? `seña ${UI.pesos(x)} · saldo ${UI.pesos(this.saldo())}`
        : `<i>sin seña — sugerida ${UI.pesos(this.senaSugerida())}</i>`;
    },

    // Refresca el resumen de las cabeceras plegadas mientras se escribe.
    refrescarResumen() {
      ['cliente', 'productos', 'adicionales', 'sena'].forEach(k => {
        const el = document.getElementById('res-' + k);
        if (el) el.innerHTML = this.resumen(k);
      });
    },

    // En la orden la cabecera es un renglón más, del alto de las otras etapas:
    // a la izquierda el N° de orden, a la derecha su fecha (que puede no ser la
    // de la cotización).
    pintarBarraOrden() {
      const c = document.getElementById('cz-cab'); if (!c) return;
      const vends = global.DB.vendedores(), locs = global.DB.locales();
      const local = (locs.find(l => l.k === this.local) || {}).label || this.local;
      const ab = this.cabAbierta;
      c.innerHTML = `<div class="ob-row">
        <div class="ob-izq">
          <b>Orden de venta ${UI.esc(this.nroOrden)}</b>
          <span>Cotización ${UI.esc(global.DB.numeroCotizacion(this.nro))} · ${UI.esc(this.vendedor)} · ${UI.esc(local)}</span>
        </div>
        <div class="ob-der">
          <span>Fecha de la orden</span>
          ${ab ? `<input id="op-fechao" type="date" value="${UI.esc(this.fechaOrden)}">`
               : `<b>${UI.esc(fechaLarga(this.fechaOrden))}</b>`}
          <button class="lapiz" id="cab-ed" title="${ab ? 'Listo' : 'Cambiar la fecha, el vendedor o el local'}">${ab ? '✓' : '✏️'}</button>
        </div>
      </div>
      ${ab ? `<div class="ob-edit">
        <div class="fr sm"><label for="op-vend">Vendedor</label>
          <select id="op-vend">${vends.map(v => `<option ${this.vendedor === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div class="fr sm"><label for="op-local">Local de origen</label>
          <select id="op-local">${locs.map(l => `<option value="${l.k}" ${this.local === l.k ? 'selected' : ''}>${UI.esc(l.label)}</option>`).join('')}</select></div>
      </div>` : ''}`;
      document.getElementById('cab-ed').onclick = () => { this.cabAbierta = !this.cabAbierta; this.pintarBarraOrden(); };
      if (ab) {
        document.getElementById('op-fechao').onchange = e => { this.fechaOrden = e.target.value; };
        document.getElementById('op-vend').onchange = e => { this.vendedor = e.target.value; };
        document.getElementById('op-local').onchange = e => { this.local = e.target.value; };
      }
    },

    // Cabecera: quién y cuándo hace el presupuesto (no el total — eso va abajo).
    pintarCabecera() {
      const c = document.getElementById('cz-cab'); if (!c) return;
      const vends = global.DB.vendedores(), locs = global.DB.locales();
      c.innerHTML = `
        <div class="cz-tit">
          <div>
            <div class="kick">${this.esOrden() ? 'Orden de venta' : 'Cotización'} ${UI.esc(this.nroDoc())}</div>
            <h1 class="h-title" style="margin:2px 0 0">${UI.esc(this.nombreCli() || 'Nueva')}</h1>
          </div>
          <div class="sp" style="flex:1"></div>
          <div class="cz-box">
            <button class="lapiz cabx" id="cab-ed" title="${this.cabAbierta ? 'Listo' : 'Modificar vendedor, local o fecha'}"
              aria-label="${this.cabAbierta ? 'Listo' : 'Modificar'}">${this.cabAbierta ? '✓' : '✏️'}</button>
            <div class="fr sm nro"><label>${this.esOrden() ? 'N° de orden' : 'N° de cotización'}</label>
              <b class="tnum">${UI.esc(this.nroDoc())}</b></div>
            ${this.esOrden() ? `<div class="fr sm"><label>Cotización</label>
              <span class="valf">${UI.esc(global.DB.numeroCotizacion(this.nro))}</span></div>` : ''}
            <div class="fr sm"><label ${this.cabAbierta ? 'for="op-vend"' : ''}>Vendedor</label>
              ${this.cabAbierta
                ? `<select id="op-vend">${vends.map(v => `<option ${this.vendedor === v ? 'selected' : ''}>${v}</option>`).join('')}</select>`
                : `<span class="valf">${UI.esc(this.vendedor)}</span>`}</div>
            <div class="fr sm"><label ${this.cabAbierta ? 'for="op-local"' : ''}>Local de origen</label>
              ${this.cabAbierta
                ? `<select id="op-local">${locs.map(l => `<option value="${l.k}" ${this.local === l.k ? 'selected' : ''}>${UI.esc(l.label)}</option>`).join('')}</select>`
                : `<span class="valf">${UI.esc((locs.find(l => l.k === this.local) || {}).label || this.local)}</span>`}</div>
            <div class="fr sm"><label ${this.cabAbierta ? 'for="op-fecha"' : ''}>Fecha</label>
              ${this.cabAbierta
                ? `<input id="op-fecha" type="date" value="${UI.esc(this.fecha)}">`
                : `<span class="valf">${UI.esc(fechaLarga(this.fecha))}</span>`}</div>
          </div>
        </div>`;
      document.getElementById('cab-ed').onclick = () => { this.cabAbierta = !this.cabAbierta; this.pintarCabecera(); };
      if (this.cabAbierta) {
        document.getElementById('op-vend').onchange = e => { this.vendedor = e.target.value; };
        document.getElementById('op-local').onchange = e => { this.local = e.target.value; };
        document.getElementById('op-fecha').onchange = e => { this.fecha = e.target.value; this.pintarCabecera(); };
      }
    },

    // ---- 1 · Datos del cliente ------------------------------------------
    // Sólo datos del cliente. La condición de pago NO va acá: es un dato de la
    // orden y hace falta para cotizar los muebles, así que vive en Productos.
    pintarCliente() {
      const c = document.getElementById('sec-cliente'); if (!c) return;
      const locActual = global.DB.localidad(this.cli.localidad);
      const f = (id, lbl, val, ph) => `<div class="fr"><label for="${id}">${UI.esc(lbl)}</label>
        <input id="${id}" value="${UI.esc(val)}" placeholder="${UI.esc(ph)}"></div>`;
      const sel = (id, lbl, opts) => `<div class="fr"><label for="${id}">${UI.esc(lbl)}</label>
        <select id="${id}">${opts}</select></div>`;

      // Los opcionales abiertos llevan una X para volver a cerrarlos: si se
      // abrió uno por error, se borra lo cargado y vuelve a quedar oculto.
      // Cada opcional cuelga del campo con el que se relaciona: el teléfono
      // adicional al lado de Teléfono, el IG debajo de Cliente (lo reemplaza
      // cuando no hay teléfono) y el DNI debajo de ¿Cómo nos conoció?
      const opcional = k => {
        const o = OPCIONALES.find(x => x.k === k);
        if (!this.abiertos[k]) return '';
        return `<div class="fr"><label for="c-${k}">${UI.esc(o.lbl)}</label>
          <div class="fx"><input id="c-${k}" value="${UI.esc(this.cli[k])}" placeholder="${UI.esc(o.ph)}">
            <button class="cx" data-quitar="${k}" title="Quitar ${UI.esc(o.lbl)}" aria-label="Quitar ${UI.esc(o.lbl)}">✕</button></div></div>`;
      };
      const mas = (k, txt) => this.abiertos[k] ? ''
        : `<button class="chip-add" data-add="${k}">${UI.esc(txt)}</button>`;

      // La forma de entrega decide qué domicilio hace falta: si retira no se
      // pregunta ninguno, si va por expreso se agrega el del expreso, y con
      // "a confirmar" los campos quedan disponibles pero sin exigirse.
      const ent = this.cli.entrega;
      const pideDom = ent !== 'retira';
      const opc = ent === 'confirmar' || ent === 'expreso' ? ' <span class="opt">(opcional)</span>' : '';

      const campoLoc = !pideDom ? '' : `
        <div class="fr"><label for="c-locd">Localidad${opc}</label>
          <div class="fx locw">
            <input id="c-locd" value="${UI.esc(locActual ? locActual.label : '')}"
              placeholder="Escribí la localidad…" autocomplete="off">
            ${locActual ? `<button class="cx" id="c-locx" title="Quitar la localidad" aria-label="Quitar la localidad">✕</button>` : ''}
            <div id="c-locdrop"></div>
          </div></div>
        ${locActual ? `<div class="fr"><label></label><span class="hint">
          ${UI.esc(locActual.zona)} · envío ${locActual.flete ? UI.pesos(locActual.flete) : 'a cotizar'}
          ${locActual.manual ? '<b>· cargada a mano</b>' : ''}</span></div>` : ''}`;

      const campoDom = !pideDom ? '' : `
        <div class="fr"><label for="c-dom">Domicilio de entrega${opc}</label>
          <input id="c-dom" value="${UI.esc(this.cli.domicilio)}" placeholder="Calle 1234, piso/depto"></div>`;

      c.innerHTML = `
        <div class="cz-cols">
          <div class="cz-col">
            <div class="fr"><label for="c-nombre">Cliente ${mas('instagram', '+ IG')}</label>
              <input id="c-nombre" value="${UI.esc(this.cli.nombre)}" placeholder="Nombre y apellido"></div>
            ${opcional('instagram')}
            ${sel('c-canal', '¿Cómo nos conoció?', `<option value="">—</option>` +
              ['Instagram', 'Facebook', 'Recomendación', 'Pasó por el local', 'Google', 'Otro']
                .map(o => `<option ${this.cli.canal === o ? 'selected' : ''}>${o}</option>`).join(''))}
          </div>
          <div class="cz-col">
            <div class="fr"><label for="c-tel">Teléfono ${mas('tel2', '+')}</label>
              <input id="c-tel" value="${UI.esc(this.cli.telefono)}" placeholder="11 5555-2020" inputmode="tel"></div>
            ${opcional('tel2')}
            ${f('c-mail', 'Email', this.cli.email, 'cliente@correo.com')}
          </div>
        </div>

        <div class="cz-tit">Entrega</div>
        <div class="cz-cols">
          <div class="cz-col">
            <div class="fr"><label for="c-entrega">Forma de entrega</label>
              <select id="c-entrega">${ENTREGAS.map(o =>
                `<option value="${o.k}" ${ent === o.k ? 'selected' : ''}>${UI.esc(o.label)}</option>`).join('')}</select></div>
            ${ent === 'retira' ? `<div class="fr"><label></label><span class="hint">Retira en el local: no hace falta domicilio ni flete.</span></div>` : ''}
            ${ent === 'confirmar' ? `<div class="fr"><label></label><span class="hint">Se define después: el envío se puede cargar igual o dejarlo a confirmar.</span></div>` : ''}
            ${campoDom}
            ${ent === 'expreso' ? `<div class="fr"><label for="c-expdom">Domicilio del expreso <span class="opt">(opcional)</span></label>
              <input id="c-expdom" value="${UI.esc(this.cli.expresoDom)}" placeholder="Se completa después"></div>` : ''}
          </div>
          <div class="cz-col">
            ${campoLoc}
            ${ent === 'expreso' ? `<div class="fr"><label for="c-expreso">Expreso <span class="opt">(opcional)</span></label>
              <input id="c-expreso" value="${UI.esc(this.cli.expreso)}" placeholder="Nombre del expreso"></div>` : ''}
          </div>
        </div>

        <div class="cz-tit">Facturación</div>
        <div class="cz-cols">
          <div class="cz-col">
            <div class="fr"><label for="c-fact">Solicita factura</label>
              <select id="c-fact">
                <option value="no" ${this.cli.factura === 'no' ? 'selected' : ''}>No</option>
                <option value="si" ${this.cli.factura === 'si' ? 'selected' : ''}>Sí</option>
              </select></div>
            ${this.cli.factura === 'si' ? `
              <div class="fr"><label for="c-dni">DNI o CUIT</label>
                <input id="c-dni" inputmode="numeric" class="${String(this.cli.dni).trim() ? '' : 'falta'}"
                  value="${UI.esc(this.cli.dni)}" placeholder="obligatorio para facturar"></div>`
              : `<div class="fr"><label></label><span class="hint">Si no pide factura, no sale impreso.</span></div>`}
          </div>
        </div>
        <div class="sec-go"><button class="btn sm primary" id="c-sig">${this.esOrden() ? 'Confirmar datos del cliente' : 'Continuar'}</button></div>`;

      // `soloNum` deja escribir únicamente números (teléfonos y DNI).
      const bind = (id, campo, soloNum) => {
        const el = document.getElementById(id); if (!el) return;
        el.oninput = () => {
          if (soloNum) {
            const limpio = el.value.replace(/[^\d]/g, '');
            if (limpio !== el.value) el.value = limpio;
          }
          this.cli[campo] = el.value;
          this.avisoCliente(); this.pintarCabecera(); this.refrescarResumen(); this.pintarSide();
        };
      };
      bind('c-nombre', 'nombre'); bind('c-tel', 'telefono', true);
      bind('c-mail', 'email'); bind('c-dom', 'domicilio');
      bind('c-expreso', 'expreso'); bind('c-expdom', 'expresoDom');
      OPCIONALES.forEach(o => bind('c-' + o.k, o.k, o.k === 'tel2' || o.k === 'dni'));
      c.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { this.abiertos[b.dataset.add] = true; this.pintarCliente(); });
      c.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => {
        const k = b.dataset.quitar;
        this.cli[k] = ''; delete this.abiertos[k];
        this.pintarCliente(); this.pintarCabecera(); this.refrescarResumen(); this.pintarSide();
      });
      document.getElementById('c-canal').onchange = e => { this.cli.canal = e.target.value; };
      // La forma de entrega mueve el flete: si retira no se cotiza y si es
      // expreso o a confirmar el costo deja de salir solo. Es un cambio con
      // impacto, así que queda registrado.
      document.getElementById('c-entrega').onchange = ev => {
        const antes = this.antes();
        this.cli.entrega = ev.target.value;
        if (!this.pideEnvio()) { this.ad.envio = 0; this.ad.envioTocado = false; this.ad.envioAbierto = false; }
        else if (this.envioCotizable() && !this.ad.envioTocado) this.ad.envio = global.DB.fleteDe(this.cli.localidad);
        this.cambio(`Cambió la forma de entrega a ${this.entregaModoLabel()}`, antes);
        this.pintarTodo();
      };
      document.getElementById('c-fact').onchange = e => {
        this.cli.factura = e.target.value;
        if (this.cli.factura === 'si') this.abiertos.dni = true;
        this.pintarCliente();
      };
      const fd = document.getElementById('c-dni');
      if (fd) fd.oninput = () => {
        const n = fd.value.replace(/[^\d]/g, ''); if (n !== fd.value) fd.value = n;
        this.cli.dni = n; fd.classList.toggle('falta', !n);
      };
      // Con Tab o Enter se recorre en el orden en que se pregunta, no por columna.
      const ORDEN = ['c-nombre', 'c-tel', 'c-canal', 'c-mail', 'c-entrega', 'c-dom', 'c-locd', 'c-expdom', 'c-expreso']
        .filter(id => document.getElementById(id));
      ORDEN.forEach((id, i) => {
        const el = document.getElementById(id); if (!el) return;
        el.onkeydown = e => {
          if (e.key !== 'Tab' && e.key !== 'Enter') return;
          if (e.key === 'Tab' && e.shiftKey) {
            const ant = document.getElementById(ORDEN[i - 1]); if (!ant) return;
            e.preventDefault(); ant.focus(); return;
          }
